            <div className="form-group" style={{ marginTop: '0.75rem' }}>
              <label>Gait Notes</label>
              <textarea value={gaitNotes} onChange={e => setGaitNotes(e.target.value)} rows={2} style={{ ...inputStyle, resize: 'vertical' }} />
            </div>
            <div className="form-group">
              <label>Hoof Notes</label>
              <textarea value={hoofNotes} onChange={e => setHoofNotes(e.target.value)} rows={2} style={{ ...inputStyle, resize: 'vertical' }} />
            </div>
            <div className="form-group">
              <label>Known Issues</label>
              <textarea value={knownIssues} onChange={e => setKnownIssues(e.target.value)} rows={2} style={{ ...inputStyle, resize: 'vertical' }} />
            </div>

            <div style={{ display: 'flex', gap: '0.75rem', marginTop: '0.5rem', marginBottom: '1.5rem' }}>
              <button className="btn btn-primary" onClick={handleSave} disabled={saving} style={{ flex: 1 }}>
                {saving ? '⏳ Saving…' : (savedHorse?.id ? '💾 Save Changes' : '✅ Add Horse')}
              </button>
            </div>

            {/* Photos — only available once the horse actually exists in Firestore */}
            <div style={{ borderTop: '2px solid var(--border)', paddingTop: '1rem' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '0.75rem' }}>
                <h3 style={{ margin: 0, fontSize: '1rem', color: 'var(--primary)' }}>📷 Photos</h3>
                {savedHorse?.id && (
                  <button className="btn btn-sm btn-outline" onClick={() => fileInputRef.current?.click()} disabled={uploading}>
                    {uploading ? '⏳ Uploading…' : '📁 Upload Photo'}
                  </button>
                )}
              </div>
              <input type="file" accept="image/*" ref={fileInputRef} onChange={handleFileChange} style={{ display: 'none' }} />

              {!savedHorse?.id ? (
                <div style={{ textAlign: 'center', color: 'var(--text-muted)', fontSize: '0.85rem', padding: '1rem' }}>
                  Save this horse first to attach photos.
                </div>
              ) : (savedHorse.photos || []).length === 0 ? (
                <div style={{ textAlign: 'center', color: 'var(--text-muted)', fontSize: '0.85rem', padding: '1rem' }}>
                  No photos yet.
                </div>
              ) : (
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(90px, 1fr))', gap: '0.5rem' }}>
                  {savedHorse.photos.map((p, i) => (
                    <div key={p.storagePath || i} style={{ position: 'relative', aspectRatio: '1', borderRadius: 8, overflow: 'hidden', background: 'var(--border)' }}>
                      <img src={p.url} alt="" style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }} />
                      <button onClick={() => removePhoto(p)} title="Remove photo"
                        style={{ position: 'absolute', top: 4, right: 4, width: 22, height: 22, borderRadius: '50%', background: 'rgba(0,0,0,0.65)', color: '#fff', border: 'none', fontSize: '0.8rem', lineHeight: 1, cursor: 'pointer', padding: 0 }}>✕</button>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    function EditAppointmentModal({ appointment, userProfile, userId, onClose, onSaved }) {
      const [phone, setPhone] = useState(appointment.phone || '');
      const [farmName, setFarmName] = useState(appointment.farmName || '');
      const [date, setDate] = useState(appointment.requestedDate || '');
      const [time, setTime] = useState(appointment.requestedTime || '');
      const [address, setAddress] = useState(appointment.address || '');
      const [city, setCity] = useState(appointment.city || '');
      const [state, setState] = useState(appointment.state || '');
      const [zip, setZip] = useState(appointment.zip || '');
      const [comments, setComments] = useState(appointment.comments || '');
      const [saving, setSaving] = useState(false);
      const [sendNotification, setSendNotification] = useState(false);
      const [sendUpdateEmail, setSendUpdateEmail] = useState(false);
      const [customerSmsOptOut, setCustomerSmsOptOut] = useState(false);

      // Check customer SMS opt-out status on mount
      useEffect(() => {
        const checkSmsStatus = async () => {
          if (!db || !appointment.phone || !userId) return;
          try {
            const cleanPhone = appointment.phone.replace(/\D/g, '');
            const snap = await db.collection('customers')
              .where('farrierId', '==', userId)
              .where('phone', '==', cleanPhone)
              .limit(1).get();
            if (!snap.empty) {
              setCustomerSmsOptOut(snap.docs[0].data().smsOptOut || false);
            }
          } catch (e) { /* silently ignore */ }
        };
        checkSmsStatus();
      }, []);

      const smsAvailable = userProfile?.smsEnabled && appointment.phone && !customerSmsOptOut;

      const fmtTime = (t) => {
        if (!t) return '';
        const [h, m] = t.split(':').map(Number);
        const ampm = h >= 12 ? 'PM' : 'AM';
        const h12 = h % 12 || 12;
        return `${h12}:${String(m).padStart(2, '0')} ${ampm}`;
      };

      // Per-horse service rows, replacing the old flat hardcoded service checklist —
      // same idiom as CreateAppointmentModal/InvoiceCreateModal. A newer appointment
      // (created after this change) carries horseRequests directly; anything older
      // only has a flat services array, so it becomes a single fallback row rather
      // than silently losing that data.
      const emptyHorseRow = () => ({ horseId: '', horseName: '', services: [] });
      const [horseRows, setHorseRows] = useState(() =>
        appointment.horseRequests?.length
          ? appointment.horseRequests.map(r => ({ horseId: r.horseId || '', horseName: r.horseName || '', services: r.services || [] }))
          : [{ horseId: '', horseName: '', services: appointment.services || [] }]
      );

      // services/numberOfHorses stay as plain derived values (not state) so the
      // existing Google Calendar sync, SMS, and update-email code below — all of
      // which already read `services`/`numberOfHorses` — keep working unchanged.
      const services = [...new Set(horseRows.flatMap(r => r.services))];
      const numberOfHorses = horseRows.filter(r => r.horseName.trim() || r.services.length > 0).length || '';

      const [horseOptions, setHorseOptions] = useState([
        { id: '', name: '-- Select Horse --' },
        { id: '__new__', name: '+ Add New Horse...' },
      ]);
      useEffect(() => {
        const loadHorses = async () => {
          if (!db || !userId || (!appointment.customerId && !appointment.customerName)) return;
          let q = db.collection('horses').where('farrierId', '==', userId);
          q = appointment.customerId
            ? q.where('customerId', '==', appointment.customerId)
            : q.where('customerName', '==', appointment.customerName);
          const snap = await q.get();
          const list = snap.docs.map(d => ({ id: d.id, ...d.data() }))
            .sort((a, b) => String(a.name || '').localeCompare(String(b.name || '')));
          setHorseOptions([
            { id: '', name: '-- Select Horse --' },
            ...list,
            { id: '__new__', name: '+ Add New Horse...' },
          ]);
        };
        loadHorses();
      }, [userId, appointment.customerId, appointment.customerName]);

      const [serviceOptions, setServiceOptions] = useState([]);
      useEffect(() => {
        const loadServices = async () => {
          if (!db || !userId) return;
          const snap = await db.collection('services')
            .where('farrierId', '==', userId)
            .where('isActive', '==', true)
            .get();
          const list = snap.docs.map(d => ({ id: d.id, ...d.data() }))
            .sort((a, b) =>
              String(a.category || '').localeCompare(String(b.category || '')) ||
              String(a.name || '').localeCompare(String(b.name || ''))
            );
          setServiceOptions(list);
        };
        loadServices();
      }, [userId]);

      const updateRowHorse = (idx, horseId) => {
        setHorseRows(rows => rows.map((r, i) => {
          if (i !== idx) return r;
          if (horseId === '__new__') return { ...r, horseId: '__new__', horseName: '' };
          if (!horseId) return { ...r, horseId: '', horseName: '' };
          const h = horseOptions.find(x => x.id === horseId);
          return { ...r, horseId, horseName: h?.name || '' };
        }));
      };
      const updateRowNewHorseName = (idx, name) => {
        setHorseRows(rows => rows.map((r, i) => i === idx ? { ...r, horseName: name } : r));
      };
      const toggleRowService = (idx, serviceName) => {
        setHorseRows(rows => rows.map((r, i) => {
          if (i !== idx) return r;
          const has = r.services.includes(serviceName);
          return { ...r, services: has ? r.services.filter(s => s !== serviceName) : [...r.services, serviceName] };
        }));
      };
      const addHorseRow = () => setHorseRows(rows => [...rows, emptyHorseRow()]);
      const removeHorseRow = (idx) => setHorseRows(rows => rows.filter((_, i) => i !== idx));

      const updateGoogleCalendarEvent = async (updatedAppointment) => {
        if (!userProfile?.googleCalendarConnected) {
          console.log('⚠️ Google Calendar not connected, skipping calendar update');
          return true;
        }

        // Older appointments stored the id as googleCalendarEventId.
        const eventId = appointment.googleEventId || appointment.googleCalendarEventId;
        if (!eventId) {
          if (updatedAppointment.status !== 'confirmed') return true;
          console.log('ℹ️ Not in Google Calendar yet — adding it');
          return createCalendarEvent(updatedAppointment, userProfile);
        }

        try {
          console.log('🔄 Updating Google Calendar event...');
          
          const startDateTime = `${date}T${time}:00`;
          const endDateTime = new Date(new Date(startDateTime).getTime() + 60 * 60 * 1000).toISOString();

          const event = {
            summary: `Farrier - ${updatedAppointment.customerName}${farmName ? ` (${farmName})` : ''}`,
            description: `Services: ${services.join(', ')}\nHorses: ${numberOfHorses || 'Not specified'}\nPhone: ${phone}${farmName ? `\nFarm/Business: ${farmName}` : ''}`,
            location: `${address}, ${city}, ${state} ${zip}`,
            start: {
              dateTime: new Date(startDateTime).toISOString(),
              timeZone: 'America/New_York'
            },
            end: {
              dateTime: endDateTime,
              timeZone: 'America/New_York'
            }
          };

          const accessToken = await getCalendarAccessToken();
          if (!accessToken) return true;

          const response = await fetch(
            `https://www.googleapis.com/calendar/v3/calendars/primary/events/${eventId}`,
            {
              method: 'PATCH',
              headers: {
                'Authorization': `Bearer ${accessToken}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify(event)
            }
          );

          if (!response.ok) {
            console.error('❌ Failed to update Google Calendar event:', await response.text());
            return false;
          }

          console.log('✅ Google Calendar event updated successfully');
          return true;
        } catch (error) {
          console.error('❌ Error updating Google Calendar:', error);
          return false;
        }
      };

      const handleSave = async () => {
        if (!phone || !date || !time) {
          alert('Please fill in Phone, Date, and Time');
          return;
        }

        setSaving(true);

        try {
          // Create a real horse record for any "+ Add New Horse..." row now — at save
          // time, same as CreateAppointmentModal/InvoiceCreateModal — so an untouched
          // edit never leaves an orphaned horse behind.
          const resolvedRows = [];
          for (const row of horseRows) {
            if (row.horseId === '__new__' && row.horseName.trim()) {
              const horseRef = await db.collection('horses').add({
                farrierId: userId,
                customerId: appointment.customerId || '',
                customerName: appointment.customerName,
                name: row.horseName.trim(),
                breed: '', dob: '', sex: '', color: '',
                shoeingCycleWeeks: null, shoeSize: '', shoeType: '',
                gaitNotes: '', hoofNotes: '', knownIssues: '',
                photos: [],
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
              });
              resolvedRows.push({ ...row, horseId: horseRef.id });
            } else {
              resolvedRows.push(row);
            }
          }
          const horseRequests = resolvedRows
            .filter(r => r.horseName.trim() || r.services.length > 0)
            .map(r => ({ horseId: r.horseId === '__new__' ? '' : (r.horseId || ''), horseName: r.horseName.trim(), services: r.services }));
          const horseIds = horseRequests.filter(r => r.horseId).map(r => r.horseId);
          const horseNames = horseRequests.filter(r => r.horseId).map(r => r.horseName);

          const updatedData = {
            phone,
            farmName: farmName || '',
            requestedDate: date,
            requestedTime: time,
            numberOfHorses: numberOfHorses || '',
            services,
            horseRequests,
            horseIds,
            horseNames,
            address: address || '',
            city: city || '',
            state: state || '',
            zip: zip || '',
            comments: comments || '',
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          };

          // Update Firestore
          await db.collection('appointments').doc(appointment.id).update(updatedData);
          console.log('✅ Appointment updated in Firestore');

          // Update Google Calendar
          const calendarUpdated = await updateGoogleCalendarEvent({
            ...appointment,
            ...updatedData,
            customerName: appointment.customerName
          });

          // Send SMS notification if requested
          if (sendNotification && smsAvailable) {
            try {
              const bizName = userProfile?.businessName || 'Your Farrier';
              const serviceList = services.length > 0 ? services.join(', ') : 'your appointment';
              const msg = `Hi ${appointment.customerName}, your appointment with ${bizName} has been updated to ${date} at ${fmtTime(time)} for ${serviceList}. Reply STOP to opt out.`;
              const res = await fetch('/api/send-sms', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ to: phone, body: msg })
              });
              const data = await res.json();
              if (data.success) {
                console.log('✅ SMS notification sent');
              } else {
                console.warn('⚠️ SMS notification failed:', data);
              }
            } catch (smsErr) {
              console.error('SMS send error:', smsErr);
            }
          }

          // Send update email to customer if requested
          if (sendUpdateEmail && appointment.email) {
            fetch('/api/send-email', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                action: 'update',
                customerEmail: appointment.email,
                customerName: appointment.customerName,
                farmName: farmName || appointment.farmName || '',
                farrierBusinessName: userProfile?.businessName || '',
                farrierEmail: userProfile?.email || '',
                farrierPhone: userProfile?.phone || '',
                bookingUrl: userProfile?.bookingUrl || '',
                services: services,
                numberOfHorses: numberOfHorses || '',
                requestedDate: date,
                requestedTime: time,
                address: address || '',
                city: city || '',
                state: state || '',
                zip: zip || '',
                comments: comments || '',
              })
            }).then(async r => {
              const d = await r.json().catch(()=>({}));
              if (r.ok) console.log('✅ Update email sent to customer');
              else console.error('❌ Update email error:', d);
            }).catch(e => console.error('❌ Update email failed:', e));
          }

          if (calendarUpdated) {
            alert(`✅ Appointment updated!${sendNotification && smsAvailable ? ' SMS sent.' : ''}${sendUpdateEmail && appointment.email ? ' Update email sent.' : ''}`);
          } else {
            alert(`⚠️ Appointment updated but failed to sync Google Calendar.${sendNotification && smsAvailable ? ' SMS sent.' : ''}${sendUpdateEmail && appointment.email ? ' Update email sent.' : ''}`);
          }

          onSaved();
        } catch (error) {
          console.error('Error updating appointment:', error);
          alert('❌ Error updating appointment');
        } finally {
          setSaving(false);
        }
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" onClick={(e) => e.stopPropagation()} style={{maxWidth: '600px'}}>
            <div className="modal-header">
              <h2>✏️ Edit Appointment</h2>
              <button className="close-btn" onClick={onClose}>×</button>
            </div>

            <div style={{padding: '1.5rem', maxHeight: '70vh', overflowY: 'auto'}}>
              <div style={{marginBottom: '1rem', padding: '1rem', background: '#f0f9ff', borderRadius: '8px'}}>
                <div style={{fontWeight: '600', color: '#2563eb'}}>Customer: {appointment.customerName}{appointment.farmName ? ` — ${appointment.farmName}` : ''}</div>
                <div style={{fontSize: '0.875rem', color: '#64748b'}}>Email: {appointment.email || 'Not provided'}</div>
              </div>

              <div className="form-group">
                <label>Farm / Business Name</label>
                <input
                  type="text"
                  value={farmName}
                  onChange={(e) => setFarmName(e.target.value)}
                  placeholder="Sunny Acres Farm (optional)"
                />
              </div>

              <div className="form-group">
                <label>Phone Number *</label>
                <input
                  type="tel"
                  value={fmtPhone(phone)}
                  onChange={(e) => setPhone(e.target.value.replace(/\D/g, '').slice(0, 11))}
                  placeholder="(555) 555-5555"
                />
              </div>

              <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1rem'}}>
                <div className="form-group">
                  <label>Date *</label>
                  <input 
                    type="date"
                    value={date}
                    onChange={(e) => setDate(e.target.value)}
                  />
                </div>
                <div className="form-group">
                  <label>Time *</label>
                  <input 
                    type="time"
                    value={time}
                    onChange={(e) => setTime(e.target.value)}
                  />
                </div>
              </div>

              <div className="form-group">
                <label>Horses &amp; Services</label>
                {horseRows.map((row, idx) => (
                  <div key={idx} style={{ border: '1px solid var(--border)', borderRadius: 8, padding: '0.75rem', marginBottom: '0.6rem', background: '#f8fafc' }}>
                    <div style={{ display: 'flex', gap: '0.5rem', marginBottom: '0.5rem' }}>
                      <select value={row.horseId} onChange={e => updateRowHorse(idx, e.target.value)} style={{ flex: 1 }}>
                        {horseOptions.map((h, i) => <option key={i} value={h.id}>{h.name}</option>)}
                      </select>
                      {horseRows.length > 1 && (
                        <button type="button" onClick={() => removeHorseRow(idx)}
                          style={{ background: '#fee2e2', color: '#dc2626', border: 'none', borderRadius: 6, padding: '0 0.9rem', cursor: 'pointer', fontWeight: 700 }}>✕</button>
                      )}
                    </div>
                    {row.horseId === '__new__' && (
                      <input type="text" placeholder="New horse's name" value={row.horseName}
                        onChange={e => updateRowNewHorseName(idx, e.target.value)}
                        style={{ width: '100%', marginBottom: '0.5rem' }} />
                    )}
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.5rem' }}>
                      {serviceOptions.map(s => (
                        <label key={s.id} style={{
                          display: 'flex', alignItems: 'center', padding: '0.5rem',
                          border: '1px solid var(--border)', borderRadius: 4, cursor: 'pointer',
                          background: row.services.includes(s.name) ? '#dcfce7' : 'white'
                        }}>
                          <input type="checkbox" checked={row.services.includes(s.name)}
                            onChange={() => toggleRowService(idx, s.name)}
                            style={{ marginRight: '0.5rem' }} />
                          {s.name}
                        </label>
                      ))}
                    </div>
                  </div>
                ))}
                <button type="button" onClick={addHorseRow} className="btn btn-outline" style={{ width: '100%' }}>+ Add Horse</button>
              </div>

              <div className="form-group">
                <label>Address</label>
                <input 
                  type="text"
                  value={address}
                  onChange={(e) => setAddress(e.target.value)}
                  placeholder="123 Main Street"
                />
              </div>

              <div style={{display: 'grid', gridTemplateColumns: '2fr 1fr 1fr', gap: '1rem'}}>
                <div className="form-group">
                  <label>City</label>
                  <input 
                    type="text"
                    value={city}
                    onChange={(e) => setCity(e.target.value)}
                    placeholder="Royal Palm Beach"
                  />
                </div>
                <div className="form-group">
                  <label>State</label>
                  <input 
                    type="text"
                    value={state}
                    onChange={(e) => setState(e.target.value)}
                    placeholder="FL"
                    maxLength="2"
                  />
                </div>
                <div className="form-group">
                  <label>ZIP</label>
                  <input 
                    type="text"
                    value={zip}
                    onChange={(e) => setZip(e.target.value)}
                    placeholder="33411"
                    maxLength="5"
                  />
                </div>
              </div>

              <div className="form-group">
                <label>Notes / Comments</label>
                <textarea 
                  value={comments}
                  onChange={(e) => setComments(e.target.value)}
                  placeholder="Special instructions, gate codes, specific requests..."
                  rows="4"
                  style={{
                    width: '100%',
                    padding: '0.75rem',
                    border: '2px solid var(--border)',
                    borderRadius: '8px',
                    fontSize: '1rem',
                    fontFamily: 'inherit',
                    resize: 'vertical'
                  }}
                />
              </div>

              {/* SMS Notification checkbox */}
              {userProfile?.smsEnabled && appointment.phone && (
                <div style={{
                  marginTop: '1.25rem',
                  padding: '1rem',
                  borderRadius: '10px',
                  border: `2px solid ${smsAvailable ? '#dcfce7' : '#fee2e2'}`,
                  background: smsAvailable ? '#f0fdf4' : '#fff5f5',
                }}>
                  {smsAvailable ? (
                    <label style={{display: 'flex', alignItems: 'flex-start', gap: '0.75rem', cursor: 'pointer'}}>
                      <input
                        type="checkbox"
                        checked={sendNotification}
                        onChange={e => setSendNotification(e.target.checked)}
                        style={{marginTop: '2px', width: 18, height: 18, cursor: 'pointer', flexShrink: 0}}
                      />
                      <div>
                        <div style={{fontWeight: 600, color: '#16a34a', fontSize: '0.95rem'}}>
                          📱 Notify customer via SMS
                        </div>
                        <div style={{fontSize: '0.82rem', color: '#1e293b', marginTop: '0.2rem'}}>
                          Sends a text to {fmtPhone(appointment.phone)} with the updated date &amp; time.
                        </div>
                      </div>
                    </label>
                  ) : (
                    <div style={{display: 'flex', alignItems: 'center', gap: '0.6rem', color: '#dc2626', fontSize: '0.88rem', fontWeight: 600}}>
                      🚫 SMS notifications unavailable — customer has opted out.
                    </div>
                  )}
                </div>
              )}

              {/* Email notification option */}
              {appointment.email && (
                <div style={{
                  marginTop: '1rem',
                  padding: '1rem',
                  borderRadius: '10px',
                  border: '2px solid #dbeafe',
                  background: '#eff6ff',
                }}>
                  <label style={{display: 'flex', alignItems: 'flex-start', gap: '0.75rem', cursor: 'pointer'}}>
                    <input
                      type="checkbox"
                      checked={sendUpdateEmail}
                      onChange={e => setSendUpdateEmail(e.target.checked)}
                      style={{marginTop: '2px', width: 18, height: 18, cursor: 'pointer', flexShrink: 0}}
                    />
                    <div>
                      <div style={{fontWeight: 600, color: '#1d4ed8', fontSize: '0.95rem'}}>
                        📧 Send update email to customer
                      </div>
                      <div style={{fontSize: '0.82rem', color: '#1e293b', marginTop: '0.2rem'}}>
                        Sends a confirmation update to {appointment.email} with the new details.
                      </div>
                    </div>
                  </label>
                </div>
              )}

              <div style={{display: 'flex', gap: '1rem', marginTop: '1.25rem'}}>
                <button 
                  className="btn btn-outline"
                  onClick={onClose}
                  style={{flex: 1}}
                  disabled={saving}
                >
                  Cancel
                </button>
                <button 
                  className="btn btn-primary"
                  onClick={handleSave}
                  style={{flex: 1}}
                  disabled={saving}
                >
                  {saving ? 'Saving...' : (sendNotification && smsAvailable && sendUpdateEmail && appointment.email ? '💾 Save & Send SMS + Email' : sendNotification && smsAvailable ? '💾 Save & Send SMS' : sendUpdateEmail && appointment.email ? '💾 Save & Send Email' : '💾 Save Changes')}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function InvoicesView({ userId, userProfile }) {
      const [invoices, setInvoices] = useState([]);
      const [showCreateModal, setShowCreateModal] = useState(false);
      const [editingInvoice, setEditingInvoice] = useState(null);
      const [showPaymentModal, setShowPaymentModal] = useState(false);
      const [showManualPaymentModal, setShowManualPaymentModal] = useState(false);
      const [selectedInvoice, setSelectedInvoice] = useState(null);
      const [loading, setLoading] = useState(false);
      const [showCancelModal, setShowCancelModal] = useState(false);
      const [showRefundModal, setShowRefundModal] = useState(false);
      const [cancelPassword, setCancelPassword] = useState('');
      const [invoiceFilter, setInvoiceFilter] = useState('all'); // all, thisMonth, lastMonth, lastQuarter, ytd, paidOnly, openOnly, cancelledOnly, customRange
      const [customStartDate, setCustomStartDate] = useState('');
      const [customEndDate, setCustomEndDate] = useState('');
      const [openInvoiceMenu, setOpenInvoiceMenu] = useState(null);

      // "Waive card price & resend" / "Undo waiver": the server closes the open checkout,
      // flips invoice.cardFeeWaived, makes a new checkout at the new price and texts/emails
      // the customer the updated link.
      const waiveCardPrice = async (invoice, waive) => {
        const balance = FarriPricing.balanceCents(invoice);
        const newAmount = waive ? balance : FarriPricing.cardCents(balance, FarriPricing.invoiceRate(invoice));
        const sendTo = [invoice.customerPhone && 'text', invoice.customerEmail && 'email'].filter(Boolean).join(' and ');
        const question = waive
          ? `Waive the card price on Invoice #${invoice.invoiceNumber}?\n\nThe customer can pay ${FarriPricing.money(newAmount)} by card.`
          : `Put the card price back on Invoice #${invoice.invoiceNumber}?\n\nCard payments will be ${FarriPricing.money(newAmount)}.`;
        if (!confirm(question + (sendTo ? `\n\nThe updated payment link will be sent by ${sendTo}.` : '\n\nThis customer has no phone or email on file — nothing will be sent.'))) return;
        try {
          const res = await fetch('/api/stripe-payment', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'waive_card_price', invoiceId: invoice.id, waive }),
          });
          const data = await res.json();
          if (!data.success) { alert('❌ ' + (data.error || 'Could not update the payment link.')); return; }
          alert(`✅ Payment link updated to $${Number(data.amount).toFixed(2)}.` + (data.sentVia?.length ? ` Sent by ${data.sentVia.join(' and ')}.` : ' Nothing was sent.'));
        } catch (e) {
          alert('❌ Could not update the payment link: ' + e.message);
        }
      };

      useEffect(() => {
        const handler = (e) => { if (!e.target.closest('.invoice-more-menu')) setOpenInvoiceMenu(null); };
        document.addEventListener('click', handler);
        return () => document.removeEventListener('click', handler);
      }, []);

      useEffect(() => {
        if (!db) return;
        // Realtime listener — updates instantly when customer pays online
        const unsub = db.collection('invoices')
          .where('farrierId', '==', userId)
          .onSnapshot(snapshot => {
            const invoiceData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            invoiceData.sort((a, b) => {
              if (!a.createdAt || !b.createdAt) return 0;
              return b.createdAt.toDate() - a.createdAt.toDate();
            });
            setInvoices(invoiceData);
          }, err => {
            console.error('Invoice listener error:', err);
          });
        return () => unsub();
      }, [userId]);

      const loadInvoices = async () => {
        console.log('🔵 Loading invoices for userId:', userId);
        if (db) {
          const snapshot = await db.collection('invoices')
            .where('farrierId', '==', userId)
            .get();
          
          console.log('📋 Found invoices:', snapshot.docs.length);
          
          const invoiceData = snapshot.docs.map(doc => ({
            id: doc.id,
            ...doc.data()
          }));
          
          // Sort in JavaScript instead of Firestore
          invoiceData.sort((a, b) => {
            if (!a.createdAt || !b.createdAt) return 0;
            return b.createdAt.toDate() - a.createdAt.toDate();
          });
          
          console.log('✅ Loaded invoices:', invoiceData);
          setInvoices(invoiceData);
        } else {
          console.error('❌ Database not initialized');
        }
      };

      const handleCancelInvoice = async () => {
        // Generate today's password (MMDDYYYY format)
        const today = new Date();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        const year = today.getFullYear();
        const correctPassword = `${month}${day}${year}`;

        if (cancelPassword !== correctPassword) {
          alert(`❌ Incorrect password. Today's password is MMDDYYYY format (e.g., ${correctPassword.slice(0,2)}${correctPassword.slice(2,4)}${correctPassword.slice(4)})`);
          return;
        }

        try {
          if (db && selectedInvoice) {
            await db.collection('invoices').doc(selectedInvoice.id).update({
              status: 'cancelled',
              cancelledAt: firebase.firestore.FieldValue.serverTimestamp(),
              cancelledBy: userId
            });

            alert('✅ Invoice cancelled successfully');
            setShowCancelModal(false);
            setSelectedInvoice(null);
            setCancelPassword('');
            loadInvoices();
          }
        } catch (error) {
          console.error('Error cancelling invoice:', error);
          alert('❌ Error cancelling invoice');
        }
      };

      // Export to Excel
      const exportToExcel = () => {
        const exportData = filteredInvoices.map(invoice => ({
          'Invoice Number': invoice.invoiceNumber || '',
          'Date': invoice.createdAt ? invoice.createdAt.toDate().toLocaleDateString('en-US') : '',
          'Customer': invoice.customerName || '',
          'Status': invoice.status || '',
          'Amount': invoice.total || 0,
          'Paid Date': invoice.paidAt ? invoice.paidAt.toDate().toLocaleDateString('en-US') : '',
          'Payment Method': invoice.cardLast4 ? `${invoice.cardType || 'Card'} ${invoice.cardLast4}` : '',
          'Transaction ID': invoice.transactionId || '',
          'Cancelled Date': invoice.cancelledAt ? invoice.cancelledAt.toDate().toLocaleDateString('en-US') : ''
        }));

        // Create worksheet
        const ws = window.XLSX.utils.json_to_sheet(exportData);

        // Set column widths
        ws['!cols'] = [
          { wch: 20 }, // Invoice Number
          { wch: 12 }, // Date
          { wch: 20 }, // Customer
          { wch: 12 }, // Status
          { wch: 12 }, // Amount
          { wch: 12 }, // Paid Date
          { wch: 20 }, // Payment Method
          { wch: 15 }, // Transaction ID
          { wch: 15 }  // Cancelled Date
        ];

        // Format amounts as currency
        const range = window.XLSX.utils.decode_range(ws['!ref']);
        for (let R = range.s.r + 1; R <= range.e.r; ++R) {
          const cellAddress = window.XLSX.utils.encode_cell({ r: R, c: 4 }); // Column E (Amount)
          if (ws[cellAddress]) {
            ws[cellAddress].z = '$#,##0.00';
          }
        }

        // Create workbook
        const wb = window.XLSX.utils.book_new();
        window.XLSX.utils.book_append_sheet(wb, ws, 'Invoices');

        // Generate filename with filter info
        const filterText = 
          invoiceFilter === 'thisMonth' ? 'This_Month' :
          invoiceFilter === 'lastMonth' ? 'Last_Month' :
          invoiceFilter === 'lastQuarter' ? 'Last_Quarter' :
          invoiceFilter === 'ytd' ? 'YTD' :
          invoiceFilter === 'paidOnly' ? 'Paid_Only' :
          invoiceFilter === 'openOnly' ? 'Open_Only' :
          invoiceFilter === 'cancelledOnly' ? 'Cancelled_Only' :
          invoiceFilter === 'customRange' ? 'Custom_Range' :
          'All_Invoices';
        
        const filename = `Farrier_Invoices_${filterText}_${new Date().toISOString().split('T')[0]}.xlsx`;

        // Download
        window.XLSX.writeFile(wb, filename);
      };

      // Filter invoices based on selected filter
      const getFilteredInvoices = () => {
        const now = new Date();
        const currentYear = now.getFullYear();
        const currentMonth = now.getMonth();

        return invoices.filter(invoice => {
          // Apply status filter first
          if (invoiceFilter === 'paidOnly' && invoice.status !== 'paid') return false;
          if (invoiceFilter === 'openOnly' && invoice.status !== 'outstanding') return false;
          if (invoiceFilter === 'cancelledOnly' && invoice.status !== 'cancelled') return false;

          // Apply date filters
          if (!invoice.createdAt) return true; // Include invoices without dates
          
          const invoiceDate = invoice.createdAt.toDate();
          const invoiceYear = invoiceDate.getFullYear();
          const invoiceMonth = invoiceDate.getMonth();

          switch (invoiceFilter) {
            case 'thisMonth':
              return invoiceYear === currentYear && invoiceMonth === currentMonth;
            
            case 'lastMonth':
              const lastMonth = currentMonth === 0 ? 11 : currentMonth - 1;
              const lastMonthYear = currentMonth === 0 ? currentYear - 1 : currentYear;
              return invoiceYear === lastMonthYear && invoiceMonth === lastMonth;
            
            case 'lastQuarter':
              const currentQuarter = Math.floor(currentMonth / 3);
              const lastQuarter = currentQuarter === 0 ? 3 : currentQuarter - 1;
              const lastQuarterYear = currentQuarter === 0 ? currentYear - 1 : currentYear;
              const invoiceQuarter = Math.floor(invoiceMonth / 3);
              return invoiceYear === lastQuarterYear && invoiceQuarter === lastQuarter;
            
            case 'ytd':
              return invoiceYear === currentYear;
            
            case 'customRange':
              if (!customStartDate || !customEndDate) return true;
              const start = new Date(customStartDate);
              const end = new Date(customEndDate);
              end.setHours(23, 59, 59);
              return invoiceDate >= start && invoiceDate <= end;
            
            default:
              return true;
          }
        });
      };

      const filteredInvoices = getFilteredInvoices();

      const getInvPaidAmount = (inv) => inv.paidAmount || (inv.payments||[]).reduce((s,p)=>s+(p.amount||0),0) || (inv.status==='paid'?(inv.total||0):0);
      const totalCollected = filteredInvoices.reduce((sum, inv) => sum + getInvPaidAmount(inv), 0);

      const totalOutstanding = filteredInvoices
        .filter(inv => inv.status === 'outstanding' || inv.status === 'partial')
        .reduce((sum, inv) => sum + Math.max(0, (inv.total||0) - getInvPaidAmount(inv)), 0);

      const totalCancelled = filteredInvoices
        .filter(inv => inv.status === 'cancelled')
        .reduce((sum, inv) => sum + (inv.total || 0), 0);

      return (
        <div>
          <h1 style={{marginBottom: '1.5rem', fontSize: '2rem', color: 'var(--primary)'}}>Invoices & Payments</h1>
          
          <div className="dashboard-grid">
            <div className="stat-card">
              <div className="stat-label">Total Collected</div>
              <div className="stat-value" style={{color: 'var(--success)'}}>${totalCollected.toFixed(2)}</div>
            </div>
            <div className="stat-card">
              <div className="stat-label">Outstanding</div>
              <div className="stat-value" style={{color: 'var(--warning)'}}>${totalOutstanding.toFixed(2)}</div>
            </div>
            {totalCancelled > 0 && (
              <div className="stat-card">
                <div className="stat-label">Cancelled</div>
                <div className="stat-value" style={{color: 'var(--text-muted)'}}>${totalCancelled.toFixed(2)}</div>
              </div>
            )}
          </div>

          <div className="card">
            <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1.5rem'}}>
              <h2 style={{marginBottom: 0}}>Your Invoices</h2>
              <button className="btn btn-primary" onClick={() => setShowCreateModal(true)}>
                + Create Invoice
              </button>
            </div>

            {/* Filter */}
            <div style={{
              display: 'flex',
              gap: '0.5rem',
              marginBottom: '1.5rem',
              flexWrap: 'wrap',
              alignItems: 'center',
              paddingBottom: '1rem',
              borderBottom: '1px solid var(--border)'
            }}>
              <label htmlFor="invoice-filter" style={{fontSize: '0.875rem', color: 'var(--text-muted)'}}>Show:</label>
              <select
                id="invoice-filter"
                value={invoiceFilter}
                onChange={(e) => setInvoiceFilter(e.target.value)}
                style={{ padding: '0.5rem', borderRadius: 8, border: '2px solid var(--border)', fontSize: '0.875rem' }}
              >
                <option value="all">All Invoices</option>
                <optgroup label="Time frame">
                  <option value="thisMonth">This Month</option>
                  <option value="lastMonth">Last Month</option>
                  <option value="lastQuarter">Last Quarter</option>
                  <option value="ytd">Year to Date</option>
                  <option value="customRange">Custom Range…</option>
                </optgroup>
                <optgroup label="Status">
                  <option value="paidOnly">Paid Only</option>
                  <option value="openOnly">Open Only</option>
                  <option value="cancelledOnly">Cancelled Only</option>
                </optgroup>
              </select>
              {filteredInvoices.length > 0 && (
                <button
                  onClick={exportToExcel}
                  className="btn btn-sm"
                  style={{
                    background: '#2683FB',
                    color: 'white',
                    fontWeight: '600',
                    marginLeft: 'auto'
                  }}
                  onMouseOver={(e) => e.target.style.background = '#15803d'}
                  onMouseOut={(e) => e.target.style.background = '#2683FB'}
                >
                  📊 Export to Excel
                </button>
              )}
            </div>

            {/* Custom Date Range Picker */}
            {invoiceFilter === 'customRange' && (
              <div style={{
                marginBottom: '1.5rem',
                padding: '1rem',
                background: '#f9fafb',
                borderRadius: '8px',
                display: 'flex',
                gap: '1rem',
                alignItems: 'end',
                flexWrap: 'wrap'
              }}>
                <div style={{flex: 1, minWidth: '200px'}}>
                  <label style={{display: 'block', marginBottom: '0.5rem', fontSize: '0.875rem', fontWeight: '500'}}>
                    Start Date
                  </label>
                  <input 
                    type="date"
                    value={customStartDate}
                    onChange={(e) => setCustomStartDate(e.target.value)}
                    style={{
                      width: '100%',
                      padding: '0.5rem',
                      borderRadius: '4px',
                      border: '1px solid var(--border)',
                      fontSize: '0.875rem'
                    }}
                  />
                </div>
                <div style={{flex: 1, minWidth: '200px'}}>
                  <label style={{display: 'block', marginBottom: '0.5rem', fontSize: '0.875rem', fontWeight: '500'}}>
                    End Date
                  </label>
                  <input 
                    type="date"
                    value={customEndDate}
                    onChange={(e) => setCustomEndDate(e.target.value)}
                    style={{
                      width: '100%',
                      padding: '0.5rem',
                      borderRadius: '4px',
                      border: '1px solid var(--border)',
                      fontSize: '0.875rem'
                    }}
                  />
                </div>
                {customStartDate && customEndDate && (
                  <div style={{
                    padding: '0.5rem 1rem',
                    background: 'var(--surface)',
                    border: '1px solid var(--border)',
                    borderRadius: '4px',
                    fontSize: '0.875rem',
                    color: 'var(--text-muted)'
                  }}>
                    📆 {new Date(customStartDate).toLocaleDateString()} - {new Date(customEndDate).toLocaleDateString()}
                  </div>
                )}
              </div>
            )}

            {filteredInvoices.length === 0 ? (
              <p style={{color: 'var(--text-muted)'}}>
                No invoices found for selected filter.
              </p>
            ) : (
              <>
                <div style={{fontSize: '0.875rem', color: 'var(--text-muted)', marginBottom: '1rem'}}>
                  Showing {filteredInvoices.length} of {invoices.length} invoice{invoices.length !== 1 ? 's' : ''}
                </div>
                <div className="appointments-list">
                  {filteredInvoices.map(invoice => (
                  <div key={invoice.id} className="appointment-item">
                    <div className="appointment-info">
                      <div className="appointment-customer">
                        Invoice #{invoice.invoiceNumber} - {invoice.customerName}
                      </div>
                      <div className="appointment-details">
                        Amount: ${invoice.total?.toFixed(2)} • Created: {invoice.createdAt?.toDate().toLocaleDateString()}
                        {invoice.status === 'partial' && <> • <strong style={{color:'#d97706'}}>Balance Due: {FarriPricing.money(FarriPricing.balanceCents(invoice))}</strong></>}
                        {(invoice.status === 'outstanding' || invoice.status === 'partial') && FarriPricing.dualPrices(invoice).card !== null && (
                          <><br/><span style={{color: 'var(--text)'}}>{FarriPricing.dualPriceText(invoice)}</span></>
                        )}
                        {(invoice.status === 'outstanding' || invoice.status === 'partial') && FarriPricing.invoiceRate(invoice) > 0 && invoice.cardFeeWaived && (
                          <><br/><span style={{color: 'var(--text-muted)'}}>Card price waived — card payments charged {FarriPricing.money(FarriPricing.balanceCents(invoice))}</span></>
                        )}
                        {invoice.paymentNeedsReview && (
                          <><br/><span style={{color: '#dc2626'}}>⚠️ A card payment came in after this invoice was already settled — check Stripe and refund it if needed.</span></>
                        )}
                        {invoice.status === 'paid' && invoice.paidAt && (
                          <><br/>Paid: {invoice.paidAt?.toDate().toLocaleDateString()} 
                          {invoice.cardLast4 && <> • {invoice.cardType || 'Card'} {invoice.cardLast4}</>}
                          {invoice.transactionId && <> • Transaction: {invoice.transactionId}</>}
                          </>
                        )}
                        {invoice.refundedAmount > 0 && (
                          <><br/><span style={{color: '#dc2626'}}>Refunded: ${invoice.refundedAmount.toFixed(2)}</span></>
                        )}
                        {invoice.paymentUrl && (
                          <><br/>Payment Link: <a href={invoice.paymentUrl} target="_blank" style={{color: 'var(--primary)'}}>View</a></>
                        )}
                      </div>
                    </div>
                    <div className="appointment-actions" style={{alignItems: 'center'}}>
                      <span className={`badge badge-${
                        invoice.status === 'paid' ? 'success' :
                        invoice.status === 'cancelled' || invoice.status === 'refunded' ? 'secondary' :
                        invoice.status === 'partial' ? 'warning' :
                        'warning'
                      }`}>
                        {invoice.status === 'partial' ? `partial (${FarriPricing.money(FarriPricing.toCents(invoice.paidAmount ?? (invoice.payments || []).reduce((s,p) => s + (p.amount||0), 0)))} paid)` : invoice.status}
                      </span>
                      {(invoice.status === 'outstanding' || invoice.status === 'partial') && (
                        <>
                          <button
                            className="btn btn-sm btn-success"
                            onClick={() => {
                              setSelectedInvoice(invoice);
                              setShowPaymentModal(true);
                            }}
                          >
                            💳 Pay Now
                          </button>
                          {userProfile?.allowManualPayments !== false && (
                            <button
                              className="btn btn-sm"
                              style={{background: '#059669', color: 'white'}}
                              onClick={() => {
                                setSelectedInvoice(invoice);
                                setShowManualPaymentModal(true);
                              }}
                            >
                              💵 Record Payment
                            </button>
                          )}
                        </>
                      )}
                      <button
                        className="btn btn-sm btn-outline"
                        onClick={() => openInvoicePdf(invoice, userProfile, userProfile?.autoPrintPdf ?? true)}
                        title="Open a professional PDF invoice (then print or save as PDF)"
                      >
                        🖨️ Print / PDF
                      </button>
                      {window.FarriTeam?.role !== 'farrier' && (invoice.status === 'paid' || invoice.status === 'partial') && (invoiceStripePaymentId(invoice) || invoiceIposPaid(invoice)) && invoiceRefundable(invoice) > 0 && (
                        <button
                          className="btn btn-sm btn-outline"
                          onClick={() => { setSelectedInvoice(invoice); setShowRefundModal(true); }}
                          title="Refund this card payment (manager password required)"
                        >
                          ↩️ Refund
                        </button>
                      )}
                      <div className="invoice-more-menu" style={{position: 'relative'}}>
                        <button
                          className="btn btn-sm btn-outline"
                          onClick={() => setOpenInvoiceMenu(openInvoiceMenu === invoice.id ? null : invoice.id)}
                          title="More actions"
                        >
                          More ▾
                        </button>
                        {openInvoiceMenu === invoice.id && (() => {
                          const itemStyle = {display: 'block', width: '100%', textAlign: 'left', padding: '0.6rem 1rem', background: 'none', border: 'none', cursor: 'pointer', fontSize: '0.875rem', color: 'var(--text)', whiteSpace: 'nowrap'};
                          const item = (label, onClick, extra = {}) => (
                            <button
                              style={{...itemStyle, ...extra}}
                              onMouseOver={(e) => { e.currentTarget.style.background = 'rgba(70,197,255,0.12)'; }}
                              onMouseOut={(e) => { e.currentTarget.style.background = 'none'; }}
                              onClick={() => { setOpenInvoiceMenu(null); onClick(); }}
                            >
                              {label}
                            </button>
                          );
                          const isOpen = invoice.status === 'outstanding' || invoice.status === 'partial';
                          return (
                            <div style={{
                              position: 'absolute',
                              right: 0,
                              top: 'calc(100% + 4px)',
                              background: 'var(--surface)',
                              border: '1.5px solid rgba(70,197,255,0.35)',
                              borderRadius: '10px',
                              boxShadow: '0 8px 24px rgba(0,0,0,0.35)',
                              minWidth: '180px',
                              zIndex: 200,
                              overflow: 'hidden'
                            }}>
                              {isOpen && item('✏️ Edit', () => setEditingInvoice(invoice))}
                              {isOpen && window.FarriTeam?.role !== 'farrier' && FarriPricing.invoiceRate(invoice) > 0 && (userProfile?.stripePublishableKey || userProfile?.ipospaysConnected) && !invoice.cardFeeWaived && item('🏷️ Waive card price & resend', () => waiveCardPrice(invoice, true))}
                              {isOpen && window.FarriTeam?.role !== 'farrier' && (userProfile?.stripePublishableKey || userProfile?.ipospaysConnected) && invoice.cardFeeWaived && item('↩️ Undo card price waiver', () => waiveCardPrice(invoice, false))}
                              {item('✉️ Email', () => emailInvoiceLink(invoice, userProfile))}
                              {invoice.customerPhone && item('📱 SMS', async () => {
                                const bizName = userProfile?.businessName || 'Your Farrier';
                                const payLink = invoice.paymentUrl || '';
                                const msg = `Hi ${invoice.customerName}, you have invoice #${invoice.invoiceNumber} for ${FarriPricing.dualPriceText(invoice)} from ${bizName}.${(FarriPricing.itemsSmsText?.(invoice) || '')}${payLink ? ` Pay here: ${payLink}` : ''}${payLink ? FarriPricing.altPaySms(userProfile, invoice) : ''} Reply STOP to opt out.`;
                                try {
                                  const res = await fetch('/api/send-sms', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ to: invoice.customerPhone, body: msg }),
                                  });
                                  const data = await res.json();
                                  if (data.success) {
                                    alert('✅ Invoice SMS sent to ' + invoice.customerPhone);
                                  } else {
                                    alert('❌ SMS failed: ' + (data.error || 'Unknown error'));
                                  }
                                } catch (e) {
                                  alert('❌ SMS error: ' + e.message);
                                }
                              })}
                              {invoice.paymentUrl && item('🔗 Copy Link', () => { navigator.clipboard?.writeText(String(invoice.paymentUrl)); alert("Payment link copied."); })}
                              {invoice.status === 'outstanding' && invoice.paymentUrl && item('📱 Send Reminder', () => {
                                const message = `Hi ${invoice.customerName}! Your invoice #${invoice.invoiceNumber} for $${invoice.total?.toFixed(2)} is ready. Pay here: ${invoice.paymentUrl}`;
                                alert(`SMS would be sent:\n\n${message}`);
                              })}
                              {isOpen && item('🚫 Cancel Invoice', () => { setSelectedInvoice(invoice); setShowCancelModal(true); }, {color: '#ef4444', borderTop: '1px solid var(--border)'})}
                            </div>
                          );
                        })()}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
              </>
            )}
          </div>

          {(showCreateModal || editingInvoice) && (
            <InvoiceCreateModal
              userId={userId}
              userProfile={userProfile}
              editingInvoice={editingInvoice}
              onClose={() => { setShowCreateModal(false); setEditingInvoice(null); }}
              onCreated={async (createdInvoice) => {
                const wasEditing = !!editingInvoice;
                setShowCreateModal(false);
                setEditingInvoice(null);
                loadInvoices();
                if (createdInvoice && !wasEditing) {
                  // Auto-open PDF after create (toggle in Settings)
                  openInvoicePdf(createdInvoice, userProfile, userProfile?.autoPrintPdf ?? true);
                  // SMS + email sent inside InvoiceCreateModal after payment link is generated
                }
              }}
            />
          )}

          {showPaymentModal && selectedInvoice && (
            <PaymentModal 
              invoice={selectedInvoice}
              userProfile={userProfile}
              onClose={() => {
                setShowPaymentModal(false);
                setSelectedInvoice(null);
              }}
              onPaymentSuccess={() => {
                setShowPaymentModal(false);
                setSelectedInvoice(null);
                loadInvoices();
              }}
            />
          )}

          {showManualPaymentModal && selectedInvoice && (
            <ManualPaymentModal
              invoice={selectedInvoice}
              onClose={() => {
                setShowManualPaymentModal(false);
                setSelectedInvoice(null);
              }}
              onPaymentRecorded={() => {
                setShowManualPaymentModal(false);
                setSelectedInvoice(null);
                loadInvoices();
              }}
            />
          )}

          {showRefundModal && selectedInvoice && (
            <RefundModal
              invoice={selectedInvoice}
              onClose={() => { setShowRefundModal(false); setSelectedInvoice(null); }}
              onRefunded={() => { setShowRefundModal(false); setSelectedInvoice(null); loadInvoices(); }}
            />
          )}

          {showCancelModal && selectedInvoice && (
            <div className="modal-overlay" onClick={() => setShowCancelModal(false)}>
              <div className="modal" onClick={(e) => e.stopPropagation()} style={{maxWidth: '500px'}}>
                <div className="modal-header">
                  <h2>🚫 Cancel Invoice</h2>
                  <button className="close-btn" onClick={() => setShowCancelModal(false)}>×</button>
                </div>

                <div style={{padding: '1.5rem'}}>
                  <div style={{
                    padding: '1rem',
                    background: '#fef2f2',
                    border: '1px solid #fecaca',
                    borderRadius: '8px',
                    marginBottom: '1.5rem'
                  }}>
                    <div style={{fontWeight: '600', marginBottom: '0.5rem'}}>
                      Invoice: {selectedInvoice.invoiceNumber}
                    </div>
                    <div style={{color: 'var(--text-muted)', fontSize: '0.9rem'}}>
                      Customer: {selectedInvoice.customerName}
                    </div>
                    <div style={{color: 'var(--text-muted)', fontSize: '0.9rem'}}>
                      Amount: ${selectedInvoice.total?.toFixed(2)}
                    </div>
                  </div>

                  <div style={{marginBottom: '1rem', color: '#991b1b', fontWeight: '500'}}>
                    ⚠️ This will mark the invoice as CANCELLED. It will remain in the system for records but cannot be paid.
                  </div>

                  <div className="form-group">
                    <label>Password (MMDDYYYY format) *</label>
                    <input 
                      type="password"
                      value={cancelPassword}
                      onChange={(e) => setCancelPassword(e.target.value)}
                      placeholder="Enter today's date (e.g., 01272026)"
                      autoFocus
                    />
                    <div style={{fontSize: '0.8rem', color: 'var(--text-muted)', marginTop: '0.25rem'}}>
                      Enter today's date in MMDDYYYY format
                    </div>
                  </div>

                  <div style={{display: 'flex', gap: '0.75rem', marginTop: '1.5rem'}}>
                    <button 
                      className="btn btn-outline"
                      onClick={() => {
                        setShowCancelModal(false);
                        setCancelPassword('');
                      }}
                      style={{flex: 1}}
                    >
                      Nevermind
                    </button>
                    <button 
                      className="btn"
                      onClick={handleCancelInvoice}
                      style={{flex: 1, background: '#ef4444', color: 'white'}}
                    >
                      Cancel Invoice
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Card payment id on a paid invoice (in-app charge, payment link, or portal) — refunds need it.
    function invoiceStripePaymentId(invoice) {
      const id = invoice.transactionId || invoice.stripePaymentIntentId || '';
      return String(id).startsWith('pi_') ? id : '';
    }
    // Paid through an iPOSpays pay link — refunded through iPOSpays (void or refund by RRN).
    function invoiceIposPaid(invoice) {
      return (invoice.payments || []).some(p => String(p.paymentId || '').startsWith('ipos_'));
    }
    function invoiceRefundable(invoice) {
      const paid = invoice.paidAmount || (invoice.payments || []).reduce((s,p) => s + (p.amount||0), 0) || invoice.total || 0;
      return Math.max(0, paid - (invoice.refundedAmount || 0));
    }

    // Settings → Team (owners only — see api/_lib/team.js). Farriers added here sign in with their
    // own login and work in this business: same customers, horses, services and payment accounts.
    function TeamSettings() {
      const [team, setTeam] = useState(null);
      const [form, setForm] = useState({ name: '', email: '', role: 'farrier' });
      const [busy, setBusy] = useState(false);
      const [msg, setMsg] = useState(null);
      const call = async (body) => {
        const r = await fetch('/api/stripe-payment', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        return r.json();
      };
      const load = async () => { try { const d = await call({ action: 'team_status' }); if (d.success) setTeam(d); } catch (e) { /* stays hidden */ } };
      useEffect(() => { load(); }, []);
      const act = async (body, ok) => {
        setBusy(true); setMsg(null);
        try {
          const d = await call(body);
          if (!d.success) setMsg({ ok: false, text: d.error || 'Something went wrong.' });
          else { if (ok) setMsg({ ok: true, text: typeof ok === 'function' ? ok(d) : ok }); await load(); }
        } catch (e) { setMsg({ ok: false, text: 'Could not reach FarriTech.' }); }
        setBusy(false);
      };
      if (!team || team.role !== 'owner') return null;
      const members = team.members || [], invites = team.invites || [];
      return (
        <div className="card" style={{marginTop: '1.5rem'}}>
          <h2>👥 Team</h2>
          <p style={{color: 'var(--text-muted)', marginBottom: '1rem', fontSize: '0.9rem'}}>
            Add the farriers who work for your business. Each signs in with their own login and sees your customers, horses and services;
            payments go into your payment account. <strong>Managers</strong> can also refund and waive the card price; <strong>farriers</strong> can't.
            Only you can change payment settings and the team.
          </p>
          {members.length === 0 && invites.length === 0 && <p style={{color: 'var(--text-muted)'}}>No one else yet. It's just you.</p>}
          {members.map(m => (
            <div key={m.uid} style={{display: 'flex', alignItems: 'center', gap: '0.75rem', padding: '0.6rem 0', borderBottom: '1px solid var(--border)', flexWrap: 'wrap'}}>
              <div style={{flex: 1, minWidth: '180px'}}><strong>{m.name || m.email}</strong>{m.name && <div style={{fontSize: '0.8rem', color: 'var(--text-muted)'}}>{m.email}</div>}</div>
              <select value={m.role} disabled={busy} onChange={(e) => act({ action: 'team_set_role', uid: m.uid, role: e.target.value }, 'Role updated.')}>
                <option value="farrier">Farrier</option>
                <option value="manager">Manager</option>
              </select>
              <button className="btn btn-sm btn-outline" disabled={busy} onClick={() => { if (confirm(`Remove ${m.name || m.email} from your team? They'll lose access to your business right away.`)) act({ action: 'team_remove', uid: m.uid }, 'Removed.'); }}>Remove</button>
            </div>
          ))}
          {invites.map(i => (
            <div key={i.email} style={{display: 'flex', alignItems: 'center', gap: '0.75rem', padding: '0.6rem 0', borderBottom: '1px solid var(--border)', flexWrap: 'wrap'}}>
              <div style={{flex: 1, minWidth: '180px'}}><strong>{i.name || i.email}</strong> <span style={{fontSize: '0.8rem', color: 'var(--text-muted)'}}>— invited ({i.role}), joins when they next sign in</span></div>
              <button className="btn btn-sm btn-outline" disabled={busy} onClick={() => act({ action: 'team_remove', email: i.email }, 'Invite cancelled.')}>Cancel invite</button>
            </div>
          ))}
          <div style={{display: 'flex', gap: '0.5rem', flexWrap: 'wrap', marginTop: '1rem', alignItems: 'flex-end'}}>
            <div className="form-group" style={{flex: '1 1 160px', margin: 0}}><label>Name</label><input value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} placeholder="Jane Smith" /></div>
            <div className="form-group" style={{flex: '2 1 220px', margin: 0}}><label>Email *</label><input type="email" value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} placeholder="jane@example.com" /></div>
            <div className="form-group" style={{flex: '1 1 120px', margin: 0}}><label>Role</label>
              <select value={form.role} onChange={(e) => setForm({ ...form, role: e.target.value })}><option value="farrier">Farrier</option><option value="manager">Manager</option></select>
            </div>
            <button className="btn btn-primary" disabled={busy || !form.email} onClick={() => act({ action: 'team_invite', ...form }, (d) => {
              setForm({ name: '', email: '', role: 'farrier' });
              return d.joined ? `Added. ${form.email} will get an email to set their password (or can sign in with Google).` : `Invited. ${form.email} already has a FarriTech login and joins when they next sign in.`;
            })}>{busy ? 'Working…' : 'Add to team'}</button>
          </div>
          {msg && <div style={{marginTop: '0.75rem', color: msg.ok ? '#16a34a' : '#dc2626'}}>{msg.text}</div>}
        </div>
      );
    }

    // Settings → Manager Password. Stored hashed on the server (farrierSecrets); guards refunds.
    function ManagerPasswordSettings() {
      const [isSet, setIsSet] = useState(null); // null = loading
      const [current, setCurrent] = useState('');
      const [next, setNext] = useState('');
      const [confirm, setConfirm] = useState('');
      const [saving, setSaving] = useState(false);
      const [message, setMessage] = useState(null); // { ok, text }

      const call = async (payload) => {
        const res = await fetch('/api/stripe-payment', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        return res.json();
      };

      useEffect(() => {
        call({ action: 'manager_password_status' })
          .then(r => setIsSet(r.success ? !!r.isSet : false))
          .catch(() => setIsSet(false));
      }, []);

      const save = async () => {
        setMessage(null);
        if (next.length < 6) { setMessage({ ok: false, text: 'New manager password must be at least 6 characters.' }); return; }
        if (next !== confirm) { setMessage({ ok: false, text: "New passwords don't match." }); return; }
        if (isSet && !current) { setMessage({ ok: false, text: 'Enter your current manager password.' }); return; }
        setSaving(true);
        try {
          const r = await call({ action: 'set_manager_password', currentPassword: current, newPassword: next });
          if (r.success) {
            setMessage({ ok: true, text: isSet ? '✅ Manager password changed.' : '✅ Manager password set.' });
            setIsSet(true); setCurrent(''); setNext(''); setConfirm('');
          } else {
            setMessage({ ok: false, text: r.error || 'Could not save manager password.' });
          }
        } catch (e) {
          setMessage({ ok: false, text: 'Could not save manager password.' });
        }
        setSaving(false);
      };

      return (
        <div className="card" style={{marginTop: '1.5rem'}}>
          <h2>🔒 Manager Password</h2>
          <p style={{color: 'var(--text-muted)', marginBottom: '1rem', fontSize: '0.9rem'}}>
            Required to issue refunds. Keep it separate from your login password so helpers using this device can't refund payments.
          </p>
          {isSet === null ? (
            <p style={{color: 'var(--text-muted)'}}>Loading…</p>
          ) : (
            <>
              <div style={{marginBottom: '1rem', fontWeight: 600, color: isSet ? '#16a34a' : '#d97706'}}>
                {isSet ? '✅ Manager password is set' : '⚠️ No manager password yet — refunds are blocked until you set one'}
              </div>
              {isSet && (
                <div className="form-group">
                  <label>Current Manager Password</label>
                  <input type="password" value={current} onChange={(e) => setCurrent(e.target.value)} autoComplete="current-password" />
                </div>
              )}
              <div className="form-group">
                <label>{isSet ? 'New Manager Password' : 'Manager Password'}</label>
                <input type="password" value={next} onChange={(e) => setNext(e.target.value)} autoComplete="new-password" placeholder="At least 6 characters" />
              </div>
              <div className="form-group">
                <label>Confirm {isSet ? 'New ' : ''}Manager Password</label>
                <input type="password" value={confirm} onChange={(e) => setConfirm(e.target.value)} autoComplete="new-password"
                  onKeyDown={(e) => { if (e.key === 'Enter' && !saving) save(); }} />
              </div>
              {message && <div style={{marginBottom: '1rem', color: message.ok ? '#16a34a' : '#dc2626'}}>{message.text}</div>}
              <button className="btn btn-primary" onClick={save} disabled={saving}>
                {saving ? 'Saving…' : isSet ? 'Change Manager Password' : 'Set Manager Password'}
              </button>
              {isSet && <div style={{fontSize: '0.8rem', color: 'var(--text-muted)', marginTop: '0.75rem'}}>Forgot it? Contact FarriTech support to reset it.</div>}
            </>
          )}
        </div>
      );
    }

    function RefundModal({ invoice, onClose, onRefunded }) {
      const refundable = invoiceRefundable(invoice);
      const [amount, setAmount] = useState(refundable.toFixed(2));
      const [password, setPassword] = useState('');
      const [processing, setProcessing] = useState(false);
      const [error, setError] = useState('');

      const handleRefund = async () => {
        const amt = parseFloat(amount);
        if (!amt || amt <= 0) { setError('Enter a refund amount.'); return; }
        if (amt > refundable + 0.001) { setError(`Refund can't be more than $${refundable.toFixed(2)}.`); return; }
        if (!password) { setError('Enter the manager password.'); return; }
        setProcessing(true); setError('');
        try {
          // Server checks the manager password and uses this farrier's Stripe key, or for an
          // iPOSpays payment voids/refunds it in iPOSpays and records it on the invoice itself.
          const ipos = !invoiceStripePaymentId(invoice) && invoiceIposPaid(invoice);
          const res = await fetch('/api/stripe-payment', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(ipos
              ? { action: 'ipospays_refund', invoiceId: invoice.id, amount: amt, refundPassword: password }
              : { action: 'refund', transactionId: invoiceStripePaymentId(invoice), amount: amt, refundPassword: password })
          });
          const result = await res.json();
          if (!result.success) { setError(result.error || 'Refund failed.'); setProcessing(false); return; }
          if (result.recorded) {
            alert(`✅ ${result.kind === 'void' ? 'Voided' : 'Refunded'} $${amt.toFixed(2)} in iPOSpays`);
            onRefunded();
            return;
          }
          const fresh = (await db.collection('invoices').doc(invoice.id).get()).data() || {};
          const refunds = [...(fresh.refunds || []), { amount: amt, refundId: result.refundId, transactionId: invoiceStripePaymentId(invoice), date: new Date().toISOString() }];
          const refundedAmount = refunds.reduce((s,r) => s + (r.amount||0), 0);
          const fully = refundedAmount >= invoiceRefundable({ ...fresh, refundedAmount: 0 }) - 0.001;
          await db.collection('invoices').doc(invoice.id).update({
            refunds, refundedAmount,
            ...(fully ? { status: 'refunded', refundedAt: firebase.firestore.FieldValue.serverTimestamp() } : {})
          });
          alert(`✅ Refunded $${amt.toFixed(2)}`);
          onRefunded();
        } catch (err) {
          console.error('Refund error:', err);
          setError('Refund failed. Please try again.');
          setProcessing(false);
        }
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" onClick={(e) => e.stopPropagation()} style={{maxWidth: '500px'}}>
            <div className="modal-header">
              <h2>↩️ Refund Payment</h2>
              <button className="close-btn" onClick={onClose}>×</button>
            </div>
            <div style={{padding: '1.5rem'}}>
              <div style={{padding: '1rem', background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: '8px', marginBottom: '1.5rem'}}>
                <div style={{fontWeight: '600', marginBottom: '0.5rem'}}>Invoice: {invoice.invoiceNumber}</div>
                <div style={{color: 'var(--text-muted)', fontSize: '0.9rem'}}>Customer: {invoice.customerName}</div>
                <div style={{color: 'var(--text-muted)', fontSize: '0.9rem'}}>
                  Refundable: ${refundable.toFixed(2)}
                  {invoice.refundedAmount > 0 && <> • Already refunded: ${invoice.refundedAmount.toFixed(2)}</>}
                </div>
              </div>
              <div className="form-group">
                <label>Refund Amount *</label>
                <input type="number" step="0.01" min="0.01" max={refundable} value={amount} onChange={(e) => setAmount(e.target.value)} />
              </div>
              <div className="form-group">
                <label>Manager Password *</label>
                <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} autoFocus
                  onKeyDown={(e) => { if (e.key === 'Enter' && !processing) handleRefund(); }} />
              </div>
              <div style={{fontSize: '0.85rem', color: 'var(--text-muted)'}}>The money goes back to the customer's card through {!invoiceStripePaymentId(invoice) && invoiceIposPaid(invoice) ? 'iPOSpays' : 'Stripe'}. This can't be undone.</div>
              {error && <div style={{marginTop: '1rem', padding: '0.75rem', background: '#fef2f2', border: '1px solid #fecaca', borderRadius: '8px', color: '#991b1b'}}>{error}</div>}
              <div style={{display: 'flex', gap: '0.75rem', marginTop: '1.5rem'}}>
                <button className="btn btn-outline" onClick={onClose} style={{flex: 1}} disabled={processing}>Nevermind</button>
                <button className="btn" onClick={handleRefund} disabled={processing} style={{flex: 1, background: '#ef4444', color: 'white'}}>
                  {processing ? 'Refunding…' : `Refund $${(parseFloat(amount) || 0).toFixed(2)}`}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // Keyed card payment. The farrier enters how much of the balance to pay (cash price);
    // the card price for that amount is shown before charging. The server works out the
    // same amount, charges it and records the payment on the invoice.
    function PaymentModal({ invoice, onClose, onPaymentSuccess, userProfile }) {
      const paidSoFar = FarriPricing.toCents(invoice.paidAmount ?? (invoice.payments || []).reduce((s,p) => s + (p.amount||0), 0)) / 100;
      const remaining = FarriPricing.balanceCents(invoice) / 100;
      const [applyAmount, setApplyAmount] = useState(remaining.toFixed(2));
      const [processing, setProcessing] = useState(false);
      const [error, setError] = useState('');
      const [stripeReady, setStripeReady] = useState(false);
      const cardElementRef = React.useRef(null);
      const stripeRef = React.useRef(null);
      const cardRef = React.useRef(null);

      const applyCents = Math.min(FarriPricing.toCents(applyAmount), FarriPricing.balanceCents(invoice));
      const chargeCents = FarriPricing.getChargeCents(invoice, 'card_keyed', applyCents);
      const hasCardPrice = chargeCents !== applyCents;

      // The secret key lives only on the server; a publishable key means Stripe is connected.
      // iPOSpays, when connected, takes keyed cards instead (same as pay links).
      const useIpos = !!userProfile?.ipospaysConnected;
      const publishableKey = useIpos ? '' : (userProfile?.stripePublishableKey || '');
      const hasStripe = !!publishableKey;
      // iPOSpays keyed card: { ref, url } of the card form shown in this box, while we wait.
