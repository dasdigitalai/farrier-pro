                      {svc.isActive ? "Disable" : "Enable"}
                    </button>
                    <button className="btn btn-sm btn-outline" style={{color: "#dc2626", borderColor: "#dc2626"}} disabled={deletingId === svc.id} onClick={() => deleteService(svc)}>
                      {deletingId === svc.id ? "…" : "Delete"}
                    </button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

    function InventoryView({ userId }) {
      const [items, setItems] = useState([]);
      const [loading, setLoading] = useState(true);
      const [itemModal, setItemModal] = useState(null); // { item } | null — null = closed, item: null = add
      const [restockModal, setRestockModal] = useState(null); // { item } | null
      const [catalogOpen, setCatalogOpen] = useState(false);

      const loadItems = async () => {
        if (!db) return;
        setLoading(true);
        const snap = await db.collection('inventoryItems').where('farrierId', '==', userId).get();
        const rows = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        rows.sort((a, b) => (a.category || '').localeCompare(b.category || '') || (a.name || '').localeCompare(b.name || ''));
        setItems(rows);
        setLoading(false);
      };

      useEffect(() => { loadItems(); }, [userId]);

      const consumables = items.filter(i => i.isConsumable !== false);
      const tools = items.filter(i => i.isConsumable === false);
      const lowStock = consumables.filter(i => Number(i.quantityOnHand || 0) < Number(i.reorderThreshold || 0));

      const renderRow = (item, showReorderBadge) => {
        const isLow = showReorderBadge && Number(item.quantityOnHand || 0) < Number(item.reorderThreshold || 0);
        return (
          <tr key={item.id} style={{ borderTop: '1px solid var(--border)', background: isLow ? '#fff5f5' : 'transparent' }}>
            <td style={{ padding: '0.5rem' }}>
              {item.name}{item.size ? ` (${item.size})` : ''}
              {isLow && <span style={{ marginLeft: '0.5rem', color: '#dc2626', fontWeight: 600, fontSize: '0.8rem' }}>⚠ Low</span>}
            </td>
            <td style={{ padding: '0.5rem' }}>{item.category || ''}</td>
            <td style={{ padding: '0.5rem' }}>{item.brand || ''}</td>
            <td style={{ padding: '0.5rem' }}>{item.quantityOnHand ?? 0} {item.unit || ''}</td>
            <td style={{ padding: '0.5rem', display: 'flex', gap: '0.5rem' }}>
              <button className="btn btn-sm btn-outline" onClick={() => setRestockModal({ item })}>Restock</button>
              <button className="btn btn-sm btn-outline" onClick={() => setItemModal({ item })}>Edit</button>
            </td>
          </tr>
        );
      };

      return (
        <div className="card">
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem' }}>
            <h2 style={{ margin: 0 }}>Inventory</h2>
            <div style={{ display: 'flex', gap: '0.5rem' }}>
              <button className="btn btn-outline" onClick={() => setCatalogOpen(true)}>📋 Add from Catalog</button>
              <button className="btn btn-primary" onClick={() => setItemModal({ item: null })}>+ Add Item</button>
            </div>
          </div>

          {lowStock.length > 0 && (
            <div style={{ padding: '0.75rem 1rem', borderRadius: 8, background: '#fff5f5', border: '2px solid #fecaca', color: '#dc2626', fontWeight: 600, marginBottom: '1rem' }}>
              ⚠️ {lowStock.length} item{lowStock.length > 1 ? 's' : ''} low on stock
            </div>
          )}

          {loading ? (
            <div>Loading...</div>
          ) : (
            <React.Fragment>
              {items.length === 0 && (
                <div style={{ padding: '1.25rem', borderRadius: 12, background: 'var(--surface)', border: '2px solid var(--primary)', marginBottom: '1rem' }}>
                  <div style={{ fontWeight: 700, fontSize: '1.1rem', marginBottom: '0.35rem' }}>📋 Build your inventory from our supply catalog?</div>
                  <div style={{ color: 'var(--text-muted)', marginBottom: '0.9rem' }}>
                    Tick the shoes, nails, pads and tools you carry — brand, size and part number come filled in. You just count what's on the truck.
                  </div>
                  <div style={{ display: 'flex', gap: '0.5rem' }}>
                    <button className="btn btn-primary" onClick={() => setCatalogOpen(true)}>Browse catalog</button>
                    <button className="btn btn-outline" onClick={() => setItemModal({ item: null })}>I'll add my own</button>
                  </div>
                </div>
              )}
              <h3 style={{ marginTop: '1rem' }}>Shoes, Nails &amp; Consumables</h3>
              <table style={{ width: '100%', borderCollapse: 'collapse' }}>
                <thead>
                  <tr style={{ textAlign: 'left' }}>
                    <th style={{ padding: '0.5rem' }}>Name</th>
                    <th style={{ padding: '0.5rem' }}>Category</th>
                    <th style={{ padding: '0.5rem' }}>Brand</th>
                    <th style={{ padding: '0.5rem' }}>On Hand</th>
                    <th style={{ padding: '0.5rem' }}></th>
                  </tr>
                </thead>
                <tbody>
                  {consumables.length === 0 ? (
                    <tr><td colSpan={5} style={{ padding: '0.5rem', color: 'var(--text-muted)' }}>No consumable items yet.</td></tr>
                  ) : consumables.map(item => renderRow(item, true))}
                </tbody>
              </table>

              <h3 style={{ marginTop: '1.5rem' }}>Tools</h3>
              <table style={{ width: '100%', borderCollapse: 'collapse' }}>
                <thead>
                  <tr style={{ textAlign: 'left' }}>
                    <th style={{ padding: '0.5rem' }}>Name</th>
                    <th style={{ padding: '0.5rem' }}>Category</th>
                    <th style={{ padding: '0.5rem' }}>Brand</th>
                    <th style={{ padding: '0.5rem' }}>On Hand</th>
                    <th style={{ padding: '0.5rem' }}></th>
                  </tr>
                </thead>
                <tbody>
                  {tools.length === 0 ? (
                    <tr><td colSpan={5} style={{ padding: '0.5rem', color: 'var(--text-muted)' }}>No tools tracked yet.</td></tr>
                  ) : tools.map(item => renderRow(item, false))}
                </tbody>
              </table>
            </React.Fragment>
          )}

          {itemModal && (
            <InventoryItemModal item={itemModal.item} userId={userId}
              onClose={() => setItemModal(null)}
              onSaved={() => loadItems()} />
          )}

          {catalogOpen && (
            <InventoryCatalogModal userId={userId} existingItems={items}
              onClose={() => setCatalogOpen(false)}
              onSaved={() => loadItems()} />
          )}

          {restockModal && (
            <InventoryRestockModal item={restockModal.item} userId={userId}
              onClose={() => setRestockModal(null)}
              onSaved={() => loadItems()} />
          )}
        </div>
      );
    }

    // Catalog picker. Two sources, both defined in inventory-catalog.js (shared with mobile):
    //  - Supply catalog: real supplier products, one pick per size, loaded on open.
    //  - General supplies: the generic consumables list, for things the supply catalog lacks.
    // Picks are copied into the farrier's inventoryItems (qty 0) in one batch. Items the
    // farrier already has (same name + size) show checked-off and disabled, so
    // re-opening the catalog never creates duplicates.
    function InventoryCatalogModal({ userId, existingItems, onClose, onSaved }) {
      const generic = window.INVENTORY_CATALOG || [];
      const owned = new Set(existingItems.map(i => inventoryCatalogKey(i.name, i.size)));
      const [tab, setTab] = useState('fd');
      const [fd, setFd] = useState(null);        // loaded catalog doc
      const [fdError, setFdError] = useState('');
      const [openCat, setOpenCat] = useState(null);
      const [openProduct, setOpenProduct] = useState(null);
      const [selected, setSelected] = useState(() => new Set()); // 'fd:<p>:<v>' | 'gen:<idx>'
      const [search, setSearch] = useState('');
      const [saving, setSaving] = useState(false);

      useEffect(() => {
        loadSupplyCatalog().then(setFd).catch(e => setFdError(e.message));
      }, []);

      const q = search.trim().toLowerCase();
      const toggleKey = (key) => setSelected(prev => {
        const next = new Set(prev);
        next.has(key) ? next.delete(key) : next.add(key);
        return next;
      });

      // ── Supply catalog tab ──
      const fdProducts = fd ? fd.products : [];
      const fdTop = (p) => p.c.split(' > ')[0];
      const fdCategories = [...new Set(fdProducts.map(fdTop))];
      const fdVisible = q
        ? fdProducts.map((p, pi) => ({ p, pi })).filter(({ p }) => supplyCatalogProductMatches(p, q)).slice(0, 150)
        : fdProducts.map((p, pi) => ({ p, pi })).filter(({ p }) => fdTop(p) === openCat);

      // Bulk selection: keys for every size of a product the farrier doesn't already own.
      const productKeys = (p, pi) => p.v.map((v, vi) => owned.has(inventoryCatalogKey(p.t, v[0])) ? null : `fd:${pi}:${vi}`).filter(Boolean);
      const allSelected = (keys) => keys.length > 0 && keys.every(k => selected.has(k));
      const setKeys = (keys, on) => setSelected(prev => {
        const next = new Set(prev);
        keys.forEach(k => on ? next.add(k) : next.delete(k));
        return next;
      });
      const searchKeys = q ? fdVisible.flatMap(({ p, pi }) => productKeys(p, pi)) : [];

      const renderSizes = (p, pi) => {
        const keys = productKeys(p, pi);
        const all = allSelected(keys);
        return (
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: '0.35rem', padding: '0.25rem 0 0.6rem 1.5rem' }}>
          {keys.length > 1 && (
            <button className="btn btn-sm btn-outline" style={{ padding: '0.25rem 0.6rem', fontSize: '0.8rem' }} onClick={() => setKeys(keys, !all)}>
              {all ? 'Clear sizes' : 'All sizes'}
            </button>
          )}
          {p.v.map((v, vi) => {
            const key = `fd:${pi}:${vi}`;
            const isOwned = owned.has(inventoryCatalogKey(p.t, v[0]));
            const on = isOwned || selected.has(key);
            return (
              <label key={vi} title={v[1] ? `Part # ${v[1]}` : ''} style={{ display: 'inline-flex', alignItems: 'center', gap: '0.3rem', padding: '0.25rem 0.55rem', borderRadius: 999, border: `2px solid ${isOwned ? '#22c55e' : on ? 'var(--primary)' : 'var(--border)'}`, fontSize: '0.85rem', cursor: isOwned ? 'default' : 'pointer' }} {...(isOwned ? { title: 'Already in your inventory' } : {})}>
                <input type="checkbox" checked={on} disabled={isOwned} onChange={() => toggleKey(key)} style={{ margin: 0 }} />
                {v[0] || 'Standard'}{isOwned && <span style={{ color: '#22c55e' }}> ✓</span>}
              </label>
            );
          })}
        </div>
        );
      };

      const renderProduct = ({ p, pi }) => {
        const single = p.v.length === 1 && !p.v[0][0];
        const selCount = p.v.filter((_, vi) => selected.has(`fd:${pi}:${vi}`)).length;
        if (single) {
          const key = `fd:${pi}:0`;
          const isOwned = owned.has(inventoryCatalogKey(p.t, ''));
          return (
            <label key={pi} style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', padding: '0.35rem 0', cursor: isOwned ? 'default' : 'pointer' }}>
              <input type="checkbox" checked={isOwned || selected.has(key)} disabled={isOwned} onChange={() => toggleKey(key)} />
              <span style={{ flex: 1 }}>{p.t}{p.b ? <span style={{ color: 'var(--text-muted)' }}> — {p.b}</span> : null}</span>
              {isOwned && <span style={{ color: '#22c55e', fontSize: '0.8rem', fontWeight: 600, whiteSpace: 'nowrap' }}>✓ In inventory</span>}
            </label>
          );
        }
        const isOpen = openProduct === pi;
        return (
          <div key={pi}>
            <div onClick={() => setOpenProduct(isOpen ? null : pi)} style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', padding: '0.35rem 0', cursor: 'pointer' }}>
              <input type="checkbox" title="Select every size" checked={allSelected(productKeys(p, pi)) || productKeys(p, pi).length === 0}
                disabled={productKeys(p, pi).length === 0}
                onClick={e => e.stopPropagation()}
                onChange={e => setKeys(productKeys(p, pi), e.target.checked)} />
              <span style={{ width: '1rem', color: 'var(--text-muted)' }}>{isOpen ? '▾' : '▸'}</span>
              <span style={{ flex: 1 }}>{p.t}{p.b ? <span style={{ color: 'var(--text-muted)' }}> — {p.b}</span> : null}</span>
              <span style={{ color: selCount ? 'var(--primary)' : 'var(--text-muted)', fontSize: '0.8rem', fontWeight: selCount ? 700 : 400 }}>
                {selCount ? `${selCount} selected` : `${p.v.length} sizes`}
              </span>
            </div>
            {isOpen && renderSizes(p, pi)}
          </div>
        );
      };

      // ── General supplies tab ──
      const genVisible = generic.map((entry, idx) => ({ entry, idx }))
        .filter(({ entry }) => !q || entry.name.toLowerCase().includes(q) || entry.category.toLowerCase().includes(q));
      const genCategories = [...new Set(genVisible.map(v => v.entry.category))];
      const selectCommon = () => setSelected(prev => {
        const next = new Set(prev);
        generic.forEach((entry, idx) => { if (entry.common && !owned.has(inventoryCatalogKey(entry.name, ''))) next.add(`gen:${idx}`); });
        return next;
      });

      const handleAdd = async () => {
        if (!selected.size) return;
        setSaving(true);
        try {
          const batch = db.batch();
          [...selected].forEach(key => {
            const [src, a, b] = key.split(':');
            const fields = src === 'fd'
              ? inventoryItemFromSupplyCatalog(fdProducts[a], fdProducts[a].v[b])
              : inventoryItemFromCatalog(generic[a]);
            batch.set(db.collection('inventoryItems').doc(), {
              ...fields,
              farrierId: userId,
              createdAt: firebase.firestore.FieldValue.serverTimestamp(),
              updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
            });
          });
          await batch.commit();
          onSaved();
          onClose();
        } catch (e) {
          alert('Error adding items: ' + e.message);
          setSaving(false);
        }
      };

      const tabBtn = (id, label) => (
        <button className={`btn btn-sm ${tab === id ? 'btn-primary' : 'btn-outline'}`} onClick={() => { setTab(id); setSearch(''); }}>{label}</button>
      );

      return (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000, padding: '1rem' }}>
          <div className="card" style={{ maxWidth: 720, width: '100%', height: '90vh', display: 'flex', flexDirection: 'column' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '0.75rem' }}>
              <h2 style={{ margin: 0, color: 'var(--primary)' }}>📋 Add from Catalog</h2>
              <button className="btn btn-sm btn-outline" onClick={onClose}>✕ Close</button>
            </div>
            <div style={{ display: 'flex', gap: '0.5rem', marginBottom: '0.75rem' }}>
              {tabBtn('fd', 'Supply catalog')}
              {tabBtn('gen', 'General supplies')}
            </div>
            <p style={{ margin: '0 0 0.75rem', color: 'var(--text-muted)', fontSize: '0.9rem' }}>
              {tab === 'fd'
                ? 'Pick the sizes you carry. Brand, size and part number are filled in — click Edit afterwards to set quantity, reorder level and your cost.'
                : "For anything not in the supply catalog. They're added with a quantity of 0 — click Edit on each to fill in details."}
            </p>
            <div style={{ display: 'flex', gap: '0.5rem', marginBottom: '0.75rem' }}>
              <input type="search" value={search} placeholder={tab === 'fd' ? 'Search name, brand or part #…' : 'Search items…'} onChange={e => setSearch(e.target.value)}
                style={{ flex: 1, padding: '0.6rem 0.75rem', borderRadius: 8, border: '2px solid var(--border)', fontFamily: 'Outfit,sans-serif', fontSize: '1rem' }} />
              {tab === 'gen' && <button className="btn btn-sm btn-outline" onClick={selectCommon}>✓ Select common items</button>}
            </div>

            <div style={{ flex: 1, overflowY: 'auto', borderTop: '1px solid var(--border)', paddingTop: '0.5rem' }}>
              {tab === 'fd' && (
                fdError ? (
                  <div style={{ padding: '1rem 0', color: '#dc2626' }}>Couldn't load the supply catalog ({fdError}). Check your connection and reopen.</div>
                ) : !fd ? (
                  <div style={{ padding: '1rem 0' }}>Loading catalog…</div>
                ) : q ? (
                  <React.Fragment>
                    {fdVisible.length === 0 && <div style={{ padding: '1rem 0', color: 'var(--text-muted)' }}>No products match "{search}".</div>}
                    {searchKeys.length > 1 && (
                      <div style={{ padding: '0.25rem 0 0.5rem' }}>
                        <button className="btn btn-sm btn-outline" onClick={() => setKeys(searchKeys, !allSelected(searchKeys))}>
                          {allSelected(searchKeys) ? `Clear all ${searchKeys.length} sizes shown` : `Select all ${searchKeys.length} sizes shown`}
                        </button>
                      </div>
                    )}
                    {fdVisible.map(renderProduct)}
                    {fdVisible.length === 150 && <div style={{ padding: '0.5rem 0', color: 'var(--text-muted)', fontSize: '0.85rem' }}>Showing the first 150 matches — refine your search.</div>}
                  </React.Fragment>
                ) : (
                  fdCategories.map(cat => {
                    const count = fdProducts.filter(p => fdTop(p) === cat).length;
                    const isOpen = openCat === cat;
                    return (
                      <div key={cat} style={{ borderBottom: '1px solid var(--border)' }}>
                        <div onClick={() => { setOpenCat(isOpen ? null : cat); setOpenProduct(null); }} style={{ display: 'flex', justifyContent: 'space-between', padding: '0.6rem 0', cursor: 'pointer', fontWeight: 700 }}>
                          <span>{isOpen ? '▾' : '▸'} {cat}</span>
                          <span style={{ color: 'var(--text-muted)', fontWeight: 400, fontSize: '0.85rem' }}>{count} products</span>
                        </div>
                        {isOpen && <div style={{ paddingBottom: '0.5rem' }}>{fdVisible.map(renderProduct)}</div>}
                      </div>
                    );
                  })
                )
              )}

              {tab === 'gen' && (
                <React.Fragment>
                  {genCategories.length === 0 && (
                    <div style={{ padding: '1rem 0', color: 'var(--text-muted)' }}>No items match "{search}" — use + Add Item to add it yourself.</div>
                  )}
                  {genCategories.map(cat => (
                    <div key={cat} style={{ marginBottom: '0.75rem' }}>
                      <div style={{ margin: '0.5rem 0 0.25rem' }}><strong>{cat}</strong></div>
                      {genVisible.filter(v => v.entry.category === cat).map(({ entry, idx }) => {
                        const isOwned = owned.has(inventoryCatalogKey(entry.name, ''));
                        return (
                          <label key={idx} style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', padding: '0.3rem 0', cursor: isOwned ? 'default' : 'pointer' }}>
                            <input type="checkbox" checked={isOwned || selected.has(`gen:${idx}`)} disabled={isOwned} onChange={() => toggleKey(`gen:${idx}`)} />
                            <span style={{ flex: 1 }}>{entry.name}</span>
                            {isOwned ? <span style={{ color: '#22c55e', fontSize: '0.8rem', fontWeight: 600, whiteSpace: 'nowrap' }}>✓ In inventory</span> : <span style={{ color: 'var(--text-muted)', fontSize: '0.8rem' }}>per {entry.unit}</span>}
                          </label>
                        );
                      })}
                    </div>
                  ))}
                </React.Fragment>
              )}
            </div>

            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '0.5rem', borderTop: '1px solid var(--border)', paddingTop: '0.75rem', marginTop: '0.5rem' }}>
              <span />
              <div style={{ display: 'flex', gap: '0.5rem' }}>
                <button className="btn btn-outline" onClick={onClose}>Cancel</button>
                <button className="btn btn-primary" disabled={!selected.size || saving} onClick={handleAdd}>
                  {saving ? 'Adding…' : selected.size ? `Add ${selected.size} item${selected.size > 1 ? 's' : ''}` : 'Select items to add'}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function InventoryItemModal({ item, userId, onClose, onSaved }) {
      const [name, setName] = useState(item?.name || '');
      const [category, setCategory] = useState(item?.category || '');
      const [brand, setBrand] = useState(item?.brand || '');
      const [size, setSize] = useState(item?.size || '');
      const [unit, setUnit] = useState(item?.unit || '');
      const [quantityOnHand, setQuantityOnHand] = useState(String(item?.quantityOnHand ?? '0'));
      const [reorderThreshold, setReorderThreshold] = useState(String(item?.reorderThreshold ?? '0'));
      const [costPerUnit, setCostPerUnit] = useState(String(item?.costPerUnit ?? '0'));
      const [isConsumable, setIsConsumable] = useState(item?.isConsumable !== false);
      const [notes, setNotes] = useState(item?.notes || '');
      const [saving, setSaving] = useState(false);

      const inputStyle = { width: '100%', padding: '0.75rem', borderRadius: 8, border: '2px solid var(--border)', fontFamily: 'Outfit,sans-serif', fontSize: '1rem', boxSizing: 'border-box' };

      const handleSave = async () => {
        if (!name.trim()) return alert('Item name is required.');
        setSaving(true);
        try {
          const payload = {
            name: name.trim(), category: category.trim(), brand: brand.trim(), size: size.trim(),
            unit: unit.trim(), quantityOnHand: Number(quantityOnHand) || 0,
            reorderThreshold: Number(reorderThreshold) || 0, costPerUnit: Number(costPerUnit) || 0,
            isConsumable: Boolean(isConsumable), isActive: true, notes: notes.trim(),
            updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
          };
          if (item?.id) {
            await db.collection('inventoryItems').doc(item.id).update(payload);
          } else {
            await db.collection('inventoryItems').add({
              ...payload, farrierId: userId, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            });
          }
          onSaved();
          onClose();
        } catch (e) {
          alert('Error saving item: ' + e.message);
        }
        setSaving(false);
      };

      return (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000, padding: '1rem' }}>
          <div className="card" style={{ maxWidth: 480, width: '100%', maxHeight: '90vh', overflowY: 'auto' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1.5rem' }}>
              <h2 style={{ margin: 0, color: 'var(--primary)' }}>{item?.id ? `✏️ Edit ${item.name || 'Item'}` : '➕ Add Item'}</h2>
              <button className="btn btn-sm btn-outline" onClick={onClose}>✕ Close</button>
            </div>

            {[
              { label: 'Name *', val: name, set: setName, ph: 'St. Croix Eventer Front 00' },
              { label: 'Category', val: category, set: setCategory, ph: 'Shoes, Nails, Consumables, Tools' },
              { label: 'Brand', val: brand, set: setBrand, ph: 'St. Croix' },
              { label: 'Size', val: size, set: setSize, ph: '00' },
              { label: 'Unit', val: unit, set: setUnit, ph: 'pair, box, each' },
            ].map(f => (
              <div className="form-group" key={f.label}>
                <label>{f.label}</label>
                <input type="text" value={f.val} placeholder={f.ph} onChange={e => f.set(e.target.value)} style={inputStyle} />
              </div>
            ))}

            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.75rem' }}>
              <div className="form-group">
                <label>Quantity On Hand</label>
                <input type="number" min="0" value={quantityOnHand} onChange={e => setQuantityOnHand(e.target.value)} style={inputStyle} />
              </div>
              <div className="form-group">
                <label>Reorder Threshold</label>
                <input type="number" min="0" value={reorderThreshold} onChange={e => setReorderThreshold(e.target.value)} style={inputStyle} />
              </div>
            </div>

    // ---- CSV helpers (Data Management) ----
    function normalizeHeader_(h) {
      return String(h || '').toLowerCase().replace(/\([^)]*\)/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
    }

    function parseCSV_(text) {
      const rows = [];
      let row = [];
      let field = '';
      let inQuotes = false;
      const clean = String(text || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n').replace(/^﻿/, '');
      for (let i = 0; i < clean.length; i++) {
        const c = clean[i];
        if (inQuotes) {
          if (c === '"') {
            if (clean[i + 1] === '"') { field += '"'; i++; }
            else { inQuotes = false; }
          } else {
            field += c;
          }
        } else if (c === '"') {
          inQuotes = true;
        } else if (c === ',') {
          row.push(field); field = '';
        } else if (c === '\n') {
          row.push(field); rows.push(row); row = []; field = '';
        } else {
          field += c;
        }
      }
      if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
      const nonEmpty = rows.filter(r => r.some(v => String(v).trim() !== ''));
      if (nonEmpty.length === 0) return { headers: [], rows: [] };
      const headers = nonEmpty[0].map(h => String(h).trim());
      const rowObjects = nonEmpty.slice(1).map(r => {
        const obj = {};
        headers.forEach((h, idx) => { obj[h] = r[idx] !== undefined ? String(r[idx]).trim() : ''; });
        return obj;
      });
      return { headers, rows: rowObjects };
    }

    function csvEscape_(val) {
      const s = val === null || val === undefined ? '' : String(val);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }

    function toCSV_(fields, rows) {
      const lines = [fields.map(f => csvEscape_(f.header)).join(',')];
      rows.forEach(r => lines.push(fields.map(f => csvEscape_(r[f.key])).join(',')));
      return lines.join('\r\n');
    }

    function downloadCSV_(filename, csvText) {
      const blob = new Blob(['﻿' + csvText], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function buildHeaderMap_(csvHeaders, fields) {
      const normalized = csvHeaders.map(normalizeHeader_);
      const map = {};
      fields.forEach(f => {
        const idx = normalized.indexOf(normalizeHeader_(f.header));
        if (idx !== -1) map[f.key] = csvHeaders[idx];
      });
      return map;
    }

    async function batchWrite_(collectionName, payloads) {
      const CHUNK = 400;
      for (let i = 0; i < payloads.length; i += CHUNK) {
        const chunk = payloads.slice(i, i + CHUNK);
        const batch = db.batch();
        chunk.forEach(payload => batch.set(db.collection(collectionName).doc(), payload));
        await batch.commit();
      }
    }

    async function batchUpdate_(collectionName, updates) {
      const CHUNK = 400;
      for (let i = 0; i < updates.length; i += CHUNK) {
        const chunk = updates.slice(i, i + CHUNK);
        const batch = db.batch();
        chunk.forEach(u => batch.update(db.collection(collectionName).doc(u.id), u.payload));
        await batch.commit();
      }
    }

    // QuickBooks Online's CSV importer requires MM/DD/YYYY regardless of the
    // farrier's locale.
    function formatQbDate_(ts) {
      const d = ts?.toDate ? ts.toDate() : (ts instanceof Date ? ts : new Date(ts || Date.now()));
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${mm}/${dd}/${d.getFullYear()}`;
    }

    function DataManagementView({ userId }) {
      const [customers, setCustomers] = useState([]);
      const [horses, setHorses] = useState([]);
      const [invoices, setInvoices] = useState([]);
      const [loading, setLoading] = useState(true);

      const [customerParsed, setCustomerParsed] = useState(null);
      const [customerImporting, setCustomerImporting] = useState(false);
      const [customerResult, setCustomerResult] = useState(null);
      const customerFileRef = useRef(null);

      const [horseParsed, setHorseParsed] = useState(null);
      const [horseImporting, setHorseImporting] = useState(false);
      const [horseResult, setHorseResult] = useState(null);
      const horseFileRef = useRef(null);

      const [qbRange, setQbRange] = useState('thisMonth');
      const [qbStart, setQbStart] = useState('');
      const [qbEnd, setQbEnd] = useState('');

      const loadAll = async () => {
        if (!db) return;
        setLoading(true);
        try {
          const [custSnap, horseSnap, invSnap] = await Promise.all([
            db.collection('customers').where('farrierId', '==', userId).get(),
            db.collection('horses').where('farrierId', '==', userId).get(),
            db.collection('invoices').where('farrierId', '==', userId).get(),
          ]);
          setCustomers(custSnap.docs.map(d => ({ id: d.id, ...d.data() })));
          setHorses(horseSnap.docs.map(d => ({ id: d.id, ...d.data() })));
          setInvoices(invSnap.docs.map(d => ({ id: d.id, ...d.data() })));
        } catch (e) {
          console.error('Error loading data for export:', e);
        }
        setLoading(false);
      };

      useEffect(() => { loadAll(); }, [userId]);

      // ---- Customers ----
      const downloadCustomerTemplate = () => {
        const example = {
          name: 'Jane Smith', farmName: 'Sunny Acres Farm', managerContact: '',
          email: 'jane@example.com', phone: '555-123-4567', address: '123 Farm Rd',
          city: 'Ocala', state: 'FL', zip: '34470',
          notes: 'Prefers morning appointments', source: 'referral',
        };
        downloadCSV_('customer_import_template.csv', toCSV_(CUSTOMER_FIELDS, [example]));
      };

      const exportCustomers = () => {
        downloadCSV_('customers_export.csv', toCSV_(CUSTOMER_FIELDS, customers));
      };

      const handleCustomerFile = async (e) => {
        const file = e.target.files?.[0];
        e.target.value = '';
        if (!file) return;
        const text = await file.text();
        const { headers, rows } = parseCSV_(text);
        setCustomerResult(null);
        if (rows.length === 0) { alert('No data rows found in that CSV.'); return; }
        const headerMap = buildHeaderMap_(headers, CUSTOMER_FIELDS);
        if (!headerMap.name) { alert('Could not find a "Name" column. Please use the template.'); return; }

        const existingById = new Map(customers.map(c => [c.id, c]));
        const existingByEmail = new Map(customers.filter(c => c.email).map(c => [c.email.toLowerCase(), c]));
        const existingKeys = new Set(customers.map(c => `${(c.name || '').toLowerCase()}|${(c.phone || '').toLowerCase()}`));

        const toCreate = [];
        const toUpdate = [];
        const errors = [];
        const skipped = [];
        const info = [];
        rows.forEach((r, idx) => {
          const rowNum = idx + 2;
          const get = (key) => headerMap[key] ? (r[headerMap[key]] || '') : '';
          const name = get('name').trim();
          if (!name) { errors.push({ row: rowNum, message: 'Name is required.' }); return; }
          const email = get('email').trim();
          const phone = get('phone').trim();
          const fields = {
            name,
            farmName: get('farmName').trim(),
            managerContact: get('managerContact').trim(),
            email,
            phone,
            address: get('address').trim(),
            city: get('city').trim(),
            state: get('state').trim().toUpperCase(),
            zip: get('zip').trim(),
            notes: get('notes').trim(),
            source: get('source').trim() || 'referral',
          };

          const id = get('id').trim();
          if (id) {
            if (existingById.has(id)) {
              toUpdate.push({ row: rowNum, id, payload: fields });
              return;
            }
            info.push({ row: rowNum, message: `"${name}" — Customer ID not found on this account, will be added as a new customer.` });
          }

          if (email && existingByEmail.has(email.toLowerCase())) {
            skipped.push({ row: rowNum, message: `"${name}" — a customer with email ${email} already exists.` });
            return;
          }
          if (!email && existingKeys.has(`${name.toLowerCase()}|${phone.toLowerCase()}`)) {
            skipped.push({ row: rowNum, message: `"${name}" — already exists.` });
            return;
          }
          toCreate.push({ row: rowNum, payload: { ...fields, farrierId: userId, smsOptOut: false } });
        });
        setCustomerParsed({ totalRows: rows.length, toCreate, toUpdate, errors, skipped, info });
      };

      const confirmCustomerImport = async () => {
        if (!customerParsed || (!customerParsed.toCreate.length && !customerParsed.toUpdate.length)) return;
        setCustomerImporting(true);
        try {
          const now = firebase.firestore.FieldValue.serverTimestamp();
          const creates = customerParsed.toCreate.map(r => ({ ...r.payload, createdAt: now, updatedAt: now }));
          const updates = customerParsed.toUpdate.map(r => ({ id: r.id, payload: { ...r.payload, updatedAt: now } }));
          await Promise.all([
            creates.length ? batchWrite_('customers', creates) : null,
            updates.length ? batchUpdate_('customers', updates) : null,
          ]);
          setCustomerResult({ added: creates.length, updated: updates.length, skipped: customerParsed.skipped.length, errors: customerParsed.errors.length });
          setCustomerParsed(null);
          await loadAll();
        } catch (e) {
          alert('Import failed: ' + e.message);
        }
        setCustomerImporting(false);
      };

      // ---- Horses ----
      const downloadHorseTemplate = () => {
        const example = {
          customerName: 'Jane Smith', customerEmail: 'jane@example.com', name: 'Buddy',
          breed: 'Quarter Horse', dob: '2016-04-12', sex: 'Gelding', color: 'Bay',
          shoeingCycleWeeks: '6', shoeSize: '00', shoeType: 'Steel',
          gaitNotes: '', hoofNotes: 'Slightly flared left front', knownIssues: '',
        };
        downloadCSV_('horse_import_template.csv', toCSV_(HORSE_FIELDS, [example]));
      };

      const exportHorses = () => {
        const customersById = new Map(customers.map(c => [c.id, c]));
        const rows = horses.map(h => ({
          ...h,
          customerName: h.customerName || customersById.get(h.customerId)?.name || '',
          customerEmail: customersById.get(h.customerId)?.email || '',
        }));
        downloadCSV_('horses_export.csv', toCSV_(HORSE_FIELDS, rows));
      };

      const handleHorseFile = async (e) => {
        const file = e.target.files?.[0];
        e.target.value = '';
        if (!file) return;
        const text = await file.text();
        const { headers, rows } = parseCSV_(text);
        setHorseResult(null);
        if (rows.length === 0) { alert('No data rows found in that CSV.'); return; }
        const headerMap = buildHeaderMap_(headers, HORSE_FIELDS);
        if (!headerMap.name || !headerMap.customerName) {
          alert('Could not find "Horse Name" and "Customer Name" columns. Please use the template.');
          return;
        }

        const existingHorseById = new Map(horses.map(h => [h.id, h]));
        const byEmail = new Map(customers.filter(c => c.email).map(c => [c.email.toLowerCase(), c]));
        const byName = new Map();
        customers.forEach(c => {
          const key = (c.name || '').toLowerCase();
          if (!byName.has(key)) byName.set(key, []);
          byName.get(key).push(c);
        });
        const existingHorseKeys = new Set(horses.map(h => `${h.customerId}|${(h.name || '').toLowerCase()}`));

        const toCreate = [];
        const toUpdate = [];
        const errors = [];
        const skipped = [];
        const info = [];
        rows.forEach((r, idx) => {
          const rowNum = idx + 2;
          const get = (key) => headerMap[key] ? (r[headerMap[key]] || '') : '';
          const horseName = get('name').trim();
          const customerName = get('customerName').trim();
          const customerEmail = get('customerEmail').trim();
          if (!horseName) { errors.push({ row: rowNum, message: 'Horse Name is required.' }); return; }
          if (!customerName && !customerEmail) { errors.push({ row: rowNum, message: 'Customer Name (or Customer Email) is required.' }); return; }

          let customer = customerEmail ? byEmail.get(customerEmail.toLowerCase()) : null;
          if (!customer) {
            const matches = byName.get(customerName.toLowerCase()) || [];
            if (matches.length === 1) customer = matches[0];
            else if (matches.length > 1) {
              errors.push({ row: rowNum, message: `Multiple customers named "${customerName}" — add a Customer Email column to disambiguate.` });
              return;
            }
          }
          if (!customer) {
            errors.push({ row: rowNum, message: `No customer found matching "${customerName || customerEmail}". Add the customer first on the Customers tab.` });
            return;
          }

          const cycle = parseInt(get('shoeingCycleWeeks'), 10);
          const fields = {
            customerId: customer.id,
            customerName: customer.name,
            name: horseName,
            breed: get('breed').trim(),
            dob: get('dob').trim(),
            sex: get('sex').trim(),
            color: get('color').trim(),
            shoeingCycleWeeks: isFinite(cycle) ? cycle : null,
            shoeSize: get('shoeSize').trim(),
            shoeType: get('shoeType').trim(),
            gaitNotes: get('gaitNotes').trim(),
            hoofNotes: get('hoofNotes').trim(),
            knownIssues: get('knownIssues').trim(),
          };

          const id = get('id').trim();
          if (id) {
            if (existingHorseById.has(id)) {
              toUpdate.push({ row: rowNum, id, payload: fields });
              return;
            }
            info.push({ row: rowNum, message: `"${horseName}" — Horse ID not found on this account, will be added as a new horse.` });
          }

          if (existingHorseKeys.has(`${customer.id}|${horseName.toLowerCase()}`)) {
            skipped.push({ row: rowNum, message: `"${horseName}" — ${customer.name} already has a horse with this name.` });
            return;
          }
          toCreate.push({ row: rowNum, payload: { ...fields, farrierId: userId, photos: [] } });
        });
        setHorseParsed({ totalRows: rows.length, toCreate, toUpdate, errors, skipped, info });
      };

      const confirmHorseImport = async () => {
        if (!horseParsed || (!horseParsed.toCreate.length && !horseParsed.toUpdate.length)) return;
        setHorseImporting(true);
        try {
          const now = firebase.firestore.FieldValue.serverTimestamp();
          const creates = horseParsed.toCreate.map(r => ({ ...r.payload, createdAt: now, updatedAt: now }));
          const updates = horseParsed.toUpdate.map(r => ({ id: r.id, payload: { ...r.payload, updatedAt: now } }));
          await Promise.all([
            creates.length ? batchWrite_('horses', creates) : null,
            updates.length ? batchUpdate_('horses', updates) : null,
          ]);
          setHorseResult({ added: creates.length, updated: updates.length, skipped: horseParsed.skipped.length, errors: horseParsed.errors.length });
          setHorseParsed(null);
          await loadAll();
        } catch (e) {
          alert('Import failed: ' + e.message);
        }
        setHorseImporting(false);
      };

      // ---- QuickBooks ----
      const getQbInvoices = () => {
        const list = invoices.filter(inv => inv.status !== 'cancelled');
        const toDate = (ts) => ts?.toDate ? ts.toDate() : (ts instanceof Date ? ts : new Date(ts || 0));
        if (qbRange === 'allTime') return list;
        if (qbRange === 'custom') {
          if (!qbStart || !qbEnd) return [];
          const start = new Date(qbStart);
          const end = new Date(qbEnd);
          end.setHours(23, 59, 59, 999);
          return list.filter(inv => { const d = toDate(inv.createdAt); return d >= start && d <= end; });
        }
        const now = new Date();
        let targetYear = now.getFullYear();
        let targetMonth = now.getMonth();
        if (qbRange === 'lastMonth') {
          targetMonth = targetMonth === 0 ? 11 : targetMonth - 1;
          targetYear = now.getMonth() === 0 ? targetYear - 1 : targetYear;
        }
        return list.filter(inv => {
          const d = toDate(inv.createdAt);
          return d.getFullYear() === targetYear && d.getMonth() === targetMonth;
        });
      };

      const qbInvoices = getQbInvoices();

      const exportQuickBooks = () => {
        if (!qbInvoices.length) { alert('No invoices in this range.'); return; }
        const rows = [];
        qbInvoices.forEach(inv => {
          const dateStr = formatQbDate_(inv.createdAt);
          (inv.items || []).filter(i => Number(i.amount || 0) > 0).forEach(item => {
            rows.push({
              invoiceNo: inv.invoiceNumber || inv.id,
              customer: inv.customerName || '',
              invoiceDate: dateStr,
              dueDate: dateStr,
              item: item.description || item.serviceNameSnapshot || 'Service',
              itemDescription: FarriPricing.itemHorseLabel(item) ? `${item.description || ''} (${FarriPricing.itemHorseLabel(item)})` : (item.description || ''),
              itemAmount: Number(item.amount || 0).toFixed(2),
              memo: inv.notes || '',
            });
          });
        });
        downloadCSV_('quickbooks_invoices.csv', toCSV_(QUICKBOOKS_INVOICE_FIELDS, rows));
      };

      const errorList = (items, color) => items.length > 0 && (
        <ul style={{ margin: '0.5rem 0 0', paddingLeft: '1.25rem', fontSize: '0.85rem', color }}>
          {items.slice(0, 10).map((it, i) => <li key={i}>Row {it.row}: {it.message}</li>)}
          {items.length > 10 && <li>...and {items.length - 10} more</li>}
        </ul>
      );

      return (
        <div>
          <div className="card" style={{ marginBottom: '1.5rem' }}>
            <h2 style={{ marginBottom: '0.5rem' }}>Data Management</h2>
            <p style={{ color: 'var(--text-muted)' }}>
              Export your customers and horses to a spreadsheet, or bulk-import new records using the templates below.
              Exports include an ID column — leave it blank to add a new record, or fill it in (e.g. after editing an
              exported file) to update that existing record, including when moving records to another FarriTech account.
            </p>
          </div>

          <div className="card" style={{ marginBottom: '1.5rem' }}>
            <h3 style={{ marginBottom: '1rem' }}>Customers</h3>
            <div style={{ display: 'flex', gap: '0.75rem', flexWrap: 'wrap', marginBottom: '1rem' }}>
              <button className="btn btn-outline" onClick={downloadCustomerTemplate}>⬇️ Download Template</button>
              <button className="btn btn-outline" onClick={exportCustomers} disabled={loading}>
                📤 Export All ({customers.length})
              </button>
              <button className="btn btn-primary" onClick={() => customerFileRef.current?.click()}>

    function MileageLogView({ userId, userProfile }) {
      const [logs, setLogs] = useState([]);
      const [loading, setLoading] = useState(true);
      const [filter, setFilter] = useState('month');
      const IRS_RATE = 0.725;

      useEffect(() => { loadLogs(); }, []);

      const loadLogs = async () => {
        setLoading(true);
        try {
          // Mileage is personal: a team member sees their own (api/_lib/team.js).
          const snap = await db.collection('mileage_logs')
            .where('farrierId', '==', window.FarriTeam?.member ? firebase.auth().currentUser.uid : userId)
            .get();
          const data = snap.docs
            .map(d => ({ id: d.id, ...d.data() }))
            .sort((a, b) => (b.date || '').localeCompare(a.date || ''));
          setLogs(data);
        } catch(e) {
          console.error('Mileage log error:', e);
        }
        setLoading(false);
      };

      const getRange = () => {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        if (filter === 'week') {
          const day = now.getDay();
          const start = new Date(now); start.setDate(now.getDate() - day);
          return { start: start.toISOString().split('T')[0], end: now.toISOString().split('T')[0] };
        }
        if (filter === 'month') return { start: `${y}-${m}-01`, end: now.toISOString().split('T')[0] };
        if (filter === 'year')  return { start: `${y}-01-01`,   end: now.toISOString().split('T')[0] };
        return { start: '2000-01-01', end: '2999-12-31' };
      };

      const { start, end } = getRange();
      const filtered = logs.filter(l => l.date >= start && l.date <= end);
      const totalMiles = filtered.reduce((s, l) => s + (l.miles || 0), 0);
      const deduction = (totalMiles * IRS_RATE).toFixed(2);

      const filterBtn = (id, label) => (
        <button
          onClick={() => setFilter(id)}
          style={{
            padding: '7px 16px', borderRadius: '8px', border: '1.5px solid',
            borderColor: filter === id ? '#0F766E' : '#d1d5db',
            background: filter === id ? '#0F766E' : 'white',
            color: filter === id ? 'white' : '#374151',
            fontWeight: '700', fontSize: '0.85rem', cursor: 'pointer'
          }}
        >{label}</button>
      );

      const handlePrint = () => {
        const bizName = userProfile?.businessName || 'Farrier';
        const periodLabel = { week: 'This Week', month: 'This Month', year: 'This Year', all: 'All Time' }[filter];
        const rows = filtered.map(l => `
          <tr>
            <td>${l.date}</td>
            <td>${l.customerName || '—'}${l.farmName ? '<br><small style="color:#6b7280">' + l.farmName + '</small>' : ''}</td>
            <td>${(l.services||[]).join(', ') || '—'}</td>
            <td>${l.invoiceNumber || '—'}</td>
            <td style="text-align:right; font-weight:700;">${l.miles}</td>
            <td style="text-align:right; color:#0F766E; font-weight:600;">$${(l.miles * IRS_RATE).toFixed(2)}</td>
          </tr>`).join('');
        const html = `<!DOCTYPE html><html><head><meta charset="utf-8">
          <title>Mileage Log — ${bizName}</title>
          <style>
            body { font-family: Arial, sans-serif; font-size: 13px; color: #111; margin: 32px; }
            h1 { font-size: 20px; margin-bottom: 4px; }
            .meta { color: #555; font-size: 12px; margin-bottom: 20px; }
            table { width: 100%; border-collapse: collapse; }
            th { background: #0F766E; color: white; padding: 8px 10px; text-align: left; font-size: 12px; }
            td { padding: 7px 10px; border-bottom: 1px solid #e5e7eb; vertical-align: top; }
            tr:nth-child(even) td { background: #f9fafb; }
            .summary { margin-top: 20px; padding: 14px 16px; background: #f0fdf4; border: 1px solid #6ee7b7; border-radius: 6px; }
            @media print { button { display:none; } }
          </style>
        </head><body>
          <h1>🚗 Mileage Log — ${bizName}</h1>
          <div class="meta">Period: ${periodLabel} (${start} → ${end}) · Generated: ${new Date().toLocaleDateString()}</div>
          <table>
            <thead><tr><th>Date</th><th>Client</th><th>Services</th><th>Invoice</th><th style="text-align:right">Miles</th><th style="text-align:right">Deduction</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
          <div class="summary">
            <strong>Total Miles: ${totalMiles.toLocaleString()}</strong> &nbsp;·&nbsp;
            IRS Rate: $${IRS_RATE}/mi &nbsp;·&nbsp;
            Estimated Deduction: <strong>$${parseFloat(deduction).toLocaleString('en-US', {minimumFractionDigits:2})}</strong>
          </div>
        </body></html>`;
        const win = window.open('', '_blank');
        win.document.write(html);
        win.document.close();
        win.print();
      };

      return (
        <div style={{maxWidth: '900px', margin: '0 auto', padding: '2rem 1rem'}}>
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:'1.5rem', flexWrap:'wrap', gap:'1rem'}}>
            <div>
              <h1 style={{fontSize:'1.75rem', fontWeight:'800', color:'var(--text)', margin:0}}>🚗 Mileage Log</h1>
              <p style={{color:'var(--text-muted)', margin:'4px 0 0', fontSize:'0.9rem'}}>Track miles driven for tax deductions</p>
            </div>
            <button onClick={handlePrint} style={{background:'#0F766E', color:'white', border:'none', borderRadius:'10px', padding:'10px 20px', fontWeight:'700', fontSize:'0.9rem', cursor:'pointer'}}>
              🖨️ Print / Export
            </button>
          </div>

          {/* Filter tabs */}
          <div style={{display:'flex', gap:'8px', marginBottom:'1.25rem', flexWrap:'wrap'}}>
            {filterBtn('week',  'This Week')}
            {filterBtn('month', 'This Month')}
            {filterBtn('year',  'This Year')}
            {filterBtn('all',   'All Time')}
          </div>

          {/* Summary cards */}
          <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(180px,1fr))', gap:'1rem', marginBottom:'1.5rem'}}>
            <div style={{background:'white', border:'2px solid #0F766E', borderRadius:'12px', padding:'1rem 1.25rem'}}>
              <div style={{fontSize:'0.75rem', fontWeight:'700', color:'#6b7280', textTransform:'uppercase', letterSpacing:'0.5px'}}>Total Miles</div>
              <div style={{fontSize:'2rem', fontWeight:'900', color:'#0F766E', marginTop:'4px'}}>{totalMiles.toLocaleString()}</div>
            </div>
            <div style={{background:'white', border:'2px solid #2683FB', borderRadius:'12px', padding:'1rem 1.25rem'}}>
              <div style={{fontSize:'0.75rem', fontWeight:'700', color:'#6b7280', textTransform:'uppercase', letterSpacing:'0.5px'}}>Est. IRS Deduction</div>
              <div style={{fontSize:'2rem', fontWeight:'900', color:'#2683FB', marginTop:'4px'}}>${parseFloat(deduction).toLocaleString('en-US', {minimumFractionDigits:2})}</div>
              <div style={{fontSize:'0.7rem', color:'#9ca3af', marginTop:'2px'}}>@ $0.725/mi (2026 rate)</div>
            </div>
            <div style={{background:'white', border:'1.5px solid #e5e7eb', borderRadius:'12px', padding:'1rem 1.25rem'}}>
              <div style={{fontSize:'0.75rem', fontWeight:'700', color:'#6b7280', textTransform:'uppercase', letterSpacing:'0.5px'}}>Entries</div>
              <div style={{fontSize:'2rem', fontWeight:'900', color:'#0D1320', marginTop:'4px'}}>{filtered.length}</div>
            </div>
          </div>

          {/* Table */}
          {loading ? (
            <div style={{textAlign:'center', padding:'3rem', color:'var(--text-muted)'}}>Loading…</div>
          ) : filtered.length === 0 ? (
            <div style={{textAlign:'center', padding:'3rem', color:'#6b7280', background:'white', borderRadius:'12px', border:'1.5px solid #e5e7eb'}}>
              No mileage entries for this period.<br/>
              <small>Miles are logged automatically when you create an invoice with miles entered.</small>
            </div>
          ) : (
            <div style={{background:'white', borderRadius:'12px', border:'1.5px solid #e5e7eb', overflow:'hidden'}}>
              <table style={{width:'100%', borderCollapse:'collapse', fontSize:'0.9rem'}}>
                <thead>
                  <tr style={{background:'#f9fafb', borderBottom:'2px solid #e5e7eb'}}>
                    <th style={{padding:'10px 14px', textAlign:'left', fontWeight:'700', color:'#374151'}}>Date</th>
                    <th style={{padding:'10px 14px', textAlign:'left', fontWeight:'700', color:'#374151'}}>Client</th>
                    <th style={{padding:'10px 14px', textAlign:'left', fontWeight:'700', color:'#374151'}}>Services</th>
                    <th style={{padding:'10px 14px', textAlign:'left', fontWeight:'700', color:'#374151'}}>Invoice</th>
                    <th style={{padding:'10px 14px', textAlign:'right', fontWeight:'700', color:'#374151'}}>Miles</th>
                    <th style={{padding:'10px 14px', textAlign:'right', fontWeight:'700', color:'#374151'}}>Deduction</th>
                  </tr>
                </thead>
                <tbody>
                  {filtered.map((l, i) => (
                    <tr key={l.id} style={{borderBottom:'1px solid #f3f4f6', background: i % 2 === 0 ? 'white' : '#fafafa'}}>
                      <td style={{padding:'10px 14px', color:'#374151', fontWeight:'600'}}>{l.date}</td>
                      <td style={{padding:'10px 14px'}}>
                        <div style={{fontWeight:'700', color:'#0D1320'}}>{l.customerName || '—'}</div>
                        {l.farmName && <div style={{fontSize:'0.78rem', color:'#6b7280'}}>{l.farmName}</div>}
                      </td>
                      <td style={{padding:'10px 14px', color:'#374151', fontSize:'0.85rem'}}>{(l.services||[]).join(', ') || '—'}</td>
                      <td style={{padding:'10px 14px', color:'#6b7280', fontSize:'0.85rem'}}>{l.invoiceNumber || '—'}</td>
                      <td style={{padding:'10px 14px', textAlign:'right', fontWeight:'800', color:'#0F766E', fontSize:'1rem'}}>{l.miles}</td>
                      <td style={{padding:'10px 14px', textAlign:'right', fontWeight:'600', color:'#2683FB'}}>${(l.miles * IRS_RATE).toFixed(2)}</td>
                    </tr>
                  ))}
                </tbody>
                <tfoot>
                  <tr style={{background:'#f0fdf4', borderTop:'2px solid #0F766E'}}>
                    <td colSpan="4" style={{padding:'10px 14px', fontWeight:'800', color:'#0F766E'}}>TOTAL</td>
                    <td style={{padding:'10px 14px', textAlign:'right', fontWeight:'900', color:'#0F766E', fontSize:'1.05rem'}}>{totalMiles.toLocaleString()}</td>
                    <td style={{padding:'10px 14px', textAlign:'right', fontWeight:'900', color:'#2683FB', fontSize:'1.05rem'}}>${parseFloat(deduction).toLocaleString('en-US', {minimumFractionDigits:2})}</td>
                  </tr>
                </tfoot>
              </table>
            </div>
          )}
        </div>
      );

                    position: 'absolute', inset: 0,
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    background: 'rgba(0,0,0,0.2)'
                  }}>
                    <div style={{
                      width: '52px', height: '52px', borderRadius: '50%',
                      background: 'rgba(255,0,0,0.92)',
                      display: 'flex', alignItems: 'center', justifyContent: 'center',
                      boxShadow: '0 2px 12px rgba(0,0,0,0.5)'
                    }}>
                      <span style={{color: 'white', fontSize: '1.4rem', marginLeft: '4px'}}>▶</span>
                    </div>
                  </div>
                  {v.isShort && (
                    <div style={{
                      position: 'absolute', top: '0.5rem', right: '0.5rem',
                      background: 'rgba(0,0,0,0.75)', color: 'white',
                      fontSize: '0.7rem', fontWeight: 700, padding: '2px 7px',
                      borderRadius: '4px', letterSpacing: '0.03em'
                    }}>SHORT</div>
                  )}
                </div>
                <div style={{padding: '0.9rem 1rem 1rem'}}>
                  <div style={{fontWeight: 700, color: 'var(--primary)', marginBottom: '0.35rem', fontSize: '0.95rem'}}>{v.title}</div>
                  <div style={{fontSize: '0.8rem', color: 'var(--text-muted)', lineHeight: 1.5}}>{v.desc}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function AboutView({ user, userProfile }) {
      const [refName,   setRefName]   = React.useState('');
      const [refEmail,  setRefEmail]  = React.useState('');
      const [refPhone,  setRefPhone]  = React.useState('');
      const [refStatus, setRefStatus] = React.useState(null);
      const [refMsg,    setRefMsg]    = React.useState('');

      const handleReferral = async (e) => {
        e.preventDefault();
        if (!refName.trim() || !refEmail.trim()) {
          setRefStatus('error'); setRefMsg('Name and email are required.'); return;
        }
        setRefStatus('sending'); setRefMsg('');
        const referrerName  = userProfile?.ownerName || user?.displayName || '';
        const referrerEmail = user?.email || '';
        try {
          await db.collection('referrals').add({
            referrerUid:   user?.uid   || '',
            referrerEmail,
            referrerName,
            refereeName:   refName.trim(),
            refereeEmail:  refEmail.trim().toLowerCase(),
            refereePhone:  refPhone.trim(),
            status:        'pending',
            creditApplied: false,
            createdAt:     firebase.firestore.FieldValue.serverTimestamp(),
            expiresAt:     new Date(Date.now() + 60 * 24 * 60 * 60 * 1000),
          });
          await fetch('https://www.farritech.com/api/send-referral-emails', {
            method:  'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              referrerName,
              referrerEmail,
              refereeName:  refName.trim(),
              refereeEmail: refEmail.trim().toLowerCase(),
              refereePhone: refPhone.trim(),
            }),
          });
          setRefStatus('success');
          setRefName(''); setRefEmail(''); setRefPhone('');
        } catch (err) {
          console.error('Referral error:', err);
          setRefStatus('error'); setRefMsg('Something went wrong. Please try again.');
        }
      };

                        <input

                          type="text"
                          placeholder="John Smith"
                          value={refName}
                          onChange={e => { setRefName(e.target.value); setRefStatus(null); }}
                          disabled={refStatus === 'sending'}
                          required
                          style={{width:'100%', boxSizing:'border-box'}}
                        />
                      </div>

                        <input
                          className="form-input"
                          type="email"
                          placeholder="john@example.com"
                          value={refEmail}
                          onChange={e => { setRefEmail(e.target.value); setRefStatus(null); }}
                          disabled={refStatus === 'sending'}
                          required
                          style={{width:'100%', boxSizing:'border-box'}}
                        />
                      </div>
                      <div>
                        <label style={{display:'block', fontSize:'0.85rem', fontWeight:'600', marginBottom:'0.3rem', color:'var(--text-muted)'}}>

                        </label>
                        <input
                          className="form-input"
                          type="tel"
                          placeholder="(555) 555-5555"
                          value={refPhone}
                          onChange={e => setRefPhone(e.target.value)}

                          style={{width:'100%', boxSizing:'border-box'}}
                        />
                      </div>

    function CustomerBookingView({ farrierId }) {

            );
          setServiceOptions(list);
        };
        loadServices();
      }, [farrierId]);

      const updateHorseName = (idx, name) => {
        setHorseRows(rows => rows.map((r, i) => i === idx ? { ...r, horseName: name } : r));
      };
      const toggleHorseService = (idx, serviceName) => {
        setHorseRows(rows => rows.map((r, i) => {
          if (i !== idx) return r;
          const has = r.services.includes(serviceName);
          return { ...r, services: has ? r.services.filter(s => s !== serviceName) : [...r.services, serviceName] };
        }));
      };
      const addHorseRow = () => setHorseRows(rows => [...rows, { horseName: '', services: [] }]);
      const removeHorseRow = (idx) => setHorseRows(rows => rows.filter((_, i) => i !== idx));


      // ---- Address Autocomplete (Google Places) ----
      const addressInputRef = useRef(null);
      const [placeMeta, setPlaceMeta] = useState({
        placeId: '',
        formattedAddress: '',
        lat: null,
        lng: null,
        source: '' // 'places' when picked from autocomplete
      });

      useEffect(() => {
        // Use new PlaceAutocompleteElement API (required for keys created after March 1 2025)
        let tries = 0;
        const maxTries = 40;
        const timer = setInterval(() => {
          tries++;
          const container = addressInputRef.current;
          if (window.google?.maps?.places?.PlaceAutocompleteElement && container) {
            clearInterval(timer);
            try {
              const pac = new window.google.maps.places.PlaceAutocompleteElement({
                types: ['address'],
                componentRestrictions: { country: 'us' },
              });

              // Style the widget to match the rest of the form (light theme override for shadow DOM)
              pac.style.cssText = [
                'width:100%;display:block;',
                '--gmp-filled-input-background-color:#ffffff;',
                '--gmp-filled-input-text-color:#0D1320;',
                '--gmp-input-placeholder-text-color:#94a3b8;',
                '--gmp-color-surface:#ffffff;',
                '--gmp-color-on-surface:#0D1320;',
                '--gmp-color-on-surface-variant:#0D1320;',
                '--gmp-color-outline:#cbd5e1;',
                'color-scheme:light;',
              ].join('');

              container.appendChild(pac);
              console.log('✅ Google PlaceAutocompleteElement attached');

              // Try both event names - API version determines which fires
              const handlePlaceSelect = async (e) => {
                try {
                  const prediction = e.placePrediction || e.place;
                  if (!prediction) return;

                  const place = prediction.toPlace ? prediction.toPlace() : prediction;
                  await place.fetchFields({ fields: ['addressComponents', 'formattedAddress', 'location', 'id'] });

                  // Parse formatted address as reliable fallback: "123 Main St, City, ST 12345, USA"
                  const formatted = place.formattedAddress || '';
                  console.log('📍 formattedAddress:', formatted);

                  const comps = place.addressComponents || [];
                  console.log('📍 comps count:', comps.length);

                  let streetNumber = '', route = '', city = '', state = '', zip = '';

                  if (comps.length > 0) {
                    const get = (type, short = false) => {
                      for (const c of comps) {
                        const types = c.types || [];
                        if (types.includes(type)) return short ? (c.shortText || c.short_name || '') : (c.longText || c.long_name || '');
                      }
                      return '';
                    };
                    streetNumber = get('street_number');
                    route = get('route');
                    city = get('locality') || get('sublocality') || get('postal_town');
                    state = get('administrative_area_level_1', true);
                    zip = get('postal_code');
                  }

                  // Fallback: parse from formatted address string "Street, City, ST ZIP, USA"
                  if (!city && formatted) {
                    const parts = formatted.split(',').map(p => p.trim());
                    // parts[0]=street, parts[1]=city, parts[2]="ST ZIP", parts[3]="USA"
                    if (parts.length >= 3) {
                      city = parts[1] || '';
                      const stateZip = (parts[2] || '').trim().split(' ');
                      state = stateZip[0] || '';
                      zip = stateZip[1] || '';
                    }
                  }

                  const address1 = [streetNumber, route].filter(Boolean).join(' ').trim()
                    || (formatted.split(',')[0] || '').trim();

                  console.log('📍 parsed:', { address1, city, state, zip });

                  // Overwrite the widget's input to show only the street address
                  const widgetInput = pac.querySelector('input');
                  if (widgetInput && address1) widgetInput.value = address1;

                  setFormData(prev => ({
                    ...prev,
                    address: address1 || prev.address,
                    city: city || prev.city,
                    state: (state || prev.state || '').toUpperCase(),
                    zip: zip || prev.zip,
                  }));

                  setPlaceMeta({
                    placeId: place.id || '',
                    formattedAddress: formatted,
                    lat: place.location?.lat?.() ?? null,
                    lng: place.location?.lng?.() ?? null,
                    source: 'places',
                  });
                } catch (err) {
                  console.warn('Place select handler error:', err);
                }
              };

              pac.addEventListener('gmp-placeselect', handlePlaceSelect);
              pac.addEventListener('gmp-select', handlePlaceSelect);
            } catch (err) {
              console.warn('PlaceAutocompleteElement init failed:', err);
            }
          }
          if (tries >= maxTries) clearInterval(timer);
        }, 250);

        return () => clearInterval(timer);
      }, []);

      // Mobile detection
      useEffect(() => {
        const onResize = () => setIsMobile(window.innerWidth < 768);
        window.addEventListener('resize', onResize);
        return () => window.removeEventListener('resize', onResize);
      }, []);


      useEffect(() => {
        loadFarrierInfo();
      }, []);

      const loadFarrierInfo = async () => {
        try {
          if (db) {
            const doc = await db.collection('farriers').doc(farrierId).get();
            if (doc.exists) {
              setFarrierInfo(doc.data());
            }
          } else {
            // Demo mode
            setFarrierInfo({
              businessName: "Demo Farrier Services",
              email: "demo@farrier.com"
            });
          }
        } catch (error) {
          console.error('Error loading farrier info:', error);
        }
        setLoading(false);
      };

      const loadBookedSlots = async (date) => {
        if (!db || !date) return;
        setLoadingSlots(true);
        try {
          const snap = await db.collection('appointments')
            .where('farrierId', '==', farrierId)
            .where('requestedDate', '==', date)
            .where('status', 'in', ['pending', 'confirmed'])
            .get();
          const times = snap.docs.map(d => d.data().requestedTime).filter(Boolean);
          setBookedSlots(times);
        } catch (error) {
          console.error('Error loading booked slots:', error);
          setBookedSlots([]);
        }
        setLoadingSlots(false);
      };

      const handleSubmit = async (e) => {
        e.preventDefault();

        const isPOBox = (s) => /^\s*p\.?\s*o\.?\s*box\b/i.test(String(s || ''));
        if (isPOBox(formData.address)) {
          alert("PO Boxes can't be routed. Please enter the barn/service address.");
          return;
        }

        // If customer used Google Places, we keep placeId + lat/lng for accurate Smart Route driving directions

        try {
          if (db) {
            const horseRequests = horseRows
              .filter(r => r.horseName.trim() || r.services.length > 0)
              .map(r => ({ horseId: '', horseName: r.horseName.trim(), services: r.services }));
            const flatServices = [...new Set(horseRequests.flatMap(r => r.services))];

            // Save appointment request to Firestore
            await db.collection('appointments').add({
              farrierId: farrierId,
              customerName: formData.name || '',
              farmName: formData.farmName || '',
              phone: formData.phone || '',
              email: formData.email || '',
              horseRequests,
              services: flatServices,
              numberOfHorses: horseRequests.length || '',
              address: formData.address || '',
              city: formData.city || '',
              state: formData.state || '',
              zip: formData.zip || '',
              comments: formData.comments || '',
              requestedDate: formData.date || '',
              requestedTime: formData.time || '',
              status: 'pending',
              smsConsent: formData.smsConsent === true,
              // Address normalization (for Smart Route)
              formattedAddress: placeMeta.formattedAddress || '',
              placeId: placeMeta.placeId || '',
              geo: (placeMeta.lat != null && placeMeta.lng != null) ? { lat: placeMeta.lat, lng: placeMeta.lng } : null,
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            // Auto-create or update customer record
            try {
              const fullAddress = [formData.address, formData.city, formData.state, formData.zip]
                .filter(Boolean).join(', ').trim();

              const customerPayload = {
                name: formData.name,
                farmName: formData.farmName,
                email: formData.email,
                phone: formData.phone,
                address: fullAddress,

                // Address normalization (for Smart Route)
                formattedAddress: placeMeta.formattedAddress || '',
                placeId: placeMeta.placeId || '',
                geo: (placeMeta.lat != null && placeMeta.lng != null) ? { lat: placeMeta.lat, lng: placeMeta.lng } : null,
                farrierId: farrierId,
                smsOptOut: formData.smsConsent ? false : true,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
              };

              // Search by email first, fall back to phone
              let existingSnap = formData.email
                ? await db.collection('customers')
                    .where('farrierId', '==', farrierId)
                    .where('email', '==', formData.email)
                    .limit(1).get()
                : { empty: true };

              if (existingSnap.empty && formData.phone) {
                existingSnap = await db.collection('customers')
                  .where('farrierId', '==', farrierId)
                  .where('phone', '==', formData.phone)
                  .limit(1).get();
              }

              if (existingSnap.empty) {
                await db.collection('customers').add({
                  ...customerPayload,
                  createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                  source: 'qr_booking',
                });
                console.log('✅ Customer profile created');
              } else {
                await existingSnap.docs[0].ref.update(customerPayload);
                console.log('✅ Customer profile updated');
              }
            } catch (error) {
              console.error('Note: Could not save customer profile:', error);
              // Don't fail the booking if customer save fails
            }

            // Auto-create a Firebase Auth account for the customer so they can access the portal.
            // We set a flag first so onAuthStateChanged ignores these transient sign-in/sign-out events.
            let portalPassword = null;
            let portalAccountCreated = false;
            if (formData.email && auth) {
              window._creatingCustomerPortalAccount = true;
              try {
                // Generate a random readable password: e.g. "Horse#4B2x9"
                const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
                portalPassword = 'Horse#' + Array.from({length: 6}, () => chars[Math.floor(Math.random() * chars.length)]).join('');
                await auth.createUserWithEmailAndPassword(formData.email, portalPassword);
                portalAccountCreated = true;
                console.log('✅ Customer portal account created for', formData.email);
                // Sign back out — we don't want to leave the customer signed in on the farrier's booking page
                await auth.signOut();
              } catch (authErr) {
                if (authErr.code === 'auth/email-already-in-use') {
                  // Account already exists — they can use "Forgot Password" on the portal
                  portalAccountCreated = false;
                  portalPassword = null;
                  console.log('ℹ️ Customer portal account already exists for', formData.email);
                } else {
                  console.warn('⚠️ Could not create customer portal account:', authErr.message);
                  portalPassword = null;
                }
              } finally {
                window._creatingCustomerPortalAccount = false;

            // Send booking notification emails (farrier + customer)
            console.log('📧 farrierInfo at booking time:', JSON.stringify(farrierInfo));
            try {
              await fetch('/api/send-booking-emails', {

                  // Customer / booking

                  numberOfHorses: horseRequests.length || '',
                  address: formData.address,

                  zip: formData.zip,

          }
          
          setStep('success');
        } catch (error) {
          console.error('Error submitting booking:', error);
          alert('Error submitting booking. Please try again.');
        }
      };

      // Convert 24-hour time to 12-hour AM/PM format
      const formatTime = (time24) => {
        const [hours, minutes] = time24.split(':').map(Number);
        const period = hours >= 12 ? 'PM' : 'AM';
        const hours12 = hours % 12 || 12; // Convert 0 to 12 for midnight
        return `${hours12}:${String(minutes).padStart(2, '0')} ${period}`;
      };

      // Generate time slots based on farrier's availability for selected date
      const getAvailableSlots = () => {
        if (!formData.date) {
          return []; // No slots until date is selected
        }

        // Parse date correctly to avoid timezone issues
        // formData.date is in format "YYYY-MM-DD"
        const [year, month, day] = formData.date.split('-').map(Number);
        const selectedDate = new Date(year, month - 1, day); // Create date in local timezone
        const dayName = selectedDate.toLocaleDateString('en-US', { weekday: 'long' }).toLowerCase();
        
        console.log('Selected date:', formData.date);
        console.log('Parsed as:', selectedDate);
        console.log('Day name:', dayName);
        
        // Default availability if farrier hasn't set it up yet (Mon-Fri 9-5)
        const defaultAvailability = {
          monday: { enabled: true, start: '09:00', end: '17:00' },
          tuesday: { enabled: true, start: '09:00', end: '17:00' },
          wednesday: { enabled: true, start: '09:00', end: '17:00' },

          saturday: { enabled: false, start: '09:00', end: '17:00' },
          sunday: { enabled: false, start: '09:00', end: '17:00' }
        };

        const availability = farrierInfo?.availability || defaultAvailability;
        const dayAvailability = availability[dayName];

        console.log('Day availability:', dayAvailability);

        if (!dayAvailability || !dayAvailability.enabled) {
          return []; // No slots if farrier doesn't work this day
        }

        // Generate 2-hour slots from start to end time
        const slots = [];
        const [startHour, startMin] = dayAvailability.start.split(':').map(Number);
        const [endHour, endMin] = dayAvailability.end.split(':').map(Number);
        
        let currentHour = startHour;
        let currentMin = startMin;
        
        while (currentHour < endHour || (currentHour === endHour && currentMin < endMin)) {
          const timeStr = `${String(currentHour).padStart(2, '0')}:${String(currentMin).padStart(2, '0')}`;
          slots.push(timeStr);
          
          // Add 2 hours for next slot
          currentMin += 120;
          currentHour += Math.floor(currentMin / 60);
          currentMin = currentMin % 60;
        }

        console.log('Generated slots:', slots);
        return slots;
      };

    function DashboardView({ userId, setTab }) {
  const [stats, setStats] = useState({
    monthAppointments: 0,
    totalRevenue: 0,
    outstandingInvoices: 0,
    upcomingWeek: 0,
  });
  const [lowStockCount, setLowStockCount] = useState(0);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    loadStats();
  }, [userId]);

  const loadStats = async () => {
    try {
      if (!db || !userId) {
        setStats({ monthAppointments: 0, totalRevenue: 0, outstandingInvoices: 0, upcomingWeek: 0 });
        setLoading(false);
        return;
      }

      // ---- Appointments ----
      let monthAppointments = 0;
      let upcomingWeek = 0;
