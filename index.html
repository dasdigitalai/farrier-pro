    function RouteSheetView({ userId, userProfile }) {
      const today = new Date().toISOString().split('T')[0];
      const [date, setDate] = React.useState(today);
      const [useDefaultAddress, setUseDefaultAddress] = React.useState(true);
      const [startAddress, setStartAddress] = React.useState('');
      const [sendSms, setSendSms] = React.useState(false);
      const [sendEmail, setSendEmail] = React.useState(false);
      const [appointments, setAppointments] = React.useState([]);
      const [routeOrder, setRouteOrder] = React.useState([]); // ordered list after smart route
      const [loading, setLoading] = React.useState(false);
      const [routing, setRouting] = React.useState(false);
      const [routeGenerated, setRouteGenerated] = React.useState(false);
      const [sending, setSending] = React.useState(false);
      const [sendResult, setSendResult] = React.useState('');
      const [totalDistance, setTotalDistance] = React.useState(null);
      const [routeLegs, setRouteLegs] = React.useState([]); // per-leg distances after smart route
      const [nearbyClients, setNearbyClients] = React.useState([]); // clients near last stop
      const [loadingNearby, setLoadingNearby] = React.useState(false);
      const [totalDuration, setTotalDuration] = React.useState(null);
      const startAddressRef = React.useRef(null);
      const startAddressPacRef = React.useRef(null);

      // Google Places for start address
      React.useEffect(() => {
        if (useDefaultAddress) return;
        let tries = 0;
        const timer = setInterval(() => {
          tries++;
          const container = startAddressRef.current;
          if (window.google?.maps?.places?.PlaceAutocompleteElement && container && !startAddressPacRef.current) {
            clearInterval(timer);
            try {
              const pac = new window.google.maps.places.PlaceAutocompleteElement({
                types: ['address'], componentRestrictions: { country: 'us' }
              });
              pac.style.cssText = [
                'width:100%;display:block;',
                '--gmp-filled-input-background-color:#ffffff;',
                '--gmp-filled-input-text-color:#0D1320;',
                '--gmp-input-placeholder-text-color:#94a3b8;',
                '--gmp-color-surface:#ffffff;',
                '--gmp-color-on-surface:#0D1320;',
                '--gmp-color-on-surface-variant:#0D1320;',
                '--gmp-color-outline:#cbd5e1;',
                'color-scheme:light;',
              ].join('');
              container.appendChild(pac);
              startAddressPacRef.current = pac;
              const handleSelect = async (e) => {
                try {
                  const pred = e.placePrediction || e.place;
                  if (!pred) return;
                  const place = pred.toPlace ? pred.toPlace() : pred;
                  await place.fetchFields({ fields: ['formattedAddress'] });
                  setStartAddress(place.formattedAddress || '');
                  const inp = pac.querySelector('input');
                  if (inp) inp.value = place.formattedAddress || '';
                } catch(err) { console.error(err); }
              };
              pac.addEventListener('gmp-placeselect', handleSelect);
              pac.addEventListener('gmp-select', handleSelect);
            } catch(err) { console.error(err); }
          } else if (tries >= 40) clearInterval(timer);
        }, 200);
        return () => {
          clearInterval(timer);
          if (startAddressPacRef.current && startAddressRef.current) {
            try { startAddressRef.current.removeChild(startAddressPacRef.current); } catch(_){}
          }
          startAddressPacRef.current = null;
        };
      }, [useDefaultAddress]);

      const defaultAddress = [
        userProfile?.address, userProfile?.city, userProfile?.state, userProfile?.zip
      ].filter(Boolean).join(', ');

      const effectiveStart = useDefaultAddress ? defaultAddress : startAddress;

      // Load appointments for selected date
      const loadAppointments = async () => {
        if (!db || !date) return;
        setLoading(true);
        setRouteGenerated(false);
        setRouteOrder([]);
        setRouteLegs([]);
        setNearbyClients([]);
        setSendResult('');
        try {
          const snap = await db.collection('appointments')
            .where('farrierId', '==', userId)
            .where('requestedDate', '==', date)
            .get();
          const appts = snap.docs
            .map(d => ({ id: d.id, ...d.data() }))
            .filter(a => a.status !== 'cancelled')
            .sort((a, b) => (a.requestedTime || '').localeCompare(b.requestedTime || ''));
          setAppointments(appts);
        } catch(e) { console.error(e); }
        setLoading(false);
      };

      React.useEffect(() => { loadAppointments(); }, [date, userId]);

      const fmtTime = (t) => {
        if (!t) return '—';
        const [h, m] = t.split(':').map(Number);
        return `${h % 12 || 12}:${String(m).padStart(2,'0')} ${h >= 12 ? 'PM' : 'AM'}`;
      };

      const fmtPhone = (p) => {
        if (!p) return '';
        const d = p.replace(/\D/g, '');
        if (d.length === 10) return `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
        if (d.length === 11 && d[0] === '1') return `+1 (${d.slice(1,4)}) ${d.slice(4,7)}-${d.slice(7)}`;
        return p;
      };

      const fullAddr = (a) => [a.address, a.city, a.state, a.zip].filter(Boolean).join(', ');

      // Smart Route — Google Directions API waypoint optimisation
      // Haversine distance in miles between two lat/lng points
      const haversineMi = (lat1, lng1, lat2, lng2) => {
        const R = 3958.8; // Earth radius miles
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLng = (lng2 - lng1) * Math.PI / 180;
        const a = Math.sin(dLat/2)**2 + Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) * Math.sin(dLng/2)**2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      };

      const loadNearbyClients = async (lastStopAppt, radiusMi = 15) => {
        if (!db || !lastStopAppt) return;
        const geo = lastStopAppt.geo || null;
        // Fall back to geocoding the address if no stored coords
        let baseLat = geo?.lat, baseLng = geo?.lng;
        if (!baseLat && lastStopAppt.address && window.google?.maps?.Geocoder) {
          try {
            const geocoder = new window.google.maps.Geocoder();
            const addr = [lastStopAppt.address, lastStopAppt.city, lastStopAppt.state, lastStopAppt.zip].filter(Boolean).join(', ');
            await new Promise(resolve => {
              geocoder.geocode({ address: addr }, (results, status) => {
                if (status === 'OK' && results[0]) {
                  baseLat = results[0].geometry.location.lat();
                  baseLng = results[0].geometry.location.lng();
                }
                resolve();
              });
            });
          } catch(e) {}
        }
        if (!baseLat) return;

        setLoadingNearby(true);
        try {
          // Load all customers with geo coords
          const custSnap = await db.collection('customers').where('farrierId', '==', userId).get();
          // Include customers with geo coords; also try to geocode those without
          const allCustomers = custSnap.docs.map(d => ({ id: d.id, ...d.data() }));
          const customers = [];
          for (const c of allCustomers) {
            if (c.geo?.lat) {
              customers.push(c);
            } else if (c.address && window.google?.maps?.Geocoder) {
              // Geocode on the fly for customers added without Places API
              try {
                const geocoder = new window.google.maps.Geocoder();
                const addr = [c.address, c.city, c.state, c.zip].filter(Boolean).join(', ');
                await new Promise(resolve => {
                  geocoder.geocode({ address: addr }, (results, status) => {
                    if (status === 'OK' && results[0]) {
                      c.geo = { lat: results[0].geometry.location.lat(), lng: results[0].geometry.location.lng() };
                      customers.push(c);
                    }
                    resolve();
                  });
                });
              } catch(e) {}
            }
          }

          // Load upcoming appointments (next 60 days)
          const today = new Date().toISOString().split('T')[0];
          const future = new Date(); future.setDate(future.getDate() + 60);
          const futureStr = future.toISOString().split('T')[0];
          const apptSnap = await db.collection('appointments')
            .where('farrierId', '==', userId)
            .where('requestedDate', '>=', today)
            .where('requestedDate', '<=', futureStr)
            .get();
          const futureAppts = apptSnap.docs.map(d => ({ id: d.id, ...d.data() }));

          // Map all possible keys → next appointment (appointments use email, customerEmail, or customerName)
          const nextApptByEmail = {};
          const nextApptByName = {};
          futureAppts.forEach(a => {
            // Only match appointments belonging to this farrier
            if (a.farrierId !== userId) return;
            const email = (a.customerEmail || a.email || '').toLowerCase().trim();
            const name  = (a.customerName || '').toLowerCase().trim();
            const update = (map, key, appt) => {
              if (!key) return;
              if (!map[key] || appt.requestedDate < map[key].requestedDate) map[key] = appt;
            };
            update(nextApptByEmail, email, a);
            update(nextApptByName, name, a);
          });

          // Calculate distance and filter
          const results = customers
            .map(c => {
              const distMi = haversineMi(baseLat, baseLng, c.geo.lat, c.geo.lng);
              const cEmail = (c.email || '').toLowerCase().trim();
              const cName  = (c.name  || '').toLowerCase().trim();
              const nextAppt = nextApptByEmail[cEmail] || nextApptByName[cName] || null;
              return { ...c, distMi, nextAppt };
            })
            .filter(c => c.distMi <= radiusMi)
            .sort((a, b) => a.distMi - b.distMi)
            .slice(0, 8); // max 8 suggestions

          setNearbyClients(results);
        } catch(e) {
          console.warn('loadNearbyClients error:', e);
        }
        setLoadingNearby(false);
      };

      const runSmartRoute = async () => {
        const withAddr = appointments.filter(a => fullAddr(a));
        if (withAddr.length < 2) {
          alert('Need at least 2 appointments with addresses to optimise the route.');
          return;
        }
        if (!effectiveStart) {
          alert('Please enter a start address or enable the default farrier address in Settings.');
          return;
        }
        setRouting(true);
        setSendResult('');
        try {
          const res = await fetch('/api/smart-route', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              origin: effectiveStart,
              stops: withAddr.map(a => fullAddr(a)),
            }),
          });
          const data = await res.json();
          if (!res.ok || !data.ok) throw new Error(data.error || 'Route API error');

          const ordered = data.order.map(i => withAddr[i]);
          const unrouted = appointments.filter(a => !fullAddr(a));
          const legs = data.legs || [];
          setRouteLegs(legs);
          setRouteOrder([...ordered, ...unrouted]);
          setTotalDistance(data.distanceMiles);
          setTotalDuration(data.durationMinutes);
          setRouteGenerated(true);
          // Load nearby clients based on last stop
          const lastStop = ordered[ordered.length - 1];
          if (lastStop) loadNearbyClients(lastStop);

          // Save leg distance to each appointment doc
          if (db && legs.length > 0) {
            ordered.forEach((appt, idx) => {
              const leg = legs[idx];
              if (leg && appt.id) {
                db.collection('appointments').doc(appt.id).update({
                  routeLegDistanceMi: parseFloat(leg.distanceMi),
                  routeLegDurationMin: leg.durationMin,
                  routeDate: date,
                }).catch(e => console.warn('Could not save leg distance:', e));
              }
            });
          }
        } catch(e) {
          alert('Route error: ' + e.message);
        }
        setRouting(false);
      };

      const displayList = routeGenerated ? routeOrder : appointments;

      // Manual reorder — swap a stop with its neighbor above (dir:-1) or
      // below (dir:1), so a farrier can build their own order by hand
      // instead of relying only on Smart Route. Works before or after Smart
      // Route has run; if it's already run, the previously-computed per-leg
      // distances and total no longer match a manually-shuffled order, so
      // clear them rather than show stale numbers next to the wrong stop.
      const moveRouteAppt = (i, dir) => {
        const list = routeGenerated ? routeOrder : appointments;
        const j = i + dir;
        if (j < 0 || j >= list.length) return;
        const next = [...list];
        [next[i], next[j]] = [next[j], next[i]];
        if (routeGenerated) {
          setRouteOrder(next);
          setRouteLegs([]);
          setTotalDistance(null);
          setTotalDuration(null);
        } else {
          setAppointments(next);
        }
      };

      const buildRouteText = () => {
        const dateStr = new Date(date + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
        const bizName = userProfile?.businessName || 'FarriTech';
        let txt = `${bizName} — Route Sheet\n${dateStr}\n`;
        if (effectiveStart) txt += `Starting from: ${effectiveStart}\n`;
        if (totalDistance) txt += `Est. drive: ${totalDistance} mi · ${totalDuration} min\n`;
        txt += '\n';
        displayList.forEach((a, i) => {
          txt += `${i + 1}. ${fmtTime(a.requestedTime)}  ${a.customerName}`;
          if (a.farmName) txt += ` — ${a.farmName}`;
          txt += '\n';
          const addr = fullAddr(a);
          if (addr) txt += `   📍 ${addr}\n`;
          const leg = routeLegs[i];
          if (leg) txt += `   ↳ ${leg.distanceMi} mi · ~${leg.durationMin} min ${i === 0 ? 'from start' : 'from prev stop'}\n`;
          if (a.services?.length) txt += `   🐴 ${a.services.join(', ')}\n`;
          if (a.phone) txt += `   📞 ${fmtPhone(a.phone)}\n`;
          if (a.numberOfHorses) txt += `   Horses: ${a.numberOfHorses}\n`;
          if (a.comments) txt += `   Notes: ${a.comments}\n`;
          txt += '\n';
        });
        return txt;
      };

      const buildRouteHtml = () => {
        const dateStr = new Date(date + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
        const bizName = userProfile?.businessName || 'FarriTech';
        const rows = displayList.map((a, i) => {
          const addr = fullAddr(a);
          const mapsUrl = addr ? `https://maps.google.com/?q=${encodeURIComponent(addr)}` : null;
          const leg = routeLegs[i];
          const legHtml = leg ? `<div style="font-size:0.8em;color:#6b7280;margin-top:2px">↳ ${leg.distanceMi} mi · ~${leg.durationMin} min ${i === 0 ? 'from start' : 'from prev stop'}</div>` : '';
          return `<tr style="border-bottom:1px solid #e5e7eb">
            <td style="padding:10px 8px;font-weight:700;color:#2563eb;vertical-align:top">${i + 1}</td>
            <td style="padding:10px 8px;vertical-align:top">
              <div style="font-weight:700">${a.customerName}${a.farmName ? ` <span style="font-weight:400;color:#666">— ${a.farmName}</span>` : ''}</div>
              ${addr ? `<div style="font-size:0.85em;color:#555;margin-top:2px">📍 ${mapsUrl ? `<a href="${mapsUrl}" style="color:#2563eb">${addr}</a>` : addr}</div>${legHtml}` : ''}
              ${a.services?.length ? `<div style="font-size:0.85em;color:#333;margin-top:2px">🐴 ${a.services.join(', ')}</div>` : ''}
              ${a.numberOfHorses ? `<div style="font-size:0.82em;color:#888">Horses: ${a.numberOfHorses}</div>` : ''}
              ${a.comments ? `<div style="font-size:0.82em;color:#888;font-style:italic">Notes: ${a.comments}</div>` : ''}
            </td>
            <td style="padding:10px 8px;white-space:nowrap;vertical-align:top;font-weight:600">${fmtTime(a.requestedTime)}</td>
            <td style="padding:10px 8px;vertical-align:top;white-space:nowrap">${fmtPhone(a.phone)}</td>
          </tr>`;
        }).join('');
        return `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Route Sheet — ${dateStr}</title>
          <style>body{font-family:Arial,sans-serif;max-width:800px;margin:0 auto;padding:24px;color:#111}
          h1{color:#1e3a5f;margin-bottom:4px}table{width:100%;border-collapse:collapse}
          th{text-align:left;background:#f0f9ff;padding:8px;color:#0369a1;font-size:0.85em;text-transform:uppercase}
          @media print{a{color:#111;text-decoration:none}}</style></head><body>
          <h1>🗺️ Route Sheet</h1>
          <p style="margin:0;color:#555"><strong>${bizName}</strong> · ${dateStr}</p>
          ${effectiveStart ? `<p style="margin:4px 0 0;color:#555;font-size:0.9em">📍 Start: ${effectiveStart}</p>` : ''}
          ${totalDistance ? `<p style="margin:4px 0 0;color:#555;font-size:0.9em">🚗 Est. ${totalDistance} mi · ${totalDuration} min driving</p>` : ''}
          <br>
          <table><thead><tr><th>#</th><th>Client / Stop</th><th>Time</th><th>Phone</th></tr></thead>
          <tbody>${rows}</tbody></table>
          </body></html>`;
      };

      const downloadPdf = () => {
        const html = buildRouteHtml();
        const win = window.open('', '_blank');
        if (!win) { alert('Popup blocked — please allow popups.'); return; }
        win.document.write(html);
        win.document.close();
        win.focus();
        setTimeout(() => { win.print(); }, 600);
      };

      const handleSend = async () => {
        if (!sendSms && !sendEmail) { alert('Please select at least one delivery method.'); return; }
        setSending(true);
        setSendResult('');
        const routeText = buildRouteText();
        const routeHtml = buildRouteHtml();
        let results = [];
        try {
          if (sendSms) {
            const smsPhone = userProfile?.phone || '+19546733041';
            const msg = routeText.length > 1500 ? routeText.substring(0, 1490) + '…' : routeText;
            const res = await fetch('/api/send-sms', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ to: smsPhone, body: msg })
            });
            results.push(res.ok ? '✅ SMS sent' : '❌ SMS failed');
          }
          if (sendEmail && userProfile?.email) {
            const dateStr = new Date(date + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
            const res = await fetch('/api/send-email', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                action: 'route-sheet',
                to: userProfile.email,
                subject: `Route Sheet — ${dateStr}`,
                html: routeHtml,
              })
            });
            results.push(res.ok ? '✅ Email sent' : '❌ Email failed');
          } else if (sendEmail) {
            results.push('⚠️ Email not available (no email in Settings)');
          }
          setSendResult(results.join('  '));
        } catch(e) {
          setSendResult('❌ Error: ' + e.message);
        }
        setSending(false);
      };

      const inputStyle = { width: '100%', padding: '0.75rem', borderRadius: 8, border: '1px solid #cbd5e1', fontFamily: 'Outfit,sans-serif', fontSize: '1rem', boxSizing: 'border-box', background: '#fff', color: 'var(--text)', colorScheme: 'light' };
      const cardStyle = { background: 'var(--surface)', borderRadius: 12, padding: '1.5rem', boxShadow: '0 1px 3px rgba(15,23,42,0.06), 0 4px 16px rgba(15,23,42,0.05)', marginBottom: '1.25rem', border: '1px solid #cbd5e1', color: 'var(--text)' };

      return (
        <div style={{ maxWidth: 680, margin: '0 auto' }}>
          <h2 style={{ color: 'var(--primary)', marginBottom: '0.25rem' }}>🗺️ Route Sheet</h2>
          <p style={{ color: 'var(--text-muted)', marginTop: 0, marginBottom: '1.5rem' }}>Build a daily stop list, optimise the drive order, then send or print.</p>

          {/* Date picker */}
          <div style={cardStyle}>
            <div className="form-group" style={{ margin: 0 }}>
              <label style={{ fontWeight: 700 }}>📅 Select Date</label>
              <div style={{position:'relative', display:'inline-flex', alignItems:'center', maxWidth:220}}>
                <input type="date" value={date} onChange={e => setDate(e.target.value)}
                  style={{ ...inputStyle, maxWidth: 220, paddingRight:'2.5rem' }}
                />
                <span
                  onClick={(e) => e.currentTarget.previousSibling.showPicker()}
                  style={{position:'absolute', right:'0.6rem', fontSize:'1.1rem', cursor:'pointer', userSelect:'none', lineHeight:1}}
                >📅</span>
              </div>
            </div>
          </div>

          {/* Start address */}
          <div style={cardStyle}>
            <label style={{ fontWeight: 700, display: 'block', marginBottom: '0.75rem' }}>📍 Start Address</label>
            <label style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', cursor: 'pointer', marginBottom: useDefaultAddress ? 0 : '0.75rem' }}>
              <input type="checkbox" checked={useDefaultAddress} onChange={e => setUseDefaultAddress(e.target.checked)} style={{ width: 18, height: 18, cursor: 'pointer' }} />
              <span style={{ fontWeight: 600 }}>Use my default address</span>
              {defaultAddress && <span style={{ color: 'var(--text-muted)', fontSize: '0.9em' }}>({defaultAddress})</span>}
            </label>
            {!useDefaultAddress && (
              <div style={{ marginTop: '0.75rem' }}>
                <div ref={startAddressRef} style={{ width: '100%' }} />
                {!startAddressPacRef.current && (
                  <input type="text" value={startAddress} placeholder="123 Main St, City, FL 12345"
                    onChange={e => setStartAddress(e.target.value)} style={{ ...inputStyle, marginTop: 4 }} />
                )}
              </div>
            )}
          </div>

          {/* Appointments list */}
          <div style={cardStyle}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem' }}>
              <span style={{ fontWeight: 700 }}>
                {loading ? '⏳ Loading…' : `${appointments.length} appointment${appointments.length !== 1 ? 's' : ''} on this date`}
              </span>
              {appointments.length >= 2 && (
                <button className="btn btn-primary" onClick={runSmartRoute} disabled={routing || !effectiveStart}
                  style={{ padding: '0.5rem 1rem', fontSize: '0.9rem' }}>
                  {routing ? '⏳ Optimising…' : '✨ Smart Route'}
                </button>
              )}
            </div>

            {!loading && appointments.length === 0 && (
              <p style={{ color: 'var(--text-muted)', margin: 0 }}>No appointments found for this date.</p>
            )}

            {routeGenerated && totalDistance && (
              <div style={{ padding: '0.6rem 1rem', background: '#f0fdf4', border: '1.5px solid #86efac', borderRadius: 8, marginBottom: '1rem', fontSize: '0.9rem', color: '#166534', fontWeight: 600 }}>
                🚗 Optimised route · {totalDistance} mi · ~{totalDuration} min driving
              </div>
            )}

            {!loading && displayList.map((a, i) => {
              const addr = fullAddr(a);
              const mapsUrl = addr ? `https://maps.google.com/?q=${encodeURIComponent(addr)}` : null;
              return (
                <div key={a.id} style={{ display: 'flex', gap: '0.75rem', padding: '0.85rem 0', borderBottom: i < displayList.length - 1 ? '1px solid var(--border)' : 'none' }}>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 3, flexShrink: 0 }}>
                    <button type="button" onClick={() => moveRouteAppt(i, -1)} disabled={i === 0} title="Move up"
                      style={{ width: 26, height: 20, border: '1.5px solid var(--border)', borderRadius: 5, background: 'transparent', color: 'var(--primary-light)', cursor: i === 0 ? 'not-allowed' : 'pointer', opacity: i === 0 ? 0.3 : 1, fontSize: '0.65rem', fontWeight: 700, lineHeight: 1, padding: 0 }}>▲</button>
                    <button type="button" onClick={() => moveRouteAppt(i, 1)} disabled={i === displayList.length - 1} title="Move down"
                      style={{ width: 26, height: 20, border: '1.5px solid var(--border)', borderRadius: 5, background: 'transparent', color: 'var(--primary-light)', cursor: i === displayList.length - 1 ? 'not-allowed' : 'pointer', opacity: i === displayList.length - 1 ? 0.3 : 1, fontSize: '0.65rem', fontWeight: 700, lineHeight: 1, padding: 0 }}>▼</button>
                  </div>
                  <div style={{ minWidth: 28, height: 28, borderRadius: '50%', background: routeGenerated ? '#2563eb' : '#94a3b8', color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 700, fontSize: '0.85rem', flexShrink: 0 }}>{i + 1}</div>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontWeight: 700 }}>{a.customerName}{a.farmName ? <span style={{ fontWeight: 400, color: 'var(--text-muted)' }}> — {a.farmName}</span> : ''}</div>
                    <div style={{ fontSize: '0.87rem', color: 'var(--text)', marginTop: 2 }}>
                      <span style={{ marginRight: '0.75rem' }}>⏰ {fmtTime(a.requestedTime)}</span>
                      {a.phone && <span style={{ marginRight: '0.75rem' }}>📞 {fmtPhone(a.phone)}</span>}
                    </div>
                    {addr && (
                      <div style={{ fontSize: '0.85rem', color: 'var(--primary-light)', marginTop: 2, fontWeight: 600 }}>
                        {mapsUrl ? <a href={mapsUrl} target="_blank" rel="noopener noreferrer" style={{color:'var(--primary-light)', textDecoration:'underline'}}>📍 {addr}</a> : `📍 ${addr}`}
                      </div>
                    )}
                    {routeGenerated && routeLegs[i] && (
                      <div style={{ fontSize: '0.8rem', color: '#94a3b8', marginTop: 2 }}>
                        ↳ {routeLegs[i].distanceMi} mi · ~{routeLegs[i].durationMin} min {i === 0 ? 'from start' : 'from prev stop'}
                      </div>
                    )}
                    {a.services?.length > 0 && <div style={{ fontSize: '0.82rem', color: 'var(--text-muted)', marginTop: 2 }}>🐴 {a.services.join(', ')}</div>}
                    {!addr && <div style={{ fontSize: '0.8rem', color: '#f59e0b', marginTop: 2 }}>⚠️ No address — cannot route</div>}
                  </div>
                </div>
              );
            })}
          </div>

          {/* Nearby clients section */}
          {routeGenerated && (nearbyClients.length > 0 || loadingNearby) && (
            <div style={cardStyle}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem', marginBottom: '1rem' }}>
                <span style={{ fontWeight: 700, fontSize: '1rem' }}>📍 Nearby Clients — You Have Time?</span>
                <span style={{ fontSize: '0.8rem', color: 'var(--text-muted)', fontWeight: 400 }}>within 15 mi of last stop</span>
              </div>
              {loadingNearby && <p style={{ color: 'var(--text-muted)', margin: 0 }}>⏳ Finding nearby clients…</p>}
              {!loadingNearby && nearbyClients.map((c, i) => (
                <div key={c.id} style={{ display: 'flex', gap: '0.75rem', padding: '0.75rem 0', borderBottom: i < nearbyClients.length - 1 ? '1px solid var(--border)' : 'none' }}>
                  <div style={{ minWidth: 36, height: 36, borderRadius: '50%', background: 'rgba(38,131,251,0.15)', border: '1.5px solid rgba(38,131,251,0.4)', color: 'var(--primary)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 700, fontSize: '0.8rem', flexShrink: 0 }}>
                    {c.distMi.toFixed(1)}mi
                  </div>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontWeight: 700 }}>
                      {c.name}{c.farmName ? <span style={{ fontWeight: 400, color: 'var(--text-muted)' }}> — {c.farmName}</span> : ''}
                    </div>
                    <div style={{ fontSize: '0.83rem', color: 'var(--text-muted)', marginTop: 2 }}>
                      {c.phone && <span style={{ marginRight: '0.75rem' }}>📞 {fmtPhone(c.phone)}</span>}
                      {c.address && <span>📍 {[c.address, c.city, c.state].filter(Boolean).join(', ')}</span>}
                    </div>
                    {c.services?.length > 0 && (
                      <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)', marginTop: 2 }}>🐴 {c.services.join(', ')}</div>
                    )}
                    {c.nextAppt ? (
                      <div style={{ fontSize: '0.8rem', marginTop: 3, color: '#f59e0b', fontWeight: 600 }}>
                        📅 Next appt: {c.nextAppt.requestedDate} {c.nextAppt.requestedTime ? `at ${c.nextAppt.requestedTime}` : ''}
                      </div>
                    ) : (
                      <div style={{ fontSize: '0.8rem', marginTop: 3, color: '#166534', fontWeight: 600 }}>
                        ✅ No upcoming appointment scheduled
                      </div>
                    )}
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* Send / PDF options */}
          {appointments.length > 0 && (
            <div style={cardStyle}>
              <label style={{ fontWeight: 700, display: 'block', marginBottom: '0.75rem' }}>📤 Send or Export</label>

              <label style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', cursor: 'pointer', marginBottom: '0.6rem' }}>
                <input type="checkbox" checked={sendSms} onChange={e => setSendSms(e.target.checked)} style={{ width: 18, height: 18, cursor: 'pointer' }} />
                <span>📱 Send via SMS to my phone</span>
                {userProfile?.phone && <span style={{ color: 'var(--text-muted)', fontSize: '0.85em' }}>({fmtPhone(userProfile.phone)})</span>}
              </label>

              <label style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', cursor: 'pointer', marginBottom: '0.6rem' }}>
                <input type="checkbox" checked={sendEmail} onChange={e => setSendEmail(e.target.checked)} style={{ width: 18, height: 18, cursor: 'pointer' }} />
                <span>✉️ Send via Email to myself</span>
                {userProfile?.email && <span style={{ color: 'var(--text-muted)', fontSize: '0.85em' }}>({userProfile.email})</span>}
              </label>

              <div style={{ display: 'flex', gap: '0.75rem', marginTop: '1rem', flexWrap: 'wrap' }}>
                {(sendSms || sendEmail) && (
                  <button className="btn btn-primary" onClick={handleSend} disabled={sending} style={{ flex: 1, minWidth: 140 }}>
                    {sending ? '⏳ Sending…' : '📤 Send Route Sheet'}
                  </button>
                )}
                <button className="btn btn-outline" onClick={downloadPdf} style={{ flex: 1, minWidth: 140 }}>
                  🖨️ Print / Save PDF
                </button>
              </div>

              {sendResult && (
                <div style={{ marginTop: '0.75rem', padding: '0.7rem 1rem', background: '#f0fdf4', borderRadius: 8, border: '1.5px solid #86efac', fontSize: '0.92rem', fontWeight: 600, color: '#16a34a' }}>
                  {sendResult}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // Business dashboard for owners and managers — lib/owner-dashboard.js does the math and
    // drawing (the mobile app's Business Dashboard uses the same file). Read-only.
    function OwnerDashboardView({ userId }) {
      const boxRef = React.useRef(null);
      const [state, setState] = useState({ loading: true, error: '', stamp: 0 });
      const load = async () => {
        setState(s => ({ ...s, loading: true, error: '' }));
        try {
          const [invSnap, apptSnap, team] = await Promise.all([
            db.collection('invoices').where('farrierId', '==', userId).get(),
            db.collection('appointments').where('farrierId', '==', userId).get(),
            fetch('/api/stripe-payment', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'team_status' }) })
              .then(r => r.json()).catch(() => null),
          ]);
          const names = { [userId]: 'Owner' };
          for (const m of (team?.members || [])) names[m.uid] = m.name || m.email;
          const stats = window.FarriOwnerDash.compute(
            invSnap.docs.map(d => ({ id: d.id, ...d.data() })),
            apptSnap.docs.map(d => ({ id: d.id, ...d.data() })),
            { names, ownerId: userId });
          window.FarriOwnerDash.render(boxRef.current, stats, { dark: true });
          setState({ loading: false, error: '', stamp: Date.now() });
        } catch (e) {
          console.error('Business dashboard error:', e);
          setState({ loading: false, error: 'Couldn’t load the dashboard. Please try again.', stamp: 0 });
        }
      };
      useEffect(() => { if (userId) load(); }, [userId]);
      return (
        <div>
          <div style={{display: 'flex', alignItems: 'center', gap: '1rem', marginBottom: '1rem', flexWrap: 'wrap'}}>
            <h1 style={{fontSize: '2rem', color: 'var(--primary)', margin: 0}}>Business Dashboard</h1>
            <button className="btn btn-sm btn-outline" onClick={load} disabled={state.loading} style={{marginLeft: 'auto'}}>{state.loading ? 'Loading…' : '↻ Refresh'}</button>
          </div>
          {state.error && <div className="error-message">{state.error}</div>}
          {state.loading && !state.stamp && <div style={{color: 'var(--text-muted)'}}>Loading your numbers…</div>}
          <div ref={boxRef} />
        </div>
      );
    }

    function ReportsView({ userId }) {
      const [invoices, setInvoices] = useState([]);
      const [loading, setLoading] = useState(true);
      const [dateRange, setDateRange] = useState('thisMonth'); // thisMonth, lastMonth, thisQuarter, thisYear, custom
      const [customStartDate, setCustomStartDate] = useState('');
      const [customEndDate, setCustomEndDate] = useState('');
      const [detailView, setDetailView] = useState(null); // { type: 'month', data: {...} } or { type: 'status', data: {...} } or { type: 'customer', data: {...} } or { type: 'service', data: {...} }

      useEffect(() => {
        loadInvoices();
      }, []);

      const loadInvoices = async () => {
        if (db) {
          try {
            const snapshot = await db.collection('invoices')
              .where('farrierId', '==', userId)
              .get();

            const invoiceData = snapshot.docs.map(doc => ({
              id: doc.id,
              ...doc.data()
            }));

            setInvoices(invoiceData);
          } catch (error) {
            console.error('Error loading invoices:', error);
          }
        }
        setLoading(false);
      };

      // Filter invoices by date range
      const getFilteredInvoices = () => {
        const now = new Date();
        const currentYear = now.getFullYear();
        const currentMonth = now.getMonth();

        return invoices.filter(invoice => {
          if (!invoice.createdAt) return false;
          
          const invoiceDate = invoice.createdAt.toDate();
          const invoiceYear = invoiceDate.getFullYear();
          const invoiceMonth = invoiceDate.getMonth();

          switch (dateRange) {
            case 'thisMonth':
              return invoiceYear === currentYear && invoiceMonth === currentMonth;
            
            case 'lastMonth':
              const lastMonth = currentMonth === 0 ? 11 : currentMonth - 1;
              const lastMonthYear = currentMonth === 0 ? currentYear - 1 : currentYear;
              return invoiceYear === lastMonthYear && invoiceMonth === lastMonth;
            
            case 'thisQuarter':
              const currentQuarter = Math.floor(currentMonth / 3);
              const invoiceQuarter = Math.floor(invoiceMonth / 3);
              return invoiceYear === currentYear && invoiceQuarter === currentQuarter;
            
            case 'thisYear':
              return invoiceYear === currentYear;
            
            case 'custom':
              if (!customStartDate || !customEndDate) return true;
              const start = new Date(customStartDate);
              const end = new Date(customEndDate);
              end.setHours(23, 59, 59);
              return invoiceDate >= start && invoiceDate <= end;
            
            default:
              return true;
          }
        });
      };

      const filteredInvoices = getFilteredInvoices();

      // Calculate metrics - use paidAmount to include partial payments, minus anything refunded
      const getPaidAmount = (inv) => Math.max(0, (inv.paidAmount || (inv.payments || []).reduce((s,p) => s + (p.amount||0), 0) || (inv.status === 'paid' || inv.status === 'refunded' ? (inv.total || 0) : 0)) - (inv.refundedAmount || 0));
      const totalRevenue = filteredInvoices.reduce((sum, inv) => sum + getPaidAmount(inv), 0);

      const totalOutstanding = filteredInvoices
        .filter(inv => inv.status === 'outstanding' || inv.status === 'partial')
        .reduce((sum, inv) => sum + (inv.balanceDue || Math.max(0, (inv.total||0) - getPaidAmount(inv))), 0);

      const totalInvoices = filteredInvoices.length;
      const paidInvoices = filteredInvoices.filter(inv => inv.status === 'paid').length;
      const unpaidInvoices = filteredInvoices.filter(inv => inv.status === 'outstanding' || inv.status === 'partial').length;

      const averageInvoice = totalInvoices > 0 ? totalRevenue / Math.max(1, paidInvoices) : 0;
      const collectionRate = totalInvoices > 0 ? (paidInvoices / totalInvoices * 100) : 0;

      // Top customers
      const customerTotals = {};
      filteredInvoices.forEach(inv => {
        if (inv.status === 'paid') {
          const name = inv.customerName || 'Unknown';
          customerTotals[name] = (customerTotals[name] || 0) + (inv.total || 0);
        }
      });

      const topCustomers = Object.entries(customerTotals)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 5);

      // Service breakdown
      const serviceRevenue = {};
      filteredInvoices.forEach(inv => {
        if (inv.status === 'paid' && inv.items) {
          inv.items.forEach(item => {
            const service = item.description || 'Unknown Service';
            serviceRevenue[service] = (serviceRevenue[service] || 0) + parseFloat(item.amount || 0);
          });
        }
      });

      const topServices = Object.entries(serviceRevenue)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 5);

      // Monthly trend (last 6 months)
      const monthlyData = [];
      for (let i = 5; i >= 0; i--) {
        const date = new Date();
        date.setMonth(date.getMonth() - i);
        const month = date.getMonth();
        const year = date.getFullYear();
        
        const monthRevenue = invoices
          .filter(inv => {
            if (!inv.createdAt || inv.status !== 'paid') return false;
            const invDate = inv.createdAt.toDate();
            return invDate.getMonth() === month && invDate.getFullYear() === year;
          })
          .reduce((sum, inv) => sum + (inv.total || 0), 0);

        monthlyData.push({
          month: date.toLocaleDateString('en-US', { month: 'short' }),
          year: date.getFullYear(),
          revenue: monthRevenue
        });
      }

      const maxRevenue = Math.max(...monthlyData.map(d => d.revenue), 1);

      // Calculate aging report (overdue invoices)
      const now = new Date();
      const aging = {
        current: { amount: 0, count: 0, invoices: [] },
        days30: { amount: 0, count: 0, invoices: [] },
        days60: { amount: 0, count: 0, invoices: [] },
        days90: { amount: 0, count: 0, invoices: [] },
        days90plus: { amount: 0, count: 0, invoices: [] }
      };

      filteredInvoices.forEach(inv => {
        if (inv.status === 'outstanding' && inv.createdAt) {
          const createdDate = inv.createdAt.toDate();
          const daysOld = Math.floor((now - createdDate) / (1000 * 60 * 60 * 24));
          
          if (daysOld <= 30) {
            aging.current.amount += inv.total || 0;
            aging.current.count++;
            aging.current.invoices.push(inv);
          } else if (daysOld <= 60) {
            aging.days30.amount += inv.total || 0;
            aging.days30.count++;
            aging.days30.invoices.push(inv);
          } else if (daysOld <= 90) {
            aging.days60.amount += inv.total || 0;
            aging.days60.count++;
            aging.days60.invoices.push(inv);
          } else if (daysOld <= 120) {
            aging.days90.amount += inv.total || 0;
            aging.days90.count++;
            aging.days90.invoices.push(inv);
          } else {
            aging.days90plus.amount += inv.total || 0;
            aging.days90plus.count++;
            aging.days90plus.invoices.push(inv);
          }
        }
      });

      const maxAging = Math.max(
        aging.current.amount,
        aging.days30.amount,
        aging.days60.amount,
        aging.days90.amount,
        aging.days90plus.amount,
        1
      );

      return (
        <div>
          <div style={{marginBottom: '2rem', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '1rem'}}>
            <div>
              <h1 style={{fontSize: '2rem', color: 'var(--primary)', marginBottom: '0.5rem'}}>
                📈 Reports & Analytics
              </h1>
              <p style={{color: 'var(--text-muted)'}}>
                Financial insights and performance metrics
              </p>
            </div>

            <div style={{display: 'flex', gap: '0.5rem', flexWrap: 'wrap'}}>
              <button
                onClick={() => setDateRange('thisMonth')}
                className={`btn btn-sm ${dateRange === 'thisMonth' ? 'btn-primary' : 'btn-outline'}`}
              >
                This Month
              </button>
              <button
                onClick={() => setDateRange('lastMonth')}
                className={`btn btn-sm ${dateRange === 'lastMonth' ? 'btn-primary' : 'btn-outline'}`}
              >
                Last Month
              </button>
              <button
                onClick={() => setDateRange('thisQuarter')}
                className={`btn btn-sm ${dateRange === 'thisQuarter' ? 'btn-primary' : 'btn-outline'}`}
              >
                This Quarter
              </button>
              <button
                onClick={() => setDateRange('thisYear')}
                className={`btn btn-sm ${dateRange === 'thisYear' ? 'btn-primary' : 'btn-outline'}`}
              >
                This Year
              </button>
              <button
                onClick={() => setDateRange('custom')}
                className={`btn btn-sm ${dateRange === 'custom' ? 'btn-primary' : 'btn-outline'}`}
              >
                Custom Range
              </button>
            </div>
          </div>

          {dateRange === 'custom' && (
            <div style={{marginBottom: '2rem', padding: '1rem', background: 'var(--surface)', borderRadius: '8px', display: 'flex', gap: '1rem', flexWrap: 'wrap'}}>
              <div>
                <label style={{display: 'block', marginBottom: '0.25rem', fontSize: '0.875rem', fontWeight: '500'}}>Start Date</label>
                <input 
                  type="date" 
                  value={customStartDate}
                  onChange={(e) => setCustomStartDate(e.target.value)}
                  style={{padding: '0.5rem', borderRadius: '4px', border: '1px solid #ddd'}}
                />
              </div>
              <div>
                <label style={{display: 'block', marginBottom: '0.25rem', fontSize: '0.875rem', fontWeight: '500'}}>End Date</label>
                <input 
                  type="date" 
                  value={customEndDate}
                  onChange={(e) => setCustomEndDate(e.target.value)}
                  style={{padding: '0.5rem', borderRadius: '4px', border: '1px solid #ddd'}}
                />
              </div>
            </div>
          )}

          {loading ? (
            <div style={{display: 'flex', justifyContent: 'center', padding: '4rem'}}>
              <div className="spinner"></div>
            </div>
          ) : (
            <>
              {/* Key Metrics */}
              <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '1.5rem', marginBottom: '2rem'}}>
                <div className="card">
                  <div style={{fontSize: '0.875rem', color: 'var(--text-muted)', marginBottom: '0.5rem', fontWeight: '500'}}>
                    Total Revenue
                  </div>
                  <div style={{fontSize: '2rem', fontWeight: '700', color: '#2683FB'}}>
                    ${totalRevenue.toFixed(2)}
                  </div>
                </div>

                <div className="card">
                  <div style={{fontSize: '0.875rem', color: 'var(--text-muted)', marginBottom: '0.5rem', fontWeight: '500'}}>
                    Outstanding
                  </div>
                  <div style={{fontSize: '2rem', fontWeight: '700', color: '#f59e0b'}}>
                    ${totalOutstanding.toFixed(2)}
                  </div>
                </div>

                <div className="card">
                  <div style={{fontSize: '0.875rem', color: 'var(--text-muted)', marginBottom: '0.5rem', fontWeight: '500'}}>
                    Average Invoice
                  </div>
                  <div style={{fontSize: '2rem', fontWeight: '700', color: 'var(--primary)'}}>
                    ${averageInvoice.toFixed(2)}
                  </div>
                </div>

                <div className="card">
                  <div style={{fontSize: '0.875rem', color: 'var(--text-muted)', marginBottom: '0.5rem', fontWeight: '500'}}>
                    Collection Rate
                  </div>
                  <div style={{fontSize: '2rem', fontWeight: '700', color: 'var(--primary)'}}>
                    {collectionRate.toFixed(1)}%
                  </div>
                </div>
              </div>

              <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))', gap: '1.5rem', marginBottom: '2rem'}}>
                {/* Revenue Trend */}
                <div className="card">
                  <h3 style={{fontSize: '1.25rem', marginBottom: '1.5rem', color: 'var(--primary)'}}>
                    📊 6-Month Revenue Trend <span style={{fontSize: '0.8rem', color: 'var(--text-muted)', fontWeight: 'normal'}}>(click bars)</span>
                  </h3>
                  <div style={{height: '200px', display: 'flex', alignItems: 'flex-end', gap: '0.5rem', justifyContent: 'space-between'}}>
                    {monthlyData.map((data, i) => {
                      const monthInvoices = invoices.filter(inv => {
                        if (!inv.createdAt || inv.status !== 'paid') return false;
                        const invDate = inv.createdAt.toDate();
                        return invDate.toLocaleDateString('en-US', { month: 'short' }) === data.month &&
                               invDate.getFullYear() === data.year;
                      });

                      return (
                        <div 
                          key={i} 
                          style={{flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', cursor: data.revenue > 0 ? 'pointer' : 'default'}}
                          onClick={() => {
                            if (data.revenue > 0) {
                              setDetailView({
                                type: 'month',
                                data: {
                                  month: `${data.month} ${data.year}`,
                                  invoices: monthInvoices,
                                  total: data.revenue
                                }
                              });
                            }
                          }}
                        >
                          <div style={{
                            width: '100%',
                            height: `${(data.revenue / maxRevenue) * 180}px`,
                            minHeight: data.revenue > 0 ? '10px' : '0',
                            background: 'linear-gradient(to top, #16a34a, #22c55e)',
                            borderRadius: '4px 4px 0 0',
                            transition: 'all 0.3s',
                            marginBottom: '0.5rem',
                            transform: 'scale(1)',
                          }}
                          onMouseEnter={(e) => {
                            if (data.revenue > 0) {
                              e.target.style.transform = 'scale(1.05)';
                              e.target.style.filter = 'brightness(1.1)';
                            }
                          }}
                          onMouseLeave={(e) => {
                            e.target.style.transform = 'scale(1)';
                            e.target.style.filter = 'brightness(1)';
                          }}
                          title={`${data.month}: $${data.revenue.toFixed(2)} (click to see invoices)`}></div>
                          <div style={{fontSize: '0.75rem', color: 'var(--text-muted)', fontWeight: '500'}}>
                            {data.month}
                          </div>
                          <div style={{fontSize: '0.7rem', color: 'var(--text-muted)'}}>
                            ${(data.revenue / 1000).toFixed(1)}k
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* Invoice Status */}
                <div className="card">
                  <h3 style={{fontSize: '1.25rem', marginBottom: '1.5rem', color: 'var(--primary)'}}>
                    📋 Invoice Breakdown <span style={{fontSize: '0.8rem', color: 'var(--text-muted)', fontWeight: 'normal'}}>(click to view)</span>
                  </h3>
                  <div style={{display: 'flex', flexDirection: 'column', gap: '1rem'}}>
                    <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
                      <span style={{color: 'var(--text-muted)'}}>Total Invoices</span>
                      <span style={{fontSize: '1.5rem', fontWeight: '700', color: 'var(--primary)'}}>{totalInvoices}</span>
                    </div>
                    <div 
                      style={{
                        display: 'flex', 
                        justifyContent: 'space-between', 
                        alignItems: 'center',
                        padding: '0.5rem',
                        borderRadius: '8px',
                        cursor: paidInvoices > 0 ? 'pointer' : 'default',
                        transition: 'background 0.2s'
                      }}
                      onMouseEnter={(e) => { if (paidInvoices > 0) e.currentTarget.style.background = '#f0fdf4'; }}
                      onMouseLeave={(e) => { e.currentTarget.style.background = 'transparent'; }}
                      onClick={() => {
                        if (paidInvoices > 0) {
                          const paidInvs = filteredInvoices.filter(inv => inv.status === 'paid');
                          setDetailView({
                            type: 'status',
                            data: {
                              status: 'paid',
                              invoices: paidInvs,
                              total: paidInvs.reduce((sum, inv) => sum + (inv.total || 0), 0)
                            }
                          });
                        }
                      }}
                    >
                      <span style={{color: 'var(--text-muted)'}}>✅ Paid</span>
                      <span style={{fontSize: '1.25rem', fontWeight: '600', color: '#2683FB'}}>{paidInvoices}</span>
                    </div>
                    <div 
                      style={{
                        display: 'flex', 
                        justifyContent: 'space-between', 
                        alignItems: 'center',
                        padding: '0.5rem',
                        borderRadius: '8px',
                        cursor: unpaidInvoices > 0 ? 'pointer' : 'default',
                        transition: 'background 0.2s'
                      }}
                      onMouseEnter={(e) => { if (unpaidInvoices > 0) e.currentTarget.style.background = '#fef3c7'; }}
                      onMouseLeave={(e) => { e.currentTarget.style.background = 'transparent'; }}
                      onClick={() => {
                        if (unpaidInvoices > 0) {
                          const unpaidInvs = filteredInvoices.filter(inv => inv.status === 'outstanding');
                          setDetailView({
                            type: 'status',
                            data: {
                              status: 'outstanding',
                              invoices: unpaidInvs,
                              total: unpaidInvs.reduce((sum, inv) => sum + (inv.total || 0), 0)
                            }
                          });
                        }
                      }}
                    >
                      <span style={{color: 'var(--text-muted)'}}>⏳ Unpaid</span>
                      <span style={{fontSize: '1.25rem', fontWeight: '600', color: '#f59e0b'}}>{unpaidInvoices}</span>
                    </div>
                    <div style={{marginTop: '1rem', height: '30px', display: 'flex', borderRadius: '8px', overflow: 'hidden', cursor: 'pointer'}}>
                      {paidInvoices > 0 && (
                        <div 
                          style={{
                            width: `${(paidInvoices / totalInvoices) * 100}%`,
                            background: '#2683FB',
                            display: 'flex',
                            alignItems: 'center',
                            justifyContent: 'center',
                            color: 'white',
                            fontSize: '0.75rem',
                            fontWeight: '600',
                            transition: 'filter 0.2s'
                          }}
                          onMouseEnter={(e) => { e.target.style.filter = 'brightness(1.1)'; }}
                          onMouseLeave={(e) => { e.target.style.filter = 'brightness(1)'; }}
                          onClick={() => {
                            const paidInvs = filteredInvoices.filter(inv => inv.status === 'paid');
                            setDetailView({
                              type: 'status',
                              data: {
                                status: 'paid',
                                invoices: paidInvs,
                                total: paidInvs.reduce((sum, inv) => sum + (inv.total || 0), 0)
                              }
                            });
                          }}
                        >
                          {((paidInvoices / totalInvoices) * 100).toFixed(0)}%
                        </div>
                      )}
                      {unpaidInvoices > 0 && (
                        <div 
                          style={{
                            width: `${(unpaidInvoices / totalInvoices) * 100}%`,
                            background: '#f59e0b',
                            display: 'flex',
                            alignItems: 'center',
                            justifyContent: 'center',
                            color: 'white',
                            fontSize: '0.75rem',
                            fontWeight: '600',
                            transition: 'filter 0.2s'
                          }}
                          onMouseEnter={(e) => { e.target.style.filter = 'brightness(1.1)'; }}
                          onMouseLeave={(e) => { e.target.style.filter = 'brightness(1)'; }}
                          onClick={() => {
                            const unpaidInvs = filteredInvoices.filter(inv => inv.status === 'outstanding');
                            setDetailView({
                              type: 'status',
                              data: {
                                status: 'outstanding',
                                invoices: unpaidInvs,
                                total: unpaidInvs.reduce((sum, inv) => sum + (inv.total || 0), 0)
                              }
                            });
                          }}
                        >
                          {((unpaidInvoices / totalInvoices) * 100).toFixed(0)}%
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              </div>

              {/* Aging Report */}
              <div style={{marginBottom: '2rem'}}>
                <div className="card">
                  <h3 style={{fontSize: '1.25rem', marginBottom: '1.5rem', color: 'var(--primary)'}}>
                    📅 Accounts Receivable Aging <span style={{fontSize: '0.8rem', color: 'var(--text-muted)', fontWeight: 'normal'}}>(click bars)</span>
                  </h3>
                  <div style={{fontSize: '0.875rem', color: 'var(--text-muted)', marginBottom: '1.5rem'}}>
                    Outstanding invoices by age
                  </div>
                  <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(150px, 1fr))', gap: '1rem'}}>
                    {[
                      { label: 'Current', sublabel: '0-30 days', data: aging.current, color: '#46C5FF' },
                      { label: '30 Days', sublabel: '31-60 days', data: aging.days30, color: '#eab308' },
                      { label: '60 Days', sublabel: '61-90 days', data: aging.days60, color: '#f97316' },
                      { label: '90 Days', sublabel: '91-120 days', data: aging.days90, color: '#ef4444' },
                      { label: '120+ Days', sublabel: 'over 120', data: aging.days90plus, color: '#991b1b' }
                    ].map((bucket, i) => (
                      <div 
                        key={i}
                        style={{
                          display: 'flex',
                          flexDirection: 'column',
                          alignItems: 'center',
                          cursor: bucket.data.count > 0 ? 'pointer' : 'default',
                          padding: '1rem',
                          borderRadius: '8px',
                          transition: 'all 0.3s'
                        }}
                        onMouseEnter={(e) => {
                          if (bucket.data.count > 0) {
                            e.currentTarget.style.background = '#f9fafb';
                            e.currentTarget.style.transform = 'translateY(-4px)';
                          }
                        }}
                        onMouseLeave={(e) => {
                          e.currentTarget.style.background = 'transparent';
                          e.currentTarget.style.transform = 'translateY(0)';
                        }}
                        onClick={() => {
                          if (bucket.data.count > 0) {
                            setDetailView({
                              type: 'status',
                              data: {
                                status: `${bucket.label} (${bucket.sublabel})`,
                                invoices: bucket.data.invoices,
                                total: bucket.data.amount
                              }
                            });
                          }
                        }}
                      >
                        <div style={{
                          width: '100%',
                          height: '120px',
                          display: 'flex',
                          alignItems: 'flex-end',
                          marginBottom: '0.75rem'
                        }}>
                          <div style={{
                            width: '100%',
                            height: `${bucket.data.amount > 0 ? Math.max((bucket.data.amount / maxAging) * 100, 10) : 0}%`,
                            background: bucket.data.count > 0 ? `linear-gradient(to top, ${bucket.color}, ${bucket.color}dd)` : '#e5e7eb',
                            borderRadius: '8px 8px 0 0',
                            transition: 'all 0.3s',
                            position: 'relative'
                          }}
                          onMouseEnter={(e) => {
                            if (bucket.data.count > 0) {
                              e.target.style.filter = 'brightness(1.1)';
                              e.target.style.transform = 'scaleY(1.05)';
                            }
                          }}
                          onMouseLeave={(e) => {
                            e.target.style.filter = 'brightness(1)';
                            e.target.style.transform = 'scaleY(1)';
                          }}
                          title={`${bucket.label}: $${bucket.data.amount.toFixed(2)} (${bucket.data.count} invoice${bucket.data.count !== 1 ? 's' : ''})`}
                          ></div>
                        </div>
                        <div style={{textAlign: 'center'}}>
                          <div style={{fontSize: '0.75rem', fontWeight: '600', color: 'var(--text)', marginBottom: '0.25rem'}}>
                            {bucket.label}
                          </div>
                          <div style={{fontSize: '0.65rem', color: 'var(--text-muted)', marginBottom: '0.5rem'}}>
                            {bucket.sublabel}
                          </div>

            const methodColors = { cash: '#059669', check: '#2683FB', credit_card: '#7c3aed', ach: '#0891b2', zelle: '#6d28d9', venmo: '#0ea5e9', other: '#d97706' };
            const methodTotals = {};
            const methodCounts = {};
            filteredInvoices.forEach(inv => {
              // Net of refunds: each refund comes off the payment it refunded (matched by
              // Stripe payment id); a payment refunded in full no longer counts.
              const refunds = Array.isArray(inv.refunds) ? inv.refunds : [];
              let unmatchedRefund = refunds.length ? 0 : (inv.refundedAmount || 0);
              const refundedFor = {};
              refunds.forEach(r => {
                if (r.transactionId && (inv.payments || []).some(p => p.transactionId === r.transactionId)) {
                  refundedFor[r.transactionId] = (refundedFor[r.transactionId] || 0) + (r.amount || 0);
                } else {
                  unmatchedRefund += r.amount || 0;
                }
              });
              const add = (m, amount) => {
                const net = Math.max(0, amount);
                methodTotals[m] = (methodTotals[m] || 0) + net;
                if (net > 0.004) methodCounts[m] = (methodCounts[m] || 0) + 1;
              };
              (inv.payments || []).forEach(p => {
                let amount = (p.amount || 0) - (p.transactionId ? (refundedFor[p.transactionId] || 0) : 0);
                if (p.method === 'credit_card' && unmatchedRefund > 0) {
                  const take = Math.min(amount, unmatchedRefund); amount -= take; unmatchedRefund -= take;
                }
                add(p.method || 'other', amount);
              });
              // Legacy: fully paid (or refunded) invoice with no payments array
              if ((!inv.payments || inv.payments.length === 0) && (inv.status === 'paid' || inv.status === 'refunded')) {
                add(inv.cardLast4 ? 'credit_card' : 'cash', (inv.total || 0) - unmatchedRefund);
              }
            });
            Object.keys(methodTotals).forEach(m => { if (methodTotals[m] < 0.005 && !methodCounts[m]) { delete methodTotals[m]; } });
            const totalPaid = Object.values(methodTotals).reduce((s,v) => s+v, 0);
            const methods = Object.keys(methodTotals).sort((a,b) => methodTotals[b] - methodTotals[a]);
            return (
              <div className="card" style={{marginTop: '1.5rem'}}>
                <h3 style={{fontSize: '1.25rem', marginBottom: '1.5rem', color: 'var(--primary)'}}>
                  💰 Payment Methods Breakdown

                {methods.length === 0 ? (
                  <p style={{color: 'var(--text-muted)', textAlign: 'center', padding: '2rem'}}>
                    No payment data yet
                  </p>
                ) : (
                  <div style={{display: 'flex', flexDirection: 'column', gap: '1rem'}}>
                    {methods.map(m => {
                      const pct = totalPaid > 0 ? (methodTotals[m] / totalPaid * 100) : 0;
                      const color = methodColors[m] || '#888';
                      return (
                        <div key={m}>
                          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'0.4rem'}}>
                            <div style={{fontWeight:'600'}}>{methodLabels[m] || m}</div>

                            <div style={{width:`${pct}%`, background:color, height:'100%', borderRadius:'99px', transition:'width 0.5s ease'}}></div>
                          </div>
                        </div>
                      );
                    })}
                    <div style={{borderTop:'1px solid #e5e7eb', paddingTop:'1rem', display:'flex', justifyContent:'space-between', fontWeight:'700'}}>
                      <span>Total Collected</span>
                      <span style={{color:'var(--primary)', fontSize:'1.1rem'}}>${totalPaid.toFixed(2)}</span>
                    </div>
                  </div>
                )}
              </div>
            );
          })()}

                      <div style={{maxHeight: '400px', overflowY: 'auto'}}>

                            <div style={{fontSize: '0.875rem', color: 'var(--text-muted)'}}>
                              {inv.createdAt?.toDate().toLocaleDateString('en-US', {
                                month: 'short',
                                day: 'numeric',
                                year: 'numeric'

                              {inv.paidAt && inv.status === 'paid' && (
                                <> • Paid: {inv.paidAt.toDate().toLocaleDateString('en-US', {

                            </div>
                            {inv.items && inv.items.length > 0 && (

                                    • {item.description}{FarriPricing.itemHorseLabel(item) ? ` (${FarriPricing.itemHorseLabel(item)})` : ''} - ${parseFloat(item.amount || 0).toFixed(2)}
                                  </div>

                          </div>
                        ))}
                      </div>
                    </>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }
function ServicesView({ userId }) {
  const [services, setServices] = useState([]);
  const [loading, setLoading] = useState(true);

  const [name, setName] = useState("");
  const [price, setPrice] = useState("");
  const [category, setCategory] = useState("");
  const [isActive, setIsActive] = useState(true);

  const [editingId, setEditingId] = useState(null);

  // Consumable inventory items this service uses (e.g. "Shoeing - Front" -> 2 front
  // shoes) — read at invoice-save time to auto-deduct stock. Tools are excluded since
  // they're never consumed by a job.
  const [inventoryItems, setInventoryItems] = useState([]);
  const [consumedItems, setConsumedItems] = useState([]);

  const loadServices = async () => {
    if (!db) return;
    setLoading(true);
    const snap = await db.collection("services")
      .where("farrierId", "==", userId)
      .get();

    const rows = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    rows.sort((a,b) => (a.category || "").localeCompare(b.category || "") || (a.name || "").localeCompare(b.name || ""));
    setServices(rows);
    setLoading(false);
  };

  const loadInventoryItems = async () => {
    if (!db) return;
    const snap = await db.collection("inventoryItems")
      .where("farrierId", "==", userId)
      .where("isConsumable", "==", true)
      .where("isActive", "==", true)
      .get();
    const rows = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    rows.sort((a,b) => (a.category || "").localeCompare(b.category || "") || (a.name || "").localeCompare(b.name || ""));
    setInventoryItems(rows);
  };

  useEffect(() => { loadServices(); loadInventoryItems(); }, [userId]);

  const resetForm = () => {
    setName(""); setPrice(""); setCategory(""); setIsActive(true); setEditingId(null);
    setConsumedItems([]);
  };

  const startEdit = (svc) => {
    setEditingId(svc.id);
    setName(svc.name || "");
    setPrice(String(svc.price ?? ""));
    setCategory(svc.category || "");
    setIsActive(Boolean(svc.isActive));
    setConsumedItems(svc.consumedItems || []);
  };

  const toggleConsumedItem = (itemId, checked) => {
    setConsumedItems(prev => {
      if (checked) return [...prev, { itemId, qty: 1 }];
      return prev.filter(ci => ci.itemId !== itemId);
    });
  };

  const setConsumedItemQty = (itemId, qty) => {
    setConsumedItems(prev => prev.map(ci => ci.itemId === itemId ? { ...ci, qty: Number(qty) || 0 } : ci));
  };

  const saveService = async () => {
    if (!db) return;
    const n = name.trim();
    if (!n) return alert("Service name is required.");

    const p = Number(price);
    if (!isFinite(p) || p < 0) return alert("Price must be a valid number.");

    const payload = {
      farrierId: userId,
      name: n,
      price: p,
      category: category.trim(),
      isActive: Boolean(isActive),
      consumedItems: consumedItems.filter(ci => ci.itemId && ci.qty > 0),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    };

    if (editingId) {
      await db.collection("services").doc(editingId).update(payload);
    } else {
      await db.collection("services").add({
        ...payload,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
    }

    resetForm();
    await loadServices();
  };

  const toggleActive = async (svc) => {

      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),

    await loadServices();
  };

  const [deletingId, setDeletingId] = useState(null);

  // Only deletable if it's never appeared on an invoice or appointment — invoices are
  // matched by serviceId (falling back to name, for older invoices saved before that
  // linkage existed), appointments only ever stored the service name (see the
  // horse/service picker rows' `services.includes(s.name)`), never an id.
  const deleteService = async (svc) => {

    try {
      const [invSnap, apptSnap] = await Promise.all([
        db.collection("invoices").where("farrierId", "==", userId).get(),
        db.collection("appointments").where("farrierId", "==", userId).get(),
      ]);
      const usedOnInvoice = invSnap.docs.some(d =>
        (d.data().items || []).some(i => i.serviceId ? i.serviceId === svc.id : i.description === svc.name)
      );
      const usedOnAppt = apptSnap.docs.some(d => (d.data().services || []).includes(svc.name));
      if (usedOnInvoice || usedOnAppt) {
        alert(`"${svc.name}" has been used on ${usedOnInvoice ? "an invoice" : "an appointment"} and can't be deleted. Use Disable instead to hide it from new invoices.`);
        return;
      }
      await db.collection("services").doc(svc.id).delete();
      await loadServices();

      setDeletingId(null);

  };

  return (

        </div>

        <div>
          <label style={{ fontWeight: 600 }}>Category (optional)</label>
