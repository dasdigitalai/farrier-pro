            <button type="button" className="btn btn-sm btn-outline" onClick={() => setFormContacts(prev => [...prev, { name: '', role: '', phone: '', email: '' }])}>+ Add contact</button>
          </div>
          {/* Source — hide the qr_booking option for manual entry; show as read-only if editing a qr_booking customer */}
          <div className="form-group">
            <label>How did you get this customer?</label>
            {editingCustomer?.source === 'qr_booking' ? (
              <div style={{ padding: '0.75rem', borderRadius: 8, border: '2px solid var(--border)', background: 'rgba(38,131,251,0.06)', color: 'var(--text-muted)', fontSize: '0.95rem' }}>
                📲 QR Booking (set by customer)
              </div>
            ) : (
              <select value={formSource} onChange={e => setFormSource(e.target.value)}
                style={{ width: '100%', padding: '0.75rem', borderRadius: 8, border: '1px solid #cbd5e1', fontFamily: 'Outfit,sans-serif', fontSize: '1rem', background: '#fff', color: 'var(--text)', colorScheme: 'light' }}>
                <option value="referral">🤝 Referral</option>
                <option value="existing">⭐ Existing</option>
                <option value="marketing">📣 Marketing</option>
              </select>
            )}
          </div>
          <div style={{ display: 'flex', gap: '0.75rem', marginTop: '0.5rem' }}>
            <button className="btn btn-primary" onClick={saveCustomer} disabled={saving} style={{ flex: 1 }}>
              {saving ? '⏳ Saving…' : (editingCustomer ? '💾 Save Changes' : '✅ Add Customer')}
            </button>
            <button className="btn btn-outline" onClick={() => setShowAddEdit(false)} style={{ flex: 0 }}>Cancel</button>
          </div>
        </div>
      );

      // ── CUSTOMER DETAIL PANEL ──
      if (selectedCustomer) return (
        <div>
          <button className="btn btn-sm btn-outline" onClick={() => setSelectedCustomer(null)} style={{ marginBottom: '1rem' }}>
            ← Back to Customers
          </button>

          {/* Header card */}
          <div className="card" style={{ marginBottom: '1rem' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', flexWrap: 'wrap', gap: '1rem' }}>
              <div>
                <h2 style={{ margin: '0 0 0.25rem', color: 'var(--primary)', fontSize: '1.6rem' }}>
                  👤 {selectedCustomer.name}
                </h2>
                {selectedCustomer.farmName && (
                  <div style={{ fontSize: '1rem', fontWeight: 600, color: 'var(--text)', marginBottom: '0.25rem' }}>
                    🏠 {selectedCustomer.farmName}
                  </div>
                )}
                {selectedCustomer.managerContact && (
                  <div style={{ fontSize: '0.9rem', color: 'var(--text-muted)', marginBottom: '0.25rem' }}>
                    👔 Manager/Contact: {selectedCustomer.managerContact}
                  </div>
                )}
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: '1rem', marginTop: '0.5rem', color: 'var(--text)', fontSize: '0.95rem' }}>
                  {selectedCustomer.phone && <span>📞 {fmtPhone(selectedCustomer.phone)}</span>}
                  {selectedCustomer.email && <span>✉️ {selectedCustomer.email}</span>}
                  {(selectedCustomer.address || selectedCustomer.city) && <span>📍 {[selectedCustomer.address, selectedCustomer.city, selectedCustomer.state, selectedCustomer.zip].filter(Boolean).join(', ')}</span>}
                </div>
                {selectedCustomer.notes && (
                  <div style={{ marginTop: '0.75rem', padding: '0.6rem 0.9rem', background: 'rgba(38,131,251,0.06)', borderRadius: 8, fontSize: '0.9rem', color: 'var(--text)', borderLeft: '3px solid var(--primary)' }}>
                    💬 {selectedCustomer.notes}
                  </div>
                )}
                {Array.isArray(selectedCustomer.contacts) && selectedCustomer.contacts.length > 0 && (
                  <div style={{ marginTop: '0.75rem' }}>
                    <div style={{ fontSize: '0.8rem', fontWeight: 700, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.04em', marginBottom: '0.35rem' }}>Other contacts</div>
                    {selectedCustomer.contacts.map((c, i) => (
                      <div key={i} style={{ display: 'flex', flexWrap: 'wrap', gap: '0.25rem 1rem', fontSize: '0.92rem', padding: '0.3rem 0' }}>
                        <strong>{c.name || 'Contact'}</strong>
                        {c.role && <span style={{ color: 'var(--text-muted)' }}>{c.role}</span>}
                        {c.phone && <a href={`tel:${String(c.phone).replace(/\D/g, '')}`} style={{ color: 'var(--primary)' }}>📞 {fmtPhone(c.phone)}</a>}
                        {c.email && <a href={`mailto:${c.email}`} style={{ color: 'var(--primary)' }}>✉️ {c.email}</a>}
                      </div>
                    ))}
                  </div>
                )}
                <div style={{ marginTop: '0.75rem', display: 'flex', gap: '0.5rem', flexWrap: 'wrap', alignItems: 'center' }}>
                  <span style={{
                    display: 'inline-flex', alignItems: 'center', gap: '0.4rem',
                    padding: '0.3rem 0.8rem', borderRadius: 20, fontSize: '0.8rem', fontWeight: 600,
                    background: selectedCustomer.smsOptOut ? '#fee2e2' : '#dcfce7',
                    color: selectedCustomer.smsOptOut ? '#dc2626' : '#16a34a',
                  }}>
                    {selectedCustomer.smsOptOut ? '🚫 SMS Opted Out' : '✅ SMS Opted In'}
                  </span>
                  {selectedCustomer.createdAt && (() => {
                    const d = selectedCustomer.createdAt.toDate ? selectedCustomer.createdAt.toDate() : new Date(selectedCustomer.createdAt);
                    const mm = String(d.getMonth() + 1).padStart(2, '0');
                    const dd = String(d.getDate()).padStart(2, '0');
                    const yyyy = d.getFullYear();
                    return (
                      <span style={{
                        display: 'inline-flex', alignItems: 'center', gap: '0.4rem',
                        padding: '0.3rem 0.8rem', borderRadius: 20, fontSize: '0.8rem', fontWeight: 600,
                        background: 'rgba(38,131,251,0.1)', color: 'var(--text-muted)',
                      }}>
                        📅 Customer Since {mm}/{dd}/{yyyy}
                      </span>
                    );
                  })()}
                  {selectedCustomer.source && (() => {
                    const sourceMap = {
                      qr_booking: { label: 'QR Booking', icon: '📲', bg: '#eff6ff', color: '#2563eb' },
                      referral:   { label: 'Referral',   icon: '🤝', bg: '#fdf4ff', color: '#9333ea' },
                      existing:   { label: 'Existing',   icon: '⭐', bg: '#fffbeb', color: '#d97706' },
                      marketing:  { label: 'Marketing',  icon: '📣', bg: '#fff1f2', color: '#e11d48' },
                      mobile_app: { label: 'Added on Mobile', icon: '📱', bg: '#ecfdf5', color: '#047857' },
                    };
                    // Anything else reads as words ("auto_from_confirm" → "Auto from confirm"), not code.
                    const pretty = String(selectedCustomer.source || '').replace(/_/g, ' ').replace(/^./, c => c.toUpperCase());
                    const s = sourceMap[selectedCustomer.source] || { label: pretty, icon: '📌', bg: '#f8fafc', color: '#475569' };
                    return (
                      <span style={{
                        display: 'inline-flex', alignItems: 'center', gap: '0.4rem',
                        padding: '0.3rem 0.8rem', borderRadius: 20, fontSize: '0.8rem', fontWeight: 600,
                        background: s.bg, color: s.color,
                      }}>
                        {s.icon} {s.label}
                      </span>
                    );
                  })()}
                </div>
              </div>
              <div style={{ display: 'flex', gap: '0.5rem', flexWrap: 'wrap' }}>
                <button className="btn btn-sm btn-primary" onClick={() => setShowNewAppt(true)}>📋 Add Appointment</button>
                <button className="btn btn-sm btn-outline" onClick={() => openEdit(selectedCustomer)}>✏️ Edit</button>
                {userProfile?.smsEnabled && (
                  <button className="btn btn-sm btn-outline" onClick={() => toggleSmsOptOut(selectedCustomer)}
                    style={{ borderColor: selectedCustomer.smsOptOut ? '#16a34a' : '#dc2626', color: selectedCustomer.smsOptOut ? '#16a34a' : '#dc2626' }}>
                    {selectedCustomer.smsOptOut ? '✅ Re-enable SMS' : '🚫 Opt Out SMS'}
                  </button>
                )}
                <button className="btn btn-sm btn-outline" onClick={() => setConfirmDelete(selectedCustomer)}
                  style={{ borderColor: '#ef4444', color: '#ef4444' }}>🗑️ Delete</button>
              </div>
            </div>
          </div>

          {/* Stats row */}
          {!detailLoading && customerDetail && (
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(150px, 1fr))', gap: '1rem', marginBottom: '1rem' }}>
              {[
                { label: 'Appointments', val: customerDetail.appointments.length, icon: '📋', color: '#3b82f6' },
                { label: 'Total Invoices', val: customerDetail.invoices.length, icon: '🧾', color: '#8b5cf6' },
                { label: 'Total Paid', val: fmtMoney(customerDetail.totalPaid), icon: '✅', color: '#10b981' },
                { label: 'Outstanding', val: fmtMoney(customerDetail.balance), icon: '⚠️', color: customerDetail.balance > 0 ? '#ef4444' : '#10b981' },
              ].map(s => (
                <div key={s.label} style={{ background: 'var(--surface)', borderRadius: 12, padding: '1rem 1.25rem', boxShadow: '0 1px 3px rgba(15,23,42,0.06), 0 4px 16px rgba(15,23,42,0.05)', border: `2px solid ${s.color}22` }}>
                  <div style={{ fontSize: '1.4rem' }}>{s.icon}</div>
                  <div style={{ fontSize: '1.4rem', fontWeight: 700, color: s.color }}>{s.val}</div>
                  <div style={{ fontSize: '0.8rem', color: '#64748b' }}>{s.label}</div>
                </div>
              ))}
            </div>
          )}
          {detailLoading && <div style={{ textAlign: 'center', padding: '2rem', color: 'var(--text-muted)' }}>⏳ Loading history…</div>}

          {/* Horses */}
          {!detailLoading && customerDetail && (
            <div className="card" style={{ marginBottom: '1rem' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem' }}>
                <h2 style={{ margin: 0, fontSize: '1.1rem', color: 'var(--primary)' }}>🐴 Horses</h2>
                <button className="btn btn-sm btn-outline" onClick={() => setHorseModal({ horse: null })}>➕ Add Horse</button>
              </div>
              {customerDetail.horses.length === 0 ? (
                <div style={{ textAlign: 'center', color: 'var(--text-muted)', padding: '1rem', fontSize: '0.9rem' }}>
                  No horses on file yet for this customer.
                </div>
              ) : (
                <div style={{ display: 'flex', flexDirection: 'column', gap: '0.5rem' }}>
                  {customerDetail.horses.map(h => (
                    <div key={h.id} onClick={() => setHorseModal({ horse: h })}
                      style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '0.6rem 0.9rem', background: 'rgba(38,131,251,0.08)', borderRadius: 8, cursor: 'pointer', flexWrap: 'wrap', gap: '0.5rem' }}>
                      <div>
                        <span style={{ fontWeight: 600, fontSize: '0.9rem' }}>{h.name || 'Unnamed'}</span>
                        {h.breed && <span style={{ color: 'var(--text-muted)', fontSize: '0.85rem' }}> — {h.breed}</span>}
                      </div>
                      <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', color: 'var(--text-muted)', fontSize: '0.8rem' }}>
                        {(h.photos || []).length > 0 && <span>📷 {h.photos.length}</span>}
                        <span>›</span>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* Appointment history */}
          {!detailLoading && customerDetail && customerDetail.appointments.length > 0 && (
            <div className="card" style={{ marginBottom: '1rem' }}>
              <h2 style={{ marginBottom: '1rem', fontSize: '1.1rem', color: 'var(--primary)' }}>📋 Appointment History</h2>
              <div style={{ display: 'flex', flexDirection: 'column', gap: '0.5rem' }}>
                {customerDetail.appointments.slice(0, 10).map(apt => (
                  <div key={apt.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '0.6rem 0.9rem', background: 'rgba(38,131,251,0.08)', borderRadius: 8, flexWrap: 'wrap', gap: '0.5rem' }}>
                    <div>
                      <span style={{ fontWeight: 600, fontSize: '0.9rem' }}>
                        {apt.requestedDate || apt.date || '—'} {apt.requestedTime ? `at ${apt.requestedTime}` : ''}
                      </span>
                      {apt.services && apt.services.length > 0 && (
                        <div style={{ fontSize: '0.8rem', color: 'var(--text)', opacity: 0.85, marginTop: '0.2rem' }}>
                          🔧 {Array.isArray(apt.services) ? apt.services.join(', ') : apt.services}
                        </div>
                      )}
                      {apt.address && <div style={{ fontSize: '0.78rem', color: 'var(--text-muted)' }}>📍 {apt.address}</div>}
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', flexWrap: 'wrap' }}>
                      <span style={{
                        padding: '0.2rem 0.7rem', borderRadius: 20, fontSize: '0.75rem', fontWeight: 700,
                        background: `${statusColor[apt.status] || '#94a3b8'}22`,
                        color: statusColor[apt.status] || '#94a3b8',
                        textTransform: 'capitalize',
                      }}>{apt.status || 'pending'}</span>
                      <button
                        className="btn btn-sm btn-outline"
                        style={{ fontSize: '0.75rem', padding: '0.2rem 0.65rem', color: '#8b5cf6', borderColor: '#8b5cf6' }}
                        onClick={() => setInvoiceApt(apt)}
                      >🧾 Invoice</button>
                    </div>
                  </div>
                ))}
                {customerDetail.appointments.length > 10 && (
                  <div style={{ textAlign: 'center', color: 'var(--text-muted)', fontSize: '0.85rem', paddingTop: '0.5rem' }}>
                    + {customerDetail.appointments.length - 10} more appointments
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Invoice history */}
          {!detailLoading && customerDetail && customerDetail.invoices.length > 0 && (
            <div className="card">
              <h2 style={{ marginBottom: '1rem', fontSize: '1.1rem', color: 'var(--primary)' }}>💰 Invoice History</h2>
              <div style={{ display: 'flex', flexDirection: 'column', gap: '0.5rem' }}>
                {customerDetail.invoices.slice(0, 10).map(inv => {
                  const statusColors = { paid: '#10b981', outstanding: '#ef4444', partial: '#f59e0b' };
                  return (
                    <div key={inv.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '0.6rem 0.9rem', background: 'rgba(38,131,251,0.08)', borderRadius: 8, flexWrap: 'wrap', gap: '0.5rem' }}>
                      <div>
                        <span style={{ fontWeight: 600, fontSize: '0.9rem' }}>Invoice #{inv.invoiceNumber || inv.id.slice(-6).toUpperCase()}</span>
                        <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>{fmtDate(inv.createdAt)}</div>
                      </div>
                      <div style={{ textAlign: 'right' }}>
                        <div style={{ fontWeight: 700, fontSize: '1rem' }}>{fmtMoney(inv.total)}</div>
                        <span style={{
                          padding: '0.15rem 0.6rem', borderRadius: 20, fontSize: '0.75rem', fontWeight: 700,
                          background: `${statusColors[inv.status] || '#94a3b8'}22`,
                          color: statusColors[inv.status] || '#94a3b8',
                          textTransform: 'capitalize',
                        }}>{inv.status || 'outstanding'}</span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {!detailLoading && customerDetail && customerDetail.appointments.length === 0 && customerDetail.invoices.length === 0 && (
            <div className="card" style={{ textAlign: 'center', color: 'var(--text-muted)', padding: '2rem' }}>
              No appointment or invoice history found for this customer yet.
            </div>
          )}

          {/* Delete confirm */}
          {confirmDelete && (
            <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000 }}>
              <div style={{ background: 'var(--surface)', color: 'var(--text)', borderRadius: 16, padding: '2rem', maxWidth: 400, width: '90%', textAlign: 'center', border: '1px solid #cbd5e1' }}>
                <div style={{ fontSize: '2rem', marginBottom: '0.5rem' }}>⚠️</div>
                <h3 style={{ marginBottom: '0.5rem' }}>Delete {confirmDelete.name}?</h3>
                <p style={{ color: 'var(--text-muted)', fontSize: '0.9rem', marginBottom: '1.5rem' }}>
                  This removes the customer record only. Appointments and invoices are not affected.
                </p>
                <div style={{ display: 'flex', gap: '0.75rem', justifyContent: 'center' }}>
                  <button className="btn btn-sm btn-outline" onClick={() => setConfirmDelete(null)}>Cancel</button>
                  <button className="btn btn-sm" style={{ background: '#ef4444', color: '#fff' }} onClick={() => deleteCustomer(confirmDelete)}>🗑️ Delete</button>
                </div>
              </div>
            </div>
          )}

          {/* New Appointment Modal */}
          {showNewAppt && (
            <CreateAppointmentModal
              customer={selectedCustomer}
              userId={userId}
              userProfile={userProfile}
              onClose={() => setShowNewAppt(false)}
              onSaved={() => {
                setShowNewAppt(false);
                openDetail(selectedCustomer); // refresh detail
              }}
            />
          )}

          {/* Create Invoice from Appointment */}
          {invoiceApt && (
            <InvoiceCreateModal
              userId={userId}
              userProfile={userProfile}
              onClose={() => setInvoiceApt(null)}
              onCreated={() => {
                setInvoiceApt(null);
                openDetail(selectedCustomer); // refresh to show new invoice
              }}
              prefillData={{
                customerId: selectedCustomer.id || '',
                customerName: invoiceApt.customerName || selectedCustomer.name || '',
                customerFarmName: invoiceApt.farmName || selectedCustomer.farmName || '',
                customerEmail: invoiceApt.email || selectedCustomer.email || '',
                customerPhone: invoiceApt.phone || selectedCustomer.phone || '',
              }}
            />
          )}

          {/* Add/Edit Horse */}
          {horseModal && (
            <HorseEditModal
              horse={horseModal.horse}
              customer={selectedCustomer}
              userId={userId}
              onClose={() => setHorseModal(null)}
              onSaved={() => refreshHorses()}
            />
          )}
        </div>
      );

      // ── CUSTOMER LIST ──
      return (
        <div className="card">
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1.25rem', flexWrap: 'wrap', gap: '0.75rem' }}>
            <h2 style={{ margin: 0, color: 'var(--primary)' }}>👥 Customers ({filtered.length})</h2>
            <button className="btn btn-primary btn-sm" onClick={openAdd}>➕ Add Customer</button>
          </div>

          {/* Filters */}
          <div style={{ display: 'flex', gap: '0.75rem', marginBottom: '1.25rem', flexWrap: 'wrap', alignItems: 'center' }}>
            <input
              type="text" placeholder="🔍 Search name, phone, email, address, horse…"
              value={search} onChange={e => setSearch(e.target.value)}
              style={{ flex: '1', minWidth: 200, padding: '0.6rem 0.9rem', borderRadius: 8, border: '2px solid var(--border)', fontFamily: 'Outfit,sans-serif', fontSize: '0.95rem' }}
            />
            {userProfile?.smsEnabled && (
              <div style={{ display: 'flex', gap: '0.4rem' }}>
                {[['all','All'],['opted_in','SMS On'],['opted_out','SMS Off']].map(([v, l]) => (
                  <button key={v} onClick={() => setSmsFilter(v)}
                    className={`btn btn-sm ${smsFilter === v ? 'btn-primary' : 'btn-outline'}`}
                    style={{ fontSize: '0.8rem' }}>{l}</button>
                ))}
              </div>
            )}
          </div>

          {loading && <div style={{ textAlign: 'center', padding: '3rem', color: 'var(--text-muted)' }}>⏳ Loading customers…</div>}

          {!loading && filtered.length === 0 && (
            <div style={{ textAlign: 'center', padding: '3rem', color: 'var(--text-muted)' }}>
              {customers.length === 0
                ? 'No customers yet. They\'ll appear here after booking or you can add them manually.'
                : 'No customers match your search.'}
            </div>
          )}

          {!loading && filtered.length > 0 && (
            <div style={{ display: 'flex', flexDirection: 'column', gap: '0.6rem' }}>
              {filtered.map(cust => (
                <div key={cust.id || cust.email} onClick={() => openDetail(cust)}
                  style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '0.85rem 1.1rem', background: 'var(--surface)', borderRadius: 12, border: '1px solid #cbd5e1', cursor: 'pointer', transition: 'all 0.15s', flexWrap: 'wrap', gap: '0.5rem' }}
                  onMouseEnter={e => e.currentTarget.style.borderColor = 'var(--primary)'}
                  onMouseLeave={e => e.currentTarget.style.borderColor = 'var(--border)'}
                >
                  <div style={{ display: 'flex', alignItems: 'center', gap: '0.85rem' }}>
                    <div style={{ width: 40, height: 40, borderRadius: '50%', background: 'var(--primary)', color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 700, fontSize: '1.1rem', flexShrink: 0 }}>
                      {(cust.name || '?').charAt(0).toUpperCase()}
                    </div>
                    <div>
                      <div style={{ fontWeight: 700, fontSize: '0.95rem', color: 'var(--text)' }}>{cust.name || 'Unknown'}{cust.farmName ? ` — ${cust.farmName}` : ''}</div>
                      <div style={{ fontSize: '0.82rem', color: 'var(--text-muted)', display: 'flex', gap: '0.75rem', flexWrap: 'wrap' }}>
                        {cust.managerContact && <span>👔 {cust.managerContact}</span>}
                        {cust.phone && <span>📞 {fmtPhone(cust.phone)}</span>}
                        {cust.email && <span>✉️ {cust.email}</span>}
                        {custAddress(cust) && <span>📍 {custAddress(cust)}</span>}
                        {Array.isArray(cust.contacts) && cust.contacts.length > 0 && <span>👥 +{cust.contacts.length} contact{cust.contacts.length === 1 ? '' : 's'}</span>}
                        {matchingHorses(cust).length > 0 && <span style={{ color: 'var(--primary)', fontWeight: 600 }}>🐴 {matchingHorses(cust).join(', ')}</span>}
                      </div>
                    </div>
                  </div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                    {userProfile?.smsEnabled && (
                      <span style={{
                        padding: '0.2rem 0.6rem', borderRadius: 20, fontSize: '0.75rem', fontWeight: 600,
                        background: cust.smsOptOut ? '#fee2e2' : '#dcfce7',
                        color: cust.smsOptOut ? '#dc2626' : '#16a34a',
                      }}>
                        {cust.smsOptOut ? '🚫 SMS Off' : '✅ SMS On'}
                      </span>
                    )}
                    <div style={{ display: 'flex', gap: '0.4rem' }} onClick={e => e.stopPropagation()}>
                      <button className="btn btn-sm btn-outline" style={{ padding: '0.3rem 0.7rem', fontSize: '0.8rem' }}
                        onClick={() => openEdit(cust)}>✏️</button>
                      <button className="btn btn-sm btn-outline" style={{ padding: '0.3rem 0.7rem', fontSize: '0.8rem', borderColor: '#ef4444', color: '#ef4444' }}
                        onClick={() => setConfirmDelete(cust)}>🗑️</button>
                    </div>
                    <span style={{ color: 'var(--text-muted)', fontSize: '1.2rem' }}>›</span>
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* Delete confirm modal */}
          {confirmDelete && (
            <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000 }}>
              <div style={{ background: 'var(--surface)', color: 'var(--text)', borderRadius: 16, padding: '2rem', maxWidth: 400, width: '90%', textAlign: 'center', border: '1px solid #cbd5e1' }}>
                <div style={{ fontSize: '2rem', marginBottom: '0.5rem' }}>⚠️</div>
                <h3 style={{ marginBottom: '0.5rem' }}>Delete {confirmDelete.name}?</h3>
                <p style={{ color: 'var(--text-muted)', fontSize: '0.9rem', marginBottom: '1.5rem' }}>
                  This removes the customer record only. Appointments and invoices are not affected.
                </p>
                <div style={{ display: 'flex', gap: '0.75rem', justifyContent: 'center' }}>
                  <button className="btn btn-sm btn-outline" onClick={() => setConfirmDelete(null)}>Cancel</button>
                  <button className="btn btn-sm" style={{ background: '#ef4444', color: '#fff' }} onClick={() => deleteCustomer(confirmDelete)}>🗑️ Delete</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ─────────────────────────────────────────
    // HORSES VIEW — find a horse by its name or its owner's name (an owner match
    // lists all of that customer's horses), then see its whole history: last and
    // next service, every appointment and every invoice line for that horse
    // (lib/horse-history.js decides what belongs to it).
    // With `upcoming` (the Upcoming Service tab) the list is instead every horse due for
    // service within N weeks, grouped by farm, plus each farm's other horses — the same
    // report as mobile.html's renderUpcoming().
    // ─────────────────────────────────────────
    function HorsesView({ userId, upcoming }) {
      const [weeks, setWeeks] = useState(4);
      const [horses, setHorses] = useState([]);
      const [customersById, setCustomersById] = useState({});
      const [appointments, setAppointments] = useState([]);
      const [invoices, setInvoices] = useState([]);
      const [loading, setLoading] = useState(true);
      const [search, setSearch] = useState('');
      const [selected, setSelected] = useState(null);
      const [editHorse, setEditHorse] = useState(null);

      const load = async () => {
        if (!db || !userId) return;
        setLoading(true);
        try {
          // Appointments and invoices don't index horse ids, so pull the farrier's docs
          // and match client-side (same as mobile.html's deleteHorse()).
          const [hSnap, cSnap, aSnap, iSnap] = await Promise.all([
            db.collection('horses').where('farrierId', '==', userId).get(),
            db.collection('customers').where('farrierId', '==', userId).get(),
            db.collection('appointments').where('farrierId', '==', userId).get(),
            db.collection('invoices').where('farrierId', '==', userId).get(),
          ]);
          const custs = {};
          cSnap.docs.forEach(d => { custs[d.id] = { id: d.id, ...d.data() }; });
          const list = hSnap.docs.map(d => ({ id: d.id, ...d.data() }));
          setCustomersById(custs);
          setHorses(list);
          setAppointments(aSnap.docs.map(d => ({ id: d.id, ...d.data() })));
          setInvoices(iSnap.docs.map(d => ({ id: d.id, ...d.data() })));
          setSelected(prev => prev ? (list.find(h => h.id === prev.id) || null) : prev);
        } catch (e) {
          console.error('Error loading horses:', e);
        }
        setLoading(false);
      };

      useEffect(() => { load(); }, [userId]);

      const ownerName = (h) => customersById[h.customerId]?.name || h.customerName || 'No owner';

      const fmtDay = (d) => d ? d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
      const fmtMoney = (n) => `$${(Number(n) || 0).toFixed(2)}`;
      const statusColor = { pending: '#f59e0b', confirmed: '#10b981', cancelled: '#ef4444', invoiced: '#6366f1', completed: '#10b981' };
      const invStatusColor = { paid: '#10b981', outstanding: '#ef4444', partial: '#f59e0b' };
      const pill = (text, color) => (
        <span style={{ padding: '0.15rem 0.6rem', borderRadius: 20, fontSize: '0.75rem', fontWeight: 700, background: `${color}22`, color, textTransform: 'capitalize' }}>{text}</span>
      );
      const rowStyle = { display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '0.6rem 0.9rem', background: 'rgba(38,131,251,0.08)', borderRadius: 8, flexWrap: 'wrap', gap: '0.5rem' };

      // ── HORSE DETAIL ──
      if (selected) {
        const hist = window.FarriHorseHistory.build(selected, appointments, invoices);
        const owner = customersById[selected.customerId];
        const next = hist.nextService;
        const profile = [
          ['Breed', selected.breed], ['Color', selected.color], ['Sex', selected.sex], ['Date of Birth', selected.dob],
          ['Shoeing Cycle', selected.shoeingCycleWeeks ? `${selected.shoeingCycleWeeks} weeks` : ''],
          ['Shoe Size', selected.shoeSize], ['Shoe Type', selected.shoeType],
          ['Gait Notes', selected.gaitNotes], ['Hoof Notes', selected.hoofNotes], ['Known Issues', selected.knownIssues],
        ].filter(([, v]) => v);

        return (
          <div>
            <button className="btn btn-sm btn-outline" onClick={() => setSelected(null)} style={{ marginBottom: '1rem' }}>← Back to {upcoming ? 'Upcoming Service' : 'Horses'}</button>

            <div className="card" style={{ marginBottom: '1rem' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', flexWrap: 'wrap', gap: '1rem' }}>
                <div>
                  <h2 style={{ margin: '0 0 0.25rem', color: 'var(--primary)', fontSize: '1.6rem' }}>🐴 {selected.name || 'Unnamed'}</h2>
                  <div style={{ fontSize: '0.95rem', color: 'var(--text)' }}>
                    👤 {ownerName(selected)}
                    {owner?.farmName && <span style={{ color: 'var(--text-muted)' }}> · 🏠 {owner.farmName}</span>}
                    {owner?.phone && <span style={{ color: 'var(--text-muted)' }}> · 📞 {fmtPhone(owner.phone)}</span>}
                  </div>
                </div>
                <button className="btn btn-sm btn-outline" onClick={() => setEditHorse(selected)}>✏️ Edit Horse</button>
              </div>
              {profile.length > 0 && (
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(180px, 1fr))', gap: '0.5rem 1rem', marginTop: '1rem' }}>
                  {profile.map(([label, v]) => (
                    <div key={label}>
                      <div style={{ fontSize: '0.75rem', fontWeight: 700, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.04em' }}>{label}</div>
                      <div style={{ fontSize: '0.92rem', color: 'var(--text)', whiteSpace: 'pre-wrap' }}>{v}</div>
                    </div>
                  ))}
                </div>
              )}
              {(selected.photos || []).length > 0 && (
                <div style={{ display: 'flex', gap: '0.5rem', flexWrap: 'wrap', marginTop: '1rem' }}>
                  {selected.photos.map((p, i) => (
                    <a key={p.storagePath || i} href={p.url} target="_blank" rel="noopener noreferrer">
                      <img src={p.url} alt="" style={{ width: 80, height: 80, objectFit: 'cover', borderRadius: 8, display: 'block' }} />
                    </a>
                  ))}
                </div>
              )}
            </div>

            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '1rem', marginBottom: '1rem' }}>
              {[
                { icon: '🔧', label: 'Last Service', val: hist.lastService ? fmtDay(hist.lastService.date) : 'None yet', sub: hist.lastService?.label, color: '#10b981' },
                { icon: '📅', label: next?.estimated ? (next.overdue ? 'Next Service (overdue)' : 'Next Service (estimated)') : 'Next Service',
                  val: next ? fmtDay(next.date) : 'Not scheduled',
                  sub: next ? next.label : (selected.shoeingCycleWeeks ? '' : 'Set a shoeing cycle to estimate'),
                  color: next?.overdue ? '#ef4444' : '#2683FB' },
                { icon: '📋', label: 'Appointments', val: hist.appointments.length, color: '#8b5cf6' },
                { icon: '💰', label: 'Billed for this horse', val: fmtMoney(hist.totalBilled), sub: `${hist.invoices.length} invoice${hist.invoices.length === 1 ? '' : 's'}`, color: '#f59e0b' },
              ].map(s => (
                <div key={s.label} style={{ background: 'var(--surface)', borderRadius: 12, padding: '1rem 1.25rem', boxShadow: '0 1px 3px rgba(15,23,42,0.06), 0 4px 16px rgba(15,23,42,0.05)', border: `2px solid ${s.color}22` }}>
                  <div style={{ fontSize: '1.4rem' }}>{s.icon}</div>
                  <div style={{ fontSize: '1.3rem', fontWeight: 700, color: s.color }}>{s.val}</div>
                  <div style={{ fontSize: '0.8rem', color: '#64748b' }}>{s.label}</div>
                  {s.sub && <div style={{ fontSize: '0.78rem', color: 'var(--text-muted)', marginTop: '0.2rem' }}>{s.sub}</div>}
                </div>
              ))}
            </div>

            <div className="card" style={{ marginBottom: '1rem' }}>
              <h2 style={{ marginBottom: '1rem', fontSize: '1.1rem', color: 'var(--primary)' }}>📋 Appointments</h2>
              {hist.appointments.length === 0 ? (
                <div style={{ textAlign: 'center', color: 'var(--text-muted)', padding: '1rem', fontSize: '0.9rem' }}>No appointments for this horse yet.</div>
              ) : (
                <div style={{ display: 'flex', flexDirection: 'column', gap: '0.5rem' }}>
                  {hist.appointments.map(apt => (
                    <div key={apt.id} style={rowStyle}>
                      <div>
                        <span style={{ fontWeight: 600, fontSize: '0.9rem' }}>{fmtDay(apt.date)} {apt.requestedTime ? `at ${apt.requestedTime}` : ''}</span>
                        {hist.upcoming.includes(apt) && <span style={{ marginLeft: '0.5rem', fontSize: '0.75rem', color: '#2683FB', fontWeight: 700 }}>UPCOMING</span>}
                        {apt.horseServices.length > 0 && (
                          <div style={{ fontSize: '0.8rem', color: 'var(--text)', opacity: 0.85, marginTop: '0.2rem' }}>🔧 {apt.horseServices.join(', ')}</div>
                        )}
                        {apt.comments && <div style={{ fontSize: '0.78rem', color: 'var(--text-muted)' }}>💬 {apt.comments}</div>}
                      </div>
                      {pill(apt.status || 'pending', statusColor[apt.status] || '#94a3b8')}
                    </div>
                  ))}
                </div>
              )}
            </div>

            <div className="card">
              <h2 style={{ marginBottom: '1rem', fontSize: '1.1rem', color: 'var(--primary)' }}>💰 Invoices</h2>
              {hist.invoices.length === 0 ? (
                <div style={{ textAlign: 'center', color: 'var(--text-muted)', padding: '1rem', fontSize: '0.9rem' }}>No invoices for this horse yet.</div>
              ) : (
                <div style={{ display: 'flex', flexDirection: 'column', gap: '0.5rem' }}>
                  {hist.invoices.map(inv => (
                    <div key={inv.id} style={rowStyle}>
                      <div>
                        <span style={{ fontWeight: 600, fontSize: '0.9rem' }}>Invoice #{inv.invoiceNumber || inv.id.slice(-6).toUpperCase()}</span>
                        <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>{fmtDay(inv.date)}</div>
                        {inv.horseLines.map((l, i) => (
                          <div key={i} style={{ fontSize: '0.8rem', color: 'var(--text)', opacity: 0.85 }}>
                            🔧 {l.description || 'Service'}{Number(l.qty) > 1 ? ` × ${l.qty}` : ''} — {fmtMoney(Number(l.amount) || 0)}
                          </div>
                        ))}
                      </div>
                      <div style={{ textAlign: 'right' }}>
                        <div style={{ fontWeight: 700, fontSize: '1rem' }}>{fmtMoney(inv.horseTotal)}</div>
                        {inv.horseTotal !== Number(inv.total) && <div style={{ fontSize: '0.72rem', color: 'var(--text-muted)' }}>of {fmtMoney(inv.total)} invoice</div>}
                        {pill(inv.status || 'outstanding', invStatusColor[inv.status] || '#94a3b8')}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>

            {editHorse && (
              <HorseEditModal
                horse={editHorse}
                customer={{ id: editHorse.customerId || '', name: ownerName(editHorse) }}
                userId={userId}
                onClose={() => setEditHorse(null)}
                onSaved={() => load()}
              />
            )}
          </div>
        );
      }

      // ── UPCOMING SERVICE ── a farm appears when at least one of its horses is due within
      // `weeks`; due horses first, then the owner's other horses. Farms by earliest due date.
      if (upcoming) {
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const end = new Date(today.getTime() + weeks * 7 * 86400e3);
        const all = horses.map(h => ({ h, hist: window.FarriHorseHistory.build(h, appointments, invoices) }));
        const isDue = x => x.hist.nextService && x.hist.nextService.date < end;
        const byFarm = {};
        all.forEach(x => {
          const key = x.h.customerId || ownerName(x.h);
          (byFarm[key] = byFarm[key] || { owner: customersById[x.h.customerId], name: ownerName(x.h), due: [], other: [] })[isDue(x) ? 'due' : 'other'].push(x);
        });
        const byNext = (a, b) => (a.hist.nextService?.date || Infinity) - (b.hist.nextService?.date || Infinity);
        const farms = Object.values(byFarm).filter(g => g.due.length);
        farms.forEach(g => { g.due.sort(byNext); g.other.sort(byNext); });
        farms.sort((a, b) => a.due[0].hist.nextService.date - b.due[0].hist.nextService.date);
        const dueCount = farms.reduce((n, g) => n + g.due.length, 0);
        const overdue = farms.reduce((n, g) => n + g.due.filter(x => x.hist.nextService.overdue).length, 0);
        const noDate = all.filter(x => !x.hist.nextService).length;
        const horseRow = ({ h, hist }, muted) => {
          const next = hist.nextService;
          const tag = !next ? pill('no due date', '#94a3b8')
            : !next.estimated ? pill('booked', '#10b981')
            : next.overdue ? pill('overdue', '#ef4444')
            : muted ? pill('next', '#94a3b8') : pill('due', '#f59e0b');
          return (
            <div key={h.id} onClick={() => setSelected(h)} style={{ ...rowStyle, cursor: 'pointer', ...(muted ? { background: 'transparent', border: '1px solid var(--border)', opacity: 0.75 } : {}) }}>
              <div>
                <span style={{ fontWeight: 600, fontSize: '0.95rem' }}>🐴 {h.name || 'Unnamed'}</span>
                {h.breed && <span style={{ color: 'var(--text-muted)', fontSize: '0.85rem' }}> — {h.breed}</span>}
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: '1rem', color: 'var(--text-muted)', fontSize: '0.8rem', flexWrap: 'wrap' }}>
                {next && <span style={{ fontWeight: 600, color: next.overdue ? '#ef4444' : undefined }}>{fmtDay(next.date)}</span>}
                {tag}
                <span>Last: {hist.lastService ? fmtDay(hist.lastService.date) : '—'}</span>
                <span>›</span>
              </div>
            </div>
          );
        };
        return (
          <div className="card">
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem', flexWrap: 'wrap', gap: '0.75rem' }}>
              <h2 style={{ margin: 0, color: 'var(--primary)' }}>🔔 Upcoming Service</h2>
              <div style={{ display: 'flex', alignItems: 'center', gap: '0.4rem', flexWrap: 'wrap' }}>
                <span style={{ fontSize: '0.85rem', color: 'var(--text-muted)', fontWeight: 600 }}>Due in the next</span>
                {[1, 2, 4, 6, 8].map(w => (
                  <button key={w} className={`btn btn-sm ${weeks === w ? 'btn-primary' : 'btn-outline'}`} onClick={() => setWeeks(w)}>{w} wk{w === 1 ? '' : 's'}</button>
                ))}
              </div>
            </div>
            {loading ? (
              <div style={{ textAlign: 'center', padding: '2rem', color: 'var(--text-muted)' }}>⏳ Loading horses…</div>
            ) : (
              <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
                {farms.length === 0 ? (
                  <div style={{ textAlign: 'center', padding: '2rem', color: 'var(--text-muted)' }}>No horses due in the next {weeks} week{weeks === 1 ? '' : 's'}.</div>
                ) : (
                  <>
                    <div style={{ display: 'flex', gap: '0.75rem', alignItems: 'center', fontWeight: 700 }}>
                      {dueCount} horse{dueCount === 1 ? '' : 's'} due at {farms.length} farm{farms.length === 1 ? '' : 's'}
                      {overdue > 0 && pill(`${overdue} overdue`, '#ef4444')}
                    </div>
                    {farms.map(g => (
                      <div key={g.due[0].h.id} style={{ border: '1px solid var(--border)', borderRadius: 10, padding: '0.9rem' }}>
                        <div style={{ fontWeight: 800, color: 'var(--primary)', fontSize: '1.05rem' }}>{g.owner?.farmName || g.name}</div>
                        {g.owner?.farmName && <div style={{ fontSize: '0.85rem', color: 'var(--text-muted)' }}>👤 {g.name}</div>}
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '0.4rem', marginTop: '0.6rem' }}>
                          {g.due.map(x => horseRow(x, false))}
                        </div>
                        {g.other.length > 0 && (
                          <>
                            <div style={{ fontSize: '0.75rem', fontWeight: 700, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.04em', margin: '0.8rem 0 0.4rem' }}>Also at this farm · not due yet</div>
                            <div style={{ display: 'flex', flexDirection: 'column', gap: '0.4rem' }}>
                              {g.other.map(x => horseRow(x, true))}
                            </div>
                          </>
                        )}
                      </div>
                    ))}
                  </>
                )}
                {noDate > 0 && (
                  <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>
                    {noDate} horse{noDate === 1 ? ' has' : 's have'} no appointment or shoeing cycle, so no due date. Set a shoeing cycle on the horse to include it.
                  </div>
                )}
              </div>
            )}
          </div>
        );
      }

      // ── HORSE LIST ── search matches the horse's name or its owner's name / farm, so
      // typing a customer's name lists all of that customer's horses.
      const q = search.trim().toLowerCase();
      const filtered = horses.filter(h => {
        if (!q) return true;
        const owner = customersById[h.customerId];
        return [h.name, ownerName(h), owner?.farmName, h.breed].some(v => String(v || '').toLowerCase().includes(q));
      });
      const groups = {};
      filtered.forEach(h => { (groups[ownerName(h)] = groups[ownerName(h)] || []).push(h); });
      const owners = Object.keys(groups).sort((a, b) => a.localeCompare(b));
      owners.forEach(o => groups[o].sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''))));

      return (
        <div className="card">
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1.25rem', flexWrap: 'wrap', gap: '0.75rem' }}>
            <h2 style={{ margin: 0, color: 'var(--primary)' }}>🐴 Horses ({filtered.length})</h2>
          </div>
          <input
            type="text" placeholder="🔍 Search by horse name or customer name…" autoFocus
            value={search} onChange={e => setSearch(e.target.value)}
            style={{ width: '100%', padding: '0.75rem', borderRadius: 8, border: '2px solid var(--border)', fontFamily: 'Outfit,sans-serif', fontSize: '1rem', boxSizing: 'border-box', marginBottom: '1.25rem' }}
          />
          {loading ? (
            <div style={{ textAlign: 'center', padding: '2rem', color: 'var(--text-muted)' }}>⏳ Loading horses…</div>
          ) : owners.length === 0 ? (
            <div style={{ textAlign: 'center', padding: '2rem', color: 'var(--text-muted)' }}>
              {horses.length === 0 ? 'No horses on file yet. Add horses from a customer\'s record.' : 'No horses or customers match your search.'}
            </div>
          ) : (
            <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
              {owners.map(o => (
                <div key={o}>
                  <div style={{ fontSize: '0.8rem', fontWeight: 700, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.04em', marginBottom: '0.4rem' }}>
                    👤 {o} · {groups[o].length} horse{groups[o].length === 1 ? '' : 's'}
                  </div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '0.4rem' }}>
                    {groups[o].map(h => {
                      const hist = window.FarriHorseHistory.build(h, appointments, invoices);
                      return (
                        <div key={h.id} onClick={() => setSelected(h)} style={{ ...rowStyle, cursor: 'pointer' }}>
                          <div>
                            <span style={{ fontWeight: 600, fontSize: '0.95rem' }}>{h.name || 'Unnamed'}</span>
                            {h.breed && <span style={{ color: 'var(--text-muted)', fontSize: '0.85rem' }}> — {h.breed}</span>}
                          </div>
                          <div style={{ display: 'flex', alignItems: 'center', gap: '1rem', color: 'var(--text-muted)', fontSize: '0.8rem', flexWrap: 'wrap' }}>
                            <span>Last: {hist.lastService ? fmtDay(hist.lastService.date) : '—'}</span>
                            <span style={{ color: hist.nextService?.overdue ? '#ef4444' : undefined }}>
                              Next: {hist.nextService ? fmtDay(hist.nextService.date) + (hist.nextService.estimated ? '*' : '') : '—'}
                            </span>
                            <span>›</span>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              ))}
              <div style={{ fontSize: '0.75rem', color: 'var(--text-muted)' }}>* estimated from the last service and the horse's shoeing cycle</div>
            </div>
          )}
        </div>
      );
    }

    // ROUTE SHEET VIEW
