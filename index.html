    /* Input fields on dark bg */
    input[type="date"], input[type="time"], input[type="number"], input[type="text"], textarea, select {

    /* Placeholder text readable on the dark inputs (the browser default nearly vanishes),

      background: transparent;

      font-family: 'Outfit', sans-serif;

      transition: all 0.2s;

      border-bottom-color: var(--primary-light);

      border-bottom-color: var(--primary);
      text-shadow: 0 0 12px rgba(38, 131, 251, 0.4);

    .time-slots {

      gap: 0.75rem;
      margin-top: 1rem;

      transition: all 0.2s;

    }

    .time-slot.selected {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .time-slot.booked {
      opacity: 0.4;
      cursor: not-allowed;
      background: var(--border);

    .calendar-status {

      padding: 1rem;

    .status-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .status-indicator.connected {
      background: var(--success);
    }

    .status-indicator.disconnected {

/* ── Desktop light theme ──

body:has(.ft-desktop) { background: #f1f5f9; }
.ft-desktop {
  --bg: #f1f5f9;
  --surface: #ffffff;
  --text: #1e293b;
  --text-muted: #64748b;
  --border: #cbd5e1;
  --secondary: #e2e8f0;

  background: var(--bg);
  color: var(--text);

.ft-desktop .card,
.ft-desktop .stat-card,
.ft-desktop .calendar,

.ft-desktop .tab.active { text-shadow: none; }

/* Inputs: white with a gray border instead of dark fills */
.ft-desktop input[type="date"], .ft-desktop input[type="time"], .ft-desktop input[type="number"],
.ft-desktop input[type="text"], .ft-desktop input[type="email"], .ft-desktop input[type="tel"],
.ft-desktop input[type="search"], .ft-desktop input[type="password"], .ft-desktop input:not([type]),
.ft-desktop textarea, .ft-desktop select,
.ft-desktop .form-group input, .ft-desktop .form-group textarea, .ft-desktop .form-group select {

  color: #1e293b;

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;


      const BUILD_VERSION = "Ver 3.1";
("FarriTech build:", BUILD_VERSION);

/**********************
       * INVOICE PDF / PRINT HELPERS
       * - Generates a professional PDF (jsPDF) with optional logo + payment QR
       * - Also supports opening print dialog
       **********************/

      const money_ = (n) => {
        const x = Number(n || 0);
        try { return x.toLocaleString(undefined, { style: "currency", currency: "USD" }); }
        catch { return `$${x.toFixed(2)}`; }
      };

      const formatDate_ = (tsOrDate) => {
        try {
          const d = tsOrDate?.toDate ? tsOrDate.toDate() : (tsOrDate instanceof Date ? tsOrDate : new Date(tsOrDate));
          return isNaN(d.getTime()) ? "" : d.toLocaleDateString();
        } catch { return ""; }
      };

      const safeText_ = (s) => String(s ?? "").replace(/\s+/g, " ").trim();

      // Wrap long text to fit PDF width
      const pdfWrapText_ = (doc, text, x, y, maxWidth, lineHeight) => {
        const lines = doc.splitTextToSize(String(text || ""), maxWidth);
        lines.forEach((ln, i) => doc.text(ln, x, y + (i * lineHeight)));
        return y + (lines.length * lineHeight);
      };

      const buildInvoicePayUrl_ = (invoice) => {
        // Prefer paymentUrl if it exists
        if (invoice?.paymentUrl) return String(invoice.paymentUrl);
        return "";
      };

      const qrToDataUrl_ = async (text) => {
        try {
          if (!text) return "";
          if (window.QRCode && typeof window.QRCode.toDataURL === "function") {
            return await window.QRCode.toDataURL(text, { margin: 1, width: 220 });
          }
        } catch (e) {}
        return "";
      };

      // horseId → name for invoice lines saved with only a horseId (no horseName).
      const resolveHorseNames_ = async (items) => {
        const names = {};
        const missing = [...new Set((items || []).filter(it => it.horseId && !safeText_(it.horseName)).map(it => it.horseId))];
        await Promise.all(missing.map(async (id) => {
          try {
            const snap = await db.collection('horses').doc(id).get();
            if (snap.exists) names[id] = safeText_(snap.data()?.name);
          } catch (e) { /* no access or offline: leave it blank */ }
        }));
        return names;
      };

      // The horse cell for an invoice line: name, or "Multiple horses — note" (qty has its own column).
      const lineHorseLabel_ = (it, names) =>
        safeText_(FarriPricing.itemHorseLabel({ ...it, horseName: safeText_(it.horseName) || names[it.horseId] || '', qty: 1 }));

      async function generateInvoicePdfBlobUrl(invoice, farrierProfile) {
        if (!window.jspdf?.jsPDF) throw new Error("jsPDF not loaded");
        const { jsPDF } = window.jspdf;

        const profile = farrierProfile || {};
        const businessName = safeText_(profile.businessName) || "FarriTech";
        const bizPhone = fmtPhone(safeText_(profile.phone));
        const bizEmail = safeText_(profile.email || ""); // optional
        const bizAddr = [safeText_(profile.address), safeText_(profile.city), safeText_(profile.state), safeText_(profile.zip)]
          .filter(Boolean)
          .join(", ");

        const doc = new jsPDF({ unit: "pt", format: "letter" });
        const pageW = doc.internal.pageSize.getWidth();
        const pageH = doc.internal.pageSize.getHeight();

        // Outer border
        const borderMargin = 28; // points
        doc.setDrawColor(0);
        doc.setLineWidth(1);
        doc.rect(borderMargin, borderMargin, pageW - (borderMargin * 2), pageH - (borderMargin * 2));

        // Style
        doc.setFont("helvetica", "normal");

        // Optional logo
        const logoUrl = safeText_(profile.logoUrl);
        let cursorY = 54;

        if (logoUrl) {
          try {
            // Fetch logo as dataURL (works for public URLs with CORS)
            const resp = await fetch(logoUrl, { mode: "cors" });
            const blob = await resp.blob();
            const dataUrl = await new Promise((resolve) => {
              const r = new FileReader();
              r.onload = () => resolve(r.result);
              r.readAsDataURL(blob);
            });

            // Draw logo (fit into 120x50)
            doc.addImage(dataUrl, "PNG", 48, 40, 120, 50);
          } catch (e) {
            // If logo fails, fall back to text
          }
        }

        // Header right: INVOICE
        doc.setFont("helvetica", "bold");
        doc.setFontSize(22);
        doc.text("INVOICE", pageW - 48, 56, { align: "right" });

        doc.setFontSize(10);
        doc.setFont("helvetica", "normal");

        // Business block (left)
        doc.setFont("helvetica", "bold");
        doc.setFontSize(14);
        doc.text(businessName, 48, 108);
        doc.setFont("helvetica", "normal");
        doc.setFontSize(10);

        let bizLine = 126;
        if (bizAddr) { doc.text(bizAddr, 48, bizLine); bizLine += 14; }
        if (bizPhone) { doc.text(`Phone: ${bizPhone}`, 48, bizLine); bizLine += 14; }
        if (bizEmail) { doc.text(`Email: ${bizEmail}`, 48, bizLine); bizLine += 14; }

        // Invoice meta (right)
        const invNo = safeText_(invoice.invoiceNumber || "");
        const invDate = formatDate_(invoice.createdAt) || formatDate_(new Date());
        // Calculate real status from payments
        const _paidSoFar = invoice.paidAmount || (invoice.payments||[]).reduce((s,p)=>s+(p.amount||0),0);
        const _balDue = invoice.status === 'paid' ? 0 : FarriPricing.balanceCents({ ...invoice, status: 'outstanding' }) / 100;
        const invStatus = _balDue <= 0 && _paidSoFar > 0 ? 'paid' : (_paidSoFar > 0 ? 'partial' : safeText_(invoice.status || 'outstanding'));

        doc.setFont("helvetica", "bold");
        doc.text("Invoice #", pageW - 220, 108);
        doc.text("Date", pageW - 220, 126);
        doc.text("Status", pageW - 220, 144);
        doc.setFont("helvetica", "normal");
        doc.text(invNo, pageW - 48, 108, { align: "right" });
        doc.text(invDate, pageW - 48, 126, { align: "right" });
        doc.text(invStatus.toUpperCase(), pageW - 48, 144, { align: "right" });

        // Watermark - only show PAID when fully paid, CANCELLED when cancelled
        if (invStatus === "paid" || invStatus === "cancelled") {
          doc.saveGraphicsState();
          doc.setTextColor(200, 200, 200);
          doc.setFontSize(72);
          doc.setFont("helvetica", "bold");
          doc.text(invStatus.toUpperCase(), pageW / 2, pageH / 2, { align: "center", angle: 30 });
          doc.restoreGraphicsState();
          doc.setTextColor(0, 0, 0);
        }

        // Bill to
        doc.setDrawColor(220);
        doc.setLineWidth(1);
        doc.roundedRect(48, 170, pageW - 96, 78, 10, 10);

        doc.setFont("helvetica", "bold");
        doc.setFontSize(10);
        doc.text("BILL TO", 64, 192);

        doc.setFont("helvetica", "normal");
        doc.setFontSize(11);
        const custName = safeText_(invoice.customerName || "");
        const custFarmName = safeText_(invoice.customerFarmName || "");
        const custEmail = safeText_(invoice.customerEmail || "");
        const custPhone = safeText_(invoice.customerPhone || "");

        doc.text(custName, 64, 212);
        let custY = 228;
        if (custFarmName) { doc.setFont("helvetica", "italic"); doc.text(custFarmName, 64, custY); doc.setFont("helvetica", "normal"); custY += 14; }
        if (custEmail) { doc.text(custEmail, 64, custY); custY += 14; }
        if (custPhone) { doc.text(custPhone, 64, custY); custY += 14; }

        // Payment QR (if paymentUrl exists)
        const payUrl = buildInvoicePayUrl_(invoice);
        if (payUrl) {
          try {
            const qr = await qrToDataUrl_(payUrl);
            if (qr) {
              doc.setFont("helvetica", "bold");
              doc.setFontSize(9);
              doc.text("PAY ONLINE", pageW - 150, 192, { align: "center" });
              doc.addImage(qr, "PNG", pageW - 190, 200, 80, 80);
              doc.setFont("helvetica", "normal");
              doc.setFontSize(8);
              doc.text("Scan to pay", pageW - 150, 290, { align: "center" });
            }
          } catch (e) {}
        }

        // Items table header
        let y = 270;
        doc.setFont("helvetica", "bold");
        doc.setFontSize(10);
        doc.text("HORSE", 48, y);
        doc.text("DESCRIPTION", 178, y);
        doc.text("QTY", pageW - 220, y, { align: "right" });
        doc.text("RATE", pageW - 140, y, { align: "right" });
        doc.text("AMOUNT", pageW - 48, y, { align: "right" });
        y += 10;
        doc.setDrawColor(200);
        doc.line(48, y, pageW - 48, y);
        y += 18;

        doc.setFont("helvetica", "normal");
        doc.setFontSize(10);

        const items = Array.isArray(invoice.items) ? invoice.items : [];
        const horseW = 120;                 // HORSE column, x 48–168
        const maxDescW = pageW - 178 - 240; // DESCRIPTION from x 178, leaving room for qty/rate/amount
        const lineH = 14;

        // Lines saved with only a horseId (no name) get the name from the horse record.
        const horseNames = await resolveHorseNames_(items);

        // `amount` is the line total (rate × qty); the rate is the per-horse price.
        const computeTotal = () => items.reduce((sum, it) => sum + Number(it.amount ?? it.unitPriceSnapshot ?? 0), 0);

        for (const it of items) {
          const rawDesc = safeText_(it.serviceNameSnapshot || it.description || "");
          const desc = rawDesc === 'Custom Service (enter manually)' ? 'Custom Service' : rawDesc;
          const horse = lineHorseLabel_(it, horseNames);
          const qty = FarriPricing.itemQty(it);
          const lineTotal = Number(it.amount ?? it.unitPriceSnapshot ?? 0);
          const rate = FarriPricing.itemUnitPrice(it);

          // Page break
          if (y > pageH - 140) {
            doc.addPage();
            y = 72;
          }

          // Horse (with "× qty — note" for a Multiple horses line), then the service
          let yAfter = y;
          if (horse) {
            doc.setFont("helvetica", "bold");
            yAfter = pdfWrapText_(doc, horse, 48, y, horseW, lineH);
            doc.setFont("helvetica", "normal");
          }
          yAfter = Math.max(yAfter, pdfWrapText_(doc, desc, 178, y, maxDescW, lineH));

          // Numbers aligned to first line y
          doc.text(String(qty), pageW - 220, y, { align: "right" });
          doc.text(money_(rate), pageW - 140, y, { align: "right" });
          doc.text(money_(lineTotal), pageW - 48, y, { align: "right" });

          y = Math.max(yAfter, y + lineH) + 10;
          doc.setDrawColor(235);
          doc.line(48, y - 6, pageW - 48, y - 6);
        }

        // Totals
        const total = money_(invoice.total || computeTotal());
        y += 10;
        if (y > pageH - 110) { doc.addPage(); y = 72; }

        doc.setFont("helvetica", "bold");
        doc.setFontSize(12);
        doc.text("TOTAL", pageW - 140, y, { align: "right" });
        doc.text(total, pageW - 48, y, { align: "right" });

        // Dual pricing: show both prices for what's owed
        const _prices = FarriPricing.dualPrices(invoice);
        if (_prices.card !== null) {
          y += 18;
          doc.setFont("helvetica", "normal");
          doc.setFontSize(10);
          doc.text(`Card price ${FarriPricing.money(_prices.card)}  /  Cash or check ${FarriPricing.money(_prices.cash)}`, pageW - 48, y, { align: "right" });
        }

        // Clickable "Pay Now" link — the QR code above only helps if the reader can
        // scan it with a second device; this covers the common case of someone
        // reading the emailed/attached PDF on the same screen they'd pay from.
        // Shown whenever there's a real Stripe payment link and money still owed
        // (this fires for a brand-new unpaid invoice too, since the "BALANCE DUE"
        // line further below only renders once there's payment history).
        if (payUrl && _balDue > 0) {
          y += 24;
          if (y > pageH - 110) { doc.addPage(); y = 72; }
          const linkLabel = "CLICK HERE TO PAY NOW";
          doc.setFont("helvetica", "bold");
          doc.setFontSize(11);
          doc.setTextColor(37, 99, 235);
          doc.textWithLink(linkLabel, pageW - 48, y, { url: payUrl, align: "right" });
          const linkWidth = doc.getTextWidth(linkLabel);
          doc.setDrawColor(37, 99, 235);
          doc.line(pageW - 48 - linkWidth, y + 3, pageW - 48, y + 3);
          doc.setTextColor(0);
          doc.setFont("helvetica", "normal");
          const altPay = FarriPricing.altPayNote(farrierProfile);
          if (altPay) {
            doc.setFontSize(9);
            doc.setTextColor(75);
            for (const line of doc.splitTextToSize(altPay, 300)) {
              y += 13;
              doc.text(line, pageW - 48, y, { align: "right" });
            }
            doc.setTextColor(0);
          }
          const venmoUrl = FarriPricing.venmoPayUrl(farrierProfile, invoice);
          if (venmoUrl) {
            y += 16;
            const venmoLabel = "PAY WITH VENMO";
            doc.setFont("helvetica", "bold");
            doc.setFontSize(10);
            doc.setTextColor(0, 140, 255);
            doc.textWithLink(venmoLabel, pageW - 48, y, { url: venmoUrl, align: "right" });
            doc.setTextColor(0);
            doc.setFont("helvetica", "normal");
          }
        }

        // Payment History
        const payments = Array.isArray(invoice.payments) ? invoice.payments : [];
        const paidAmount = invoice.paidAmount || payments.reduce((s,p) => s + (p.amount||0), 0);
        const balanceDue = invoice.status === 'paid' ? 0 : FarriPricing.balanceCents({ ...invoice, status: 'outstanding' }) / 100;

        // Build effective payments list — prefer payments[] array,
        // but fall back to top-level paidAt/cardLast4 for Stripe online payments
        let effectivePayments = payments;
        if (payments.length === 0 && invoice.paidAt && (invStatus === 'paid' || invStatus === 'partial')) {
          const paidDate = invoice.paidAt?.toDate ? invoice.paidAt.toDate() : new Date(invoice.paidAt);
          const cardDetail = invoice.cardLast4
            ? `${invoice.cardType || 'Card'} ending ${invoice.cardLast4}`
            : (invoice.paymentMethod === 'cash' ? 'Cash' : invoice.paymentMethod === 'check' ? 'Check' : 'Online Payment');
          effectivePayments = [{
            date: paidDate.toISOString(),
            amount: paidAmount || invoice.total || 0,
            memo: cardDetail,
            stripePaymentIntentId: invoice.stripePaymentIntentId || '',
          }];
        }

        if (effectivePayments.length > 0) {
          y += 16;
          if (y > pageH - 160) { doc.addPage(); y = 72; }
          doc.setFont("helvetica", "bold");
          doc.setFontSize(10);
          doc.setTextColor(30);
          doc.text("PAYMENT HISTORY", 48, y);
          y += 8;
          doc.setDrawColor(180);
          doc.line(48, y, pageW - 48, y);
          y += 14;
          doc.setFont("helvetica", "normal");
          doc.setFontSize(9);
          const methodLabels = { cash: 'Cash', check: 'Check', credit_card: 'Credit Card', other: 'Other' };
          for (const p of effectivePayments) {
            if (y > pageH - 100) { doc.addPage(); y = 72; }
            const dateStr = p.date ? new Date(p.date).toLocaleDateString() : '';
            const methodStr = methodLabels[p.method] || p.method || '';
            const detailStr = p.memo && p.memo !== 'Credit card' && p.memo !== 'Credit Card' ? p.memo : methodStr;
            doc.setTextColor(60);
            doc.text(`${dateStr}  ${detailStr}`, 48, y);
            // Show transaction ID in small text if available
            if (p.stripePaymentIntentId) {
              doc.setFontSize(7);
              doc.setTextColor(140);
              doc.text(`Txn: ${p.stripePaymentIntentId}`, 48, y + 8);
              doc.setFontSize(9);
              y += 8;
            }
            doc.setTextColor(0);
            doc.text(money_(p.amount || 0), pageW - 48, y, { align: 'right' });
            y += 16;
          }
          y += 4;
          doc.setDrawColor(200);
          doc.line(48, y, pageW - 48, y);
          y += 14;
          doc.setFont("helvetica", "bold");
          doc.setFontSize(10);
          doc.text("AMOUNT PAID", pageW - 140, y, { align: "right" });
          doc.text(money_(paidAmount), pageW - 48, y, { align: "right" });
          y += 16;
          if (balanceDue > 0) {
            doc.setTextColor(220, 38, 38);
            doc.text("BALANCE DUE", pageW - 140, y, { align: "right" });
            doc.text(money_(balanceDue), pageW - 48, y, { align: "right" });
            doc.setTextColor(0);
            y += 16;
          } else {
            doc.setTextColor(5, 150, 105);
            doc.text("PAID IN FULL", pageW - 140, y, { align: "right" });
            doc.setTextColor(0);
            y += 16;
          }
        }

        // Footer
        doc.setFont("helvetica", "normal");
        doc.setFontSize(9);
        doc.setTextColor(120);
        doc.text("Thank you for your business.", 48, pageH - 54);
        doc.setTextColor(0);

        const blob = doc.output("blob");
        const url = URL.createObjectURL(blob);
        return url;
      }

      async function openInvoicePdf(invoice, farrierProfile, autoPrint = true) {
        try {
          const url = await generateInvoicePdfBlobUrl(invoice, farrierProfile);
          const w = window.open(url, "_blank", "noopener,noreferrer");
          if (!w) {
            alert("Popup blocked. Please allow popups to view/print the invoice PDF.");
            return;
          }
          if (autoPrint) {
            // Give it a moment to load, then print
            setTimeout(() => {
              try { w.focus(); w.print(); } catch (e) {}
            }, 700);
          }
        } catch (e) {
          console.error("PDF generation failed:", e);
          alert("Could not generate PDF. Check console for details.");
        }
      }

      async function emailInvoiceLink(invoice, profileOverride) {
        const _userProfile = profileOverride || {};
        const customerEmail = safeText_(invoice.customerEmail || "");
        if (!customerEmail) {
          alert("No customer email on this invoice.");
          return;
        }

        const invoiceNum = safeText_(invoice.invoiceNumber || invoice.id?.slice(-6).toUpperCase() || "");
        const customerName = safeText_(invoice.customerName || "");
        const firstName = customerName.split(" ")[0] || "there";
        const total = Number(invoice.total || 0).toFixed(2);
        const paidSoFar = invoice.paidAmount || (invoice.payments||[]).reduce((s,p)=>s+(p.amount||0),0);
        const balanceDue = (invoice.status === 'paid' ? 0 : FarriPricing.balanceCents({ ...invoice, status: 'outstanding' }) / 100).toFixed(2);
        const isPaid = parseFloat(balanceDue) <= 0;
        const prices = FarriPricing.dualPrices(invoice);

        // The invoice's own pay link (/pay/{id}). Without a saved one, /pay/{id} still works when
        // the farrier takes online payments: it opens a fresh Stripe or iPOSpays page. Never the
        // customer portal (that needs a sign-in). No online payments → no Pay button.
        const takesOnline = !!(_userProfile?.stripePublishableKey || _userProfile?.ipospaysConnected);
        const payUrl = buildInvoicePayUrl_(invoice) || (takesOnline && invoice.id ? `${window.location.origin}/pay/${invoice.id}` : "");

        // Build services list from the invoice's lines (items[]), one row per line with its horse.
        const esc = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        const items = Array.isArray(invoice.items) ? invoice.items : [];
        const horseNames = await resolveHorseNames_(items);
        const serviceLines = items.map(item => {
          const rawDesc = safeText_(item.serviceNameSnapshot || item.description || "");
          const desc = rawDesc === 'Custom Service (enter manually)' ? 'Custom Service' : rawDesc;
          const horse = lineHorseLabel_(item, horseNames);
          const qty = FarriPricing.itemQty(item);
          const price = FarriPricing.itemUnitPrice(item);
          return `<tr>
            <td style="padding:6px 8px;font-size:14px;color:#374151;font-weight:600;">${esc(horse)}</td>
            <td style="padding:6px 8px;font-size:14px;color:#374151;">${esc(desc)}</td>
            <td style="padding:6px 8px;font-size:14px;color:#374151;text-align:center;">${qty}</td>
            <td style="padding:6px 8px;font-size:14px;color:#374151;text-align:right;">$${Number(price).toFixed(2)}</td>
          </tr>`;
        }).join("");

        const html = `<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"></head>
<body style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;line-height:1.6;color:#333;max-width:600px;margin:0 auto;padding:20px;">
  <div style="text-align:center;padding:28px 30px;background:linear-gradient(135deg,#1a365d 0%,#2563eb 100%);border-radius:8px 8px 0 0;">
    <h1 style="color:#fff;margin:0;font-size:26px;font-weight:700;">🐴 FarriTech</h1>
    <p style="color:#06b6d4;margin:6px 0 0;font-size:14px;">Invoice from ${safeText_(_userProfile?.businessName || "Your Farrier")}</p>
  </div>

  <div style="background:#fff;padding:32px 30px;border:1px solid #e5e7eb;border-top:none;">
    <p style="font-size:16px;color:#374151;">Hi ${firstName},</p>
    <p style="font-size:15px;color:#4b5563;">Here is your invoice from <strong>${safeText_(_userProfile?.businessName || "your farrier")}</strong>. ${payUrl && !isPaid ? "You can view and pay it online using the button below." : "Your invoice details are below."}</p>

    <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:20px;margin:24px 0;">
      <table style="width:100%;border-collapse:collapse;font-size:14px;color:#374151;margin-bottom:12px;">
        <tr><td style="padding:4px 0;color:#6b7280;width:140px;">Invoice #</td><td><strong>${invoiceNum}</strong></td></tr>
        <tr><td style="padding:4px 0;color:#6b7280;">Customer</td><td>${customerName}</td></tr>

    if (!snap.exists) {
      throw new Error("Farrier profile was not created. This is usually a Firestore Rules/Permissions issue.");

    const code = e?.code || "";
    if (code === "permission-denied") {
      throw new Error("Firestore permission denied while creating your profile. Check Firestore Rules for collection 'farriers'.");

    (async () => {
      try {
        // Grandfather in any account that already has services configured —
        // this gate is meant to catch never-set-up accounts, not interrupt
        // farriers who were already using the app before it existed.
        const snap = await db.collection('services').where('farrierId', '==', user.uid).limit(1).get();
        if (!snap.empty) {
          db.collection('farriers').doc(user.uid).update({ setupCompleted: true }).catch(() => {});
          setNeedsSetupWizard(false);
        } else {
          setNeedsSetupWizard(true);
        }
      } catch (e) {
        console.error('Setup check failed:', e);
        setNeedsSetupWizard(false); // fail open — never lock someone out over a query error
      }
    })();
  }, [user?.uid, userProfile?.setupCompleted]);

  // URL params (must be defined outside hooks)
  const urlParams = new URLSearchParams(window.location.search);
  const farrierIdParam = urlParams.get("farrier");
  const support = urlParams.has("support");
  const supportSessionId = urlParams.get("supportSession");
  const finishSignup = urlParams.get("finishSignup") === "1" || urlParams.has("leadId") || urlParams.has("lead") || urlParams.has("lid");


  const clearSupportSession = async () => {
    try {
      if (supportSessionId && db) {
        await db.collection("supportSessions").doc(supportSessionId).update({
          endedAt: firebase.firestore.FieldValue.serverTimestamp(),
        });
      }
    } catch (e) {
      console.error("Failed to end support session:", e);
    }

    const u = new URL(window.location.href);
    u.searchParams.delete("supportSession");
    window.location.href = u.toString();
  };

  useEffect(() => {
    if (!auth) {
      setLoading(false);
      return;
    }

    let logoutTimer = null;
    let hasEverSignedIn = false;
    const unsubscribe = auth.onAuthStateChanged(async (u) => {
      try {
        // Ignore auth state changes caused by the booking page auto-creating a customer portal account
        if (window._creatingCustomerPortalAccount) return;

        if (!u) {
          const delay = hasEverSignedIn ? 5000 : 0;
          console.warn("⚠️ onAuthStateChanged fired NULL. hasEverSignedIn:", hasEverSignedIn, "Stack:", new Error().stack.split("\n").slice(1,4).join(" | "));
          setLogoutTimerActive(true);
          logoutTimer = setTimeout(() => {
            console.error("🔴 Logout timer expired - signing out. Auth state:", auth.currentUser);
            setLogoutTimerActive(false);
            setUser(null);
            setUserProfile(null);
            setSupportSession(null);
            setEffectiveFarrierId(null);
            setIsSupportMode(false);
          }, delay);
          return;
        }
        // User is signed in - cancel any pending logout
        console.log("✅ onAuthStateChanged fired with user:", u.uid, u.email);
        hasEverSignedIn = true;
        if (logoutTimer) { clearTimeout(logoutTimer); logoutTimer = null; setLogoutTimerActive(false); }

        setUser(u);

        // Send phones to the mobile app instead of the desktop dashboard. The
        // login/signup forms already do this (see redirectToMobileIfNeeded in
        // AuthView), but that only fires on a fresh sign-in submit — a phone with
        // an already-persisted Firebase session lands here via auth auto-restore
        // instead, skipping AuthView entirely, which is why the mobile app could
        // "revert" to the desktop QR code screen. Support sessions and the
        // finish-signup flow are left alone since they already manage their own
        // navigation.
        if (!supportSessionId && !finishSignup) {
          const isMobileDevice = window.innerWidth < 768 ||
            /Mobi|Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
          if (isMobileDevice) {
            window.location.href = window.location.origin + '/mobile';
            return;
          }
        }

        // Default to the signed-in farrier
        let farrierIdToUse = u.uid;
        let supportSessionData = null;

        // Works in someone else's business? (api/_lib/team.js) A farrier on their own has no
        // membership and nothing changes for them; any failure here falls back to that too.
        window.FarriTeam = { businessId: u.uid, role: 'owner', member: false };
        if (!supportSessionId && db) {
          try {
            let m = await db.collection('businessMembers').doc(u.uid).get();
            if (!m.exists && u.email) {
              const inv = await db.collection('businessInvites').doc(u.email.toLowerCase()).get().catch(() => null);
              if (inv?.exists) {
                const r = await fetch('/api/stripe-payment', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'team_accept' }) })
                  .then(x => x.json()).catch(() => null);
                if (r?.error) alert(r.error);
                if (r?.joined) m = await db.collection('businessMembers').doc(u.uid).get();
              }
            }
            const md = m.exists ? m.data() : null;
            if (md?.businessId && md.businessId !== u.uid) {
              window.FarriTeam = { businessId: md.businessId, role: md.role === 'manager' ? 'manager' : 'farrier', member: true, name: md.name || '' };
              farrierIdToUse = md.businessId;
            }
          } catch (e) { console.warn('Team check skipped:', e.message); }
        }

        // If a support session is present, validate it and switch context
        if (supportSessionId && db) {
          const ssDoc = await db.collection("supportSessions").doc(supportSessionId).get();
          if (ssDoc.exists) {
            const ss = ssDoc.data();
            const now = Date.now();
            const expired = ss.expiresAt?.toDate && ss.expiresAt.toDate().getTime() < now;
            const ended = !!ss.endedAt;
            const wrongUser = ss.supportAgentUid && ss.supportAgentUid !== u.uid;

            if (!expired && !ended && !wrongUser && ss.targetFarrierId) {
              supportSessionData = ss;
              farrierIdToUse = ss.targetFarrierId;
            }
          }
        }

        setSupportSession(supportSessionData);
        setIsSupportMode(!!supportSessionData);
        setEffectiveFarrierId(farrierIdToUse);

        // Load profile for effective farrier
       if (db && !finishSignup) {
          const profileDoc = await db.collection("farriers").doc(farrierIdToUse).get();

          // If the user can authenticate but has no profile doc, create one now.
          if (!profileDoc.exists) {
            try {
              const baseProfile = {
                email: u?.email || "",
                businessName: u?.displayName || "My Farrier Business",
                ownerUid: farrierIdToUse,
                farrierId: farrierIdToUse,
                bookingUrl: window.location.origin + "/?farrier=" + farrierIdToUse,
                googleCalendarConnected: false,
                autoPrintPdf: true,
                logoUrl: "",
                status: "active",
                  createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
              };
              await ensureFarriTechfile_(farrierIdToUse, baseProfile);
              const createdSnap = await db.collection("farriers").doc(farrierIdToUse).get();
              setUserProfile(createdSnap.exists ? createdSnap.data() : baseProfile);
            } catch (e) {
              console.error("❌ Could not auto-create missing farrier profile doc", e);
              setUserProfile(null);
            }
          } else {
            const profileData = profileDoc.data();
            // Backfill email if missing (e.g. Google sign-in users whose doc predates email capture)
            if (!profileData.email && u?.email) {
              await db.collection('farriers').doc(farrierIdToUse).update({ email: u.email });
              profileData.email = u.email;
              console.log('✅ Backfilled missing email into farrier profile:', u.email);
            }
            // Older accounts kept the Stripe secret key on this (publicly readable) profile.
            // Ask the server to move it into its locked secrets store; it deletes the copy here.
            if (profileData.stripeSecretKey) {
              fetch('/api/stripe-payment', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'status' }) })
                .catch(e => console.warn('Stripe key migration deferred:', e.message));
              delete profileData.stripeSecretKey;
            }
            setUserProfile(profileData);
          }
} else {
          setUserProfile(null);
        }
      } catch (e) {
        console.error("Auth/profile load failed:", e);
      } finally {
        setLoading(false);
      }
    });

    return () => { unsubscribe(); if (logoutTimer) clearTimeout(logoutTimer); };
  }, [supportSessionId]);

  // ── Inactivity timer - 30 min then warning, 60s then logout ──────────
  useEffect(() => {
    if (!user) return;

    const INACTIVE_MS = 30 * 60 * 1000; // 30 minutes
    const COUNTDOWN_S = 60;

    let inactivityTimer = null;
    let countdownTimer = null;
    let countdownValue = COUNTDOWN_S;

    const resetTimer = () => {
      if (showInactivityWarning) return; // don't reset if warning is showing
      clearTimeout(inactivityTimer);
      inactivityTimer = setTimeout(() => {
        setShowInactivityWarning(true);
        setInactivityCountdown(COUNTDOWN_S);
        countdownValue = COUNTDOWN_S;
        countdownTimer = setInterval(() => {
          countdownValue -= 1;
          setInactivityCountdown(countdownValue);
          if (countdownValue <= 0) {
            clearInterval(countdownTimer);
            setShowInactivityWarning(false);
            auth.signOut();
          }
        }, 1000);
      }, INACTIVE_MS);
    };

    const stayLoggedIn = () => {
      setShowInactivityWarning(false);
      clearInterval(countdownTimer);
      countdownValue = COUNTDOWN_S;
      setInactivityCountdown(COUNTDOWN_S);
      resetTimer();
    };

    // Store stayLoggedIn so we can call it from the modal
    window.__farritech_stayLoggedIn = stayLoggedIn;

    const events = ['mousemove', 'mousedown', 'keypress', 'scroll', 'touchstart', 'click'];
    events.forEach(e => window.addEventListener(e, resetTimer, { passive: true }));

    resetTimer();

    return () => {
      clearTimeout(inactivityTimer);
      clearInterval(countdownTimer);
      events.forEach(e => window.removeEventListener(e, resetTimer));
      delete window.__farritech_stayLoggedIn;
    };
  }, [user]);

  // Show spinner while loading OR while waiting to confirm logout (prevents flash to login)
  if (loading || (logoutTimerActive)) {
    return (
      <div style={{display: "flex", justifyContent: "center", alignItems: "center", height: "100vh"}}>
        <div className="spinner"></div>
      </div>
    );
  }

  // Customer booking view
  if (farrierIdParam) {
    return <CustomerBookingView farrierId={farrierIdParam} />;
  }

  // Support portal view — moved to its own page, support.html (/support).
if (support) {
  window.location.replace('/support');
  return null;
  }

  // Finish signup (post-billing activation)
  if (finishSignup) {
    // Only sign out a pre-existing cached session, never one just created by handleComplete
    if (user && !window.__finishSignupInProgress__) {
      auth.signOut().catch(() => {});
      return null;
    }
    return <FinishSignupView />;
  }

  // Authentication view
  if (!user) {
    return <AuthView />;
  }

  // First-time setup gate — before the dashboard/QR code, not after.
  // Deliberately fails open: while the check is still running (null), we
  // render the normal dashboard rather than blocking behind another spinner,
  // so a slow/unsettled auth state can never brick the whole app. The wizard
  // only interjects once the check positively confirms it's actually needed.
  if (needsSetupWizard) {
    return (
      <SetupWizardView
        userId={user.uid}
        userProfile={userProfile}
        onComplete={() => {
          setUserProfile(prev => ({ ...(prev || {}), setupCompleted: true }));
          setNeedsSetupWizard(false);
        }}
      />
    );
  }

  // Farrier dashboard (+ support banner)
  return (
    <>
      {/* Inactivity Warning Modal */}
      {showInactivityWarning && (
        <div style={{position:'fixed', inset:0, background:'rgba(0,0,0,0.6)', zIndex:99999, display:'flex', alignItems:'center', justifyContent:'center'}}>
          <div style={{background:'var(--surface)', color:'var(--text)', borderRadius:'12px', padding:'2rem', maxWidth:'420px', width:'90%', textAlign:'center', border:'1px solid #cbd5e1', boxShadow:'0 20px 60px rgba(0,0,0,0.6)'}}>
            <div style={{fontSize:'3rem', marginBottom:'1rem'}}>⏱️</div>
            <h2 style={{marginBottom:'0.75rem', color:'var(--text)'}}>Still there?</h2>
            <p style={{color:'var(--text-muted)', marginBottom:'1.5rem'}}>
              You've been inactive for 30 minutes. For your security, you'll be logged out in:
            </p>
            <div style={{fontSize:'3rem', fontWeight:'700', color:'#ef4444', marginBottom:'1.5rem'}}>
              {inactivityCountdown}s
            </div>
            <div style={{display:'flex', gap:'0.75rem', justifyContent:'center'}}>
              <button
                className="btn btn-outline"
                onClick={() => { auth.signOut(); setShowInactivityWarning(false); }}
                style={{flex:1}}
              >
                Log Out Now
              </button>
              <button
                className="btn btn-primary"
                onClick={() => window.__farritech_stayLoggedIn && window.__farritech_stayLoggedIn()}
                style={{flex:1}}
                autoFocus
              >
                Stay Logged In
              </button>
            </div>
          </div>
        </div>
      )}

      {isSupportMode && (
        <div style={{padding:"10px", background:"#ffefef", border:"1px solid #ffb3b3", borderRadius:"8px", margin:"12px"}}>
          <strong>SUPPORT MODE</strong>
          {supportSession?.reason ? ` — ${supportSession.reason}` : ""}
          <div style={{marginTop:"8px"}}>
            <button className="btn btn-secondary" onClick={clearSupportSession}>
              End Support Session
            </button>
          </div>
        </div>
      )}

      <FarrierDashboard
        user={user}
        userProfile={userProfile}
        setUserProfile={setUserProfile}
        farrierId={effectiveFarrierId || user.uid}
        isSupportMode={isSupportMode}
        supportSession={supportSession}
        clearSupportSession={clearSupportSession}
      />
    </>
  );
}

function AuthView() {
      const [mode, setMode] = useState('login'); // 'login' or 'signup'
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [businessName, setBusinessName] = useState('');
      const [phone, setPhone] = useState('');
      const [address, setAddress] = useState('');
      const [city, setCity] = useState('');
      const [state, setState] = useState('');
      const [zip, setZip] = useState('');
      const [logoUrl, setLogoUrl] = useState('');
      const [autoPrintPdf, setAutoPrintPdf] = useState(true);
      const [error, setError] = useState('');
      
      
      // (removed) userProfile sync belongs in SettingsView
const [loading, setLoading] = useState(false);
      const [successMessage, setSuccessMessage] = useState('');

      const handleForgotPassword = async () => {
        if (!email) {
          setError('Please enter your email address first');
          return;
        }
        
        setError('');
        setLoading(true);
        
        try {
          if (!auth) {
            setError('Firebase not configured. Please add your Firebase credentials.');
            setLoading(false);
            return;
          }
          await auth.sendPasswordResetEmail(email);
          setSuccessMessage('Password reset email sent! Check your inbox.');
          setError('');
        } catch (err) {
          setError(err.message);
        }
        setLoading(false);
      };

      // If signing in from a phone, send the user to the mobile app instead of
      // the desktop dashboard (same device check used after signup below).
      const redirectToMobileIfNeeded = () => {
        const isMobileDevice = window.innerWidth < 768 ||
          /Mobi|Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        if (isMobileDevice) {
          window.location.href = window.location.origin + '/mobile';
          return true;
        }
        return false;
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        setError('');
        setLoading(true);

        try {
          if (!auth) {
            setError('Firebase not configured. Please add your Firebase credentials.');
            setLoading(false);
            return;
          }
          await auth.signInWithEmailAndPassword(email, password);
          if (redirectToMobileIfNeeded()) return;
        } catch (err) {
          setError(err.message);
        }
        setLoading(false);
      };

      const handleGoogleSignIn = async () => {
        setError('');
        setLoading(true);

        try {
          if (!auth) {
            setError('Firebase not configured.');
            setLoading(false);
            return;
          }

          const provider = new firebase.auth.GoogleAuthProvider();
          const result = await auth.signInWithPopup(provider);
          const user = result.user;

          // Check if user profile exists
          const profileDoc = await db.collection('farriers').doc(user.uid).get();

          if (!profileDoc.exists) {
            // First time Google sign-in - create profile
            await ensureFarriTechfile_(user.uid, {
              businessName: user.displayName || 'My Farrier Business',
              email: user.email,
              phone: '',
              address: '',
              city: '',
              state: '',
              zip: '',
              ownerUid: user.uid,
              farrierId: user.uid,
              logoUrl: '',
              autoPrintPdf: true,
              createdAt: firebase.firestore.FieldValue.serverTimestamp(),
              googleCalendarConnected: false,
              bookingUrl: window.location.origin + '?farrier=' + user.uid
            });
            notifySignup_(user);
}

          // User will be automatically logged in by Firebase
          if (redirectToMobileIfNeeded()) return;
        } catch (err) {
          if (err.code !== 'auth/popup-closed-by-user') {
            setError(err.message);
          }
        }
        setLoading(false);
      };

    const handleSignup = async (e) => {
  e.preventDefault();
  setError('');
  setLoading(true);

  try {
    if (!auth || !db) {
      setError('Firebase not configured.');
      setLoading(false);
      return;
    }

    // 1) Create Firebase Auth user
    const cred = await auth.createUserWithEmailAndPassword(email, password);
    const user = cred.user;

    // 2) Set display name (optional)
    try {
      await user.updateProfile({ displayName: businessName || "" });
    } catch (e) {
      console.warn("Could not set displayName", e);
    }

    // 3) Send verification email (optional)
    try { await user.sendEmailVerification(); } catch (e) {}

    // 4) Create/merge farrier profile doc
    await ensureFarriTechfile_(user.uid, {
      businessName: businessName || 'My Farrier Business',
      email: email || user.email || '',
      phone: phone || '',
      address: address || '',
      city: city || '',
      state: (state || '').toUpperCase(),
      zip: zip || '',
      ownerUid: user.uid,
      farrierId: user.uid,
      logoUrl: logoUrl || '',
      autoPrintPdf: autoPrintPdf ?? true,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      googleCalendarConnected: false,
      bookingUrl: window.location.origin + '?farrier=' + user.uid
    });
    notifySignup_(user);

    // Services are no longer auto-seeded here — the first-time setup wizard
    // (SetupWizardView) is now how a new farrier adds their own real services
    // right after signup, instead of silently getting generic placeholders.

    alert('Welcome! Please check your email to verify your account.');
  } catch (err) {
    setError(err?.message || String(err));
  }

  setLoading(false);
};

            boxShadow: '0 1px 4px rgba(15,23,42,0.06)'
          }}>
            {(() => {
              const navGroups = [
                { label: '📊 Overview', items: [
                  { id: 'dashboard', label: 'Dashboard', icon: '📊' },
                  ...(window.FarriTeam?.role === 'farrier' ? [] : [{ id: 'business', label: 'Business Dashboard', icon: '📈' }]),
                  { id: 'qrcode', label: 'My QR Code', icon: '📱' },
                  { id: 'about', label: 'About', icon: 'ℹ️' },
                ]},
                { label: '📅 Schedule', items: [
                  { id: 'calendar', label: 'Calendar', icon: '📅' },
                  { id: 'appointments', label: 'Appointments', icon: '📋' },
                  { id: 'route', label: 'Route Sheet', icon: '🗺️' },
                ]},
                { label: '💰 Billing', items: [
                  { id: 'invoices', label: 'Invoices', icon: '💰' },
                  ...(window.FarriTeam?.role === 'farrier' ? [] : [{ id: 'reports', label: 'Reports', icon: '📈' }]),
                  { id: 'mileage', label: 'Mileage Log', icon: '🚗' },
                ]},
                { label: '👥 Clients', items: [
                  { id: 'customers', label: 'Customers', icon: '👥' },
                  { id: 'horses', label: 'Horses', icon: '🐴' },
                  { id: 'upcoming', label: 'Upcoming Service', icon: '🔔' },
                ]},
                { label: '⚙️ Manage', items: [
                  { id: 'services', label: 'Services', icon: '🧾' },
                  { id: 'inventory', label: 'Inventory', icon: '📦' },
                  { id: 'data', label: 'Data Management', icon: '🗂️' },
                  { id: 'settings', label: 'Settings', icon: '⚙️' },
                  { id: 'tutorials', label: 'Video Tutorials', icon: '▶️' },
                  ...(isSponsorAdmin ? [{ id: 'sponsors', label: 'Sponsor Banners', icon: '📢' }] : []),
                ]},
              ];

              const activeGroup = navGroups.find(g => g.items.some(i => i.id === tab));

              return (
                <div style={{
                  maxWidth: '1200px',
                  margin: '0 auto',
                  display: 'flex',
                  alignItems: 'stretch',
                  padding: '0 1.5rem',
                  gap: '0'
                }}>
                  {navGroups.map(group => {
                    const isGroupActive = group.items.some(i => i.id === tab);
                    const isOpen = openNavGroup === group.label;
                    const activeItem = group.items.find(i => i.id === tab);

                    return (
                      <div key={group.label} style={{position: 'relative'}}
                        onMouseEnter={() => setOpenNavGroup(group.label)}
                        onMouseLeave={() => setOpenNavGroup(null)}
                      >
                        <button
                          onClick={() => { if (group.items.length === 1) { setTab(group.items[0].id); setOpenNavGroup(null); } }}
                          style={{
                            background: 'none',
                            border: 'none',
                            cursor: 'pointer',
                            padding: '0 1.25rem',
                            height: '48px',
                            display: 'flex',
                            alignItems: 'center',
                            gap: '0.4rem',
                            fontSize: '0.88rem',
                            fontWeight: isGroupActive ? '700' : '500',
                            color: isGroupActive ? '#2683FB' : '#475569',
                            borderBottom: isGroupActive ? '2px solid #2683FB' : '2px solid transparent',
                            transition: 'all 0.15s',
                            whiteSpace: 'nowrap',
                          }}
                          onMouseOver={(e) => { if (!isGroupActive) e.currentTarget.style.color = '#0f172a'; }}
                          onMouseOut={(e) => { if (!isGroupActive) e.currentTarget.style.color = '#475569'; }}
                        >
                          {isGroupActive ? `${activeItem.icon} ${activeItem.label}` : group.label}
                          <span style={{
                            fontSize: '0.6rem',
                            opacity: 0.7,
                            marginLeft: '2px',
                            transform: isOpen ? 'rotate(180deg)' : 'rotate(0deg)',
                            display: 'inline-block',
                            transition: 'transform 0.2s'
                          }}>▼</span>
                        </button>

                        {isOpen && (
                          <div style={{
                            position: 'absolute',
                            top: 'calc(100% - 2px)',
                            left: 0,
                            backgroundColor: '#ffffff',
                            border: '1px solid #e2e8f0',
                            borderTop: '2px solid #2683FB',
                            borderRadius: '0 0 10px 10px',
                            boxShadow: '0 8px 24px rgba(15,23,42,0.12)',
                            minWidth: '180px',
                            zIndex: 200,
                            overflow: 'hidden'
                          }}>
                            {group.items.map(item => (
                              <button
                                key={item.id}
                                onClick={() => { setTab(item.id); setOpenNavGroup(null); }}
                                style={{
                                  display: 'block',
                                  width: '100%',
                                  textAlign: 'left',
                                  padding: '0.75rem 1.25rem',
                                  background: tab === item.id ? '#eff6ff' : 'none',
                                  border: 'none',
                                  borderLeft: tab === item.id ? '3px solid #2683FB' : '3px solid transparent',
                                  color: tab === item.id ? '#2683FB' : '#334155',
                                  fontSize: '0.88rem',
                                  fontWeight: tab === item.id ? '600' : '400',
                                  cursor: 'pointer',
                                  transition: 'all 0.15s',
                                  gap: '0.5rem',
                                }}
                                onMouseOver={(e) => { if (tab !== item.id) { e.currentTarget.style.background = '#f1f5f9'; e.currentTarget.style.color = '#0f172a'; }}}
                                onMouseOut={(e) => { if (tab !== item.id) { e.currentTarget.style.background = 'none'; e.currentTarget.style.color = '#334155'; }}}
                              >
                                {item.icon} {item.label}
                              </button>
                            ))}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              );
            })()}
          </nav>

          <main className="main-content">

            {tab === 'qrcode' && (
              <QRCodeView 
                user={user} 
                userProfile={userProfile}
                connectGoogleCalendar={connectGoogleCalendar}
                disconnectGoogleCalendar={disconnectGoogleCalendar}
              />
            )}
            {tab === 'dashboard' && <DashboardView userId={farrierId} setTab={setTab} />}
            {tab === 'calendar' && <CalendarView userId={farrierId} />}
            {tab === 'appointments' && <AppointmentsView userId={farrierId} userProfile={userProfile} />}
            {tab === 'invoices' && <InvoicesView userId={farrierId} userProfile={userProfile} />}
            {tab === 'customers' && <CustomersView userId={farrierId} userProfile={userProfile} />}
            {tab === 'horses' && <HorsesView userId={farrierId} />}
            {tab === 'upcoming' && <HorsesView userId={farrierId} upcoming />}
            {tab === 'sponsors' && isSponsorAdmin && <SponsorBannersView />}
            {tab === 'services' && <ServicesView userId={farrierId} />}
            {tab === 'inventory' && <InventoryView userId={farrierId} />}
            {tab === 'data' && <DataManagementView userId={farrierId} />}
            {tab === 'reports' && window.FarriTeam?.role !== 'farrier' && <ReportsView userId={farrierId} />}
            {tab === 'business' && window.FarriTeam?.role !== 'farrier' && <OwnerDashboardView userId={farrierId} />}
            {tab === 'mileage' && <MileageLogView userId={farrierId} userProfile={userProfile} />}
            {tab === 'route' && <RouteSheetView userId={farrierId} userProfile={userProfile} />}
            {tab === 'settings' && <SettingsView user={user} userProfile={userProfile} setUserProfile={setUserProfile} farrierId={farrierId} />}
            {tab === 'about' && <AboutView user={user} userProfile={userProfile} />}
            {tab === 'tutorials' && <TutorialsView />}
            <footer style={{
              textAlign: 'center',
              padding: '16px',
              marginTop: '24px',
              borderTop: '1px solid #e5e7eb',
              fontSize: '0.78rem',
              color: '#9ca3af',
            }}>
              <span>© {new Date().getFullYear()} FarriTech &nbsp;·&nbsp; </span>
              <a href="https://farritech.com/privacy" target="_blank" rel="noreferrer" style={{color:'var(--text-muted)',textDecoration:'none'}}>Privacy Policy</a>
              <span> &nbsp;·&nbsp; </span>
              <a href="https://farritech.com/terms" target="_blank" rel="noreferrer" style={{color:'var(--text-muted)',textDecoration:'none'}}>Terms of Service</a>
              <span> &nbsp;·&nbsp; </span>
              <a href="https://farritech.com/refund-policy" target="_blank" rel="noreferrer" style={{color:'var(--text-muted)',textDecoration:'none'}}>Refund Policy</a>
            </footer>
          </main>
        </div>
      );
    }

    function CustomersView({ userId, userProfile }) {
      const [customers, setCustomers] = useState([]);
      const [loading, setLoading] = useState(true);
      const [search, setSearch] = useState('');
      const [smsFilter, setSmsFilter] = useState('all'); // all | opted_in | opted_out
      const [selectedCustomer, setSelectedCustomer] = useState(null);
      const [detailLoading, setDetailLoading] = useState(false);
      const [customerDetail, setCustomerDetail] = useState(null); // { appointments, invoices, balance }
      const [showAddEdit, setShowAddEdit] = useState(false);
      const [editingCustomer, setEditingCustomer] = useState(null);
      const [saving, setSaving] = useState(false);
      const [confirmDelete, setConfirmDelete] = useState(null);
      const [showNewAppt, setShowNewAppt] = useState(false);
      const [invoiceApt, setInvoiceApt] = useState(null);
      const [horseModal, setHorseModal] = useState(null); // { horse } — horse is null when adding new; presence of the key just controls modal visibility
      const [horseNamesByCustomer, setHorseNamesByCustomer] = useState({}); // customerId → horse names, so search finds an owner by horse name

      // Form state
      const [formName, setFormName] = useState('');
      const [formFarmName, setFormFarmName] = useState('');
      const [formManagerContact, setFormManagerContact] = useState('');
      // Other people to reach for this customer: [{ name, role, phone, email }] (customers/{id}.contacts).
      const [formContacts, setFormContacts] = useState([]);
      const [formEmail, setFormEmail] = useState('');
      const [formSource, setFormSource] = useState('referral');
      const [formPhone, setFormPhone] = useState('');
      const [formAddress, setFormAddress] = useState('');
      const [formCity, setFormCity] = useState('');
      const [formState, setFormState] = useState('');
      const [formZip, setFormZip] = useState('');
      const [formNotes, setFormNotes] = useState('');
      const custAddressRef = useRef(null);
      const custAddressPacRef = useRef(null); // holds the PAC widget instance

      // ---- Customer Address Autocomplete (Google Places) ----
      useEffect(() => {
        if (!showAddEdit) return; // only mount when form is open
        let tries = 0;
        const maxTries = 40;
        const timer = setInterval(() => {
          tries++;
          const container = custAddressRef.current;
          if (window.google?.maps?.places?.PlaceAutocompleteElement && container && !custAddressPacRef.current) {
            clearInterval(timer);
            try {
              const pac = new window.google.maps.places.PlaceAutocompleteElement({
                types: ['address'],
                componentRestrictions: { country: 'us' },
              });
              pac.style.cssText = [
                'width:100%;display:block;',
                '--gmp-filled-input-background-color:#ffffff;',
                '--gmp-filled-input-text-color:#0D1320;',
                '--gmp-input-placeholder-text-color:#94a3b8;',
                '--gmp-color-surface:#ffffff;',
                '--gmp-color-on-surface:#0D1320;',
                '--gmp-color-on-surface-variant:#0D1320;',
                '--gmp-color-outline:#cbd5e1;',
                'color-scheme:light;',
              ].join('');
              container.appendChild(pac);
              custAddressPacRef.current = pac;

              const handlePlaceSelect = async (e) => {
                try {
                  const prediction = e.placePrediction || e.place;
                  if (!prediction) return;
                  const place = prediction.toPlace ? prediction.toPlace() : prediction;
                  await place.fetchFields({ fields: ['addressComponents', 'formattedAddress', 'location', 'id'] });

                  const formatted = place.formattedAddress || '';
                  const comps = place.addressComponents || [];

                  let streetNumber = '', route = '', city = '', state = '', zip = '';
                  if (comps.length > 0) {
                    const get = (type, short = false) => {
                      for (const c of comps) {
                        const types = c.types || [];
                        if (types.includes(type)) return short ? (c.shortText || c.short_name || '') : (c.longText || c.long_name || '');
                      }
                      return '';
                    };
                    streetNumber = get('street_number');
                    route = get('route');
                    city = get('locality') || get('sublocality') || get('postal_town');
                    state = get('administrative_area_level_1', true);
                    zip = get('postal_code');
                  }
                  if (!city && formatted) {
                    const parts = formatted.split(',').map(p => p.trim());
                    if (parts.length >= 3) {
                      city = parts[1] || '';
                      const stateZip = (parts[2] || '').trim().split(' ');
                      state = stateZip[0] || '';
                      zip = stateZip[1] || '';
                    }
                  }
                  const address1 = [streetNumber, route].filter(Boolean).join(' ').trim()
                    || (formatted.split(',')[0] || '').trim();

                  const widgetInput = pac.querySelector('input');
                  if (widgetInput && address1) widgetInput.value = address1;

                  setFormAddress(address1);
                  setFormCity(city);
                  setFormState((state || '').toUpperCase());
                  setFormZip(zip);
                } catch (err) {
                  console.error('Customer PAC error:', err);
                }
              };
              pac.addEventListener('gmp-placeselect', handlePlaceSelect);
              pac.addEventListener('gmp-select', handlePlaceSelect);
            } catch (err) {
              console.error('Failed to init customer PAC:', err);
            }
          } else if (tries >= maxTries) {
            clearInterval(timer);
          }
        }, 200);
        return () => {
          clearInterval(timer);
          if (custAddressPacRef.current && custAddressRef.current) {
            try { custAddressRef.current.removeChild(custAddressPacRef.current); } catch(_) {}
          }
          custAddressPacRef.current = null;
        };
      }, [showAddEdit]);

      const loadCustomers = async () => {
        if (!db) return;
        setLoading(true);
        try {
          const snap = await db.collection('customers')
            .where('farrierId', '==', userId)
            .get();
          const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          list.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
          setCustomers(list);
        } catch (e) {
          console.error('Error loading customers:', e);
        }
        setLoading(false);
        // Horse names for search — the list works without them if this fails.
        try {
          const horseSnap = await db.collection('horses').where('farrierId', '==', userId).get();
          const byCustomer = {};
          horseSnap.docs.forEach(d => {
            const h = d.data();
            if (!h.customerId || !h.name) return;
            (byCustomer[h.customerId] = byCustomer[h.customerId] || []).push(String(h.name));
          });
          setHorseNamesByCustomer(byCustomer);
        } catch (e) {
          console.error('Error loading horses for search:', e);
        }
      };

      useEffect(() => { loadCustomers(); }, [userId]);

      const openDetail = async (cust) => {
        setSelectedCustomer(cust);
        setDetailLoading(true);
        setCustomerDetail(null);
        try {
          // Load appointments by phone (fallback to email match)
          const apptPromise = db.collection('appointments')
            .where('farrierId', '==', userId)
            .where('phone', '==', cust.phone || '__none__')
            .orderBy('requestedDate', 'desc')
            .get()
            .catch(() => db.collection('appointments')
              .where('farrierId', '==', userId)
              .get()
              .then(s => ({ docs: s.docs.filter(d => {
                const d2 = d.data();
                return d2.email === cust.email || d2.phone === cust.phone;
              })}))
            );

          // Load invoices — try email+farrierId, then name+farrierId, then email-only fallback
          const loadInvoices = async () => {
            const results = new Map();

            const tryQuery = async (q) => {
              try {
                const snap = await q.get();
                snap.docs.forEach(d => results.set(d.id, { id: d.id, ...d.data() }));
              } catch(e) { /* silently skip failed queries */ }
            };

            // By email with farrierId
            if (cust.email) {
              await tryQuery(db.collection('invoices').where('farrierId', '==', userId).where('customerEmail', '==', cust.email));
              // Fallback: email only (no farrierId — catches older records)
              await tryQuery(db.collection('invoices').where('customerEmail', '==', cust.email));
            }
            // By name with farrierId
            if (cust.name) {
              await tryQuery(db.collection('invoices').where('farrierId', '==', userId).where('customerName', '==', cust.name));
            }

            return Array.from(results.values()).sort((a, b) => {
              const aT = a.createdAt?.toDate ? a.createdAt.toDate() : new Date(a.createdAt || 0);
              const bT = b.createdAt?.toDate ? b.createdAt.toDate() : new Date(b.createdAt || 0);
              return bT - aT;
            });
          };

          const loadHorses = async () => {
            if (!cust.id) return [];
            try {
              const snap = await db.collection('horses')
                .where('farrierId', '==', userId)
                .where('customerId', '==', cust.id)
                .get();
              return snap.docs.map(d => ({ id: d.id, ...d.data() }))
                .sort((a, b) => String(a.name || '').localeCompare(String(b.name || '')));
            } catch (e) { console.error('Error loading horses:', e); return []; }
          };

          const [apptSnap, invoices, horses] = await Promise.all([apptPromise, loadInvoices(), loadHorses()]);

          const appointments = apptSnap.docs.map(d => ({ id: d.id, ...d.data() }));
          const balance = invoices
            .filter(i => i.status === 'outstanding' || i.status === 'partial')
            .reduce((s, i) => s + (i.balanceDue || Math.max(0, (i.total || 0) - ((i.paidAmount || 0) + ((i.payments||[]).reduce((x,p)=>x+(p.amount||0),0))))), 0);
          const totalPaid = invoices
            .filter(i => i.status === 'paid')
            .reduce((s, i) => s + (i.total || 0), 0);
          setCustomerDetail({ appointments, invoices, horses, balance, totalPaid });
        } catch (e) {
          console.error('Error loading customer detail:', e);
          setCustomerDetail({ appointments: [], invoices: [], horses: [], balance: 0, totalPaid: 0 });
        }
        setDetailLoading(false);
      };

      const refreshHorses = async () => {
        if (!selectedCustomer?.id) return;
        try {
          const snap = await db.collection('horses')
            .where('farrierId', '==', userId)
            .where('customerId', '==', selectedCustomer.id)
            .get();
          const horses = snap.docs.map(d => ({ id: d.id, ...d.data() }))
            .sort((a, b) => String(a.name || '').localeCompare(String(b.name || '')));
          setCustomerDetail(prev => prev ? { ...prev, horses } : prev);
          setHorseNamesByCustomer(prev => ({ ...prev, [selectedCustomer.id]: horses.map(h => String(h.name || '')).filter(Boolean) }));
        } catch (e) { console.error('Error refreshing horses:', e); }
      };

      const openAdd = () => {
        setEditingCustomer(null);
        setFormName(''); setFormFarmName(''); setFormManagerContact(''); setFormEmail(''); setFormPhone('');
        setFormContacts([]);
        setFormAddress(''); setFormCity(''); setFormState(''); setFormZip('');
        setFormNotes(''); setFormSource('referral');
        setShowAddEdit(true);
      };

      const openEdit = (cust) => {
        setEditingCustomer(cust);
        setFormName(cust.name || '');
        setFormFarmName(cust.farmName || '');
        setFormManagerContact(cust.managerContact || '');
        setFormContacts(Array.isArray(cust.contacts) ? cust.contacts.map(c => ({ name: c.name || '', role: c.role || '', phone: c.phone || '', email: c.email || '' })) : []);
        setFormEmail(cust.email || '');
        setFormPhone(cust.phone || '');
        setFormAddress(cust.address || '');
        setFormCity(cust.city || '');
        setFormState(cust.state || '');
        setFormZip(cust.zip || '');
        setFormNotes(cust.notes || '');
        setFormSource(cust.source === 'qr_booking' ? 'qr_booking' : (cust.source || 'referral'));
        setShowAddEdit(true);
      };

      const saveCustomer = async () => {
        if (!formName.trim()) return alert('Name is required.');
        setSaving(true);
        try {
          const payload = {
            farrierId: userId,
            name: formName.trim(),
            farmName: formFarmName.trim(),
            managerContact: formManagerContact.trim(),
            contacts: formContacts
              .map(c => ({ name: c.name.trim(), role: c.role.trim(), phone: c.phone.trim(), email: c.email.trim() }))
              .filter(c => c.name || c.phone || c.email),
            email: formEmail.trim(),
            phone: formPhone.trim(),
            address: formAddress.trim(),
            city: formCity.trim(),
            state: formState.trim().toUpperCase(),
            zip: formZip.trim(),
            notes: formNotes.trim(),
            source: formSource,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
          };
          if (editingCustomer) {
            await db.collection('customers').doc(editingCustomer.id).update(payload);
            if (selectedCustomer && selectedCustomer.id === editingCustomer.id) {
              setSelectedCustomer({ ...selectedCustomer, ...payload });
            }
          } else {
            await db.collection('customers').add({
              ...payload,
              smsOptOut: false,
              createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            });
          }
          setShowAddEdit(false);
          await loadCustomers();
        } catch (e) {
          alert('Error saving customer: ' + e.message);
        }
        setSaving(false);
      };

      const deleteCustomer = async (cust) => {
        try {
          await db.collection('customers').doc(cust.id).delete();
          if (selectedCustomer && selectedCustomer.id === cust.id) setSelectedCustomer(null);
          setConfirmDelete(null);
          await loadCustomers();
        } catch (e) {
          alert('Error deleting customer: ' + e.message);
        }
      };

      const toggleSmsOptOut = async (cust) => {
        try {
          const newVal = !cust.smsOptOut;
          await db.collection('customers').doc(cust.id).update({ smsOptOut: newVal });
          setCustomers(prev => prev.map(c => c.id === cust.id ? { ...c, smsOptOut: newVal } : c));
          if (selectedCustomer && selectedCustomer.id === cust.id) {
            setSelectedCustomer({ ...selectedCustomer, smsOptOut: newVal });
          }
        } catch (e) {
          alert('Error updating SMS preference: ' + e.message);
        }
      };

      // "123 Main St, Wellington, FL 33414" from whichever address parts the customer has.
      const custAddress = (c) => [c.address, c.city, [c.state, c.zip].filter(Boolean).join(' ')].map(x => String(x || '').trim()).filter(Boolean).join(', ');
      const searchQ = search.trim().toLowerCase();
      const matchingHorses = (c) => searchQ ? (horseNamesByCustomer[c.id] || []).filter(n => n.toLowerCase().includes(searchQ)) : [];
      const filtered = customers.filter(c => {
        const q = search.toLowerCase();
        const matchSearch = !q || matchingHorses(c).length > 0 ||
          (c.name || '').toLowerCase().includes(q) ||
          (c.farmName || '').toLowerCase().includes(q) ||
          (c.managerContact || '').toLowerCase().includes(q) ||
          (c.email || '').toLowerCase().includes(q) ||
          custAddress(c).toLowerCase().includes(q) ||
          (Array.isArray(c.contacts) && c.contacts.some(k => `${k.name || ''} ${k.role || ''} ${k.email || ''}`.toLowerCase().includes(q)
            || (q.replace(/\D/g, '').length >= 3 && String(k.phone || '').replace(/\D/g, '').includes(q.replace(/\D/g, ''))))) ||
          (c.phone || '').includes(q) ||
          (q.replace(/\D/g, '').length >= 3 && (c.phone || '').replace(/\D/g, '').includes(q.replace(/\D/g, '')));
        const matchSms = smsFilter === 'all' ||
          (smsFilter === 'opted_out' && c.smsOptOut) ||
          (smsFilter === 'opted_in' && !c.smsOptOut);
        return matchSearch && matchSms;
      });

      const fmtDate = (ts) => {
        if (!ts) return '—';
        const d = ts.toDate ? ts.toDate() : new Date(ts);
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      };

      const fmtMoney = (n) => `$${(n || 0).toFixed(2)}`;

      const statusColor = { pending: '#f59e0b', confirmed: '#10b981', cancelled: '#ef4444', invoiced: '#6366f1' };

      // ── ADD/EDIT MODAL ──
      if (showAddEdit) return (
        <div className="card" style={{ maxWidth: 560, margin: '0 auto' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1.5rem' }}>
            <h2 style={{ margin: 0, color: 'var(--primary)' }}>{editingCustomer ? '✏️ Edit Customer' : '➕ Add Customer'}</h2>
            <button className="btn btn-sm btn-outline" onClick={() => setShowAddEdit(false)}>✕ Cancel</button>
          </div>
          {[
            { label: 'Full Name *', val: formName, set: setFormName, type: 'text', ph: 'Jane Smith' },
            { label: 'Farm / Business Name', val: formFarmName, set: setFormFarmName, type: 'text', ph: 'Sunny Acres Farm' },
            { label: 'Manager / Contact', val: formManagerContact, set: setFormManagerContact, type: 'text', ph: 'Barn manager or on-site contact name' },
            { label: 'Email', val: formEmail, set: setFormEmail, type: 'email', ph: 'jane@example.com' },
            { label: 'Phone', val: formPhone, set: setFormPhone, type: 'tel', ph: '(555) 555-5555', isPhone: true },
          ].map(f => (
            <div className="form-group" key={f.label}>
              <label>{f.label}</label>
              <input type={f.type} value={f.isPhone ? fmtPhone(f.val) : f.val} placeholder={f.ph}
                onChange={e => f.set(f.isPhone ? e.target.value.replace(/\D/g, '').slice(0, 11) : e.target.value)}
                style={{ width: '100%', padding: '0.75rem', borderRadius: 8, border: '2px solid var(--border)', fontFamily: 'Outfit,sans-serif', fontSize: '1rem', boxSizing: 'border-box' }} />
            </div>
          ))}

          {/* Address with Google Places Autocomplete */}
          <div className="form-group">
            <label>Street Address</label>
            <div ref={custAddressRef} style={{ width: '100%' }}>
              {/* Google PlaceAutocompleteElement mounts here */}
            </div>
            {/* Fallback manual input shown if PAC didn't mount (e.g. slow load) */}
            {!custAddressPacRef.current && (
              <input type="text" value={formAddress} placeholder="123 Main St"
                onChange={e => setFormAddress(e.target.value)}
                style={{ width: '100%', padding: '0.75rem', borderRadius: 8, border: '2px solid var(--border)', fontFamily: 'Outfit,sans-serif', fontSize: '1rem', boxSizing: 'border-box', marginTop: 4 }} />
            )}
          </div>

          {/* City / State / Zip row */}
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 80px 110px', gap: '0.75rem' }}>
            <div className="form-group" style={{ margin: 0 }}>
              <label>City</label>
              <input type="text" value={formCity} placeholder="Orlando"
                onChange={e => setFormCity(e.target.value)}
                style={{ width: '100%', padding: '0.75rem', borderRadius: 8, border: '2px solid var(--border)', fontFamily: 'Outfit,sans-serif', fontSize: '1rem', boxSizing: 'border-box' }} />
            </div>
            <div className="form-group" style={{ margin: 0 }}>
              <label>State</label>
              <input type="text" value={formState} placeholder="FL" maxLength={2}
                onChange={e => setFormState(e.target.value.toUpperCase())}
                style={{ width: '100%', padding: '0.75rem', borderRadius: 8, border: '2px solid var(--border)', fontFamily: 'Outfit,sans-serif', fontSize: '1rem', boxSizing: 'border-box', textTransform: 'uppercase' }} />
            </div>
            <div className="form-group" style={{ margin: 0 }}>
              <label>Zip Code</label>
              <input type="text" value={formZip} placeholder="32801" maxLength={10}
                onChange={e => setFormZip(e.target.value)}
                style={{ width: '100%', padding: '0.75rem', borderRadius: 8, border: '2px solid var(--border)', fontFamily: 'Outfit,sans-serif', fontSize: '1rem', boxSizing: 'border-box' }} />
            </div>
          </div>
          <div className="form-group">
            <label>Notes</label>
            <textarea value={formNotes} placeholder="Horse names, special instructions, preferences…"
              onChange={e => setFormNotes(e.target.value)} rows={3}
              style={{ width: '100%', padding: '0.75rem', borderRadius: 8, border: '2px solid var(--border)', fontFamily: 'Outfit,sans-serif', fontSize: '1rem', resize: 'vertical', boxSizing: 'border-box' }} />
          </div>

          {/* Other contacts: barn manager, spouse, trainer, vet… */}
          <div className="form-group">
            <label>Other Contacts</label>
            {formContacts.map((c, i) => {
              const setField = (k, v) => setFormContacts(prev => prev.map((x, j) => j === i ? { ...x, [k]: v } : x));
              const inp = { padding: '0.6rem', borderRadius: 8, border: '2px solid var(--border)', fontFamily: 'Outfit,sans-serif', fontSize: '0.95rem', boxSizing: 'border-box', minWidth: 0 };
              return (
                <div key={i} style={{ display: 'grid', gridTemplateColumns: '1.2fr 1fr 1fr 1.3fr auto', gap: '0.4rem', marginBottom: '0.4rem' }}>
                  <input type="text" value={c.name} placeholder="Name" onChange={e => setField('name', e.target.value)} style={inp} />
                  <input type="text" value={c.role} placeholder="Role (e.g. Trainer)" list="contact-roles" onChange={e => setField('role', e.target.value)} style={inp} />
                  <input type="tel" value={fmtPhone(c.phone)} placeholder="Phone" onChange={e => setField('phone', e.target.value.replace(/\D/g, '').slice(0, 11))} style={inp} />
                  <input type="email" value={c.email} placeholder="Email (optional)" onChange={e => setField('email', e.target.value)} style={inp} />
                  <button type="button" className="btn btn-sm btn-outline" title="Remove contact" onClick={() => setFormContacts(prev => prev.filter((_, j) => j !== i))}>✕</button>
                </div>
              );
            })}
            <datalist id="contact-roles">
              {['Barn manager', 'Spouse', 'Trainer', 'Rider', 'Vet', 'Groom', 'Owner', 'Other'].map(r => <option key={r} value={r} />)}
            </datalist>
