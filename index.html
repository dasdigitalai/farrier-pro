      const now = new Date();
      const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
      const monthEnd = new Date(now.getFullYear(), now.getMonth() + 1, 0);
      const weekEnd = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 7);

      const apptSnap = await db.collection('appointments')
        .where('farrierId', '==', userId)
        .get();

      apptSnap.forEach(doc => {
        const a = doc.data() || {};
        const dStr = a.requestedDate || a.date || "";
        if (!dStr) return;

        // expected "YYYY-MM-DD"
        const parts = String(dStr).split('-').map(Number);
        if (parts.length !== 3 || !parts[0] || !parts[1] || !parts[2]) return;
        const d = new Date(parts[0], parts[1] - 1, parts[2]);

        if (d >= monthStart && d <= monthEnd) monthAppointments++;
        if (d >= new Date(now.getFullYear(), now.getMonth(), now.getDate()) && d < weekEnd) upcomingWeek++;
      });

      // ---- Invoices / Revenue (optional) ----
      // If you haven't built invoices yet, these will remain 0.
      let totalRevenue = 0;
      let outstandingInvoices = 0;
      try {
        const invSnap = await db.collection('invoices')
          .where('farrierId', '==', userId)
          .get();

        invSnap.forEach(doc => {
          const inv = doc.data() || {};
          const amount = Number(inv.amount || inv.total || inv.totalAmount || 0) || 0;
          const status = String(inv.status || '').toLowerCase();

          const paidAmt = Number(inv.paidAmount || 0) || (Array.isArray(inv.payments) ? inv.payments.reduce((s,p) => s+(p.amount||0), 0) : 0) || (status === 'paid' || status === 'settled' ? amount : 0);
          totalRevenue += paidAmt;
          if (status === 'outstanding' || status === 'partial') outstandingInvoices += Math.max(0, amount - paidAmt);
        });
      } catch (e) {
        // invoices collection may not exist yet - that's fine
      }

      // ---- Inventory low-stock count (optional) ----
      try {
        const invItemSnap = await db.collection('inventoryItems')
          .where('farrierId', '==', userId)
          .where('isConsumable', '==', true)
          .get();
        const lowStock = invItemSnap.docs.filter(d => {
          const item = d.data();
          return Number(item.quantityOnHand || 0) < Number(item.reorderThreshold || 0);
        });
        setLowStockCount(lowStock.length);
      } catch (e) {
        // inventoryItems collection may not exist yet - that's fine
      }

      setStats({
        monthAppointments,
        totalRevenue,
        outstandingInvoices,
        upcomingWeek,
      });
    } catch (err) {
      console.error('❌ Error loading dashboard stats:', err);
      setStats({ monthAppointments: 0, totalRevenue: 0, outstandingInvoices: 0, upcomingWeek: 0 });
    }
    setLoading(false);
  };

  const kpis = [
    { label: 'Appointments This Month', value: loading ? '…' : String(stats.monthAppointments), change: 'Live', positive: true },
    { label: 'Total Revenue', value: loading ? '…' : `$${stats.totalRevenue.toFixed(2)}`, change: 'Paid invoices', positive: true },
    { label: 'Outstanding Invoices', value: loading ? '…' : `$${stats.outstandingInvoices.toFixed(2)}`, change: 'Unpaid', positive: true },
    { label: 'This Week', value: loading ? '…' : String(stats.upcomingWeek), change: 'Upcoming', positive: true },
  ];

  return (
    <div>
      <h1 style={{marginBottom: '1.5rem', fontSize: '2rem', color: 'var(--primary)'}}>Dashboard Overview</h1>

      {lowStockCount > 0 && (
        <div onClick={() => setTab && setTab('inventory')}
          style={{ padding: '0.75rem 1rem', borderRadius: 8, background: '#fff5f5', border: '2px solid #fecaca', color: '#dc2626', fontWeight: 600, marginBottom: '1.5rem', cursor: 'pointer' }}>
          ⚠️ {lowStockCount} inventory item{lowStockCount > 1 ? 's' : ''} low on stock — tap to view
        </div>
      )}

      <div className="dashboard-grid">
        {kpis.map((kpi, idx) => (
          <div key={idx} className="stat-card">
            <div className="stat-label">{kpi.label}</div>
            <div className="stat-value">{kpi.value}</div>
            <div className={`stat-change ${kpi.positive ? 'positive' : ''}`}>
              {kpi.change}
            </div>
          </div>
        ))}
      </div>

      <div className="card">
        <h2>Recent Activity</h2>
        <p style={{color: 'var(--text-muted)'}}>
          Your real appointments are pulled from Firestore (appointments where farrierId = your userId).
        </p>
      </div>
    </div>
  );
}

function CalendarView({ userId }) {
      // Month / Week / Day calendar of the farrier's appointments, plus the horses actually
      // worked on each day. "Horses done" comes from that day's invoice lines (one per horse),
      // topped up with horses on that day's completed/invoiced appointments that no invoice
      // line already covers.
      const [view, setView] = useState('month');
      const [cursor, setCursor] = useState(() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); });
      const [appointments, setAppointments] = useState([]);
      const [invoices, setInvoices] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        if (!db || !userId) { setLoading(false); return; }
        (async () => {
          try {
            const [aSnap, iSnap] = await Promise.all([
              db.collection('appointments').where('farrierId', '==', userId).get(),
              db.collection('invoices').where('farrierId', '==', userId).get(),
            ]);
            setAppointments(aSnap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
            setInvoices(iSnap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
          } catch (error) {
            console.error('❌ Error loading calendar:', error);
          }
          setLoading(false);
        })();
      }, [userId]);

      const pad = (n) => String(n).padStart(2, '0');
      const keyOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
      const todayKey = keyOf(new Date());
      const toDate = (v) => v?.toDate ? v.toDate() : (typeof v?.seconds === 'number' ? new Date(v.seconds * 1000) : (v ? new Date(v) : null));
      const fmtTime = (t) => {
        if (!t || !t.includes(':')) return '';
        const [h, m] = t.split(':').map(Number);
        return `${h % 12 || 12}:${pad(m || 0)} ${h >= 12 ? 'PM' : 'AM'}`;
      };
      const norm = (s) => String(s || '').trim().toLowerCase();

      // Horses booked on an appointment: per-horse requests, else the plain horse names.
      const horsesOf = (a) => {
        if (Array.isArray(a.horseRequests) && a.horseRequests.length) {
          return a.horseRequests.map(r => ({ name: r.horseName || 'Horse', services: r.services || [] }));
        }
        return (a.horseNames || []).map(n => ({ name: n, services: a.services || [] }));
      };

      const byDay = React.useMemo(() => {
        const days = {};
        const day = (k) => (days[k] = days[k] || { appts: [], done: [] });
        appointments.forEach(a => {
          if (!a.requestedDate) return;
          day(a.requestedDate).appts.push(a);
        });
        Object.values(days).forEach(d => d.appts.sort((x, y) => String(x.requestedTime || '99').localeCompare(String(y.requestedTime || '99'))));

        // Horses done: invoice lines on the invoice's date…
        invoices.forEach(inv => {
          if (inv.status === 'cancelled') return;
          const d = toDate(inv.createdAt);
          if (!d || isNaN(d)) return;
          const k = keyOf(d);
          const perHorse = {};
          (inv.items || []).forEach(it => {
            // "Multiple horses × 10" for a group line, so the day's recap shows how many.
            const horse = FarriPricing.itemHorseLabel({ horseName: it.horseName, qty: it.qty });
            if (!horse) return;
            const id = norm(horse);
            perHorse[id] = perHorse[id] || { horse, customer: inv.customerName || '', farm: inv.customerFarmName || '', services: [], invoiceNumber: inv.invoiceNumber || '' };
            const svc = it.serviceNameSnapshot || it.description || it.serviceName;
            if (svc) perHorse[id].services.push(svc);
          });
          Object.values(perHorse).forEach(h => day(k).done.push(h));
        });
        // …plus horses on completed/invoiced appointments that day not already listed.
        Object.entries(days).forEach(([k, d]) => {
          d.appts.forEach(a => {
            if (!(a.status === 'completed' || a.status === 'invoiced' || a.invoiced)) return;
            horsesOf(a).forEach(h => {
              const dup = d.done.some(x => norm(x.horse) === norm(h.name) && norm(x.customer) === norm(a.customerName));
              if (!dup) d.done.push({ horse: h.name, customer: a.customerName || '', farm: a.farmName || '', services: h.services, invoiceNumber: '' });
            });
          });
        });
        return days;
      }, [appointments, invoices]);

      const dayData = (k) => byDay[k] || { appts: [], done: [] };
      const live = (a) => a.status !== 'cancelled';

      // ── navigation ──
      const step = (dir) => {
        if (view === 'month') setCursor(new Date(cursor.getFullYear(), cursor.getMonth() + dir, 1));
        else setCursor(addDays(cursor, dir * (view === 'week' ? 7 : 1)));
      };
      const goToday = () => { const d = new Date(); setCursor(new Date(d.getFullYear(), d.getMonth(), d.getDate())); };
      const openDay = (d) => { setCursor(d); setView('day'); };
      const weekStart = addDays(cursor, -cursor.getDay());
      const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      const title = view === 'month'
        ? `${monthNames[cursor.getMonth()]} ${cursor.getFullYear()}`
        : view === 'week'
          ? `${weekStart.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} – ${addDays(weekStart, 6).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`
          : cursor.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

      const statusStyle = (s) => ({
        confirmed: { bg: '#dcfce7', fg: '#166534', label: 'Confirmed' },
        completed: { bg: '#dbeafe', fg: '#1e40af', label: 'Completed' },
        invoiced: { bg: '#e0e7ff', fg: '#3730a3', label: 'Invoiced' },
        cancelled: { bg: '#fee2e2', fg: '#991b1b', label: 'Cancelled' },
      }[s] || { bg: '#fef3c7', fg: '#92400e', label: s ? s[0].toUpperCase() + s.slice(1) : 'Pending' });
      const pill = (bg, fg, text) => <span style={{ background: bg, color: fg, borderRadius: 999, padding: '0.1rem 0.5rem', fontSize: '0.72rem', fontWeight: 700, whiteSpace: 'nowrap' }}>{text}</span>;
      const horseCount = (k) => dayData(k).done.length;

      // ── Month ──
      const renderMonth = () => {
        const first = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
        const daysInMonth = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 0).getDate();
        const cells = [];
        for (let i = 0; i < first.getDay(); i++) cells.push(<div key={`e${i}`} className="calendar-day" style={{ aspectRatio: 'auto', minHeight: 96 }} />);
        for (let i = 1; i <= daysInMonth; i++) {
          const d = new Date(cursor.getFullYear(), cursor.getMonth(), i);
          const k = keyOf(d);
          const appts = dayData(k).appts.filter(live);
          const confirmed = appts.filter(a => a.status === 'confirmed').length;
          const other = appts.length - confirmed;
          const horses = horseCount(k);
          cells.push(
            <div key={k} className="calendar-day" onClick={() => openDay(d)} title="Open this day"
              style={{ aspectRatio: 'auto', minHeight: 96, flexDirection: 'column', alignItems: 'stretch', justifyContent: 'flex-start', padding: '0.4rem', gap: '0.25rem' }}>
              <div style={{ alignSelf: 'flex-end', fontWeight: 700, width: 26, height: 26, lineHeight: '26px', textAlign: 'center', borderRadius: '50%',
                background: k === todayKey ? 'var(--primary)' : 'transparent', color: k === todayKey ? '#fff' : 'var(--text)' }}>{i}</div>
              {confirmed > 0 && pill('#dcfce7', '#166534', `✓ ${confirmed} confirmed`)}
              {other > 0 && pill('#fef3c7', '#92400e', `⏳ ${other} ${other === 1 ? 'appt' : 'appts'}`)}
              {horses > 0 && pill('#dbeafe', '#1e40af', `🐴 ${horses} done`)}
            </div>
          );
        }
        return (
          <div className="calendar-grid">
            {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(day => <div key={day} className="calendar-day header" style={{ aspectRatio: 'auto', padding: '0.5rem' }}>{day}</div>)}
            {cells}
          </div>
        );
      };

      const apptCard = (a, compact) => {
        const st = statusStyle(a.status);
        const horses = horsesOf(a);
        return (
          <div key={a.id} style={{ border: '1px solid var(--border)', borderLeft: `4px solid ${st.fg}`, borderRadius: 8, padding: compact ? '0.4rem 0.5rem' : '0.75rem 1rem', background: 'var(--surface)', opacity: a.status === 'cancelled' ? 0.55 : 1 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', gap: '0.5rem', alignItems: 'baseline', flexWrap: 'wrap' }}>
              <strong style={{ fontSize: compact ? '0.8rem' : '1rem', textDecoration: a.status === 'cancelled' ? 'line-through' : 'none' }}>
                {fmtTime(a.requestedTime) && <span style={{ color: 'var(--primary)' }}>{fmtTime(a.requestedTime)} </span>}
                {a.customerName || 'Customer'}
              </strong>
              {!compact && pill(st.bg, st.fg, st.label)}
            </div>
            {!compact && a.farmName && <div style={{ color: 'var(--text-muted)', fontSize: '0.85rem' }}>{a.farmName}</div>}
            {!compact && (a.address || a.city) && <div style={{ color: 'var(--text-muted)', fontSize: '0.85rem' }}>📍 {[a.address, a.city, a.state].filter(Boolean).join(', ')}</div>}
            {horses.length > 0 ? (
              <div style={{ fontSize: compact ? '0.75rem' : '0.88rem', marginTop: '0.2rem' }}>
                {horses.map((h, i) => (
                  <div key={i}>🐴 <strong>{h.name}</strong>{!compact && h.services.length ? <span style={{ color: 'var(--text-muted)' }}> — {h.services.join(', ')}</span> : null}</div>
                ))}
              </div>
            ) : (
              (a.numberOfHorses || (a.services || []).length) ? (
                <div style={{ fontSize: compact ? '0.75rem' : '0.88rem', color: 'var(--text-muted)', marginTop: '0.2rem' }}>
                  {a.numberOfHorses ? `🐴 ${a.numberOfHorses} horse${a.numberOfHorses == 1 ? '' : 's'}` : ''}{!compact && (a.services || []).length ? ` · ${a.services.join(', ')}` : ''}
                </div>
              ) : null
            )}
          </div>
        );
      };

      const doneList = (done, compact) => (
        <div style={{ display: 'flex', flexDirection: 'column', gap: compact ? '0.15rem' : '0.4rem' }}>
          {done.map((h, i) => (
            <div key={i} style={{ fontSize: compact ? '0.75rem' : '0.9rem', background: compact ? 'transparent' : '#f0f9ff', border: compact ? 'none' : '1px solid #dbeafe', borderRadius: 8, padding: compact ? 0 : '0.5rem 0.75rem' }}>
              ✅ <strong>{h.horse}</strong>
              <span style={{ color: 'var(--text-muted)' }}> · {h.customer}{!compact && h.farm ? ` (${h.farm})` : ''}</span>
              {!compact && h.services.length > 0 && <div style={{ color: 'var(--text-muted)', fontSize: '0.82rem', marginTop: 2 }}>{h.services.join(', ')}{h.invoiceNumber ? ` · Invoice #${h.invoiceNumber}` : ''}</div>}
            </div>
          ))}
        </div>
      );

      // ── Week ──
      const renderWeek = () => (
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, minmax(0, 1fr))', gap: '0.5rem', overflowX: 'auto' }}>
          {Array.from({ length: 7 }, (_, i) => addDays(weekStart, i)).map(d => {
            const k = keyOf(d);
            const { appts, done } = dayData(k);
            return (
              <div key={k} style={{ minWidth: 130, border: '1px solid var(--border)', borderRadius: 10, background: k === todayKey ? '#eff6ff' : '#f8fafc', display: 'flex', flexDirection: 'column' }}>
                <button onClick={() => openDay(d)} title="Open this day"
                  style={{ background: 'none', border: 'none', borderBottom: '1px solid var(--border)', padding: '0.5rem', cursor: 'pointer', textAlign: 'center', fontFamily: 'inherit' }}>
                  <div style={{ fontSize: '0.75rem', fontWeight: 700, textTransform: 'uppercase', color: 'var(--text-muted)' }}>{d.toLocaleDateString('en-US', { weekday: 'short' })}</div>
                  <div style={{ fontSize: '1.2rem', fontWeight: 800, color: k === todayKey ? 'var(--primary)' : 'var(--text)' }}>{d.getDate()}</div>
                </button>
                <div style={{ padding: '0.4rem', display: 'flex', flexDirection: 'column', gap: '0.35rem', flex: 1 }}>
                  {appts.map(a => apptCard(a, true))}
                  {!appts.length && <div style={{ fontSize: '0.75rem', color: 'var(--text-muted)', textAlign: 'center', padding: '0.5rem 0' }}>No appointments</div>}
                </div>
                {done.length > 0 && (
                  <div style={{ borderTop: '1px solid var(--border)', padding: '0.4rem', background: '#f0f9ff', borderRadius: '0 0 10px 10px' }}>
                    <div style={{ fontSize: '0.7rem', fontWeight: 700, color: '#1e40af', textTransform: 'uppercase', marginBottom: 2 }}>🐴 {done.length} done</div>
                    {doneList(done, true)}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      );

      // ── Day ──
      const renderDay = () => {
        const { appts, done } = dayData(keyOf(cursor));
        const booked = appts.filter(live).reduce((n, a) => n + (horsesOf(a).length || Number(a.numberOfHorses) || 0), 0);
        return (
          <div style={{ display: 'grid', gridTemplateColumns: 'minmax(0, 3fr) minmax(0, 2fr)', gap: '1.25rem' }} className="ft-day-grid">
            <div>
              <h3 style={{ margin: '0 0 0.75rem' }}>📋 Appointments ({appts.filter(live).length}){booked ? <span style={{ color: 'var(--text-muted)', fontWeight: 400, fontSize: '0.9rem' }}> · {booked} horse{booked === 1 ? '' : 's'} booked</span> : null}</h3>
              <div style={{ display: 'flex', flexDirection: 'column', gap: '0.6rem' }}>
                {appts.map(a => apptCard(a, false))}
                {!appts.length && <p style={{ color: 'var(--text-muted)' }}>No appointments this day.</p>}
              </div>
            </div>
            <div>
              <h3 style={{ margin: '0 0 0.75rem' }}>🐴 Horses done ({done.length})</h3>
              {done.length ? doneList(done, false) : <p style={{ color: 'var(--text-muted)' }}>No horses recorded as done this day. They appear here once they're on an invoice, or the appointment is marked completed.</p>}
            </div>
          </div>
        );
      };

      const viewBtn = (id, label) => (
        <button className={`btn btn-sm ${view === id ? 'btn-primary' : 'btn-outline'}`} onClick={() => setView(id)}>{label}</button>
      );

      return (
        <div>
          <style>{`@media (max-width: 900px) { .ft-day-grid { grid-template-columns: 1fr !important; } }`}</style>
          <h1 style={{ marginBottom: '1.5rem', fontSize: '2rem', color: 'var(--primary)' }}>Calendar</h1>
          <div className="calendar">
            <div className="calendar-header" style={{ flexWrap: 'wrap', gap: '0.75rem' }}>
              <h2 className="calendar-title" style={{ margin: 0 }}>{title}</h2>
              <div style={{ display: 'flex', gap: '0.5rem', flexWrap: 'wrap', alignItems: 'center' }}>
                <div style={{ display: 'flex', gap: '0.25rem' }}>{viewBtn('month', 'Month')}{viewBtn('week', 'Week')}{viewBtn('day', 'Day')}</div>
                <div className="calendar-nav">
                  <button className="btn btn-sm btn-outline" onClick={() => step(-1)} aria-label="Previous">←</button>
                  <button className="btn btn-sm btn-outline" onClick={goToday}>Today</button>
                  <button className="btn btn-sm btn-outline" onClick={() => step(1)} aria-label="Next">→</button>
                </div>
              </div>
            </div>
            {loading ? <p style={{ color: 'var(--text-muted)' }}>Loading…</p>
              : view === 'month' ? renderMonth() : view === 'week' ? renderWeek() : renderDay()}
          </div>
          {view === 'month' && (
            <div style={{ marginTop: '1rem', display: 'flex', gap: '1rem', justifyContent: 'center', flexWrap: 'wrap', fontSize: '0.85rem', color: 'var(--text-muted)' }}>
              <span>{pill('#dcfce7', '#166534', '✓')} Confirmed</span>
              <span>{pill('#fef3c7', '#92400e', '⏳')} Other appointments</span>
              <span>{pill('#dbeafe', '#1e40af', '🐴')} Horses done</span>
              <span>Click a day to see it in detail.</span>
            </div>
          )}
        </div>
      );
    }

    function AppointmentsView({ userId, userProfile }) {
      const [appointments, setAppointments] = useState([]);
      const [loading, setLoading] = useState(true);
      const [showInvoiceModal, setShowInvoiceModal] = useState(false);
      const [selectedAppointment, setSelectedAppointment] = useState(null);
      const [sortOrder, setSortOrder] = useState('newest'); // 'newest' or 'oldest'
      const [appointmentFilter, setAppointmentFilter] = useState('all'); // all, pending, confirmed, cancelled, invoiced, thisMonth, lastMonth
      const [showEditModal, setShowEditModal] = useState(false);
      const [editingAppointment, setEditingAppointment] = useState(null);
      const [showCancelApptModal, setShowCancelApptModal] = useState(false);
      const [cancellingAppointment, setCancellingAppointment] = useState(null);

      useEffect(() => {
        loadAppointments();
      }, []);

      const loadAppointments = async () => {
        if (db) {
          try {
            const snapshot = await db.collection('appointments')
              .where('farrierId', '==', userId)
              .get();
            
            const appointmentData = snapshot.docs.map(doc => {
              const data = doc.data();
              
              // Clean up time format: convert "HH:MM:SS" to "HH:MM"
              if (data.requestedTime && data.requestedTime.includes(':')) {
                const timeParts = data.requestedTime.split(':');
                if (timeParts.length === 3) {
                  // Has seconds, remove them
                  data.requestedTime = `${timeParts[0]}:${timeParts[1]}`;
                  console.log(`🕐 Fixed time format: ${doc.data().requestedTime} → ${data.requestedTime}`);
                }
              }
              
              return {
                id: doc.id,
                ...data
              };
            });
            
            // One-time cleanup: Fix time formats in database
            appointmentData.forEach(async (apt) => {
              if (apt.requestedTime && apt.requestedTime.split(':').length === 3) {
                // This appointment has HH:MM:SS format, fix it in the database
                const timeParts = apt.requestedTime.split(':');
                const cleanTime = `${timeParts[0]}:${timeParts[1]}`;
                try {
                  await db.collection('appointments').doc(apt.id).update({
                    requestedTime: cleanTime
                  });
                  console.log(`✅ Fixed time in database for ${apt.id}: ${apt.requestedTime} → ${cleanTime}`);
                } catch (error) {
                  console.error(`❌ Error fixing time for ${apt.id}:`, error);
                }
              }
            });
            
            setAppointments(appointmentData);
            console.log('✅ Loaded appointments:', appointmentData.length);
          } catch (error) {
            console.error('❌ Error loading appointments:', error);
          }
        }
        setLoading(false);
      };

      // Filter appointments
      const getFilteredAppointments = () => {
        const now = new Date();
        const currentYear = now.getFullYear();
        const currentMonth = now.getMonth();

        return appointments.filter(apt => {
          // Status filters
          if (appointmentFilter === 'pending') return apt.status === 'pending';
          if (appointmentFilter === 'confirmed') return apt.status === 'confirmed' || apt.status === 'confirmed_by_customer';
          if (appointmentFilter === 'cancelled') return apt.status === 'cancelled';
          if (appointmentFilter === 'invoiced') return !!apt.invoiced;

          // 'all' and date filters: hide cancelled by default
          if (apt.status === 'cancelled') return false;

          // Date filters - use requestedDate (appointment date)
          if (!apt.requestedDate) return true;
          const aptDate = new Date(apt.requestedDate);
          const aptYear = aptDate.getFullYear();
          const aptMonth = aptDate.getMonth();

          if (appointmentFilter === 'thisMonth') {
            return aptYear === currentYear && aptMonth === currentMonth;
          }
          if (appointmentFilter === 'lastMonth') {
            const lastMonth = currentMonth === 0 ? 11 : currentMonth - 1;
            const lastMonthYear = currentMonth === 0 ? currentYear - 1 : currentYear;
            return aptYear === lastMonthYear && aptMonth === lastMonth;
          }

          return true;
        });
      };

      // Get sorted appointments based on sortOrder
      const getSortedAppointments = () => {
        const filtered = getFilteredAppointments();
        return [...filtered].sort((a, b) => {
          if (!a.createdAt || !b.createdAt) return 0;
          const dateA = a.createdAt.toDate();
          const dateB = b.createdAt.toDate();
          return sortOrder === 'newest' ? dateB - dateA : dateA - dateB;
        });
      };

      const sortedAppointments = getSortedAppointments();

      const deleteCalendarEvent = async (appointment, userProfile) => {
        console.log('🗑️ DELETE CALENDAR EVENT START');
        
        if (!appointment.googleEventId) {
          console.log('⚠️ No Google Event ID found - event may not be in calendar');
          return true; // Not an error, just wasn't synced yet
        }
        
        if (!userProfile?.googleCalendarConnected) {
          console.error('❌ Calendar not connected');
          return false;
        }

        try {
          const accessToken = await getCalendarAccessToken();
          if (!accessToken) return false;
          
          console.log('🗑️ Deleting event from Google Calendar:', appointment.googleEventId);
          
          const response = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${appointment.googleEventId}`, {
            method: 'DELETE',
            headers: {
              'Authorization': `Bearer ${accessToken}`
            }
          });

          if (response.ok || response.status === 404) {
            console.log('✅ Calendar event deleted successfully!');
            return true;
          } else {
            console.error('❌ Failed to delete calendar event:', response.status);
            return false;
          }
        } catch (error) {
          console.error('❌ Calendar deletion error:', error);
          return false;
        }
      };

      const updateStatus = async (appointmentId, newStatus) => {
        console.log('🔵 updateStatus called:', { appointmentId, newStatus });
        
        if (db) {
          await db.collection('appointments').doc(appointmentId).update({
            status: newStatus,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
            ...(newStatus === 'confirmed' ? { confirmedAt: firebase.firestore.FieldValue.serverTimestamp() } : {}),
            ...(newStatus === 'cancelled' ? { cancelledAt: firebase.firestore.FieldValue.serverTimestamp() } : {})
          });
          console.log('✅ Status updated in Firebase');
          
          const appointment = appointments.find(apt => apt.id === appointmentId);
          
          // If confirming, add to Google Calendar + send SMS
          if (newStatus === 'confirmed') {
            console.log('🟢 Status is confirmed');
            if (appointment) {
              // ── Ensure customer record exists ──────────────────────────────
              if (db && appointment.customerName) {
                try {
                  const custEmail = (appointment.email || appointment.customerEmail || '').toLowerCase().trim();
                  const custName  = (appointment.customerName || '').trim();
                  // Check by email first, then by name
                  let custExists = false;
                  if (custEmail) {
                    const byEmail = await db.collection('customers')
                      .where('farrierId', '==', farrierId)
                      .where('email', '==', custEmail)
                      .limit(1).get();
                    custExists = !byEmail.empty;
                  }
                  if (!custExists && custName) {
                    const byName = await db.collection('customers')
                      .where('farrierId', '==', farrierId)
                      .where('name', '==', custName)
                      .limit(1).get();
                    custExists = !byName.empty;
                  }
                  if (!custExists) {
                    await db.collection('customers').add({
                      farrierId,
                      name: custName,
                      farmName: appointment.farmName || '',
                      email: custEmail,
                      phone: appointment.phone || '',
                      address: appointment.address || '',
                      city: appointment.city || '',
                      state: appointment.state || '',
                      zip: appointment.zip || '',
                      services: appointment.services || [],
                      geo: appointment.geo || null,
                      source: 'auto_from_confirm',
                      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    });
                    console.log('✅ Customer record created from confirmation:', custName);
                  }
                } catch(e) {
                  console.warn('Could not auto-create customer record:', e);
                }
              }
              // ──────────────────────────────────────────────────────────────

              // Calendar sync — silent, non-blocking
              if (userProfile?.googleCalendarConnected) {
                createCalendarEvent(appointment, userProfile).then(success => {
                  console.log(success ? '✅ Added to Google Calendar' : '⚠️ Calendar sync skipped (token may need refresh — reconnect in My QR Code tab)');
                });
              }
              // Send SMS confirmation if enabled
              if (userProfile?.smsEnabled && appointment.phone) {
                const bizName = userProfile?.businessName || 'Your Farrier';
                const msg = `Hi ${appointment.customerName}, your appointment with ${bizName} is confirmed for ${appointment.requestedDate} at ${appointment.requestedTime}. Reply CONFIRM to confirm or STOP to opt out.`;
                await sendSms(appointment.phone, msg);
              }
              // Send confirmation email to customer (non-blocking)
              if (appointment.email) {
                fetch('/api/send-email', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    action: 'confirmation',
                    customerEmail: appointment.email,
                    customerName: appointment.customerName,
                    farmName: appointment.farmName || '',
                    farrierBusinessName: userProfile?.businessName || '',
                    farrierEmail: userProfile?.email || '',
                    farrierPhone: userProfile?.phone || '',
                    services: appointment.services,
                    numberOfHorses: appointment.numberOfHorses,
                    requestedDate: appointment.requestedDate,
                    requestedTime: appointment.requestedTime,
                    address: appointment.address,
                    city: appointment.city,
                    state: appointment.state,
                    zip: appointment.zip,
                    comments: appointment.comments,
                  })
                }).then(async (r) => {
                  const data = await r.json().catch(() => ({}));
                  if (r.ok) {
                    console.log('✅ Confirmation email sent to', appointment.email);
                  } else {
                    console.error('❌ Confirmation email API error:', r.status, data);
                  }
                }).catch(e => console.error('❌ Confirmation email network error:', e));
              } else {
                console.warn('⚠️ No customer email on appointment — skipping confirmation email');
              }
            } else {
              console.error('❌ Appointment not found in local state');
            }
          }
          
          // If cancelling, remove from Google Calendar (only if connected)
          if (newStatus === 'cancelled') {
            if (appointment && userProfile?.googleCalendarConnected && appointment.googleEventId) {
              console.log('🔴 Status is cancelled, removing from calendar...');
              const deleted = await deleteCalendarEvent(appointment, userProfile);
              if (deleted) {
                alert('✓ Appointment cancelled and removed from your Google Calendar!');
              } else {
                alert('⚠️ Appointment cancelled, but could not remove from Google Calendar. Please remove it manually.');
              }
            }
            // No alert needed if calendar isn't connected — cancel is silent/fast
          }
          
          loadAppointments();
        }
      };

      // ── SMS helpers ──────────────────────────────────────────────────
      const sendSms = async (phone, message) => {
        try {
          const res = await fetch('/api/send-sms', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ to: phone, body: message })
          });
          const data = await res.json();
          return data.success === true;
        } catch (e) {
          console.error('SMS error:', e);
          return false;
        }
      };

      const isSmsEnabled = (customerPhone, customers) => {
        if (!userProfile?.smsEnabled) return false;
        if (!customerPhone) return false;
        // Check if customer has opted out
        const phone = customerPhone.replace(/\D/g, '');
        const customer = customers?.find(c => c.phone?.replace(/\D/g, '') === phone);
        if (customer?.smsOptOut) return false;
        return true;
      };

      const sendReminder = async (appointment) => {
        if (!userProfile?.smsEnabled || !appointment.phone) {
          alert('SMS not enabled. Enable it in Settings → SMS & Messaging.');
          return;
        }
        const bizName = userProfile?.businessName || 'Your Farrier';
        const message = `Hi ${appointment.customerName}, reminder: your appointment with ${bizName} is on ${appointment.requestedDate} at ${appointment.requestedTime}. Reply CONFIRM to confirm or STOP to opt out.`;
        const sent = await sendSms(appointment.phone, message);
        if (sent) {
          alert(`✅ Reminder sent to ${appointment.customerName}`);
        } else {
          alert('❌ Failed to send reminder. Check SMS settings.');
        }
      };

      const handleCreateInvoiceFromAppointment = (appointment) => {
        console.log('🎯 Creating invoice from appointment:', appointment);
        console.log('Customer Name:', appointment.customerName);
        console.log('Customer Email:', appointment.email);
        console.log('Customer Phone:', appointment.phone);
        setSelectedAppointment(appointment);
        setShowInvoiceModal(true);
      };

      const handleInvoiceCreated = async () => {
        // Mark appointment as invoiced
        if (selectedAppointment && db) {
          try {
            await db.collection('appointments').doc(selectedAppointment.id).update({
              invoiced: true,
              invoicedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            console.log('✅ Appointment marked as invoiced');
            loadAppointments();
          } catch (error) {
            console.error('Error marking appointment as invoiced:', error);
          }
        }
        setShowInvoiceModal(false);
        setSelectedAppointment(null);
      };

      if (loading) {
        return (
          <div style={{display: 'flex', justifyContent: 'center', padding: '3rem'}}>
            <div className="spinner"></div>
          </div>
        );
      }

      return (
        <div>
          <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1.5rem'}}>
            <h1 style={{marginBottom: 0, fontSize: '2rem', color: 'var(--primary)'}}>Appointments</h1>
            {appointments.length > 0 && (
              <button
                onClick={() => setSortOrder(sortOrder === 'newest' ? 'oldest' : 'newest')}
                className="btn btn-sm btn-outline"
                style={{display: 'flex', alignItems: 'center', gap: '0.5rem'}}
              >
                {sortOrder === 'newest' ? '📅 Newest First' : '📅 Oldest First'}
              </button>
            )}
          </div>
          
          {appointments.length === 0 ? (
            <div className="card">
              <h2>No Appointments Yet</h2>
              <p style={{color: 'var(--text-muted)', marginBottom: '1.25rem'}}>
                Appointments booked through your QR code will appear here. Share your QR code to start receiving bookings!
              </p>
              <div style={{ padding: '1rem 1.25rem', background: '#f0f9ff', borderRadius: 10, border: '1.5px solid #bae6fd', display: 'flex', alignItems: 'flex-start', gap: '0.75rem' }}>
                <span style={{ fontSize: '1.4rem', lineHeight: 1 }}>💡</span>
                <div>
                  <div style={{ fontWeight: 700, color: '#0369a1', marginBottom: '0.25rem' }}>Want to schedule an appointment manually?</div>
                  <div style={{ color: '#374151', fontSize: '0.92rem', lineHeight: 1.5 }}>
                    Go to <strong>Clients</strong> → <strong>Customers</strong>, select a customer, then click <strong>Add Appointment</strong> to create one directly from their profile.
                  </div>
                </div>
              </div>
            </div>
          ) : (
            <div className="card">
              <h2>Your Appointments ({appointments.length})</h2>
              
              {/* Filter Buttons */}
              <div style={{
                display: 'flex',
                gap: '0.5rem',
                marginBottom: '1.5rem',
                flexWrap: 'wrap',
                paddingBottom: '1rem',
                borderBottom: '1px solid var(--border)'
              }}>
                <button
                  onClick={() => setAppointmentFilter('all')}
                  className={`btn btn-sm ${appointmentFilter === 'all' ? 'btn-primary' : 'btn-outline'}`}
                >
                  All
                </button>
                <button
                  onClick={() => setAppointmentFilter('pending')}
                  className={`btn btn-sm ${appointmentFilter === 'pending' ? 'btn-primary' : 'btn-outline'}`}
                >
                  ⏳ Pending
                </button>
                <button
                  onClick={() => setAppointmentFilter('confirmed')}
                  className={`btn btn-sm ${appointmentFilter === 'confirmed' ? 'btn-primary' : 'btn-outline'}`}
                >
                  ✓ Confirmed
                </button>
                <button
                  onClick={() => setAppointmentFilter('cancelled')}
                  className={`btn btn-sm ${appointmentFilter === 'cancelled' ? 'btn-primary' : 'btn-outline'}`}
                >
                  ✕ Cancelled
                </button>
                <button
                  onClick={() => setAppointmentFilter('invoiced')}
                  className={`btn btn-sm ${appointmentFilter === 'invoiced' ? 'btn-primary' : 'btn-outline'}`}
                >
                  💰 Invoiced
                </button>
                <button
                  onClick={() => setAppointmentFilter('thisMonth')}
                  className={`btn btn-sm ${appointmentFilter === 'thisMonth' ? 'btn-primary' : 'btn-outline'}`}
                >
                  This Month
                </button>
                <button
                  onClick={() => setAppointmentFilter('lastMonth')}
                  className={`btn btn-sm ${appointmentFilter === 'lastMonth' ? 'btn-primary' : 'btn-outline'}`}
                >
                  Last Month
                </button>
              </div>

              <div style={{fontSize: '0.875rem', color: 'var(--text-muted)', marginBottom: '1rem'}}>
                Showing {sortedAppointments.length} of {appointments.length} appointment{appointments.length !== 1 ? 's' : ''}
              </div>

              <div className="appointments-list">
                {sortedAppointments.map(apt => (
                  <div key={apt.id} className="appointment-item">
                    <div className="appointment-info">
                      <div className="appointment-customer">{apt.customerName}{apt.farmName ? ` — ${apt.farmName}` : ''}</div>
                      <div className="appointment-details">
                        📞 {fmtPhone(apt.phone)} {apt.email && `• ✉️ ${apt.email}`}
                        {userProfile?.smsEnabled && apt.phone && (() => {
                          const ph = apt.phone.replace(/\D/g,'');
                          const cust = appointments.find ? null : null; // will use Firestore
                          return null; // handled via button below
                        })()}
                        <br/>
                        📅 {apt.requestedDate} at {apt.requestedTime}<br/>
                        {apt.services && apt.services.length > 0 && (
                          <>🔧 Services: {apt.services.join(', ')}<br/></>
                        )}
                        {apt.numberOfHorses && (
                          <>🐴 Horses: {apt.numberOfHorses}<br/></>
                        )}
                        {apt.address && (
                          <>📍 {apt.address}, {apt.city}, {apt.state} {apt.zip}<br/></>
                        )}
                        {apt.comments && (
                          <>💬 Notes: {apt.comments}<br/></>
                        )}
                        <small style={{color: 'var(--text-muted)'}}>
                          Requested: {apt.createdAt?.toDate().toLocaleDateString()}
                          {apt.confirmedAt && (() => {
                            const d = apt.confirmedAt.toDate ? apt.confirmedAt.toDate() : new Date(apt.confirmedAt);
                            return (
                              <span style={{marginLeft: '0.75rem', color: '#10b981', fontWeight: '500'}}>
                                ✓ Confirmed: {d.toLocaleDateString()} {d.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'})}
                              </span>
                            );
                          })()}
                          {apt.cancelledAt && (() => {
                            const d = apt.cancelledAt.toDate ? apt.cancelledAt.toDate() : new Date(apt.cancelledAt);
                            return (
                              <span style={{marginLeft: '0.75rem', color: '#ef4444', fontWeight: '500'}}>
                                ✕ Cancelled: {d.toLocaleDateString()} {d.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'})}
                              </span>
                            );
                          })()}
                        </small>
                      </div>
                    </div>
                    <div className="appointment-actions">
                      <span className={`badge badge-${
                        apt.status === 'confirmed' ? 'success' :
                        apt.status === 'confirmed_by_customer' ? 'success' :
                        apt.status === 'pending' ? 'warning' : 'pending'
                      }`}>
                        {apt.status === 'confirmed_by_customer' ? '✅ Confirmed by Customer' : (apt.status || 'pending')}
                      </span>
                      {apt.customerConfirmed && apt.status !== 'confirmed_by_customer' && (
                        <span className="badge badge-success" title={apt.customerConfirmedAt ? `Customer replied CONFIRM ${new Date(apt.customerConfirmedAt.toDate ? apt.customerConfirmedAt.toDate() : apt.customerConfirmedAt).toLocaleString()}` : 'Customer replied CONFIRM'}>
                          ✅ Customer Confirmed
                        </span>
                      )}
                      {apt.invoiced && (
                        <span className="badge" style={{background: '#dcfce7', color: '#166534'}}>
                          ✓ Invoiced
                        </span>
                      )}
                      {apt.status !== 'confirmed' && apt.status !== 'confirmed_by_customer' && (
                        <button 
                          className="btn btn-sm btn-success"
                          onClick={() => updateStatus(apt.id, 'confirmed')}
                        >
                          ✓ Confirm
                        </button>
                      )}
                      <button 
                        className="btn btn-sm btn-outline"
                        onClick={() => {
                          setEditingAppointment(apt);
                          setShowEditModal(true);
                        }}
                      >
                        ✏️ Edit
                      </button>
                      {!apt.invoiced && (
                        <button 
                          className="btn btn-sm"
                          style={{background: '#2683FB', color: 'white'}}
                          onClick={() => handleCreateInvoiceFromAppointment(apt)}
                        >
                          💰 Create Invoice
                        </button>
                      )}
                      {userProfile?.smsEnabled && (
                        <button 
                          className="btn btn-sm btn-warning"
                          onClick={() => sendReminder(apt)}
                        >
                          📱 Send Reminder
                        </button>
                      )}

                      {apt.status !== 'cancelled' && (
                        <button 
                          className="btn btn-sm btn-outline"
                          onClick={() => { setCancellingAppointment(apt); setShowCancelApptModal(true); }}
                        >
                          ✕ Cancel
                        </button>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {showInvoiceModal && selectedAppointment && (
            <InvoiceCreateModal 
              userId={userId}
              onClose={() => {
                setShowInvoiceModal(false);
                setSelectedAppointment(null);
              }}
              onCreated={handleInvoiceCreated}
              prefillData={{
                customerName: selectedAppointment.customerName || '',
                customerFarmName: selectedAppointment.farmName || '',
                customerEmail: selectedAppointment.email || '',
                customerPhone: selectedAppointment.phone || ''
              }}
            />
          )}

          {showEditModal && editingAppointment && (
            <EditAppointmentModal 
              appointment={editingAppointment}
              userProfile={userProfile}
              userId={userId}
              onClose={() => {
                setShowEditModal(false);
                setEditingAppointment(null);
              }}
              onSaved={() => {
                setShowEditModal(false);
                setEditingAppointment(null);
                loadAppointments();
              }}
            />
          )}

          {/* Cancel Appointment Modal */}
          {showCancelApptModal && cancellingAppointment && (
            <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.5)',zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center',padding:'1rem'}}>
              <div style={{background:'#fff',borderRadius:'12px',padding:'2rem',maxWidth:'460px',width:'100%',boxShadow:'0 20px 60px rgba(0,0,0,0.3)'}}>
                <h2 style={{margin:'0 0 0.5rem',color:'#1a365d',fontSize:'1.25rem'}}>✕ Cancel Appointment</h2>
                <p style={{color:'#6b7280',margin:'0 0 1.25rem',fontSize:'0.9rem'}}>
                  You are about to cancel the appointment for <strong>{cancellingAppointment.customerName}</strong>
                  {cancellingAppointment.farmName ? ` — ${cancellingAppointment.farmName}` : ''} on{' '}
                  <strong>{cancellingAppointment.requestedDate} at {cancellingAppointment.requestedTime}</strong>.
                </p>

                {cancellingAppointment.email && (
                  <div style={{background:'#fef9f0',border:'1px solid #f59e0b',borderRadius:'8px',padding:'1rem',marginBottom:'1.25rem'}}>
                    <p style={{margin:'0 0 0.75rem',fontWeight:'600',color:'#92400e',fontSize:'0.9rem'}}>
                      📧 Send cancellation email to customer?
                    </p>
                    <p style={{margin:'0',color:'#78716c',fontSize:'0.82rem'}}>
                      {cancellingAppointment.email}
                    </p>
                  </div>
                )}

                <div style={{display:'flex',gap:'0.75rem',flexWrap:'wrap'}}>
                  {cancellingAppointment.email && (
                    <button
                      className="btn btn-danger"
                      style={{flex:1,minWidth:'160px'}}
                      onClick={async () => {
                        await updateStatus(cancellingAppointment.id, 'cancelled');
                        // Send cancellation email
                        fetch('/api/send-email', {
                          method: 'POST',
                          headers: { 'Content-Type': 'application/json' },
                          body: JSON.stringify({
                            action: 'cancellation',
                            customerEmail: cancellingAppointment.email,
                            customerName: cancellingAppointment.customerName,
                            farmName: cancellingAppointment.farmName || '',
                            farrierBusinessName: userProfile?.businessName || '',
                            farrierEmail: userProfile?.email || '',
                            farrierPhone: userProfile?.phone || '',
                            bookingUrl: userProfile?.bookingUrl || '',
                            requestedDate: cancellingAppointment.requestedDate,
                            requestedTime: cancellingAppointment.requestedTime,
                            services: cancellingAppointment.services,
                          })
                        }).then(async r => {
                          const d = await r.json().catch(()=>({}));
                          if (r.ok) console.log('✅ Cancellation email sent');
                          else console.error('❌ Cancellation email error:', d);
                        }).catch(e => console.error('❌ Cancellation email failed:', e));
                        setShowCancelApptModal(false);
                        setCancellingAppointment(null);
                      }}
                    >
                      ✕ Cancel & Notify Customer
                    </button>
                  )}
                  <button
                    className="btn btn-outline"
                    style={{flex:1,minWidth:'140px',borderColor:'#ef4444',color:'#ef4444'}}
                    onClick={async () => {
                      await updateStatus(cancellingAppointment.id, 'cancelled');
                      setShowCancelApptModal(false);
                      setCancellingAppointment(null);
                    }}
                  >
                    ✕ Cancel Only
                  </button>
                  <button
                    className="btn btn-outline"
                    style={{minWidth:'100px'}}
                    onClick={() => { setShowCancelApptModal(false); setCancellingAppointment(null); }}
                  >
                    Go Back
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function CreateAppointmentModal({ customer, userId, userProfile, onClose, onSaved }) {
      const [date, setDate] = useState('');
      const [time, setTime] = useState('');
      const [farmName, setFarmName] = useState(customer.farmName || '');
      const [address, setAddress] = useState(customer.address || '');
      const [city, setCity] = useState(customer.city || '');
      const [state, setState] = useState(customer.state || '');
      const [comments, setComments] = useState('');
      const [saving, setSaving] = useState(false);
      const [sendConfirmation, setSendConfirmation] = useState(false);

      const smsAvailable = userProfile?.smsEnabled && customer.phone && !customer.smsOptOut;

      // Per-horse service rows, replacing the old flat hardcoded service checklist —
      // same idiom as InvoiceCreateModal's horse/service pickers, except an
      // appointment's services aren't priced line items, just planned-work names, so
      // each row just tracks a horse + a list of selected service name strings.
      const emptyHorseRow = () => ({ horseId: '', horseName: '', services: [] });
      const [horseRows, setHorseRows] = useState([emptyHorseRow()]);

      const [horseOptions, setHorseOptions] = useState([
        { id: '', name: '-- Select Horse --' },
        { id: '__new__', name: '+ Add New Horse...' },
      ]);
      useEffect(() => {
        const loadHorses = async () => {
          if (!db || !userId || !customer?.id) return;
          const snap = await db.collection('horses')
            .where('farrierId', '==', userId)
            .where('customerId', '==', customer.id)
            .get();
          const list = snap.docs.map(d => ({ id: d.id, ...d.data() }))
            .sort((a, b) => String(a.name || '').localeCompare(String(b.name || '')));
          setHorseOptions([
            { id: '', name: '-- Select Horse --' },
            ...list,
            { id: '__new__', name: '+ Add New Horse...' },
          ]);
        };
        loadHorses();
      }, [userId, customer?.id]);

      const [serviceOptions, setServiceOptions] = useState([]);
      useEffect(() => {
        const loadServices = async () => {
          if (!db || !userId) return;
          const snap = await db.collection('services')
            .where('farrierId', '==', userId)
            .where('isActive', '==', true)
            .get();
          const list = snap.docs.map(d => ({ id: d.id, ...d.data() }))
            .sort((a, b) =>
              String(a.category || '').localeCompare(String(b.category || '')) ||
              String(a.name || '').localeCompare(String(b.name || ''))
            );
          setServiceOptions(list);
        };
        loadServices();
      }, [userId]);

      const updateRowHorse = (idx, horseId) => {
        setHorseRows(rows => rows.map((r, i) => {
          if (i !== idx) return r;
          if (horseId === '__new__') return { ...r, horseId: '__new__', horseName: '' };
          if (!horseId) return { ...r, horseId: '', horseName: '' };
          const h = horseOptions.find(x => x.id === horseId);
          return { ...r, horseId, horseName: h?.name || '' };
        }));
      };
      const updateRowNewHorseName = (idx, name) => {
        setHorseRows(rows => rows.map((r, i) => i === idx ? { ...r, horseName: name } : r));
      };
      const toggleRowService = (idx, serviceName) => {
        setHorseRows(rows => rows.map((r, i) => {
          if (i !== idx) return r;
          const has = r.services.includes(serviceName);
          return { ...r, services: has ? r.services.filter(s => s !== serviceName) : [...r.services, serviceName] };
        }));
      };
      const addHorseRow = () => setHorseRows(rows => [...rows, emptyHorseRow()]);
      const removeHorseRow = (idx) => setHorseRows(rows => rows.filter((_, i) => i !== idx));

      const fmtTime = (t) => {
        if (!t) return '';
        const [h, m] = t.split(':').map(Number);
        const ampm = h >= 12 ? 'PM' : 'AM';
        return `${h % 12 || 12}:${String(m).padStart(2,'0')} ${ampm}`;
      };

      const handleSave = async () => {
        if (!date || !time) return alert('Date and Time are required.');
        setSaving(true);
        try {
          // Create a real horse record for any "+ Add New Horse..." row now — at save
          // time rather than the moment it's picked, so an abandoned booking never
          // leaves an orphaned horse behind. Same shape as one created from mobile or
          // from InvoiceCreateModal's "+ Add New Horse".
          const resolvedRows = [];
          for (const row of horseRows) {
            if (row.horseId === '__new__' && row.horseName.trim()) {
              const horseRef = await db.collection('horses').add({
                farrierId: userId,
                customerId: customer.id || '',
                customerName: customer.name,
                name: row.horseName.trim(),
                breed: '', dob: '', sex: '', color: '',
                shoeingCycleWeeks: null, shoeSize: '', shoeType: '',
                gaitNotes: '', hoofNotes: '', knownIssues: '',
                photos: [],
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
              });
              resolvedRows.push({ ...row, horseId: horseRef.id });
            } else {
              resolvedRows.push(row);
            }
          }

          const horseRequests = resolvedRows
            .filter(r => r.horseName.trim() || r.services.length > 0)
            .map(r => ({ horseId: r.horseId === '__new__' ? '' : (r.horseId || ''), horseName: r.horseName.trim(), services: r.services }));
          const flatServices = [...new Set(horseRequests.flatMap(r => r.services))];
          const horseIds = horseRequests.filter(r => r.horseId).map(r => r.horseId);
          const horseNames = horseRequests.filter(r => r.horseId).map(r => r.horseName);

          const newAppointment = {
            farrierId: userId,
            customerId: customer.id || '',
            customerName: customer.name,
            farmName: farmName || customer.farmName || '',
            email: customer.email || '',
            phone: customer.phone || '',
            address: address || '',
            city: city || '',
            state: state || '',
            horseRequests,
            services: flatServices,
            numberOfHorses: horseRequests.length || 1,
            horseIds,
            horseNames,
            comments,
            requestedDate: date,
            requestedTime: time,
            status: 'confirmed',
            source: 'farrier_created',
            // Who booked it (a team member, or the farrier themself) — for per-farrier views.
            performedBy: firebase.auth().currentUser?.uid || '',
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          };
          const apptRef = await db.collection('appointments').add(newAppointment);

          // Calendar sync — silent, non-blocking
          if (userProfile?.googleCalendarConnected) {
            createCalendarEvent({ id: apptRef.id, ...newAppointment }, userProfile).then(ok => {
              console.log(ok ? '✅ Added to Google Calendar' : '⚠️ Calendar sync skipped');
            });
          }

          if (sendConfirmation && smsAvailable) {
            try {
              const bizName = userProfile?.businessName || 'Your Farrier';
              const serviceList = flatServices.length > 0 ? flatServices.join(', ') : 'your appointment';
              const msg = `Hi ${customer.name}, your appointment with ${bizName} is confirmed for ${date} at ${fmtTime(time)} for ${serviceList}. Reply STOP to opt out.`;
              await fetch('/api/send-sms', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ to: customer.phone, body: msg })
              });
            } catch (e) { console.error('SMS error:', e); }
          }

          onSaved();
        } catch (e) {
          alert('Error creating appointment: ' + e.message);
        }
        setSaving(false);
      };

      // Light-mode style helpers for this modal
      const mBorder = '2px solid #cbd5e1';
      const mInput  = { width: '100%', padding: '0.75rem', borderRadius: 8, border: mBorder, fontFamily: 'Outfit,sans-serif', fontSize: '1rem', boxSizing: 'border-box', background: '#fff', color: '#0f172a' };
      const mLabel  = { fontWeight: 600, color: '#1e293b', fontSize: '0.9rem', marginBottom: '0.35rem', display: 'block' };

      return (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000, padding: '1rem' }}>
          <div style={{ background: '#fff', borderRadius: 16, width: '100%', maxWidth: 580, maxHeight: '90vh', overflowY: 'auto', boxShadow: '0 20px 60px rgba(0,0,0,0.3)', color: '#0f172a' }}>
            {/* Header */}
            <div style={{ padding: '1.25rem 1.5rem', borderBottom: '2px solid #e2e8f0', display: 'flex', justifyContent: 'space-between', alignItems: 'center', position: 'sticky', top: 0, background: '#fff', zIndex: 1 }}>
              <h2 style={{ margin: 0, color: '#2683FB', fontSize: '1.2rem' }}>📋 New Appointment</h2>
              <button onClick={onClose} style={{ background: 'none', border: '1.5px solid #cbd5e1', borderRadius: 8, padding: '0.3rem 0.7rem', cursor: 'pointer', color: '#64748b', fontSize: '1rem' }}>✕</button>
            </div>

            <div style={{ padding: '1.5rem', display: 'flex', flexDirection: 'column', gap: '1rem' }}>

              {/* Customer banner */}
              <div style={{ padding: '0.9rem 1.1rem', background: '#f0f9ff', borderRadius: 10, border: '1.5px solid #bae6fd' }}>
                <div style={{ fontWeight: 700, color: '#0369a1' }}>👤 {customer.name}{customer.farmName ? ` — ${customer.farmName}` : ''}</div>
                <div style={{ fontSize: '0.85rem', color: '#334155', marginTop: '0.2rem', display: 'flex', gap: '1rem', flexWrap: 'wrap' }}>
                  {customer.phone && <span>📞 {fmtPhone(customer.phone)}</span>}
                  {customer.email && <span>✉️ {customer.email}</span>}
                </div>
              </div>

              {/* Farm/Business override */}
              <div style={{ margin: 0 }}>
                <label style={mLabel}>Farm / Business Name</label>
                <input type="text" value={farmName} onChange={e => setFarmName(e.target.value)}
                  placeholder="Sunny Acres Farm (optional)" style={mInput} />
              </div>

              {/* Date & Time */}
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1rem' }}>
                <div>
                  <label style={mLabel}>Date *</label>
                  <input type="date" value={date} onChange={e => setDate(e.target.value)}
                    className="light-date-input"
                    style={{...mInput, colorScheme:'light'}} />
                </div>
                <div>
                  <label style={mLabel}>Time *</label>
                  <input type="time" value={time} onChange={e => setTime(e.target.value)}
                    style={{...mInput, colorScheme:'light'}} />
                </div>
              </div>

              {/* Horses + per-horse services */}
              <div>
                <label style={mLabel}>Horses &amp; Services</label>
                {horseRows.map((row, idx) => (
                  <div key={idx} style={{ border: '1.5px solid #cbd5e1', borderRadius: 10, padding: '0.75rem', marginBottom: '0.6rem', background: '#f8fafc' }}>
                    <div style={{ display: 'flex', gap: '0.5rem', marginBottom: '0.5rem' }}>
                      <select value={row.horseId} onChange={e => updateRowHorse(idx, e.target.value)} style={{ ...mInput, flex: 1 }}>
                        {horseOptions.map((h, i) => <option key={i} value={h.id}>{h.name}</option>)}
                      </select>
                      {horseRows.length > 1 && (
                        <button type="button" onClick={() => removeHorseRow(idx)}
                          style={{ background: '#fee2e2', color: '#dc2626', border: 'none', borderRadius: 8, padding: '0 0.9rem', cursor: 'pointer', fontWeight: 700 }}>✕</button>
                      )}
                    </div>
                    {row.horseId === '__new__' && (
                      <input type="text" placeholder="New horse's name" value={row.horseName}
                        onChange={e => updateRowNewHorseName(idx, e.target.value)}
                        style={{ ...mInput, marginBottom: '0.5rem' }} />
                    )}
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.4rem' }}>
                      {serviceOptions.map(s => (
                        <label key={s.id} style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', padding: '0.5rem 0.7rem', border: row.services.includes(s.name) ? '1.5px solid #2683FB' : '1.5px solid #cbd5e1', borderRadius: 8, cursor: 'pointer', background: row.services.includes(s.name) ? '#eff6ff' : '#fff', fontSize: '0.9rem', fontWeight: row.services.includes(s.name) ? 600 : 400, color: '#0f172a' }}>
                          <input type="checkbox" checked={row.services.includes(s.name)}
                            onChange={() => toggleRowService(idx, s.name)}
                            style={{ cursor: 'pointer' }} />
                          {s.name}
                        </label>
                      ))}
                    </div>
                  </div>
                ))}
                <button type="button" onClick={addHorseRow} className="btn btn-outline" style={{ width: '100%' }}>+ Add Horse</button>
              </div>

              {/* Address */}
              <div>
                <label style={mLabel}>Address</label>
                <input type="text" value={address} onChange={e => setAddress(e.target.value)} placeholder="Service location"
                  style={mInput} />
              </div>

              {/* City & State */}
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 90px', gap: '0.75rem' }}>
                <div>
                  <label style={mLabel}>City</label>
                  <input type="text" value={city} onChange={e => setCity(e.target.value)} placeholder="City" style={mInput} />
                </div>
                <div>
                  <label style={mLabel}>State</label>
                  <input type="text" value={state} onChange={e => setState(e.target.value.toUpperCase())} placeholder="FL" maxLength={2}
                    style={{...mInput, textTransform:'uppercase'}} />
                </div>
              </div>

              {/* Notes */}
              <div>
                <label style={mLabel}>Notes</label>
                <textarea value={comments} onChange={e => setComments(e.target.value)}
                  placeholder="Gate codes, special instructions…" rows={3}
                  style={{...mInput, resize:'vertical'}} />
              </div>

              {/* SMS confirmation */}
              {userProfile?.smsEnabled && customer.phone && (
                <div style={{ padding: '1rem', borderRadius: 10, border: `2px solid ${smsAvailable ? '#dcfce7' : '#fee2e2'}`, background: smsAvailable ? '#f0fdf4' : '#fff5f5' }}>
                  {smsAvailable ? (
                    <label style={{ display: 'flex', alignItems: 'flex-start', gap: '0.75rem', cursor: 'pointer' }}>
                      <input type="checkbox" checked={sendConfirmation} onChange={e => setSendConfirmation(e.target.checked)}
                        style={{ marginTop: 2, width: 18, height: 18, cursor: 'pointer', flexShrink: 0 }} />
                      <div>
                        <div style={{ fontWeight: 600, color: '#16a34a', fontSize: '0.95rem' }}>📱 Send confirmation SMS</div>
                        <div style={{ fontSize: '0.82rem', color: '#1e293b', marginTop: '0.2rem' }}>Text {fmtPhone(customer.phone)} with the appointment details.</div>
                      </div>
                    </label>
                  ) : (
                    <div style={{ color: '#dc2626', fontSize: '0.88rem', fontWeight: 600 }}>🚫 Customer has opted out of SMS.</div>
                  )}
                </div>
              )}

              {/* Actions */}
              <div style={{ display: 'flex', gap: '0.75rem', marginTop: '0.25rem' }}>
                <button className="btn btn-outline" onClick={onClose} style={{ flex: 1 }} disabled={saving}>Cancel</button>
                <button className="btn btn-primary" onClick={handleSave} style={{ flex: 2 }} disabled={saving}>
                  {saving ? '⏳ Saving…' : (sendConfirmation && smsAvailable ? '✅ Create & Send SMS' : '✅ Create Appointment')}
                </button>
              </div>

            </div>
          </div>
        </div>
      );
    }

    // Resize/compress before uploading — keeps large desktop-camera-sized photos
    // from bloating Storage or taking forever on a farrier's upload speed.
    function compressImageForUpload(file, maxDim = 1600, quality = 0.75) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          let { width, height } = img;
          if (width > maxDim || height > maxDim) {
            const scale = maxDim / Math.max(width, height);
            width = Math.round(width * scale);
            height = Math.round(height * scale);
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          canvas.toBlob(blob => { URL.revokeObjectURL(url); blob ? resolve(blob) : reject(new Error('Compression failed')); }, 'image/jpeg', quality);
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read image')); };
        img.src = url;
      });
    }

    function HorseEditModal({ horse, customer, userId, onClose, onSaved }) {
      // savedHorse becomes non-null once the horse actually has a Firestore doc —
      // for a brand-new horse that's only true after the first Save, which is what
      // unlocks the Photos section below (a photo needs a horseId to attach to).
      const [savedHorse, setSavedHorse] = useState(horse || null);
      const [name, setName] = useState(horse?.name || '');
      const [breed, setBreed] = useState(horse?.breed || '');
      const [dob, setDob] = useState(horse?.dob || '');
      const [sex, setSex] = useState(horse?.sex || '');
      const [color, setColor] = useState(horse?.color || '');
      const [shoeingCycleWeeks, setShoeingCycleWeeks] = useState(horse?.shoeingCycleWeeks || '');
      const [shoeSize, setShoeSize] = useState(horse?.shoeSize || '');
      const [shoeType, setShoeType] = useState(horse?.shoeType || '');
      const [gaitNotes, setGaitNotes] = useState(horse?.gaitNotes || '');
      const [hoofNotes, setHoofNotes] = useState(horse?.hoofNotes || '');
      const [knownIssues, setKnownIssues] = useState(horse?.knownIssues || '');
      const [saving, setSaving] = useState(false);
      const [uploading, setUploading] = useState(false);
      const fileInputRef = useRef(null);

      const inputStyle = { width: '100%', padding: '0.75rem', borderRadius: 8, border: '2px solid var(--border)', fontFamily: 'Outfit,sans-serif', fontSize: '1rem', boxSizing: 'border-box' };

      const handleSave = async () => {
        if (!name.trim()) return alert('Horse name is required.');
        setSaving(true);
        try {
          const payload = {
            name: name.trim(), breed: breed.trim(), dob, sex, color: color.trim(),
            shoeingCycleWeeks: shoeingCycleWeeks ? parseInt(shoeingCycleWeeks) : null,
            shoeSize: shoeSize.trim(), shoeType: shoeType.trim(),
            gaitNotes: gaitNotes.trim(), hoofNotes: hoofNotes.trim(), knownIssues: knownIssues.trim(),
            updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
          };
          if (savedHorse?.id) {
            await db.collection('horses').doc(savedHorse.id).update(payload);
            setSavedHorse(prev => ({ ...prev, ...payload }));
          } else {
            const ref = await db.collection('horses').add({
              ...payload,
              farrierId: userId,
              customerId: customer.id || '',
              customerName: customer.name,
              photos: [],
              createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            });
            setSavedHorse({ id: ref.id, ...payload, photos: [] });
          }
          onSaved();
        } catch (e) {
          alert('Error saving horse: ' + e.message);
        }
        setSaving(false);
      };

      const handleFileChange = async (e) => {
        const file = e.target.files?.[0];
        e.target.value = '';
        if (!file || !savedHorse?.id) return;
        setUploading(true);
        try {
          const blob = await compressImageForUpload(file);
          const photoId = `${savedHorse.id}_${Date.now()}_${Math.random().toString(36).slice(2,8)}`;
          const path = `horse-photos/${userId}/${savedHorse.id}/${photoId}.jpg`;
          const ref = storage.ref(path);
          await ref.put(blob);
          const url = await ref.getDownloadURL();
          const photo = { url, storagePath: path, uploadedAt: Date.now(), caption: '' };
          await db.collection('horses').doc(savedHorse.id).update({
            photos: firebase.firestore.FieldValue.arrayUnion(photo),
          });
          setSavedHorse(prev => ({ ...prev, photos: [...(prev.photos || []), photo] }));
          onSaved();
        } catch (e) {
          alert('Error uploading photo: ' + e.message);
        }
        setUploading(false);
      };

      const removePhoto = async (photo) => {
        if (!savedHorse?.id) return;
        if (!confirm('Delete this photo?')) return;
        try {
          await db.collection('horses').doc(savedHorse.id).update({
            photos: firebase.firestore.FieldValue.arrayRemove(photo),
          });
          setSavedHorse(prev => ({ ...prev, photos: (prev.photos || []).filter(p => p !== photo) }));
          if (photo.storagePath) storage.ref(photo.storagePath).delete().catch(e => console.warn('Photo storage cleanup failed (non-fatal):', e));
          onSaved();
        } catch (e) {
          alert('Error removing photo: ' + e.message);
        }
      };

      return (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000, padding: '1rem' }}>
          <div className="card" style={{ maxWidth: 560, width: '100%', maxHeight: '90vh', overflowY: 'auto' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1.5rem' }}>
              <h2 style={{ margin: 0, color: 'var(--primary)' }}>{savedHorse?.id ? `✏️ Edit ${savedHorse.name || 'Horse'}` : '➕ Add Horse'}</h2>
              <button className="btn btn-sm btn-outline" onClick={onClose}>✕ Close</button>
            </div>

            {[
              { label: 'Name *', val: name, set: setName, ph: 'Biscuit' },
              { label: 'Breed', val: breed, set: setBreed, ph: 'Quarter Horse' },
              { label: 'Color', val: color, set: setColor, ph: 'Bay' },
            ].map(f => (
              <div className="form-group" key={f.label}>
                <label>{f.label}</label>
                <input type="text" value={f.val} placeholder={f.ph} onChange={e => f.set(e.target.value)} style={inputStyle} />
              </div>
            ))}

            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.75rem' }}>
              <div className="form-group" style={{ margin: 0 }}>
                <label>Date of Birth</label>
                <input type="date" value={dob} onChange={e => setDob(e.target.value)} style={inputStyle} />
              </div>
              <div className="form-group" style={{ margin: 0 }}>
                <label>Sex</label>
                <select value={sex} onChange={e => setSex(e.target.value)}
                  style={{ ...inputStyle, border: '1px solid #cbd5e1', background: '#fff', color: 'var(--text)', colorScheme: 'light' }}>
                  <option value="">—</option>
                  <option value="Mare">Mare</option>
                  <option value="Gelding">Gelding</option>
                  <option value="Stallion">Stallion</option>
                </select>
              </div>
            </div>

            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '0.75rem', marginTop: '0.75rem' }}>
              <div className="form-group" style={{ margin: 0 }}>
                <label>Shoeing Cycle (wks)</label>
                <input type="number" min="1" value={shoeingCycleWeeks} placeholder="6" onChange={e => setShoeingCycleWeeks(e.target.value)} style={inputStyle} />
              </div>
              <div className="form-group" style={{ margin: 0 }}>
                <label>Shoe Size</label>
                <input type="text" value={shoeSize} placeholder="00" onChange={e => setShoeSize(e.target.value)} style={inputStyle} />
              </div>
              <div className="form-group" style={{ margin: 0 }}>
                <label>Shoe Type</label>
                <input type="text" value={shoeType} placeholder="Steel" onChange={e => setShoeType(e.target.value)} style={inputStyle} />
              </div>
            </div>
