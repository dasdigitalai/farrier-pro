      // (iPOSpays lets its payment page be framed: no X-Frame-Options / frame-ancestors, 2026-10-13.)
      const [iposPage, setIposPage] = useState(null);
      const [iposChecking, setIposChecking] = useState(false);
      const iposDoneRef = React.useRef(false);

      const iposCheck = React.useCallback(async (ref, manual = false) => {
        if (iposDoneRef.current) return;
        if (manual) setIposChecking(true);
        try {
          const res = await fetch('/api/stripe-payment', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'ipospays_check', invoiceId: invoice.id, ref }),
          });
          const result = await res.json();
          if (iposDoneRef.current) return;
          if (result.success && result.paid) {
            iposDoneRef.current = true;
            alert(`✅ Payment of $${Number(result.amount).toFixed(2)} successful!`);
            onPaymentSuccess();
          } else if (result.success && result.declined) {
            setIposPage(null);
            setError(`The card didn't go through${result.message ? ` (${result.message})` : ''}. Try again with another card.`);
          } else if (manual) {
            setError(result.success ? "iPOSpays hasn't confirmed this payment yet. If the card form said it was approved, check again in a moment." : (result.error || 'Could not check the payment.'));
          }
        } catch (e) {
          if (manual) setError('Could not reach the server to check the payment.');
        }
        if (manual) setIposChecking(false);
      }, [invoice.id]);

      // While the card form is open, ask every few seconds (and whenever this tab comes back
      // into view, in case it was opened in its own tab) whether iPOSpays has the payment. Stops after 15 minutes; "Check now" still works.
      React.useEffect(() => {
        if (!iposPage) return;
        const started = Date.now();
        const timer = setInterval(() => { if (Date.now() - started < 15 * 60e3) iposCheck(iposPage.ref); }, 4000);
        const onVisible = () => { if (document.visibilityState === 'visible') iposCheck(iposPage.ref); };
        document.addEventListener('visibilitychange', onVisible);
        return () => { clearInterval(timer); document.removeEventListener('visibilitychange', onVisible); };
      }, [iposPage, iposCheck]);

      const openIposCardForm = async () => {
        if (!applyCents || applyCents <= 0) { setError('Please enter a valid amount.'); return; }
        setProcessing(true);
        setError('');
        try {
          const res = await fetch('/api/stripe-payment', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'ipospays_keyed', invoiceId: invoice.id, applyAmount: applyCents / 100 }),
          });
          const result = await res.json();
          if (!result.success) {
            setError(result.error || 'Could not open the iPOSpays card form.');
          } else {
            setIposPage({ ref: result.ref, url: result.url, amount: result.amount });
          }
        } catch (err) {
          setError('Could not open the iPOSpays card form. Please try again.');
        }
        setProcessing(false);
      };

      React.useEffect(() => {
        if (!hasStripe || !window.Stripe) return;
        const stripe = window.Stripe(publishableKey);
        stripeRef.current = stripe;
        const elements = stripe.elements();
        const card = elements.create('card', {
          style: {
            base: {
              fontSize: '16px',
              color: '#1a1a2e',
              fontFamily: 'system-ui, sans-serif',
              '::placeholder': { color: '#aab7c4' }
            },
            invalid: { color: '#dc2626' }
          }
        });
        cardRef.current = card;
        card.mount(cardElementRef.current);
        card.on('ready', () => setStripeReady(true));
        return () => card.destroy();
      }, [hasStripe, publishableKey]);

      const handlePayment = async () => {
        if (!hasStripe) return;
        if (!applyCents || applyCents <= 0) { setError('Please enter a valid amount.'); return; }
        setProcessing(true);
        setError('');
        try {
          const { paymentMethod, error: pmError } = await stripeRef.current.createPaymentMethod({
            type: 'card',
            card: cardRef.current,
            billing_details: {
              name: invoice.customerName || '',
              email: invoice.customerEmail || ''
            }
          });

          if (pmError) { setError(pmError.message); setProcessing(false); return; }

          // The server prices and charges it with this farrier's Stripe key, then records
          // the payment on the invoice (api-auth.js sends who we are).
          const res = await fetch('/api/stripe-payment', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              action: 'charge',
              paymentMethodId: paymentMethod.id,
              invoiceId: invoice.id,
              applyAmount: applyCents / 100,
            })
          });

          const result = await res.json();

          if (result.success) {
            alert(`✅ Payment of $${Number(result.amount).toFixed(2)} successful!`);
            onPaymentSuccess();
          } else {
            setError(result.error || 'Payment failed. Please try again.');
          }
        } catch (err) {
          console.error('Payment error:', err);
          setError('Payment processing failed. Please try again.');
        }
        setProcessing(false);
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal-content" onClick={(e) => e.stopPropagation()} style={{maxWidth: '500px'}}>
            <h2 style={{marginBottom: '1.5rem'}}>💳 Pay Invoice</h2>

            <div style={{background: 'var(--surface)', padding: '1rem', borderRadius: '8px', marginBottom: '1.5rem'}}>
              <div style={{fontSize: '0.875rem', color: '#666', marginBottom: '0.25rem'}}>
                Invoice #{invoice.invoiceNumber} • {invoice.customerName}
              </div>
              <div style={{fontSize: '0.875rem', color: '#666'}}>
                Total: ${invoice.total?.toFixed(2)}
                {paidSoFar > 0 && <> • Paid: ${paidSoFar.toFixed(2)} • <strong>Balance: ${remaining.toFixed(2)}</strong></>}
              </div>
              {FarriPricing.dualPrices(invoice).card !== null && (
                <div style={{fontSize: '0.875rem', color: '#666', marginTop: '0.25rem'}}>{FarriPricing.dualPriceText(invoice)}</div>
              )}
            </div>

            {useIpos ? (
              iposPage ? (
                <>
                  <iframe
                    src={iposPage.url}
                    title="iPOSpays card form"
                    allow="payment"
                    style={{width: '100%', height: '640px', maxHeight: '65vh', border: '1px solid var(--border)', borderRadius: '8px', background: '#fff'}}
                  />
                  <div style={{fontSize: '0.8rem', color: 'var(--text-muted)', marginTop: '0.5rem', textAlign: 'center'}}>
                    Type the card and press Pay Now — this closes by itself when the payment goes through.{' '}

    // Record a payment taken outside FarriTech. The amount starts at the price for the
    // chosen method (card price for "External card", cash price otherwise) and
    // can be lowered for a partial payment. The server records it and closes any open
    // online checkout so the customer can't also pay by link.
    function ManualPaymentModal({ invoice, onClose, onPaymentRecorded }) {
      const paidSoFar = FarriPricing.toCents(invoice.paidAmount ?? (invoice.payments || []).reduce((s,p) => s + (p.amount||0), 0)) / 100;
      const remaining = FarriPricing.balanceCents(invoice) / 100;
      const priceFor = (m) => (FarriPricing.getChargeCents(invoice, m) / 100).toFixed(2);
      const [method, setMethod] = useState('cash');
      const [amount, setAmount] = useState(priceFor('cash'));
      const [reference, setReference] = useState('');
      const [datePaid, setDatePaid] = useState(new Date().toISOString().split('T')[0]);
      const [processing, setProcessing] = useState(false);
      const [error, setError] = useState('');

      const changeMethod = (m) => { setMethod(m); setAmount(priceFor(m)); };

      const handleRecord = async (e) => {
        e.preventDefault();
        const amt = parseFloat(amount);
        if (!amt || amt <= 0) { setError('Please enter a valid amount.'); return; }
        setProcessing(true);
        setError('');
        try {
          const res = await fetch('/api/stripe-payment', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'record_payment', invoiceId: invoice.id, method, amount: amt, reference, datePaid }),
          });
          const data = await res.json();
          if (data.success) {
            onPaymentRecorded();
          } else {
            setError(data.error || 'Failed to record payment. Please try again.');
          }
        } catch (err) {
          console.error('Error recording payment:', err);
          setError('Failed to record payment. Please try again.');
        }
        setProcessing(false);
      };

      const referencePlaceholder = { check: 'Check #, e.g. 1042', ach: 'Confirmation #', zelle: 'Confirmation #', venmo: 'Venmo transaction ID', card_terminal: 'Last 4 or approval code' }[method] || 'Optional note';

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal-content" onClick={(e) => e.stopPropagation()} style={{maxWidth: '480px'}}>
            <h2 style={{marginBottom: '1.5rem'}}>💵 Record Payment</h2>

            <div style={{background: 'var(--surface)', padding: '1rem', borderRadius: '8px', marginBottom: '1.5rem'}}>
              <div style={{fontSize: '0.875rem', color: '#666', marginBottom: '0.25rem'}}>
                Invoice #{invoice.invoiceNumber} • {invoice.customerName}
              </div>
              <div style={{fontSize: '0.875rem', color: '#666'}}>
                Invoice Total: ${invoice.total?.toFixed(2)}
                {paidSoFar > 0 && <> • Already Paid: ${paidSoFar.toFixed(2)} • <strong>Balance: ${remaining.toFixed(2)}</strong></>}
              </div>
              {FarriPricing.dualPrices(invoice).card !== null && (
                <div style={{fontSize: '0.875rem', color: '#666', marginTop: '0.25rem'}}>{FarriPricing.dualPriceText(invoice)}</div>
              )}
            </div>

            {error && <div className="error-message" style={{marginBottom:'1rem'}}>{error}</div>}

            <form onSubmit={handleRecord}>
              <div className="form-group">
                <label>Payment Method *</label>
                <select value={method} onChange={(e) => changeMethod(e.target.value)}>
                  {Object.entries(FarriPricing.MANUAL_METHODS).map(([value, label]) => (
                    <option key={value} value={value}>{label}</option>
                  ))}
                </select>
              </div>

              <div className="form-group">
                <label>Amount Received *</label>
                <input
                  type="number"
                  step="0.01"
                  min="0.01"
                  required
                  value={amount}
                  onChange={(e) => setAmount(e.target.value)}
                />
                <div style={{fontSize: '0.75rem', color: 'var(--text-muted)', marginTop: '0.25rem'}}>
                  {FarriPricing.isCardMethod(method) && FarriPricing.dualPrices(invoice).card !== null ? 'Card price' : 'Cash or check price'} for the balance — lower it for a partial payment.
                </div>
              </div>

              <div className="form-group">
                <label>Reference (optional)</label>
                <input
                  type="text"
                  value={reference}
                  onChange={(e) => setReference(e.target.value)}
                  placeholder={referencePlaceholder}
                />
              </div>

              <div className="form-group">
                <label>Date Paid *</label>
                <input
                  type="date"
                  required
                  value={datePaid}
                  onChange={(e) => setDatePaid(e.target.value)}
                />
              </div>

              <div style={{display:'flex', gap:'0.75rem', marginTop:'1.5rem'}}>
                <button type="button" onClick={onClose} className="btn btn-outline" disabled={processing} style={{flex:1}}>
                  Cancel
                </button>
                <button type="submit" className="btn" disabled={processing} style={{flex:1, background:'#059669', color:'white'}}>
                  {processing ? <span className="spinner"></span> : `Record $${parseFloat(amount||0).toFixed(2)} Payment`}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

                  gaitNotes: '', hoofNotes: '', knownIssues: '',
                  photos: [],
                  createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                  updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                });
                item.horseId = horseRef.id;
              }
              delete item._newHorse;
            }

            const updates = {
              customerName,
              customerFarmName,
              customerEmail,
              customerPhone,
              items: cleanedItems,
              total,
              milesDriven: milesDriven || 0,
              updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
            };

            const totalChanged = Math.abs((editingInvoice.total || 0) - total) > 0.001;
            let paymentUrl = editingInvoice.paymentUrl || '';
            await db.collection('invoices').doc(editingInvoice.id).update(updates);
            if (editingInvoice.paymentUrl && totalChanged) {
              try {
                if ((userProfile?.stripePublishableKey || userProfile?.ipospaysConnected) && total > 0) {
                  // Server re-prices from the invoice we just saved and closes the old checkout.
                  const plRes = await fetch('/api/stripe-payment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'payment_link', invoiceId: editingInvoice.id }),
                  });
                  const plData = await plRes.json();
                  if (plData.success && plData.paymentUrl) {
                    paymentUrl = plData.paymentUrl;
                    updates.paymentUrl = paymentUrl;
                  } else {
                    console.error('Payment link regeneration failed:', plData.error);
                  }
                }
              } catch (plErr) {
                console.error('Payment link regeneration error:', plErr);
              }
            }

            const updatedInvoice = { ...editingInvoice, ...updates, paymentUrl, total, items: cleanedItems };

            // Only send if the farrier explicitly tapped Send Text/Email on this edit —
            // correcting an invoice must never auto-notify the customer as a side effect.
            let sendNote = '';
            if (sendVia === 'sms') {
              if (!customerPhone) {
                sendNote = ' No phone number entered — nothing was texted.';
              } else {
                try {
                  const bizName = userProfile?.businessName || 'Your Farrier';
                  const msg = `Hi ${customerName}, your invoice #${editingInvoice.invoiceNumber} for ${FarriPricing.dualPriceText(updatedInvoice)} from ${bizName} has been updated.${(FarriPricing.itemsSmsText?.(updatedInvoice) || '')}${paymentUrl ? ` Pay here: ${paymentUrl}` : ''}${paymentUrl ? FarriPricing.altPaySms(userProfile, updatedInvoice) : ''} Reply STOP to opt out.`;
                  await fetch('/api/send-sms', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ to: customerPhone, body: msg }),
                  });
                  sendNote = ' Text sent to customer.';
                } catch (smsErr) {
                  console.error('Invoice SMS error:', smsErr);
                  sendNote = ' Text failed to send — invoice was still saved.';
                }
              }
            } else if (sendVia === 'email') {
              if (!customerEmail) {
                sendNote = ' No email entered — nothing was emailed.';
              } else {
                try {
                  await emailInvoiceLink(updatedInvoice, userProfile);
                  sendNote = ' Email sent to customer.';
                } catch (emailErr) {
                  console.error('Invoice email error:', emailErr);
                  sendNote = ' Email failed to send — invoice was still saved.';
                }
              }
            }

            alert(`✅ Invoice updated!${sendNote}`);
            onCreated(updatedInvoice);
          } catch (err) {
            console.error('❌ Error updating invoice:', err);
            setError('Error updating invoice. Please try again.');
          } finally {
            setLoading(false);
          }
          return;
        }

        try {
          // Save invoice to Firestore (no payment link needed - using Pay Now button)
          if (db) {
            // Generate sequential 5-digit invoice number
            let invoiceNumber;
            
            // Get all invoices for this farrier to find the highest number
            const allInvoicesQuery = await db.collection('invoices')
              .where('farrierId', '==', userId)
              .get();
            
            if (!allInvoicesQuery.empty) {
              // Find the highest 5-digit invoice number (ignore old 13-digit ones)
              let highestNumber = 9999; // Start below 10000
              
              allInvoicesQuery.docs.forEach(doc => {
                const data = doc.data();
                if (data.invoiceNumber && data.invoiceNumber.startsWith('INV-')) {
                  const num = parseInt(data.invoiceNumber.replace('INV-', ''));
                  // Only count 5-digit numbers (10000-99999)
                  if (!isNaN(num) && num >= 10000 && num <= 99999 && num > highestNumber) {
                    highestNumber = num;
                  }
                }
              });
              
              const nextNumber = highestNumber + 1;
              invoiceNumber = `INV-${nextNumber}`;
            } else {
              // First invoice - start at 10000
              invoiceNumber = 'INV-10000';
            }
            console.log('🔵 Creating invoice:', {
              farrierId: userId,
              customerName,
              total,
              invoiceNumber
            });

            // Create a real horse record for any "+ Add New Horse..." line now — at
            // save time rather than the moment it's picked, so an abandoned invoice
            // never leaves an orphaned horse behind. Same field shape as a horse
            // created from the mobile app.
            for (const item of cleanedItems) {
              if (item._newHorse) {
                const horseRef = await db.collection('horses').add({
                  farrierId: userId,
                  customerId: customerId || '',
                  customerName,
                  name: item._newHorse,
                  breed: '', dob: '', sex: '', color: '',
                  shoeingCycleWeeks: null, shoeSize: '', shoeType: '',
                  gaitNotes: '', hoofNotes: '', knownIssues: '',
                  photos: [],
                  createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                  updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                });
                item.horseId = horseRef.id;
              }
              delete item._newHorse; // transient marker only, not part of the saved shape
            }

            const docRef = await db.collection('invoices').add({
              farrierId: userId,
              // Who did the work (a team member, or the farrier themself) — for per-farrier reports.
              performedBy: firebase.auth().currentUser?.uid || '',
              customerId: customerId || '',
              customerName: customerName,
              customerFarmName: customerFarmName,
              customerEmail: customerEmail,
              customerPhone: customerPhone,
              items: cleanedItems,
              total: total,
              invoiceNumber: invoiceNumber,
              status: 'outstanding',
              cardPriceRate: FarriPricing.farrierCardPriceRate(userProfile),
              milesDriven: milesDriven || 0,
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            console.log('✅ Invoice created with ID:', docRef.id);

            // Record each invoiced horse's latest service — mirrors what the mobile
            // app writes, so "defaults to last service" stays accurate regardless of
            // which app was used most recently. Best-effort: never blocks the invoice.
            cleanedItems.forEach(item => {
              if (item.horseId) {
                db.collection('horses').doc(item.horseId).update({
                  lastServiceId: item.serviceId || '',
                  lastServiceName: item.description,
                  lastServicePrice: item.unitPrice,
                  lastServiceDate: firebase.firestore.FieldValue.serverTimestamp(),
                }).catch(() => {});
              }
            });

            // Auto-deduct inventory consumed by each invoiced service — best-effort,
            // never blocks invoice creation. Services referenced on this invoice are
            // fetched once (not per line item) to resolve their consumedItems mapping.
            // Note: this only runs on invoice creation, not when an existing invoice is
            // edited — editing an invoice does not re-run or reverse deduction.
            try {
              const distinctServiceIds = [...new Set(cleanedItems.map(i => i.serviceId).filter(Boolean))];
              if (distinctServiceIds.length) {
                const serviceDocs = await Promise.all(
                  distinctServiceIds.map(id => db.collection('services').doc(id).get().catch(() => null))
                );
                const consumedByServiceId = {};
                serviceDocs.forEach(doc => {
                  if (doc && doc.exists) consumedByServiceId[doc.id] = doc.data().consumedItems || [];
                });

                cleanedItems.forEach(item => {
                  const consumed = consumedByServiceId[item.serviceId] || [];
                  const lineQty = Number(item.qty || 1);
                  consumed.forEach(ci => {
                    if (!ci.itemId || !ci.qty) return;
                    const deductQty = Number(ci.qty) * lineQty;
                    db.collection('inventoryItems').doc(ci.itemId).update({
                      quantityOnHand: firebase.firestore.FieldValue.increment(-deductQty),
                      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    }).catch(() => {});
                    db.collection('inventoryTransactions').add({
                      farrierId: userId, itemId: ci.itemId, qtyDelta: -deductQty,
                      type: 'auto-deduct', invoiceId: docRef.id, serviceId: item.serviceId,
                      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    }).catch(() => {});
                  });
                });
              }
            } catch (e) { /* best-effort — never block invoice creation */ }

            // Write mileage log if miles entered
            if (milesDriven > 0) {
              try {
                await db.collection('mileage_logs').add({
                  farrierId:    window.FarriTeam?.member ? firebase.auth().currentUser.uid : userId,
                  date:         new Date().toISOString().split('T')[0],
                  customerName: customerName,
                  farmName:     customerFarmName || '',
                  services:     cleanedItems.map(i => i.description || i.name || ''),
                  invoiceNumber,
                  invoiceId:    docRef.id,
                  invoiceTotal: total,
                  miles:        milesDriven,
                  createdAt:    firebase.firestore.FieldValue.serverTimestamp(),
                });
                console.log('✅ Mileage log saved:', milesDriven, 'miles');
              } catch(e) {
                console.warn('⚠️ Mileage log failed (non-fatal):', e.message);
              }
            }

            // Generate the pay link if the farrier has Stripe or iPOSpays connected (the
            // server holds the keys; the profile only says which is connected)
            let paymentUrl = '';
            if ((userProfile?.stripePublishableKey || userProfile?.ipospaysConnected) && total > 0) {
              try {
                const plRes = await fetch('/api/stripe-payment', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  // The server prices it from the saved invoice and saves the link on it.
                  body: JSON.stringify({ action: 'payment_link', invoiceId: docRef.id }),
                });
                const plData = await plRes.json();
                console.log('💳 Stripe API response:', JSON.stringify(plData));
                if (plData.success && plData.paymentUrl) {
                  paymentUrl = plData.paymentUrl;
                  console.log('✅ Payment link generated:', paymentUrl);
                } else {
                  console.error('❌ Payment link failed:', plData.error);
                  alert('⚠️ Payment link failed: ' + (plData.error || 'Unknown Stripe error') + '\n\nInvoice was still created but no payment link was generated.');
                }
              } catch (plErr) {
                console.error('Payment link error:', plErr);
              }
            }

            const createdInvoice = {
              id: docRef.id,
              farrierId: userId,
              customerName,
              customerFarmName,
              customerEmail,
              customerPhone,
              items: cleanedItems,
              total,
              invoiceNumber,
              status: 'outstanding',
              cardPriceRate: FarriPricing.farrierCardPriceRate(userProfile),
              paymentUrl,
              createdAt: new Date()
            };

            // Send invoice notification — ONLY when the farrier explicitly tapped
            // Send Text or Send Email; a plain Save must never message the customer.
            let sendNote = '';
            if (sendVia === 'sms') {
              if (!customerPhone) {
                sendNote = ' No phone number entered — nothing was texted.';
              } else {
                try {
                  const bizName = userProfile?.businessName || 'Your Farrier';
                  const msg = `Hi ${customerName}, you have a new invoice #${invoiceNumber} for ${FarriPricing.dualPriceText(createdInvoice)} from ${bizName}.${(FarriPricing.itemsSmsText?.(createdInvoice) || '')}${paymentUrl ? ` Pay here: ${paymentUrl}` : ''}${paymentUrl ? FarriPricing.altPaySms(userProfile, createdInvoice) : ''} Reply STOP to opt out.`;
                  await fetch('/api/send-sms', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ to: customerPhone, body: msg }),
                  });
                  console.log('✅ Invoice SMS sent');
                  sendNote = ' Text sent to customer.';
                } catch (smsErr) {
                  console.error('Invoice SMS error:', smsErr);
                  sendNote = ' Text failed to send — invoice was still saved.';
                }
              }
            } else if (sendVia === 'email') {
              if (!customerEmail) {
                sendNote = ' No email entered — nothing was emailed.';
              } else {
                try {
                  await emailInvoiceLink(createdInvoice, userProfile);
                  console.log('✅ Invoice email sent');
                  sendNote = ' Email sent to customer.';
                } catch (emailErr) {
                  console.error('Invoice email error:', emailErr);
                  sendNote = ' Email failed to send — invoice was still saved.';
                }
              }
            }

            alert(`✅ Invoice created!${paymentUrl ? ' Payment link generated.' : ' Add Stripe in Settings to enable Pay Now links.'}${sendNote}`);
            onCreated(createdInvoice);
          } else {
            console.error('❌ Database not initialized');
            setError('Database not available');
          }
       } catch (err) {
  console.error('❌ Error creating invoice:', err);
  setError('Error creating invoice. Please try again.');
} finally {
  setLoading(false);
}
};

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <h2>{editingInvoice ? `Edit Invoice #${editingInvoice.invoiceNumber}` : 'Create Invoice'}</h2>
              <button className="close-btn" onClick={onClose}>×</button>
            </div>

            {editLocked && (
              <div className="error-message">This invoice has been paid and can no longer be edited.</div>
            )}

            {error && <div className="error-message">{error}</div>}

            {prefillData && (
              <div style={{
                marginBottom: '1.5rem',
                padding: '1rem',
                background: '#f0f9ff',
                border: '2px solid #0ea5e9',
                borderRadius: '8px'
              }}>
                <div style={{fontSize: '0.875rem', fontWeight: '600', color: '#2563eb', marginBottom: '0.5rem'}}>
                  📋 Invoice from Appointment
                </div>
                <div style={{fontSize: '0.875rem', color: '#2563eb'}}>
                  Customer info pre-filled from appointment booking
                </div>
              </div>
            )}

            {!prefillData && !editingInvoice && (
              <div className="form-group">
                <label>Select Existing Customer (Optional)</label>
                {loadingCustomers ? (
                  <div style={{padding: '0.75rem', color: 'var(--text-muted)'}}>Loading customers...</div>
                ) : (
                  <select
                    onChange={(e) => {
                      const customer = customers.find(c => c.email === e.target.value);
                      if (customer) {
                        selectCustomer(customer);
                      } else {
                        selectCustomer(null);
                      }
                    }}
                    style={{
                      width: '100%',
                      padding: '0.75rem',
                      border: '2px solid var(--border)',
                      borderRadius: '8px',
                      fontSize: '1rem'
                    }}
                  >
                    <option value="">-- Select Customer or Enter New Below --</option>
                    {customers.map((customer, i) => (
                      <option key={i} value={customer.email}>
                        {customer.name} - {customer.email}
                      </option>
                    ))}
                  </select>
                )}
                <div style={{fontSize: '0.8rem', color: 'var(--text-muted)', marginTop: '0.25rem'}}>
                  Or search by phone number below
                </div>
              </div>
            )}

            {selectedCustomerInfo && (
              <div style={{
                background: 'linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%)',
                border: '2px solid #0ea5e9',
                borderRadius: '12px',
                padding: '1rem',
                marginBottom: '1rem'
              }}>
                <div style={{
                  fontSize: '0.9rem',
                  fontWeight: '600',
                  color: '#2563eb',
                  marginBottom: '0.75rem',
                  display: 'flex',
                  alignItems: 'center',
                  gap: '0.5rem'
                }}>
                  📊 Customer Account Summary
                </div>
                
                <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.75rem'}}>
                  <div>
                    <div style={{fontSize: '0.75rem', color: '#64748b', marginBottom: '0.25rem'}}>
                      Current Balance
                    </div>
                    <div style={{
                      fontSize: '1.5rem',
                      fontWeight: 'bold',
                      color: selectedCustomerInfo.balance > 0 ? '#dc2626' : '#2683FB'
                    }}>
                      ${selectedCustomerInfo.balance.toFixed(2)}
                    </div>
                    {selectedCustomerInfo.balance > 0 && (
                      <div style={{fontSize: '0.7rem', color: '#dc2626', fontWeight: '500'}}>
                        OUTSTANDING
                      </div>
                    )}
                  </div>

                  <div>
                    <div style={{fontSize: '0.75rem', color: '#64748b', marginBottom: '0.25rem'}}>
                      Total Paid
                    </div>
                    <div style={{fontSize: '1.5rem', fontWeight: 'bold', color: '#2683FB'}}>
                      ${selectedCustomerInfo.totalPaid.toFixed(2)}
                    </div>
                    <div style={{fontSize: '0.7rem', color: '#64748b'}}>
                      {selectedCustomerInfo.totalInvoices} invoice{selectedCustomerInfo.totalInvoices !== 1 ? 's' : ''}
                    </div>
                  </div>
                </div>

                {selectedCustomerInfo.lastInvoice && (
                  <div style={{
                    marginTop: '0.75rem',
                    paddingTop: '0.75rem',
                    borderTop: '1px solid #bae6fd'
                  }}>
                    <div style={{fontSize: '0.75rem', color: '#64748b', marginBottom: '0.25rem'}}>
                      Last Invoice
                    </div>
                    <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
                      <div>
                        <div style={{fontSize: '0.85rem', fontWeight: '600', color: '#2563eb'}}>
                          {selectedCustomerInfo.lastInvoice.invoiceNumber}
                        </div>
                        <div style={{fontSize: '0.75rem', color: '#64748b'}}>
                          {selectedCustomerInfo.lastInvoice.createdAt?.toDate().toLocaleDateString('en-US', {
                            month: 'short',
                            day: 'numeric',
                            year: 'numeric'
                          })}
                        </div>
                      </div>
                      <div style={{textAlign: 'right'}}>
                        <div style={{fontSize: '1rem', fontWeight: 'bold', color: '#2563eb'}}>
                          ${selectedCustomerInfo.lastInvoice.total?.toFixed(2)}
                        </div>
                        <span style={{
                          fontSize: '0.7rem',
                          padding: '0.125rem 0.5rem',
                          borderRadius: '12px',
                          fontWeight: '600',
                          textTransform: 'uppercase',
                          background: selectedCustomerInfo.lastInvoice.status === 'paid' ? '#dcfce7' : '#fef3c7',
                          color: selectedCustomerInfo.lastInvoice.status === 'paid' ? '#166534' : '#92400e'
                        }}>
                          {selectedCustomerInfo.lastInvoice.status}
                        </span>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

            <div className="form-group">
              <label>Customer Phone {phoneSearching && <span style={{color: 'var(--primary)'}}>🔍 Searching...</span>}</label>
              <input
                type="tel"
                value={fmtPhone(customerPhone)}
                onChange={(e) => {
                  const raw = e.target.value.replace(/\D/g, '').slice(0, 11);
                  setCustomerPhone(raw);
                  if (raw.length >= 10) {
                    lookupByPhone(raw);
                  }
                }}
                placeholder="(555) 123-4567 (auto-fills customer info)"
              />
              <div style={{fontSize: '0.8rem', color: 'var(--text-muted)', marginTop: '0.25rem'}}>
                Enter phone to auto-fill customer details
              </div>
            </div>

            <div className="form-group">
              <label>Customer Name *</label>
              <input 
                type="text"
                value={customerName}
                onChange={(e) => setCustomerName(e.target.value)}
                placeholder="John Smith"
              />
            </div>

            <div className="form-group">
              <label>Customer Email *</label>
              <input 
                type="email"
                value={customerEmail}
                onChange={(e) => setCustomerEmail(e.target.value)}
                placeholder="customer@email.com"
              />
            </div>

            <div className="form-group">
              <label>Invoice Items</label>
              {items.map((item, idx) => (
                <div key={idx} style={{marginBottom: '1rem', padding: '1rem', background: 'var(--surface)', borderRadius: '8px'}}>
                  {/* Horse first, then Service — selectHorse() defaults the service to
                      this horse's last one (lastServiceId), so the horse has to be
                      picked first for that default to actually land instead of getting
                      silently overwritten by a service chosen a moment earlier. */}
                  <div style={{display: 'flex', gap: '0.5rem', marginBottom: '0.5rem'}}>
                    <select
                      value={item.horseId || (item.horseName === FarriPricing.MULTIPLE_HORSES ? '__multiple__' : '')}
                      onChange={(e) => selectHorse(idx, e.target.value)}
                      style={{
                        flex: 2,
                        padding: '0.75rem',
                        border: '2px solid var(--border)',
                        borderRadius: '8px',
                        fontSize: '1rem',
                        fontFamily: 'inherit'
                      }}
                    >
                      {horseOptions.map((h, i) => (
                        <option key={i} value={h.id}>{h.name}</option>
                      ))}
                    </select>
                    {items.length > 1 && (
                      <button
                        className="btn btn-sm btn-outline"
                        onClick={() => removeItem(idx)}
                        type="button"
                        style={{padding: '0.75rem 1rem'}}
                      >
                        ✕
                      </button>
                    )}
                  </div>

                  {item.horseId === '__new__' ? (
                    <input
                      type="text"
                      placeholder="New horse's name"
                      value={item.horseName || ''}
                      onChange={(e) => updateItem(idx, 'horseName', e.target.value)}
                      style={{
                        width: '100%',
                        padding: '0.75rem',
                        border: '2px solid var(--border)',
                        borderRadius: '8px',
                        fontSize: '1rem',
                        marginBottom: '0.5rem'
                      }}
                    />
                  ) : null}

                  <select
                    value={item.description}
                    onChange={(e) => selectService(idx, e.target.value)}
                    style={{
                      width: '100%',
                      padding: '0.75rem',
                      border: '2px solid var(--border)',
                      borderRadius: '8px',
                      fontSize: '1rem',
                      fontFamily: 'inherit',
                      marginBottom: '0.5rem'
                    }}
                  >
                    {serviceOptions.map((service, i) => (
                      <option
                        key={i}
                        value={service.name}
                        disabled={service.isHeader}
                        style={{
                          fontWeight: service.isHeader ? 'bold' : 'normal',
                          color: service.isHeader ? '#666' : 'inherit'
                        }}
                      >
                        {service.name}
                      </option>
                    ))}
                  </select>

                  {item.description === 'Custom Service (enter manually)' ||
                   (item.description && !serviceOptions.find(s => s.name === item.description)) ? (
                    <input
                      type="text"
                      placeholder="Enter custom service description"
                      value={item.description === 'Custom Service (enter manually)' ? '' : item.description}
                      onChange={(e) => updateItem(idx, 'description', e.target.value)}
                      style={{
                        width: '100%',
                        padding: '0.75rem',
                        border: '2px solid var(--border)',
                        borderRadius: '8px',
                        fontSize: '1rem',
                        marginBottom: '0.5rem'
                      }}
                    />
                  ) : null}

                  <div style={{display: 'flex', alignItems: 'center', gap: '0.5rem'}}>
                    <label style={{marginBottom: 0, fontSize: '0.9rem', fontWeight: '500'}}>Price:</label>
                    <span style={{fontSize: '1.5rem', fontWeight: 'bold'}}>$</span>
                    <input 
                      type="number"
                      placeholder="0.00"
                      value={item.amount || ''}
                      onChange={(e) => updateItem(idx, 'amount', e.target.value)}
                      style={{
                        flex: 1,
                        padding: '0.75rem',
                        border: '2px solid var(--border)',
                        borderRadius: '8px',
                        fontSize: '1rem'
                      }}
                      step="0.01"
                      min="0"
                    />
                    <label style={{marginBottom: 0, fontSize: '0.9rem', fontWeight: '500'}}>Qty:</label>
                    <input
                      type="number"
                      aria-label="Quantity"
                      value={item.qty ?? 1}
                      onChange={(e) => updateItem(idx, 'qty', e.target.value === '' ? '' : Math.max(1, Math.floor(Number(e.target.value)) || 1))}
                      onBlur={() => { if (!(Number(item.qty) >= 1)) updateItem(idx, 'qty', 1); }}
                      style={{
                        width: '80px',
                        padding: '0.75rem',
                        border: '2px solid var(--border)',
                        borderRadius: '8px',
                        fontSize: '1rem'
                      }}
                      step="1"
                      min="1"
                    />
                  </div>
                  {FarriPricing.itemQty(item) > 1 && (
                    <div style={{fontSize: '0.8rem', color: 'var(--text-muted)', marginTop: '0.35rem'}}>

            <div style={{display: 'flex', gap: '0.75rem', marginTop: '1rem'}}>

                disabled={loading || editLocked}
              >
                {loading ? <span className="spinner"></span> : (editingInvoice ? '✓ Save Changes' : '💾 Save Only')}
              </button>
              <button
                className="btn btn-secondary"
                style={{flex: 1}}

                disabled={loading || editLocked}

              <button
                className="btn btn-primary"
                style={{flex: 1}}

            <p style={{fontSize: '0.875rem', color: '#666', marginTop: '0.5rem', textAlign: 'center'}}>
              {editingInvoice ? 'Saving will update the amount due on the existing Pay Now link.' : 'Customer will use "Pay Now" button to pay with Stripe'} Save Only never messages the customer — use Send Text/Email to notify them.
            </p>
          </div>
        </div>
      );
    }

          {/* Stripe Payments Settings */}
          <div className="card" style={{marginTop: '1.5rem'}}>
            <h2>💳 Stripe Payments</h2>
            <p style={{color: 'var(--text-muted)', marginBottom: '1rem', fontSize: '0.9rem'}}>
              Connect your Stripe account to accept credit card payments on invoices. Your keys are stored securely and never shared. Connect Stripe or iPOSpays, not both.
            </p>

            {stripeStatus === 'connected' && (
              <div style={{background: '#f0fdf4', border: '1px solid #86efac', borderRadius: '8px', padding: '0.75rem 1rem', marginBottom: '1rem', display: 'flex', alignItems: 'center', gap: '0.5rem'}}>
                <span style={{fontSize: '1.1rem'}}>✅</span>
                <span style={{color: '#16a34a', fontWeight: 600}}>Stripe connected{stripeAccountName ? ` — ${stripeAccountName}` : ''}</span>
              </div>
            )}

            {stripeStatus === 'error' && (
              <div style={{background: '#fef2f2', border: '1px solid #fca5a5', borderRadius: '8px', padding: '0.75rem 1rem', marginBottom: '1rem'}}>
                <span style={{color: '#dc2626'}}>❌ {stripeError || 'Invalid keys — please check and try again.'}</span>
              </div>
            )}

            {stripeStatus === 'connected' && stripeWebhookMissing && (
              <div style={{background: '#fff7ed', border: '1px solid #fdba74', borderRadius: '8px', padding: '0.75rem 1rem', marginBottom: '1rem', color: '#9a3412', fontSize: '0.9rem'}}>
                ⚠️ Invoices paid online aren't being marked paid automatically yet. Paste your secret key below and click Validate &amp; Save again to finish setup.
              </div>
            )}

            <div className="form-group">
              <label>Publishable Key <span style={{color:'var(--text-muted)', fontWeight:400}}>(starts with pk_)</span></label>
              <input
                type="text"
                value={stripePublishableKey}
                onChange={(e) => { setStripePublishableKey(e.target.value); setStripeStatus('none'); }}
                placeholder="pk_live_..."
                style={{fontFamily: 'monospace', fontSize: '0.85rem'}}
              />
            </div>

            <div className="form-group">
              <label>Secret Key <span style={{color:'var(--text-muted)', fontWeight:400}}>(starts with rk_ or sk_)</span></label>
              <input
                type="password"
                value={stripeSecretKey}
                onChange={(e) => { setStripeSecretKey(e.target.value); setStripeStatus('none'); }}
                placeholder={stripeStatus === 'connected' ? '•••••••• saved securely — paste a new key to replace it' : 'rk_live_...'}
                autoComplete="off"
                style={{fontFamily: 'monospace', fontSize: '0.85rem'}}
              />
              <div style={{fontSize: '0.75rem', color: 'var(--text-muted)', marginTop: '0.25rem'}}>
                Your secret key is stored on FarriTech's server only — it's never shown again or kept in your browser. Find these at <a href="https://dashboard.stripe.com/apikeys" target="_blank" rel="noreferrer" style={{color:'var(--primary)'}}>dashboard.stripe.com/apikeys</a>
              </div>
            </div>

            <div style={{display: 'flex', gap: '0.75rem', flexWrap: 'wrap'}}>
              <button
                className="btn btn-primary"
                disabled={stripeValidating || !stripePublishableKey || !stripeSecretKey}
                onClick={async () => {
                  const pkMode = (/^pk_(live|test)_/.exec(stripePublishableKey.trim()) || [])[1];
                  const skMode = (/^(?:sk|rk)_(live|test)_/.exec(stripeSecretKey.trim()) || [])[1];
                  if (!pkMode) { alert('Publishable key must start with pk_live_ or pk_test_'); return; }
                  if (!skMode) { alert('Secret key must start with rk_live_, rk_test_, sk_live_ or sk_test_'); return; }
                  if (pkMode !== skMode) { alert('Both keys must be live keys, or both test keys.'); return; }
                  setStripeValidating(true);
                  setStripeError('');
                  try {
                    // The server validates the key with Stripe and stores it in its locked
                    // secrets store; only the publishable key + account name go on the profile.
                    const res = await fetch('/api/stripe-payment', {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify({ action: 'connect', stripeSecretKey: stripeSecretKey.trim() })
                    });
                    const data = await res.json();
                    if (data.success) {
                      await ensureFarriTechfile_(safeFarrierId, {
                        stripePublishableKey,
                        stripeAccountName: data.accountName || ''
                      });
                      setUserProfile(prev => ({ ...prev, stripePublishableKey, stripeAccountName: data.accountName || '' }));
                      setStripeSecretKey('');
                      setStripeAccountName(data.accountName || '');
                      setStripeStatus('connected');
                      setStripeWebhookMissing(false);
                    } else {
                      setStripeError(data.error || '');
                      setStripeStatus('error');
                    }
                  } catch (e) {
                    setStripeError('');
                    setStripeStatus('error');
                  }
                  setStripeValidating(false);
                }}
              >
                {stripeValidating ? <span className="spinner"></span> : '✓ Validate & Save'}
              </button>

              {stripeStatus === 'connected' && (
                <button
                  className="btn btn-outline"
                  onClick={async () => {
                    if (!confirm('Remove your Stripe connection? Stripe payment pages your customers haven\'t paid yet will be closed.')) return;
                    const res = await fetch('/api/stripe-payment', {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify({ action: 'disconnect' })
                    });
                    const result = await res.json().catch(() => ({}));
                    if (!result.success) { alert(result.error || 'Could not disconnect Stripe — please try again.'); return; }
                    await ensureFarriTechfile_(safeFarrierId, { stripePublishableKey: '', stripeAccountName: '' });
                    setUserProfile(prev => ({ ...prev, stripePublishableKey: '', stripeAccountName: '' }));
                    setStripePublishableKey('');
                    setStripeSecretKey('');
                    setStripeAccountName('');
                    setStripeStatus('none');
                  }}
                >
                  Disconnect
                </button>
              )}
            </div>

            <div style={{marginTop: '1rem', padding: '0.75rem', background: 'var(--surface)', borderRadius: '6px', fontSize: '0.8rem', color: 'var(--text-muted)'}}>
              💡 Use <strong>test keys</strong> (pk_test_ / rk_test_) while testing, then switch to live keys when ready to accept real payments. A restricted key needs <strong>Write</strong> access to PaymentIntents, Checkout Sessions, Customers, PaymentMethods, Refunds and Webhook Endpoints.
            </div>
          </div>


          {/* iPOSpays Payments Settings */}
          <div className="card" style={{marginTop: '1.5rem'}}>
            <h2>💳 iPOSpays Payments</h2>
            <p style={{color: 'var(--text-muted)', marginBottom: '1rem', fontSize: '0.9rem'}}>
              Take payments through your iPOSpays (Dejavoo) merchant account instead of Stripe. Connect one or the other, not both. While iPOSpays is connected, the Pay Now links you text and email, and cards you key in, open an iPOSpays payment page. The Refund button on an invoice paid through iPOSpays voids or refunds it in iPOSpays.
            </p>

            {userProfile?.ipospaysConnected ? (
              <>
                <div style={{background: '#f0fdf4', border: '1px solid #86efac', borderRadius: '8px', padding: '0.75rem 1rem', marginBottom: '1rem', display: 'flex', alignItems: 'center', gap: '0.5rem'}}>
                  <span style={{fontSize: '1.1rem'}}>✅</span>
                  <span style={{color: '#16a34a', fontWeight: 600}}>
                    iPOSpays connected — TPN ending {userProfile.ipospaysTpnLast4 || '••••'}{userProfile.ipospaysMode === 'production' ? '' : ' (sandbox — test payments only)'}
                  </span>
                </div>
                {userProfile?.stripePublishableKey && (
                  <div style={{background: '#fff7ed', border: '1px solid #fdba74', borderRadius: '8px', padding: '0.75rem 1rem', marginBottom: '1rem', fontSize: '0.875rem'}}>
                    ⚠️ Stripe is connected too. Card payments go through iPOSpays while it's connected. Disconnect one of them so customers are only ever charged through one.
                  </div>
                )}
                <button
                  className="btn btn-outline"
                  onClick={async () => {
                    if (!confirm('Disconnect iPOSpays? Payment pages your customers haven\'t paid yet will be closed, and Pay Now links will go back to Stripe (if connected).')) return;
                    const res = await fetch('/api/stripe-payment', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'ipospays_disconnect' }) });
                    const result = await res.json().catch(() => ({}));
                    if (!result.success) { alert(result.error || 'Could not disconnect iPOSpays — please try again.'); return; }
                    const cleared = { ipospaysConnected: false, ipospaysMode: '', ipospaysTpnLast4: '' };
                    await db.collection('farriers').doc(safeFarrierId).set({ ...cleared, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
                    setUserProfile(prev => ({ ...prev, ...cleared }));
                  }}
                >
                  Disconnect
                </button>
              </>
            ) : (
              <>
                {iposError && (
                  <div style={{background: '#fef2f2', border: '1px solid #fca5a5', borderRadius: '8px', padding: '0.75rem 1rem', marginBottom: '1rem'}}>
                    <span style={{color: '#dc2626'}}>❌ {iposError}</span>
                  </div>
                )}
                <div className="form-group">
                  <label>Environment</label>
                  <select value={ipos.mode} onChange={(e) => setIpos({ ...ipos, mode: e.target.value })}>
                    <option value="sandbox">Sandbox (testing)</option>
                    <option value="production">Production (real payments)</option>
                  </select>
                </div>
                {[
                  ['tpn', 'TPN', 'text', '12-digit CloudPOS TPN'],
                  ['apiKey', 'API Key', 'password', ''],
                  ['secretKey', 'Secret Key', 'password', ''],
                  ['ecomToken', 'Ecom Token', 'password', ''],
                ].map(([field, label, type, placeholder]) => (
                  <div className="form-group" key={field}>
                    <label>{label}</label>
                    <input
                      type={type}
                      value={ipos[field]}
                      onChange={(e) => { setIpos({ ...ipos, [field]: e.target.value }); setIposError(''); }}
                      placeholder={placeholder}
                      autoComplete="off"
                      style={{fontFamily: 'monospace', fontSize: '0.85rem'}}
                    />
                  </div>
                ))}
                <div style={{fontSize: '0.75rem', color: 'var(--text-muted)', margin: '-0.25rem 0 1rem'}}>
                  In the <a href="https://portal.ipospays.com/" target="_blank" rel="noreferrer" style={{color:'var(--primary)'}}>iPOSpays portal</a>, signed in as Merchant Admin: API key and secret key are under <strong>Settings → Generate API &amp; Secret Key</strong>; the Ecom token is under <strong>Settings → Merchant Keys / Ecom Token</strong> (pick your TPN, then Generate Token). They're stored on FarriTech's server only and never shown again.
                </div>
                <button
                  className="btn btn-primary"
                  disabled={iposSaving || !ipos.tpn || !ipos.apiKey || !ipos.secretKey || !ipos.ecomToken}
                  onClick={async () => {
                    setIposSaving(true);
                    setIposError('');
                    try {
                      const res = await fetch('/api/stripe-payment', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'ipospays_connect', ...ipos }),
                      });
                      const data = await res.json();
                      if (data.success) {
                        const saved = { ipospaysConnected: true, ipospaysMode: data.mode, ipospaysTpnLast4: data.tpnLast4 };
                        await db.collection('farriers').doc(safeFarrierId).set({ ...saved, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
                        setUserProfile(prev => ({ ...prev, ...saved }));
                        setIpos({ tpn: '', apiKey: '', secretKey: '', ecomToken: '', mode: data.mode });
                      } else {
                        setIposError(data.error || 'Could not connect iPOSpays.');
                      }
                    } catch (e) {
                      setIposError('Could not reach FarriTech — check your connection and try again.');
                    }
                    setIposSaving(false);
                  }}
                >
                  {iposSaving ? <span className="spinner"></span> : '✓ Validate & Save'}
                </button>
              </>
            )}
          </div>

          <TeamSettings />
          </>)}

          <div className="card" style={{marginTop: '1.5rem'}}>
            <h2>Account Information</h2>
            <p style={{color: 'var(--text-muted)', marginBottom: '1rem'}}>
              <strong>Account Created:</strong> {userProfile?.createdAt?.toDate().toLocaleDateString() || 'N/A'}
            </p>
            <div style={{marginBottom: '1rem'}}>
              <strong>Booking URL:</strong><br/>
              <code style={{background: '#f1f5f9', color: '#1d4ed8', padding: '0.5rem', borderRadius: '4px', display: 'inline-block', marginTop: '0.5rem', wordBreak: 'break-all', border: '1.5px solid rgba(38,131,251,0.45)'}}>
                {`${window.location.origin}?farrier=${safeFarrierId}`}
              </code>
              <div style={{marginTop: '0.5rem'}}>
                <button 
                  className="btn btn-sm"
                  onClick={() => {
                    const url = `${window.location.origin}?farrier=${safeFarrierId}`;
                    navigator.clipboard.writeText(url);
                    alert('Booking URL copied to clipboard!');
                  }}
                  style={{marginRight: '0.5rem'}}
                >
                  📋 Copy URL
                </button>
                <button 
                  className="btn btn-sm"
                  onClick={async () => {
                    try {
                      if (db) {
                        // Use merge-safe set so we never wipe other fields (ex: Google Calendar tokens)
            await ensureFarriTechfile_(safeFarrierId, { bookingUrl: `${window.location.origin}/?farrier=${safeFarrierId}` });
setUserProfile({
                          ...userProfile,
                          bookingUrl: `${window.location.origin}?farrier=${safeFarrierId}`
                        });
                        alert('Booking URL updated successfully!');
                      }
                    } catch (error) {
                      console.error('Error updating URL:', error);
                      alert('Failed to update URL');
                    }
                  }}
                >
                  🔄 Update URL
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const rootEl = document.getElementById('root');
    const reactRoot = ReactDOM.createRoot(rootEl);
    reactRoot.render(<App />);
  </script>

</body>
</html>
